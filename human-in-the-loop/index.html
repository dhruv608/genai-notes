<script>window.PAGE = {"id": "n31", "root": "../", "lesson": {"id": "n31", "title": "Human-in-the-Loop", "short": "Human-in-the-Loop", "unit": "Unit 4", "unitName": "Agents with LangGraph", "pos": 15, "of": 16, "sub": "", "info": "Pausing for human approval", "html": "<h2 class=\"c1\" id=\"1-architectural-purpose-mental-model\">1. Architectural Purpose &amp; Mental Model<\/h2>\n<p>In enterprise systems, granting autonomous agents unchecked execution permissions is hazardous. High-stakes actions (publishing content to corporate social channels, executing database migrations, sending client emails, transferring funds) require <strong>Human-in-the-Loop (HITL)<\/strong> governance.<\/p>\n<h3 id=\"how-hitl-works-in-langgraph\">How HITL Works in LangGraph:<\/h3>\n<ol>\n<li><strong>Dynamic Pause (<code>interrupt()<\/code>)<\/strong>: The graph runs autonomously until it reaches an approval gate. It pauses mid-execution, freezing the state snapshot in the checkpointer.<\/li>\n<li><strong>Out-of-Band Human Review<\/strong>: A human manager reviews the drafted content via a web UI or CLI at their own pace (seconds, hours, or days later).<\/li>\n<li><strong>Resumption via <code>Command<\/code><\/strong>: The human submits feedback (<code>\"Approve\"<\/code> or <code>\"Make it shorter\"<\/code>). LangGraph unfreezes the graph and injects the human's response directly into the waiting node.<\/li>\n<\/ol>\n<hr />\n<h2 class=\"c2\" id=\"2-architecture-diagram\">2. Architecture Diagram<\/h2>\n<figure class=\"diagram\"><pre class=\"mermaid\">flowchart LR\n  START([&quot;START&quot;]) --&gt; W[&quot;Writer node&quot;] --&gt; H[&quot;Human node&lt;br/&gt;&lt;small&gt;interrupt() · pauses here&lt;br/&gt;waits for Command(resume=...)&lt;/small&gt;&quot;] --&gt; G{&quot;Gate&quot;}\n  G -- &quot;feedback given&quot; --&gt; W\n  G -- &quot;approved&quot; --&gt; END([&quot;END&quot;])\nclassDef term fill:#0e3b3a,stroke:#0e3b3a,color:#ffffff,font-weight:bold\nclassDef gate fill:#fdf1ec,stroke:#c9583a,color:#7a2e1a\nclassDef store fill:#f5f5f4,stroke:#57534e,color:#292524\nclassDef c0 fill:#d4ecea,stroke:#2a7a79,color:#0e3b3a\nclassDef c1 fill:#fbe5dc,stroke:#c9583a,color:#7a2e1a\nclassDef c2 fill:#e3f5ee,stroke:#4aa58a,color:#14463a\nclassDef c3 fill:#f6f4f0,stroke:#a7a29a,color:#3f3b35\nclassDef c4 fill:#eef7f7,stroke:#1a5c5b,color:#0e3b3a\nclass START term\nclass W c0\nclass H c1\nclass G gate\nclass END term<\/pre><div class=\"dg-ascii\" hidden><div class=\"hl\"><pre><span><\/span><code>+-----------------------------------------------------------------------------------------+\n| HUMAN-IN-THE-LOOP APPROVAL WORKFLOW                                                     |\n+-----------------------------------------------------------------------------------------+\n|                                                                                         |\n|                  ┌──────────────────────────────────────────────┐                       |\n|                  │                                              │                       |\n|                  ▼                                              │ (Feedback provided)   |\n| [START] ───&gt; [Writer Node] ───&gt; [Human Node (interrupt)] ───&gt; [Gate]                    |\n|                                         │                       │                       |\n|                                         ▼                       └───&gt; [END] (Approved)  |\n|                                 (Execution Pauses)                                      |\n|                                 (Awaits Command(resume=...))                            |\n+-----------------------------------------------------------------------------------------+\n<\/code><\/pre><\/div><\/div><\/figure>\n\n<hr />\n<h2 class=\"c3\" id=\"3-the-modern-langgraph-hitl-primitives\">3. The Modern LangGraph HITL Primitives<\/h2>\n<p>Unlike older callback systems, modern LangGraph uses native, functional primitives:<\/p>\n<ul>\n<li><strong><code>interrupt(value)<\/code><\/strong>: Halts node execution and serializes <code>value<\/code> into the state checkpoint for the caller to inspect.<\/li>\n<li><strong><code>Command(resume=input_data)<\/code><\/strong>: When calling <code>app.invoke()<\/code> to resume a paused thread, <code>Command(resume=...)<\/code> provides the human input to the exact line where <code>interrupt()<\/code> was called.<\/li>\n<\/ul>\n<hr />\n<h2 class=\"c4\" id=\"4-production-python-implementation-human_in_looppy\">4. Production Python Implementation (<code>human_in_loop.py<\/code>)<\/h2>\n<details class=\"codecard\"><summary><span class=\"cc-t\">Code · 109 lines<\/span><span class=\"cc-f\">03_human_in_loop.py<\/span><span class=\"cc-show\">Show here<\/span><\/summary><div class=\"hl\"><pre><span><\/span><code><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">dotenv<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">load_dotenv<\/span>\n<span class=\"n\">load_dotenv<\/span><span class=\"p\">()<\/span>\n\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">typing<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">TypedDict<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain.chat_models<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">init_chat_model<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_core.prompts<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">ChatPromptTemplate<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_core.output_parsers<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">StrOutputParser<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langgraph.graph<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">StateGraph<\/span><span class=\"p\">,<\/span> <span class=\"n\">START<\/span><span class=\"p\">,<\/span> <span class=\"n\">END<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langgraph.checkpoint.memory<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">MemorySaver<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langgraph.types<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">interrupt<\/span><span class=\"p\">,<\/span> <span class=\"n\">Command<\/span>\n\n<span class=\"n\">model<\/span> <span class=\"o\">=<\/span> <span class=\"n\">init_chat_model<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"mistralai:mistral-small-2603\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">temperature<\/span><span class=\"o\">=<\/span><span class=\"mf\">0.7<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">parser<\/span> <span class=\"o\">=<\/span> <span class=\"n\">StrOutputParser<\/span><span class=\"p\">()<\/span>\n\n<span class=\"c1\"># 1. State Schema<\/span>\n<span class=\"k\">class<\/span><span class=\"w\"> <\/span><span class=\"nc\">State<\/span><span class=\"p\">(<\/span><span class=\"n\">TypedDict<\/span><span class=\"p\">):<\/span>\n    <span class=\"n\">topic<\/span><span class=\"p\">:<\/span> <span class=\"nb\">str<\/span>\n    <span class=\"n\">draft<\/span><span class=\"p\">:<\/span> <span class=\"nb\">str<\/span>\n    <span class=\"n\">human_feedback<\/span><span class=\"p\">:<\/span> <span class=\"nb\">str<\/span>\n    <span class=\"n\">is_approved<\/span><span class=\"p\">:<\/span> <span class=\"nb\">bool<\/span>\n\n<span class=\"c1\"># 2. Prompts<\/span>\n<span class=\"n\">writer_prompt<\/span> <span class=\"o\">=<\/span> <span class=\"n\">ChatPromptTemplate<\/span><span class=\"o\">.<\/span><span class=\"n\">from_messages<\/span><span class=\"p\">([<\/span>\n    <span class=\"p\">(<\/span><span class=\"s2\">\"system\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"You are an expert LinkedIn copywriter. Write a high-engagement post under 100 words. Strong hook, no hashtags.\"<\/span><span class=\"p\">),<\/span>\n    <span class=\"p\">(<\/span><span class=\"s2\">\"human\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"\"\"Topic: <\/span><span class=\"si\">{topic}<\/span>\n<span class=\"s2\">Previous Draft: <\/span><span class=\"si\">{draft}<\/span>\n<span class=\"s2\">Human Feedback to incorporate: <\/span><span class=\"si\">{feedback}<\/span>\n<span class=\"s2\">If no feedback is provided, write a great initial post. <\/span>\n<span class=\"s2\">If human feedback is provided, revise the draft precisely as requested!\"\"\"<\/span><span class=\"p\">)<\/span>\n<span class=\"p\">])<\/span>\n\n<span class=\"c1\"># 3. Worker Node: Writer<\/span>\n<span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">writer_node<\/span><span class=\"p\">(<\/span><span class=\"n\">state<\/span><span class=\"p\">:<\/span> <span class=\"n\">State<\/span><span class=\"p\">)<\/span> <span class=\"o\">-&gt;<\/span> <span class=\"nb\">dict<\/span><span class=\"p\">:<\/span>\n    <span class=\"n\">chain<\/span> <span class=\"o\">=<\/span> <span class=\"n\">writer_prompt<\/span> <span class=\"o\">|<\/span> <span class=\"n\">model<\/span> <span class=\"o\">|<\/span> <span class=\"n\">parser<\/span>\n    <span class=\"n\">new_draft<\/span> <span class=\"o\">=<\/span> <span class=\"n\">chain<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">({<\/span>\n        <span class=\"s2\">\"topic\"<\/span><span class=\"p\">:<\/span> <span class=\"n\">state<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"topic\"<\/span><span class=\"p\">],<\/span>\n        <span class=\"s2\">\"draft\"<\/span><span class=\"p\">:<\/span> <span class=\"n\">state<\/span><span class=\"o\">.<\/span><span class=\"n\">get<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"draft\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"\"<\/span><span class=\"p\">),<\/span>\n        <span class=\"s2\">\"feedback\"<\/span><span class=\"p\">:<\/span> <span class=\"n\">state<\/span><span class=\"o\">.<\/span><span class=\"n\">get<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"human_feedback\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"\"<\/span><span class=\"p\">)<\/span>\n    <span class=\"p\">})<\/span>\n    <span class=\"k\">return<\/span> <span class=\"p\">{<\/span><span class=\"s2\">\"draft\"<\/span><span class=\"p\">:<\/span> <span class=\"n\">new_draft<\/span><span class=\"p\">}<\/span>\n\n<span class=\"c1\"># 4. Human Approval Node (Dynamic Breakpoint)<\/span>\n<span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">human_node<\/span><span class=\"p\">(<\/span><span class=\"n\">state<\/span><span class=\"p\">:<\/span> <span class=\"n\">State<\/span><span class=\"p\">)<\/span> <span class=\"o\">-&gt;<\/span> <span class=\"nb\">dict<\/span><span class=\"p\">:<\/span>\n    <span class=\"c1\"># Execution halts here! The dict is sent to the client.<\/span>\n    <span class=\"n\">human_input<\/span> <span class=\"o\">=<\/span> <span class=\"n\">interrupt<\/span><span class=\"p\">({<\/span>\n        <span class=\"s2\">\"instruction\"<\/span><span class=\"p\">:<\/span> <span class=\"s2\">\"Please review the draft below and reply 'approve' or provide revision feedback.\"<\/span><span class=\"p\">,<\/span>\n        <span class=\"s2\">\"draft\"<\/span><span class=\"p\">:<\/span> <span class=\"n\">state<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"draft\"<\/span><span class=\"p\">]<\/span>\n    <span class=\"p\">})<\/span>\n\n    <span class=\"c1\"># When resumed via Command(resume=...), human_input receives the response<\/span>\n    <span class=\"n\">is_approved<\/span> <span class=\"o\">=<\/span> <span class=\"n\">human_input<\/span><span class=\"o\">.<\/span><span class=\"n\">strip<\/span><span class=\"p\">()<\/span><span class=\"o\">.<\/span><span class=\"n\">lower<\/span><span class=\"p\">()<\/span> <span class=\"ow\">in<\/span> <span class=\"p\">[<\/span><span class=\"s2\">\"approve\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"approved\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"yes\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"y\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"ok\"<\/span><span class=\"p\">]<\/span>\n    <span class=\"k\">return<\/span> <span class=\"p\">{<\/span>\n        <span class=\"s2\">\"human_feedback\"<\/span><span class=\"p\">:<\/span> <span class=\"n\">human_input<\/span><span class=\"p\">,<\/span>\n        <span class=\"s2\">\"is_approved\"<\/span><span class=\"p\">:<\/span> <span class=\"n\">is_approved<\/span>\n    <span class=\"p\">}<\/span>\n\n<span class=\"c1\"># 5. Routing Function<\/span>\n<span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">human_decision_gate<\/span><span class=\"p\">(<\/span><span class=\"n\">state<\/span><span class=\"p\">:<\/span> <span class=\"n\">State<\/span><span class=\"p\">)<\/span> <span class=\"o\">-&gt;<\/span> <span class=\"nb\">str<\/span><span class=\"p\">:<\/span>\n    <span class=\"k\">if<\/span> <span class=\"n\">state<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"is_approved\"<\/span><span class=\"p\">]:<\/span>\n        <span class=\"k\">return<\/span> <span class=\"s2\">\"approved_exit\"<\/span>\n    <span class=\"k\">return<\/span> <span class=\"s2\">\"revise_draft\"<\/span>\n\n<span class=\"c1\"># 6. Graph Construction<\/span>\n<span class=\"n\">builder<\/span> <span class=\"o\">=<\/span> <span class=\"n\">StateGraph<\/span><span class=\"p\">(<\/span><span class=\"n\">State<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">builder<\/span><span class=\"o\">.<\/span><span class=\"n\">add_node<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"writer\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">writer_node<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">builder<\/span><span class=\"o\">.<\/span><span class=\"n\">add_node<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"human\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">human_node<\/span><span class=\"p\">)<\/span>\n\n<span class=\"n\">builder<\/span><span class=\"o\">.<\/span><span class=\"n\">add_edge<\/span><span class=\"p\">(<\/span><span class=\"n\">START<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"writer\"<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">builder<\/span><span class=\"o\">.<\/span><span class=\"n\">add_edge<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"writer\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"human\"<\/span><span class=\"p\">)<\/span>\n\n<span class=\"n\">builder<\/span><span class=\"o\">.<\/span><span class=\"n\">add_conditional_edges<\/span><span class=\"p\">(<\/span>\n    <span class=\"s2\">\"human\"<\/span><span class=\"p\">,<\/span>\n    <span class=\"n\">human_decision_gate<\/span><span class=\"p\">,<\/span>\n    <span class=\"p\">{<\/span>\n        <span class=\"s2\">\"approved_exit\"<\/span><span class=\"p\">:<\/span> <span class=\"n\">END<\/span><span class=\"p\">,<\/span>\n        <span class=\"s2\">\"revise_draft\"<\/span><span class=\"p\">:<\/span> <span class=\"s2\">\"writer\"<\/span>\n    <span class=\"p\">}<\/span>\n<span class=\"p\">)<\/span>\n\n<span class=\"c1\"># HITL strictly requires a checkpointer to preserve state across interrupts<\/span>\n<span class=\"n\">memory<\/span> <span class=\"o\">=<\/span> <span class=\"n\">MemorySaver<\/span><span class=\"p\">()<\/span>\n<span class=\"n\">app<\/span> <span class=\"o\">=<\/span> <span class=\"n\">builder<\/span><span class=\"o\">.<\/span><span class=\"n\">compile<\/span><span class=\"p\">(<\/span><span class=\"n\">checkpointer<\/span><span class=\"o\">=<\/span><span class=\"n\">memory<\/span><span class=\"p\">)<\/span>\n\n<span class=\"c1\"># 7. Execution Simulation<\/span>\n<span class=\"n\">config<\/span> <span class=\"o\">=<\/span> <span class=\"p\">{<\/span><span class=\"s2\">\"configurable\"<\/span><span class=\"p\">:<\/span> <span class=\"p\">{<\/span><span class=\"s2\">\"thread_id\"<\/span><span class=\"p\">:<\/span> <span class=\"s2\">\"review_session_101\"<\/span><span class=\"p\">}}<\/span>\n\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"=== STEP 1: INITIAL GENERATION (Will halt at Human Node) ===\"<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">app<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">({<\/span><span class=\"s2\">\"topic\"<\/span><span class=\"p\">:<\/span> <span class=\"s2\">\"Why AI Agents require human oversight in production\"<\/span><span class=\"p\">},<\/span> <span class=\"n\">config<\/span><span class=\"o\">=<\/span><span class=\"n\">config<\/span><span class=\"p\">)<\/span>\n\n<span class=\"c1\"># Inspect the state while paused<\/span>\n<span class=\"n\">state_snapshot<\/span> <span class=\"o\">=<\/span> <span class=\"n\">app<\/span><span class=\"o\">.<\/span><span class=\"n\">get_state<\/span><span class=\"p\">(<\/span><span class=\"n\">config<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"<\/span><span class=\"se\">\\n<\/span><span class=\"s2\">[PAUSED EXECUTION STATE]\"<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Next Node Scheduled:\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">state_snapshot<\/span><span class=\"o\">.<\/span><span class=\"n\">next<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Draft to Review:<\/span><span class=\"se\">\\n<\/span><span class=\"s2\">
