<script>window.PAGE = {"id": "n28_1", "root": "../", "lesson": {"id": "n28_1", "title": "Fan-Out and Fan-In", "short": "Fan-Out and Fan-In", "unit": "Unit 4", "unitName": "Agents with LangGraph", "pos": 10, "of": 16, "sub": "", "info": "Why run independent checks together, fan-out and fan-in, and the three checks", "html": "<h2 class=\"c1\" id=\"the-problem-slow-independent-checks\">The Problem: Slow, Independent Checks<\/h2>\n<p>Before a video script goes out, we check it three ways.<\/p>\n<figure class=\"visual\"><div class=\"px\">\n  <div class=\"px-r\"><span>The issue<\/span><div>A script must pass three checks before we publish it: toxicity, copyright risk and cultural sensitivity. Each check is a model call.<\/div><\/div>\n  <div class=\"px-r\"><span>The first try<\/span><div>A sequential graph: run the three checks one after another.<\/div><\/div>\n  <div class=\"px-r\"><span>Why it fails<\/span><div>The checks do not need each other. Running them in a line makes us wait for the first before the second can start, so the waiting time adds up.<\/div><\/div>\n  <div class=\"px-r hi\"><span>The fix<\/span><div>Run all three <b>at the same time<\/b>, as parallel branches. We wait only as long as the slowest check.<\/div><\/div>\n<\/div><div class=\"em-point\"><b>We tested this on your installed LangGraph.<\/b> Three nodes that each waited one second finished in about one second in total, not three.<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c2\" id=\"fan-out-and-fan-in-the-shape\">Fan-Out and Fan-In: The Shape<\/h2>\n<blockquote class=\"def\"><span class=\"deflab\">Definition<\/span>\n<p><strong>Fan-out<\/strong> means one node leads to several nodes that run at the same time. <strong>Fan-in<\/strong> means those nodes come back together.<\/p>\n<\/blockquote>\n<figure class=\"visual\"><div class=\"hl\" data-x=\"1\"><pre><span class=\"n\">builder<\/span><span class=\"o\">.<\/span><span class=\"n\">add_edge<\/span><span class=\"p\">(<\/span><span class=\"n\">START<\/span> <span class=\"p\">,<\/span><span class=\"s2\">\"toxicity_node\"<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">builder<\/span><span class=\"o\">.<\/span><span class=\"n\">add_edge<\/span><span class=\"p\">(<\/span><span class=\"n\">START<\/span> <span class=\"p\">,<\/span><span class=\"s2\">\"copyright_node\"<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">builder<\/span><span class=\"o\">.<\/span><span class=\"n\">add_edge<\/span><span class=\"p\">(<\/span><span class=\"n\">START<\/span> <span class=\"p\">,<\/span><span class=\"s2\">\"culture_node\"<\/span><span class=\"p\">)<\/span>\n\n\n<span class=\"n\">builder<\/span><span class=\"o\">.<\/span><span class=\"n\">add_edge<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"toxicity_node\"<\/span><span class=\"p\">,<\/span><span class=\"n\">END<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">builder<\/span><span class=\"o\">.<\/span><span class=\"n\">add_edge<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"copyright_node\"<\/span><span class=\"p\">,<\/span><span class=\"n\">END<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">builder<\/span><span class=\"o\">.<\/span><span class=\"n\">add_edge<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"culture_node\"<\/span><span class=\"p\">,<\/span><span class=\"n\">END<\/span><span class=\"p\">)<\/span><\/pre><\/div>\n<div class=\"em-fig\"><svg class=\"em-svg\" viewBox=\"0 0 760 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"ga\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#9aa3a2\"/><\/marker><\/defs><circle cx=\"60.0\" cy=\"125.0\" r=\"22\" fill=\"#fff\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"60.0\" y=\"129.0\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#0e3b3a\">START<\/text><rect x=\"295.0\" y=\"26.0\" width=\"170\" height=\"38\" rx=\"9\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"380.0\" y=\"50.2\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">toxicity_node<\/text><line x1=\"82.0\" y1=\"89.0\" x2=\"292.0\" y2=\"45.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><line x1=\"468.0\" y1=\"45.0\" x2=\"640.0\" y2=\"89.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><rect x=\"295.0\" y=\"106.0\" width=\"170\" height=\"38\" rx=\"9\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"380.0\" y=\"130.2\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">copyright_node<\/text><line x1=\"82.0\" y1=\"125.0\" x2=\"292.0\" y2=\"125.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><line x1=\"468.0\" y1=\"125.0\" x2=\"640.0\" y2=\"125.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><rect x=\"295.0\" y=\"186.0\" width=\"170\" height=\"38\" rx=\"9\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"380.0\" y=\"210.2\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">culture_node<\/text><line x1=\"82.0\" y1=\"161.0\" x2=\"292.0\" y2=\"205.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><line x1=\"468.0\" y1=\"205.0\" x2=\"640.0\" y2=\"161.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><circle cx=\"700.0\" cy=\"125.0\" r=\"22\" fill=\"#fff\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"700.0\" y=\"129.0\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#0e3b3a\">END<\/text><text x=\"190\" y=\"30\" font-size=\"13\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#7a7367\" letter-spacing=\"1\">FAN-OUT<\/text><text x=\"570\" y=\"30\" font-size=\"13\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#7a7367\" letter-spacing=\"1\">FAN-IN<\/text><\/svg><\/div><div class=\"px\">\n  <div class=\"px-r\"><span>Fan-out<\/span><div>Three edges leave <code>START<\/code>. Your own comment says it: &ldquo;START goes to all 3 nodes, they run at the same time&rdquo;.<\/div><\/div>\n  <div class=\"px-r\"><span>Fan-in<\/span><div>Three edges arrive at <code>END<\/code>. The run finishes only when all three nodes are done.<\/div><\/div>\n  <div class=\"px-r hi\"><span>Nothing else changes<\/span><div>The nodes, the state and <code>compile()<\/code> work as before. Only the shape of the edges is new.<\/div><\/div>\n<\/div><\/figure>\n<hr />\n<h2 class=\"c3\" id=\"the-three-checks\">The Three Checks<\/h2>\n<p>Each check is a node with its own prompt. Each one returns a score from 0 to 100.<\/p>\n<figure class=\"visual\"><div class=\"em-tbl\"><table>\n<tr><th>Node<\/th><th>It checks for<\/th><th>It writes<\/th><\/tr>\n<tr><td><code>toxicity_node<\/code><\/td><td>profanity, aggression, hate speech<\/td><td><code>{\"toxicity\": score}<\/code><\/td><\/tr>\n<tr><td><code>copyright_node<\/code><\/td><td>plagiarism or a trademark risk<\/td><td><code>{\"copyright_risk\": score}<\/code><\/td><\/tr>\n<tr><td><code>culture_node<\/code><\/td><td>cultural insensitivity<\/td><td><code>{\"cultural_insensitivity\": score}<\/code><\/td><\/tr>\n<\/table><\/div>\n<div class=\"hl\" data-x=\"1\"><pre><span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">to_score<\/span><span class=\"p\">(<\/span><span class=\"n\">text<\/span><span class=\"p\">:<\/span><span class=\"nb\">str<\/span><span class=\"p\">)<\/span> <span class=\"o\">-&gt;<\/span> <span class=\"nb\">int<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">    <\/span><span class=\"sd\">\"\"\"LLM returns text like '85' or '85.' -&gt; pull out the number so state really holds an int\"\"\"<\/span>\n    <span class=\"n\">match<\/span> <span class=\"o\">=<\/span> <span class=\"n\">re<\/span><span class=\"o\">.<\/span><span class=\"n\">search<\/span><span class=\"p\">(<\/span><span class=\"sa\">r<\/span><span class=\"s2\">\"\\d+\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">text<\/span><span class=\"p\">)<\/span>\n    <span class=\"k\">return<\/span> <span class=\"nb\">int<\/span><span class=\"p\">(<\/span><span class=\"n\">match<\/span><span class=\"o\">.<\/span><span class=\"n\">group<\/span><span class=\"p\">())<\/span> <span class=\"k\">if<\/span> <span class=\"n\">match<\/span> <span class=\"k\">else<\/span> <span class=\"o\">-<\/span><span class=\"mi\">1<\/span>\n\n<span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">toxicity_node<\/span><span class=\"p\">(<\/span><span class=\"n\">state<\/span> <span class=\"p\">:<\/span><span class=\"n\">AnlayzerState<\/span><span class=\"p\">)<\/span> <span class=\"o\">-&gt;<\/span> <span class=\"nb\">dict<\/span><span class=\"p\">:<\/span>\n    <span class=\"n\">chain<\/span> <span class=\"o\">=<\/span> <span class=\"n\">toxicity_prompt<\/span> <span class=\"o\">|<\/span> <span class=\"n\">model<\/span> <span class=\"o\">|<\/span> <span class=\"n\">parser<\/span>\n    <span class=\"n\">score<\/span> <span class=\"o\">=<\/span> <span class=\"n\">chain<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">({<\/span><span class=\"s2\">\"raw_text\"<\/span><span class=\"p\">:<\/span><span class=\"n\">state<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"raw_text\"<\/span><span class=\"p\">]})<\/span>\n    <span class=\"k\">return<\/span> <span class=\"p\">{<\/span><span class=\"s2\">\"safety_scores\"<\/span><span class=\"p\">:{<\/span><span class=\"s2\">\"toxicity\"<\/span><span class=\"p\">:<\/span><span class=\"n\">to_score<\/span><span class=\"p\">(<\/span><span class=\"n\">score<\/span><span class=\"p\">)}}<\/span><\/pre><\/div>\n<div class=\"em-cap\">From your <code>01_parallel_reducers.py<\/code>. Each prompt asks for a plain number. <code>to_score<\/code> pulls the number out of the reply, so the state really holds an <code>int<\/code>. The other two nodes are the same, with another prompt and another key.<\/div>\n<div class=\"em-point\"><b>Every node writes to the same key, <code>safety_scores<\/code>,<\/b> but with a different small dictionary inside. That is the problem for the next lesson tab.<\/div>\n<\/figure>\n", "toc": [{"id": "the-problem-slow-independent-checks", "name": "The Problem: Slow, Independent Checks"}, {"id": "fan-out-and-fan-in-the-shape", "name": "Fan-Out and Fan-In: The Shape"}, {"id": "the-three-checks", "name": "The Three Checks"}], "search": "", "slides": null, "slideCount": 0, "code": []}};</script>
