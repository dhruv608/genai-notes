<script>window.PAGE = {"id": "n04_3", "root": "../", "lesson": {"id": "n04_3", "title": "Temperature & Max Tokens", "short": "Temperature & Max Tokens", "unit": "Unit 1", "unitName": "Start Here: GenAI Basics", "pos": 7, "of": 7, "sub": "", "info": "How random the answer is, and how long it can be", "html": "<h2 class=\"c3\" id=\"8-temperature-max-tokens\">1. Temperature &amp; Max Tokens<\/h2>\n<blockquote class=\"def\"><span class=\"deflab\">Definition<\/span>\n<p><strong>Temperature<\/strong> is a setting that controls how random the model's choice of the next token is. Low temperature gives safe, predictable answers. High temperature gives more creative, surprising ones.<\/p>\n<\/blockquote>\n<figure class=\"visual\"><div class=\"tm3 tmx\">\n  <div class=\"tm-q\">Prompt: <b>\"Give me a name for a coffee shop.\"<\/b> Asked three times:<\/div>\n  <div class=\"tm\">\n    <h5>Temperature 0<\/h5><p>Always the top token<\/p>\n    <div class=\"run\">Coffee House<\/div><div class=\"run\">Coffee House<\/div><div class=\"run\">Coffee House<\/div>\n    <em>Almost always the same<\/em>\n  <\/div>\n  <div class=\"tm\">\n    <h5>Temperature 1<\/h5><p>The model's normal choice<\/p>\n    <div class=\"run\">Brew Corner<\/div><div class=\"run\">Coffee House<\/div><div class=\"run\">The Daily Grind<\/div>\n    <em>Some variety<\/em>\n  <\/div>\n  <div class=\"tm\">\n    <h5>Temperature above 1<\/h5><p>Lower tokens get a chance<\/p>\n    <div class=\"run\">Moonbean Alchemy<\/div><div class=\"run\">The Purring Espresso<\/div><div class=\"run\">Caffeine Comet<\/div>\n    <em>Very creative, can go off track<\/em>\n  <\/div>\n  <div class=\"tm-n\">Example outputs are illustrative. Real answers vary.<\/div>\n<\/div>\n<\/figure>\n<p><strong>How to use it:<\/strong> keep it low (0 to 0.3) for facts, code and data extraction. Raise it (0.7 to 1) for stories, ideas and marketing copy.<\/p>\n<p><strong>Range:<\/strong> OpenAI 0–2 · Claude 0–1 · Gemini 0–2 · Mistral 0–1.5<\/p>\n<p><strong>Max Tokens (<code>max_tokens<\/code>)<\/strong> sets a strict upper limit on how many tokens the model can generate in one reply. It controls API cost and keeps responses concise.<\/p>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"c1\"># Setting temperature and max_tokens inline<\/span>\n<span class=\"n\">model<\/span> <span class=\"o\">=<\/span> <span class=\"n\">init_chat_model<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"google_genai:gemini-2.5-flash\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">temperature<\/span><span class=\"o\">=<\/span><span class=\"mf\">0.2<\/span><span class=\"p\">,<\/span> <span class=\"n\">max_tokens<\/span><span class=\"o\">=<\/span><span class=\"mi\">150<\/span><span class=\"p\">)<\/span>\n<\/code><\/pre><\/div>\n\n", "toc": [{"id": "8-temperature-max-tokens", "name": "8. Temperature & Max Tokens"}], "search": "", "slides": null, "slideCount": 0, "code": []}};</script>
