<script>window.PAGE = {"id": "n04_3", "root": "../", "lesson": {"id": "n04_3", "title": "Temperature & Max Tokens", "short": "Temperature & Max Tokens", "unit": "Unit 2", "unitName": "Build with LangChain", "pos": 4, "of": 15, "sub": "", "info": "How random the answer is, and how long it can be", "html": "<h2 class=\"c3\" id=\"8-how-temperature-works\">1. How Temperature Works<\/h2>\n<blockquote class=\"def\"><span class=\"deflab\">Definition<\/span>\n<p><strong>Temperature<\/strong> is a setting that controls how random the model's choice of the next token is. Low temperature gives safe, predictable answers. High temperature gives more creative, surprising ones.<\/p>\n<\/blockquote>\n<figure class=\"visual\"><div class=\"tm3 tmx\"><div class=\"tm-q\">The model picks the first word of a coffee shop name from a list of <b>chances<\/b>:<\/div><div class=\"tm\"><h5>Low (0)<\/h5><p>Always the top token<\/p><div style=\"display:flex;align-items:center;gap:8px;margin:7px 0\"><span style=\"width:58px;font-size:.88em\">Coffee<\/span><div style=\"flex:1;background:#e3eeed;border-radius:5px;height:15px\"><div style=\"width:100%;height:100%;background:#1a5c5b;border-radius:5px\"><\/div><\/div><b style=\"width:40px;text-align:right;font-size:.86em\">100%<\/b><\/div><div style=\"display:flex;align-items:center;gap:8px;margin:7px 0\"><span style=\"width:58px;font-size:.88em\">Brew<\/span><div style=\"flex:1;background:#e3eeed;border-radius:5px;height:15px\"><div style=\"width:0%;height:100%;background:#8cbcba;border-radius:5px\"><\/div><\/div><b style=\"width:40px;text-align:right;font-size:.86em\">0%<\/b><\/div><div style=\"display:flex;align-items:center;gap:8px;margin:7px 0\"><span style=\"width:58px;font-size:.88em\">The<\/span><div style=\"flex:1;background:#e3eeed;border-radius:5px;height:15px\"><div style=\"width:0%;height:100%;background:#8cbcba;border-radius:5px\"><\/div><\/div><b style=\"width:40px;text-align:right;font-size:.86em\">0%<\/b><\/div><div style=\"display:flex;align-items:center;gap:8px;margin:7px 0\"><span style=\"width:58px;font-size:.88em\">Moon<\/span><div style=\"flex:1;background:#e3eeed;border-radius:5px;height:15px\"><div style=\"width:0%;height:100%;background:#8cbcba;border-radius:5px\"><\/div><\/div><b style=\"width:40px;text-align:right;font-size:.86em\">0%<\/b><\/div><em>Always Coffee<\/em><\/div><div class=\"tm\"><h5>Normal (1)<\/h5><p>The model's own chances<\/p><div style=\"display:flex;align-items:center;gap:8px;margin:7px 0\"><span style=\"width:58px;font-size:.88em\">Coffee<\/span><div style=\"flex:1;background:#e3eeed;border-radius:5px;height:15px\"><div style=\"width:50%;height:100%;background:#1a5c5b;border-radius:5px\"><\/div><\/div><b style=\"width:40px;text-align:right;font-size:.86em\">50%<\/b><\/div><div style=\"display:flex;align-items:center;gap:8px;margin:7px 0\"><span style=\"width:58px;font-size:.88em\">Brew<\/span><div style=\"flex:1;background:#e3eeed;border-radius:5px;height:15px\"><div style=\"width:25%;height:100%;background:#8cbcba;border-radius:5px\"><\/div><\/div><b style=\"width:40px;text-align:right;font-size:.86em\">25%<\/b><\/div><div style=\"display:flex;align-items:center;gap:8px;margin:7px 0\"><span style=\"width:58px;font-size:.88em\">The<\/span><div style=\"flex:1;background:#e3eeed;border-radius:5px;height:15px\"><div style=\"width:15%;height:100%;background:#8cbcba;border-radius:5px\"><\/div><\/div><b style=\"width:40px;text-align:right;font-size:.86em\">15%<\/b><\/div><div style=\"display:flex;align-items:center;gap:8px;margin:7px 0\"><span style=\"width:58px;font-size:.88em\">Moon<\/span><div style=\"flex:1;background:#e3eeed;border-radius:5px;height:15px\"><div style=\"width:10%;height:100%;background:#8cbcba;border-radius:5px\"><\/div><\/div><b style=\"width:40px;text-align:right;font-size:.86em\">10%<\/b><\/div><em>Mostly Coffee, sometimes others<\/em><\/div><div class=\"tm\"><h5>High (above 1)<\/h5><p>The chances flatten out<\/p><div style=\"display:flex;align-items:center;gap:8px;margin:7px 0\"><span style=\"width:58px;font-size:.88em\">Coffee<\/span><div style=\"flex:1;background:#e3eeed;border-radius:5px;height:15px\"><div style=\"width:37%;height:100%;background:#1a5c5b;border-radius:5px\"><\/div><\/div><b style=\"width:40px;text-align:right;font-size:.86em\">37%<\/b><\/div><div style=\"display:flex;align-items:center;gap:8px;margin:7px 0\"><span style=\"width:58px;font-size:.88em\">Brew<\/span><div style=\"flex:1;background:#e3eeed;border-radius:5px;height:15px\"><div style=\"width:26%;height:100%;background:#8cbcba;border-radius:5px\"><\/div><\/div><b style=\"width:40px;text-align:right;font-size:.86em\">26%<\/b><\/div><div style=\"display:flex;align-items:center;gap:8px;margin:7px 0\"><span style=\"width:58px;font-size:.88em\">The<\/span><div style=\"flex:1;background:#e3eeed;border-radius:5px;height:15px\"><div style=\"width:20%;height:100%;background:#8cbcba;border-radius:5px\"><\/div><\/div><b style=\"width:40px;text-align:right;font-size:.86em\">20%<\/b><\/div><div style=\"display:flex;align-items:center;gap:8px;margin:7px 0\"><span style=\"width:58px;font-size:.88em\">Moon<\/span><div style=\"flex:1;background:#e3eeed;border-radius:5px;height:15px\"><div style=\"width:17%;height:100%;background:#8cbcba;border-radius:5px\"><\/div><\/div><b style=\"width:40px;text-align:right;font-size:.86em\">17%<\/b><\/div><em>Other words win more often<\/em><\/div><div class=\"tm-n\">Example chances for one word. The real numbers depend on the model and the prompt.<\/div><\/div><\/figure>\n<hr />\n<h2 class=\"c4\" id=\"9-one-prompt-three-temperatures\">2. One Prompt, Three Temperatures<\/h2>\n<p>The same prompt, asked three times at each temperature.<\/p>\n<figure class=\"visual\"><div class=\"tm3 tmx\"><div class=\"tm-q\">Prompt: <b>\"Finish the sentence: The sky is\"<\/b> Asked three times:<\/div><div class=\"tm\"><h5>Low (0)<\/h5><p>Safe and predictable<\/p><div class=\"run\">blue.<\/div><div class=\"run\">blue.<\/div><div class=\"run\">blue.<\/div><em>Almost the same every time<\/em><\/div><div class=\"tm\"><h5>Normal (1)<\/h5><p>The model's own choice<\/p><div class=\"run\">blue.<\/div><div class=\"run\">clear today.<\/div><div class=\"run\">blue.<\/div><em>Some variety<\/em><\/div><div class=\"tm\"><h5>High (above 1)<\/h5><p>Unusual words get a chance<\/p><div class=\"run\">a quiet painting.<\/div><div class=\"run\">full of small surprises.<\/div><div class=\"run\">blue.<\/div><em>Creative, but it can go off track<\/em><\/div><div class=\"tm-n\">Example answers to show the idea. Real answers vary.<\/div><\/div><\/figure>\n<hr />\n<h2 class=\"c5\" id=\"10-which-temperature-to-use\">3. Which Temperature to Use<\/h2>\n<p>Pick it by the job. Each company allows its own range.<\/p>\n<figure class=\"visual\"><div class=\"em-tbl ck-tbl\"><table><tr><th>Your task<\/th><th>Temperature<\/th><\/tr><tr><td>Facts, code, data extraction<\/td><td>0 to 0.3<\/td><\/tr><tr><td>Stories, ideas, marketing copy<\/td><td>0.7 to 1<\/td><\/tr><\/table><\/div><div class=\"em-tbl ck-tbl\"><table><tr><th>Company<\/th><th>Range of temperature<\/th><\/tr><tr><td>OpenAI<\/td><td>0 to 2<\/td><\/tr><tr><td>Claude<\/td><td>0 to 1<\/td><\/tr><tr><td>Gemini<\/td><td>0 to 2<\/td><\/tr><tr><td>Mistral<\/td><td>0 to 1.5<\/td><\/tr><\/table><\/div><div class=\"em-point\"><b>Temperature 0<\/b> is the most consistent setting, but it does not promise the same answer every time. Small differences on the server can still change a word.<\/div><\/figure>\n<hr />\n<h2 class=\"c1\" id=\"11-max-tokens\">4. Max Tokens<\/h2>\n<blockquote class=\"def\"><span class=\"deflab\">Definition<\/span>\n<p><strong>Max tokens<\/strong> (<code>max_tokens<\/code>) is the most tokens the model may write in one reply. It controls the cost and keeps answers short.<\/p>\n<\/blockquote>\n<figure class=\"visual\"><div class=\"tm3 tmx\"><div class=\"tm-q\">Prompt: <b>\"Explain what an API key is.\"<\/b> with <code>max_tokens=20<\/code><\/div><div class=\"tm\" style=\"grid-column: span 3\"><h5>The reply stops after 20 tokens<\/h5><p>It can end in the middle of a sentence<\/p><div class=\"run\">An API key is a secret code that a program sends to a service to show who it is, so the<\/div><em>The reply is cut here<\/em><\/div><div class=\"tm-n\">Example. Without the limit, the model keeps writing until it is done.<\/div><\/div><\/figure>\n<hr />\n<h2 class=\"c2\" id=\"12-setting-both-in-langchain\">5. Setting Both in LangChain<\/h2>\n<p>Both settings go in the same line that creates the model. Pick your company in each way.<\/p>\n<figure class=\"visual\"><div class=\"dw\">\n  <div class=\"dw-c t\">\n    <div class=\"dw-h\"><b>Way 1<\/b>a class for each company<\/div>\n    <input type=\"radio\" name=\"dwa\" id=\"a1\" checked><label for=\"a1\">Gemini<\/label>\n    <input type=\"radio\" name=\"dwa\" id=\"a2\"><label for=\"a2\">Groq<\/label>\n    <input type=\"radio\" name=\"dwa\" id=\"a3\"><label for=\"a3\">Mistral<\/label>\n    <input type=\"radio\" name=\"dwa\" id=\"a4\"><label for=\"a4\">OpenAI<\/label>\n    <div class=\"dw-inst\">install: <code>pip install <span class=\"va1\">langchain-google-genai<\/span><span class=\"va2\">langchain-groq<\/span><span class=\"va3\">langchain-mistralai<\/span><span class=\"va4\">langchain-openai<\/span><\/code><\/div>\n    <div class=\"hl\" data-x=\"1\"><pre><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">dotenv<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">load_dotenv<\/span>\n<span class=\"va1\"><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_google_genai<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">ChatGoogleGenerativeAI<\/span><\/span><span class=\"va2\"><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_groq<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">ChatGroq<\/span><\/span><span class=\"va3\"><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_mistralai<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">ChatMistralAI<\/span><\/span><span class=\"va4\"><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_openai<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">ChatOpenAI<\/span><\/span>\n\n<span class=\"n\">load_dotenv<\/span><span class=\"p\">()<\/span>\n\n<span class=\"va1\"><span class=\"n\">model<\/span> <span class=\"o\">=<\/span> <span class=\"n\">ChatGoogleGenerativeAI<\/span><span class=\"p\">(<\/span><span class=\"n\">model<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"gemini-2.5-flash\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">temperature<\/span><span class=\"o\">=<\/span><span class=\"mf\">0.2<\/span><span class=\"p\">,<\/span> <span class=\"n\">max_output_tokens<\/span><span class=\"o\">=<\/span><span class=\"mi\">150<\/span><span class=\"p\">)<\/span><\/span><span class=\"va2\"><span class=\"n\">model<\/span> <span class=\"o\">=<\/span> <span class=\"n\">ChatGroq<\/span><span class=\"p\">(<\/span><span class=\"n\">model<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"openai/gpt-oss-20b\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">temperature<\/span><span class=\"o\">=<\/span><span class=\"mf\">0.2<\/span><span class=\"p\">,<\/span> <span class=\"n\">max_tokens<\/span><span class=\"o\">=<\/span><span class=\"mi\">150<\/span><span class=\"p\">)<\/span><\/span><span class=\"va3\"><span class=\"n\">model<\/span> <span class=\"o\">=<\/span> <span class=\"n\">ChatMistralAI<\/span><span class=\"p\">(<\/span><span class=\"n\">model<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"open-mistral-nemo\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">temperature<\/span><span class=\"o\">=<\/span><span class=\"mf\">0.2<\/span><span class=\"p\">,<\/span> <span class=\"n\">max_tokens<\/span><span class=\"o\">=<\/span><span class=\"mi\">150<\/span><span class=\"p\">)<\/span><\/span><span class=\"va4\"><span class=\"n\">model<\/span> <span class=\"o\">=<\/span> <span class=\"n\">ChatOpenAI<\/span><span class=\"p\">(<\/span><span class=\"n\">model<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"gpt-4o-mini\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">temperature<\/span><span class=\"o\">=<\/span><span class=\"mf\">0.2<\/span><span class=\"p\">,<\/span> <span class=\"n\">max_tokens<\/span><span class=\"o\">=<\/span><span class=\"mi\">150<\/span><span class=\"p\">)<\/span><\/span><\/pre><\/div>\n    <ul class=\"dw-n\"><li>The settings go inside the brackets of the class, after the model name.<\/li><li><code>temperature<\/code> has the same name in every class.<\/li><li>In this class, the most tokens is <span class=\"va1\"><code>max_output_tokens<\/code>. <code>max_tokens<\/code> also works<\/span><span class=\"va2\"><code>max_tokens<\/code><\/span><span class=\"va3\"><code>max_tokens<\/code><\/span><span class=\"va4\"><code>max_tokens<\/code><\/span>.<\/li><\/ul>\n  <\/div>\n  <div class=\"dw-c t\">\n    <div class=\"dw-h\"><b>Way 2<\/b>one function for every company<\/div>\n    <input type=\"radio\" name=\"dwb\" id=\"b1\" checked><label for=\"b1\">Gemini<\/label>\n    <input type=\"radio\" name=\"dwb\" id=\"b2\"><label for=\"b2\">Groq<\/label>\n    <input type=\"radio\" name=\"dwb\" id=\"b3\"><label for=\"b3\">Mistral<\/label>\n    <input type=\"radio\" name=\"dwb\" id=\"b4\"><label for=\"b4\">OpenAI<\/label>\n    <div class=\"dw-inst\">install: <code>pip install langchain <span class=\"vb1\">langchain-google-genai<\/span><span class=\"vb2\">langchain-groq<\/span><span class=\"vb3\">langchain-mistralai<\/span><span class=\"vb4\">langchain-openai<\/span><\/code><\/div>\n    <div class=\"hl\" data-x=\"1\"><pre><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">dotenv<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">load_dotenv<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain.chat_models<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">init_chat_model<\/span>\n\n<span class=\"n\">load_dotenv<\/span><span class=\"p\">()<\/span>\n\n<span class=\"vb1\"><span class=\"n\">model<\/span> <span class=\"o\">=<\/span> <span class=\"n\">init_chat_model<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"google_genai:gemini-2.5-flash\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">temperature<\/span><span class=\"o\">=<\/span><span class=\"mf\">0.2<\/span><span class=\"p\">,<\/span> <span class=\"n\">max_tokens<\/span><span class=\"o\">=<\/span><span class=\"mi\">150<\/span><span class=\"p\">)<\/span><\/span><span class=\"vb2\"><span class=\"n\">model<\/span> <span class=\"o\">=<\/span> <span class=\"n\">init_chat_model<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"groq:openai/gpt-oss-20b\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">temperature<\/span><span class=\"o\">=<\/span><span class=\"mf\">0.2<\/span><span class=\"p\">,<\/span> <span class=\"n\">max_tokens<\/span><span class=\"o\">=<\/span><span class=\"mi\">150<\/span><span class=\"p\">)<\/span><\/span><span class=\"vb3\"><span class=\"n\">model<\/span> <span class=\"o\">=<\/span> <span class=\"n\">init_chat_model<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"mistralai:open-mistral-nemo\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">temperature<\/span><span class=\"o\">=<\/span><span class=\"mf\">0.2<\/span><span class=\"p\">,<\/span> <span class=\"n\">max_tokens<\/span><span class=\"o\">=<\/span><span class=\"mi\">150<\/span><span class=\"p\">)<\/span><\/span><span class=\"vb4\"><span class=\"n\">model<\/span> <span class=\"o\">=<\/span> <span class=\"n\">init_chat_model<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"openai:gpt-4o-mini\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">temperature<\/span><span class=\"o\">=<\/span><span class=\"mf\">0.2<\/span><span class=\"p\">,<\/span> <span class=\"n\">max_tokens<\/span><span class=\"o\">=<\/span><span class=\"mi\">150<\/span><span class=\"p\">)<\/span><\/span><\/pre><\/div>\n    <ul class=\"dw-n\"><li><code>temperature<\/code> and <code>max_tokens<\/code> have the same names for every company.<\/li><li>LangChain changes <code>max_tokens<\/code> into the name that the company's class uses. For Gemini that is <code>max_output_tokens<\/code>.<\/li><li>To switch company, change only the string. The settings stay the same.<\/li><\/ul>\n  <\/div>\n<\/div>\n<\/figure>\n", "toc": [{"id": "8-how-temperature-works", "name": "8. How Temperature Works"}, {"id": "9-one-prompt-three-temperatures", "name": "9. One Prompt, Three Temperatures"}, {"id": "10-which-temperature-to-use", "name": "10. Which Temperature to Use"}, {"id": "11-max-tokens", "name": "11. Max Tokens"}, {"id": "12-setting-both-in-langchain", "name": "12. Setting Both in LangChain"}], "search": "", "slides": null, "slideCount": 0, "code": []}};</script>
