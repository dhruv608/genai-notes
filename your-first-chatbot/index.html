<script>window.PAGE = {"id": "n36", "root": "../", "lesson": {"id": "n36", "title": "Your First Chatbot", "short": "Your First Chatbot", "unit": "Unit 2", "unitName": "Build with LangChain", "pos": 8, "of": 16, "sub": "Chatbot", "info": "What a chatbot is, the loop, a first chatbot in a few lines, and what each line does", "html": "<h2 class=\"c1\" id=\"what-is-a-chatbot\">What Is a Chatbot?<\/h2>\n<p>You already use chatbots, like ChatGPT. You type a message, you get an answer, and you can keep going. In this lesson you build a small one that runs in the terminal.<\/p>\n<blockquote class=\"def\"><span class=\"deflab\">Definition<\/span>\n<p>A <strong>chatbot<\/strong> is a loop. It asks you for a message, sends it to the model, shows the answer, and asks again.<\/p>\n<\/blockquote>\n<figure class=\"visual\"><div class=\"em-cap\" style=\"margin:6px 0 6px\">What you will see when you run it<\/div><div class=\"hl\" data-x=\"1\"><pre>welcome to chatbot type exit to quit\nYou : ask any think: What is the capital of India?\nBot: The capital of India is New Delhi.\nYou : ask any think: What is 5 plus 3?\nBot: 5 plus 3 is 8.\nYou : ask any think: exit<\/pre><\/div><div class=\"em-cap\" style=\"margin:4px 0 14px\">An example run. Your answers will be a little different.<\/div><div class=\"bnt rt4 three\" style=\"grid-template-columns: repeat(4, 1fr)\"><div class=\"bnt-t c3\"><div class=\"bnt-h\">1. You type<\/div><div class=\"bnt-b\">A message<\/div><div class=\"bnt-p\">The program waits for you.<\/div><\/div><div class=\"bnt-t c1\"><div class=\"bnt-h\">2. The model<\/div><div class=\"bnt-b\">Gets your message<\/div><div class=\"bnt-p\">It writes an answer.<\/div><\/div><div class=\"bnt-t c4\"><div class=\"bnt-h\">3. The answer<\/div><div class=\"bnt-b\">Is shown<\/div><div class=\"bnt-p\">The program prints it.<\/div><\/div><div class=\"bnt-t c3\"><div class=\"bnt-h\">4. Again<\/div><div class=\"bnt-b\">Back to step 1<\/div><div class=\"bnt-p\">Until you type exit.<\/div><\/div><\/div><div class=\"em-point\"><b>A chatbot is a loop.<\/b> The same four steps repeat. In code, that loop is a <code>while<\/code> loop.<\/div><\/figure>\n<hr />\n<h2 class=\"c2\" id=\"the-code\">The Code<\/h2>\n<p>The whole chatbot is a few lines. Run it, type a question, and type <code>exit<\/code> to stop.<\/p>\n<figure class=\"visual\"><div class=\"hl\" data-x=\"1\"><pre><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">dotenv<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">load_dotenv<\/span>\n<span class=\"n\">load_dotenv<\/span><span class=\"p\">()<\/span>\n\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain.chat_models<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">init_chat_model<\/span>\n\n<span class=\"n\">model<\/span> <span class=\"o\">=<\/span> <span class=\"n\">init_chat_model<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"mistralai:mistral-small-2603\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">temperature<\/span><span class=\"o\">=<\/span><span class=\"mf\">0.7<\/span><span class=\"p\">)<\/span>\n\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"welcome to chatbot type exit to quit\"<\/span><span class=\"p\">)<\/span>\n\n<span class=\"k\">while<\/span> <span class=\"kc\">True<\/span><span class=\"p\">:<\/span>\n    <span class=\"n\">user_input<\/span> <span class=\"o\">=<\/span> <span class=\"nb\">input<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"You : ask any think: \"<\/span><span class=\"p\">)<\/span>\n    <span class=\"k\">if<\/span> <span class=\"n\">user_input<\/span> <span class=\"o\">==<\/span> <span class=\"s2\">\"exit\"<\/span><span class=\"p\">:<\/span>\n        <span class=\"k\">break<\/span>\n\n    <span class=\"n\">response<\/span> <span class=\"o\">=<\/span> <span class=\"n\">model<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">(<\/span><span class=\"n\">user_input<\/span><span class=\"p\">)<\/span>\n\n    <span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"sa\">f<\/span><span class=\"s2\">\"Bot: <\/span><span class=\"si\">{<\/span><span class=\"n\">response<\/span><span class=\"o\">.<\/span><span class=\"n\">content<\/span><span class=\"si\">}<\/span><span class=\"s2\">\"<\/span><span class=\"p\">)<\/span><\/pre><\/div><div class=\"em-point\"><b>The model is created once,<\/b> before the loop. The loop only asks and answers.<\/div><div class=\"em-point\"><b>This chatbot has no memory yet.<\/b> Every question goes to the model on its own. The next lesson fixes that.<\/div><\/figure>\n<hr />\n<h2 class=\"c3\" id=\"how-the-code-works\">How the Code Works<\/h2>\n<p>Each line has one job.<\/p>\n<figure class=\"visual\"><div class=\"em-tbl ck-tbl\"><table><tr><th>Line<\/th><th>What it does<\/th><\/tr><tr><td><code>load_dotenv()<\/code><\/td><td>Reads your API key from the <code>.env<\/code> file.<\/td><\/tr><tr><td><code>model = init_chat_model(\"mistralai:mistral-small-2603\", temperature=0.7)<\/code><\/td><td>Creates the model one time. The provider and the model name are one string, and <code>temperature<\/code> is the setting from the earlier lesson.<\/td><\/tr><tr><td><code>while True:<\/code><\/td><td>Repeats the lines inside it, again and again, until a <code>break<\/code>.<\/td><\/tr><tr><td><code>user_input = input(\"You : ask any think: \")<\/code><\/td><td>Waits for you to type. What you type goes into <code>user_input<\/code>.<\/td><\/tr><tr><td><code>if user_input == \"exit\":<\/code> <code>break<\/code><\/td><td>If you type <code>exit<\/code>, the loop stops and the program ends.<\/td><\/tr><tr><td><code>response = model.invoke(user_input)<\/code><\/td><td>Sends your text to the model and waits for the answer.<\/td><\/tr><tr><td><code>print(f\"Bot: {response.content}\")<\/code><\/td><td>Prints the text of the answer. <code>response.content<\/code> is the text.<\/td><\/tr><\/table><\/div><\/figure>\n<hr />\n<h2 class=\"c4\" id=\"try-it\">Try It<\/h2>\n<p>Run the chatbot and have a short chat with it.<\/p>\n<figure class=\"visual\"><div class=\"em-point\"><b>Type this first:<\/b> <code>My name is Dhruv.<\/code><\/div><div class=\"em-point\"><b>Then type this:<\/b> <code>What is my name?<\/code><\/div><div class=\"em-point\"><b>Look at the second answer.<\/b> The bot does not remember your name. Each message goes to the model alone. The next lesson, Chat History, shows why this happens and how to fix it.<\/div><\/figure>\n<hr />", "toc": [{"id": "what-is-a-chatbot", "name": "What Is a Chatbot?"}, {"id": "the-code", "name": "The Code"}, {"id": "how-the-code-works", "name": "How the Code Works"}, {"id": "try-it", "name": "Try It"}], "search": "", "slides": null, "slideCount": 0, "code": []}};</script>
