<script>window.PAGE = {"id": "n24", "root": "../", "lesson": {"id": "n24", "title": "Chains vs Graphs", "short": "Chains vs Graphs", "unit": "Unit 4", "unitName": "Agents with LangGraph", "pos": 3, "of": 16, "sub": "", "info": "Linear chains vs cyclic graphs", "html": "<h2 class=\"c1\" id=\"same-job-two-ways\">Same Job, Two Ways<\/h2>\n<p>Take the blog post job again: write it, review it, show it. Let us build it as a chain, and then as a graph.<\/p>\n<figure class=\"visual\"><div class=\"em-fig\"><svg class=\"em-svg\" viewBox=\"0 0 640 340\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"ga\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#9aa3a2\"/><\/marker><marker id=\"gb\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#c9583a\"/><\/marker><\/defs><text x=\"10\" y=\"32\" font-size=\"13\" font-weight=\"800\" fill=\"#7a7367\" letter-spacing=\"1\">A CHAIN: ONE WAY ONLY<\/text><rect x=\"50.0\" y=\"50.0\" width=\"120\" height=\"40\" rx=\"9\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"110.0\" y=\"75.2\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">Write<\/text><rect x=\"240.0\" y=\"50.0\" width=\"120\" height=\"40\" rx=\"9\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"300.0\" y=\"75.2\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">Review<\/text><rect x=\"430.0\" y=\"50.0\" width=\"120\" height=\"40\" rx=\"9\" fill=\"#d4ecea\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"490.0\" y=\"75.2\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">Show<\/text><line x1=\"172.0\" y1=\"70.0\" x2=\"238.0\" y2=\"70.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><line x1=\"362.0\" y1=\"70.0\" x2=\"428.0\" y2=\"70.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><text x=\"300\" y=\"110\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#9aa3a2\">no way back<\/text><text x=\"10\" y=\"168\" font-size=\"13\" font-weight=\"800\" fill=\"#7a7367\" letter-spacing=\"1\">A GRAPH: IT CAN GO BACK<\/text><rect x=\"50.0\" y=\"265.0\" width=\"120\" height=\"40\" rx=\"9\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"110.0\" y=\"290.2\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">Write<\/text><rect x=\"240.0\" y=\"265.0\" width=\"120\" height=\"40\" rx=\"9\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"300.0\" y=\"290.2\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">Review<\/text><rect x=\"430.0\" y=\"265.0\" width=\"120\" height=\"40\" rx=\"9\" fill=\"#d4ecea\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"490.0\" y=\"290.2\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">Show<\/text><line x1=\"172.0\" y1=\"285.0\" x2=\"238.0\" y2=\"285.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><line x1=\"362.0\" y1=\"285.0\" x2=\"428.0\" y2=\"285.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><path d=\"M 300 264 Q 205 207 110 264\" fill=\"none\" stroke=\"#c9583a\" stroke-width=\"2.6\" marker-end=\"url(#gb)\"/><text x=\"205\" y=\"219\" font-size=\"14\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#c9583a\">needs a fix: go back<\/text><\/svg><\/div><div class=\"px\">\n  <div class=\"px-r\"><span>In a chain<\/span><div>write, then review, then show. One pass. If the review fails, there is nowhere to go.<\/div><\/div>\n  <div class=\"px-r hi\"><span>In a graph<\/span><div>write, then review. If the review fails, an arrow leads <b>back to write<\/b>. If it passes, we show the result.<\/div><\/div>\n<\/div><\/figure>\n<hr />\n<h2 class=\"c2\" id=\"three-things-a-chain-cannot-do\">Three Things a Chain Cannot Do<\/h2>\n<p>The chain works for a straight line. It fails the moment the job needs more.<\/p>\n<figure class=\"visual\"><div class=\"em-tbl\"><table>\n<tr><th>The job needs&hellip;<\/th><th>A chain<\/th><th>A graph<\/th><\/tr>\n<tr><td><b>Another try<\/b> after a mistake<\/td><td>cannot go back<\/td><td>an edge can lead back to an earlier step<\/td><\/tr>\n<tr><td><b>Shared notes<\/b> between steps<\/td><td>each step only gets the output of the one before<\/td><td>one shared state that every step reads and writes<\/td><\/tr>\n<tr><td><b>Waiting<\/b> for a human<\/td><td>cannot stop in the middle<\/td><td>the graph can pause, and continue later with the saved state<\/td><\/tr>\n<\/table><\/div>\n<\/figure>\n<hr />\n<h2 class=\"c3\" id=\"head-to-head\">Head to Head<\/h2>\n<p>The same comparison, one row at a time.<\/p>\n<figure class=\"visual\"><div class=\"em-tbl\"><table>\n<tr><th><\/th><th>LangChain chain<\/th><th>LangGraph graph<\/th><\/tr>\n<tr><td><b>Shape<\/b><\/td><td>a line that moves forward<\/td><td>any shape, with loops allowed<\/td><\/tr>\n<tr><td><b>Next step<\/b><\/td><td>fixed by the pipe <code>|<\/code><\/td><td>chosen by edges, including conditions<\/td><\/tr>\n<tr><td><b>Data between steps<\/b><\/td><td>the output of the last step<\/td><td>one shared state<\/td><\/tr>\n<tr><td><b>Memory across messages<\/b><\/td><td>you add it by hand<\/td><td>built in: the graph saves its state (a checkpointer)<\/td><\/tr>\n<tr><td><b>Human approval<\/b><\/td><td>hard to add<\/td><td>built in: <code>interrupt()<\/code> pauses the graph<\/td><\/tr>\n<\/table><\/div>\n<\/figure>\n<hr />\n<h2 class=\"c4\" id=\"which-one-should-i-use\">Which One Should I Use?<\/h2>\n<p>A graph is not always better. It is more work, so use it only when you need it.<\/p>\n<figure class=\"visual\"><div class=\"em-pair\">\n  <div class=\"em-fc\"><div class=\"stp-l\">Use a chain when<\/div><span>The steps are always in the same order.<\/span><span>It is a single question and a single answer, like simple RAG or a summary.<\/span><span>Nobody needs to approve anything in the middle.<\/span><span>It finishes in one pass.<\/span><\/div>\n  <div class=\"em-fc out\"><div class=\"stp-l\">Use LangGraph when<\/div><span>The work must be checked and repeated.<\/span><span>The model must keep choosing tools until it is done.<\/span><span>A person must approve a risky step.<\/span><span>Several specialised steps work as a team.<\/span><\/div>\n<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c5\" id=\"quick-revision\">Quick Revision<\/h2>\n<p>The whole lesson on one page.<\/p>\n<figure class=\"visual\"><div class=\"bnt rt4 three\"><div class=\"bnt-t c3\"><div class=\"bnt-h\">Chain<\/div><div class=\"bnt-b\">A line<\/div><div class=\"bnt-p\">Prompt, model, parser. It only moves forward.<\/div><\/div><div class=\"bnt-t c1\"><div class=\"bnt-h\">Graph<\/div><div class=\"bnt-b\">Steps and arrows<\/div><div class=\"bnt-p\">Nodes do the work, edges join them, and the state is shared. It can loop and pause.<\/div><\/div><div class=\"bnt-t c4\"><div class=\"bnt-h\">Choosing<\/div><div class=\"bnt-b\">Start simple<\/div><div class=\"bnt-p\">Use a chain for a straight line. Use LangGraph when the job needs loops, memory or approval.<\/div><\/div><\/div><\/figure>\n<div class=\"docs\"><span class=\"docs-l\">LangGraph docs<\/span><a href=\"https://docs.langchain.com/oss/python/langgraph/overview\" target=\"_blank\" rel=\"noopener\">LangGraph overview<\/a><a href=\"https://docs.langchain.com/oss/python/langgraph/persistence\" target=\"_blank\" rel=\"noopener\">Persistence<\/a><a href=\"https://docs.langchain.com/oss/python/langgraph/interrupts\" target=\"_blank\" rel=\"noopener\">Interrupts<\/a><\/div>\n\n<hr />", "toc": [{"id": "same-job-two-ways", "name": "Same Job, Two Ways"}, {"id": "three-things-a-chain-cannot-do", "name": "Three Things a Chain Cannot Do"}, {"id": "head-to-head", "name": "Head to Head"}, {"id": "which-one-should-i-use", "name": "Which One Should I Use?"}, {"id": "quick-revision", "name": "Quick Revision"}], "search": "", "slides": null, "slideCount": 0, "code": []}};</script>
