<script>window.PAGE = {"id": "n05", "root": "../", "lesson": {"id": "n05", "title": "Virtual Environment & uv", "short": "Virtual Environment & uv", "unit": "Unit 1", "unitName": "Start Here: GenAI Basics", "pos": 5, "of": 7, "sub": "", "info": "What a virtual environment is, pip and uv, installing uv, requirements.txt, and the three setup commands", "html": "<h2 class=\"c1\" id=\"what-is-a-virtual-environment\">What Is a Virtual Environment?<\/h2>\n<blockquote class=\"def\"><span class=\"deflab\">Definition<\/span>\n<p>A <strong>virtual environment<\/strong> is a private folder of Python packages for one project. When it is active, Python uses only the packages inside it, and everything you install goes inside it too.<\/p>\n<\/blockquote>\n<figure class=\"visual\"><div class=\"bnt rt4 three\" style=\"grid-template-columns: repeat(2, 1fr)\"><div class=\"bnt-t c1\"><div class=\"bnt-h\">Without<\/div><div class=\"bnt-b\">One shared set of packages<\/div><div class=\"bnt-p\">Every project uses the same packages. Two projects that need different versions of one package clash.<\/div><\/div><div class=\"bnt-t c3\"><div class=\"bnt-h\">With a virtual environment<\/div><div class=\"bnt-b\">One set for each project<\/div><div class=\"bnt-p\">Each project has its own packages. Installing in one project never affects another.<\/div><\/div><\/div><\/figure>\n<hr />\n<h2 class=\"c2\" id=\"what-is-inside-the-folder\">What Is Inside the Folder?<\/h2>\n<p>The folder is named <code>.venv<\/code> and it sits inside your project.<\/p>\n<figure class=\"visual\"><div class=\"hl\" data-x=\"1\"><pre>your-project/\n├── .venv/\n│   ├── Scripts/            python and the activate script\n│   ├── Lib/site-packages/  the packages you install\n│   └── pyvenv.cfg\n├── requirements.txt\n└── your code files<\/pre><\/div><div class=\"em-point\"><b>Installed packages live in the folder.<\/b> <code>pip install<\/code> and <code>uv pip install<\/code> put them in <code>Lib/site-packages<\/code> inside <code>.venv<\/code>, not on your computer.<\/div><div class=\"em-point\"><b>Activate switches the project on.<\/b> It tells the terminal to use the Python and packages of this folder. <code>(.venv)<\/code> appears in the terminal line.<\/div><div class=\"em-point\"><b>It can be thrown away.<\/b> Delete the folder and create it again from requirements.txt. Nothing is lost.<\/div><div class=\"em-point\"><b>On macOS and Linux,<\/b> <code>Scripts<\/code> is named <code>bin<\/code> and <code>Lib<\/code> is named <code>lib<\/code>.<\/div><\/figure>\n<hr />\n<h2 class=\"c3\" id=\"package-managers-pip-and-uv\">Package Managers: pip and uv<\/h2>\n<p>A package manager downloads and installs Python packages for you. There are two to know.<\/p>\n<figure class=\"visual\"><div class=\"em-tbl ck-tbl\"><table><tr><th>Tool<\/th><th>Comes with Python?<\/th><th>Install a package<\/th><\/tr><tr><td>pip<\/td><td>Yes, already installed<\/td><td><code>pip install package<\/code><\/td><\/tr><tr class=\"hi\"><td>uv<\/td><td>No, a one-time download<\/td><td><code>uv pip install package<\/code><\/td><\/tr><\/table><\/div><div class=\"em-point\"><b>uv does the same job as pip, and faster.<\/b> Every uv command in these notes has a pip twin, so pip works too.<\/div><div class=\"em-point\"><b>We use uv.<\/b> The commands that follow are uv commands.<\/div><\/figure>\n<hr />\n<h2 class=\"c4\" id=\"install-uv\">Install uv<\/h2>\n<p>uv is a one-time download. You do it once per computer.<\/p>\n<figure class=\"visual\"><div class=\"hl\" data-x=\"1\"><pre><span class=\"c1\"># Windows (PowerShell)<\/span>\npowershell<span class=\"w\"> <\/span>-ExecutionPolicy<span class=\"w\"> <\/span>ByPass<span class=\"w\"> <\/span>-c<span class=\"w\"> <\/span><span class=\"s2\">\"irm https://astral.sh/uv/install.ps1 | iex\"<\/span>\n\n<span class=\"c1\"># macOS and Linux<\/span>\ncurl<span class=\"w\"> <\/span>-LsSf<span class=\"w\"> <\/span>https://astral.sh/uv/install.sh<span class=\"w\"> <\/span><span class=\"p\">|<\/span><span class=\"w\"> <\/span>sh\n\n<span class=\"c1\"># Or, with pip (any system)<\/span>\npip<span class=\"w\"> <\/span>install<span class=\"w\"> <\/span>uv<\/pre><\/div><div class=\"em-point\"><b>Close the terminal and open a new one<\/b> after installing, so that the <code>uv<\/code> command is found.<\/div><div class=\"em-point\"><b>Check it worked:<\/b> <code>uv --version<\/code> prints the version number.<\/div><div class=\"em-point\"><b>Windows has WinGet?<\/b> This also works: <code>winget install --id=astral-sh.uv -e<\/code><\/div><div class=\"em-point\"><b>Installation guide:<\/b> <a href=\"https://docs.astral.sh/uv/getting-started/installation/\" target=\"_blank\" rel=\"noopener\">docs.astral.sh/uv/getting-started/installation ↗<\/a><\/div><\/figure>\n<hr />\n<h2 class=\"c5\" id=\"create-and-activate\">Create and Activate<\/h2>\n<p>Every project gets its own environment. Create it, then switch it on.<\/p>\n<figure class=\"visual\"><div class=\"hl\" data-x=\"1\"><pre>uv<span class=\"w\"> <\/span>venv\n.venv<span class=\"se\">\\S<\/span>cripts<span class=\"se\">\\a<\/span>ctivate<\/pre><\/div><div class=\"em-point\"><b>uv venv<\/b> creates the <code>.venv<\/code> folder inside the project.<\/div><div class=\"em-point\"><b>activate<\/b> switches it on. <code>(.venv)<\/code> appears at the start of the terminal line.<\/div><div class=\"em-point\"><b>On macOS and Linux,<\/b> activate with <code>source .venv/bin/activate<\/code>.<\/div><div class=\"em-point\"><b>When you finish,<\/b> type <code>deactivate<\/code>.<\/div><div class=\"em-point\"><b>Not active?<\/b> Packages go to the computer's Python, and the project cannot find them. Always check for <code>(.venv)<\/code> before you install or run.<\/div><div class=\"em-point\"><b>Windows says scripts are disabled?<\/b> Run this once, then activate again: <code>Set-ExecutionPolicy -Scope CurrentUser RemoteSigned<\/code><\/div><\/figure>\n<hr />\n<h2 class=\"c1\" id=\"what-is-requirementstxt\">What Is requirements.txt?<\/h2>\n<p>A plain text file that lists the packages a project needs, one on each line.<\/p>\n<figure class=\"visual\"><div class=\"hl\" data-x=\"1\"><pre>mistralai\ngoogle-genai\npython-dotenv\ngroq<\/pre><\/div><div class=\"em-point\"><b>requirements.txt<\/b> is a list of package names, one on each line. This one belongs to a project that calls LLMs.<\/div><div class=\"em-point\"><b>To install everything in the list,<\/b> run this:<\/div><div class=\"hl\" data-x=\"1\"><pre>uv<span class=\"w\"> <\/span>pip<span class=\"w\"> <\/span>install<span class=\"w\"> <\/span>-r<span class=\"w\"> <\/span>requirements.txt<\/pre><\/div><div class=\"em-point\"><b>With pip:<\/b> <code>pip install -r requirements.txt<\/code><\/div><div class=\"em-point\"><b>Share a project with this file,<\/b> and anyone can build the same environment.<\/div><\/figure>\n<hr />\n<h2 class=\"c2\" id=\"setup-in-three-commands\">Setup in Three Commands<\/h2>\n<p>This is the whole setup for any project. Run it in the project folder.<\/p>\n<figure class=\"visual\"><div class=\"hl\" data-x=\"1\"><pre>uv<span class=\"w\"> <\/span>venv\n.venv<span class=\"se\">\\S<\/span>cripts<span class=\"se\">\\a<\/span>ctivate\nuv<span class=\"w\"> <\/span>pip<span class=\"w\"> <\/span>install<span class=\"w\"> <\/span>-r<span class=\"w\"> <\/span>requirements.txt<\/pre><\/div><div class=\"em-tbl ck-tbl\"><table><tr><th>Task<\/th><th>uv<\/th><th>pip<\/th><\/tr><tr><td>Create the environment<\/td><td><code>uv venv<\/code><\/td><td><code>python -m venv .venv<\/code><\/td><\/tr><tr><td>Install one package<\/td><td><code>uv pip install package<\/code><\/td><td><code>pip install package<\/code><\/td><\/tr><tr><td>Install from the file<\/td><td><code>uv pip install -r requirements.txt<\/code><\/td><td><code>pip install -r requirements.txt<\/code><\/td><\/tr><tr><td>See what is installed<\/td><td><code>uv pip list<\/code><\/td><td><code>pip list<\/code><\/td><\/tr><tr><td>Save the list to the file<\/td><td><code>uv pip freeze &gt; requirements.txt<\/code><\/td><td><code>pip freeze &gt; requirements.txt<\/code><\/td><\/tr><\/table><\/div><\/figure>\n<hr />\n<h2 class=\"c3\" id=\"files-to-keep-out-of-git\">Files to Keep Out of Git<\/h2>\n<p>Two things should stay out of Git.<\/p>\n<figure class=\"visual\"><div class=\"hl\" data-x=\"1\"><pre>.env\n.venv/<\/pre><\/div><div class=\"em-point\"><b>.env<\/b> holds your API keys. Never share it.<\/div><div class=\"em-point\"><b>.venv/<\/b> is large, and it can be rebuilt from requirements.txt. Share the file, not the folder.<\/div><div class=\"em-point\"><b>Put these two lines<\/b> in a file named <code>.gitignore<\/code>.<\/div><\/figure>\n<hr />\n<h2 class=\"c4\" id=\"documentation\">Documentation<\/h2>\n<p>Where to read more.<\/p>\n<figure class=\"visual\"><div class=\"em-tbl ck-tbl\"><table><tr><th>Topic<\/th><th>Documentation<\/th><\/tr><tr><td>Install uv<\/td><td><a href=\"https://docs.astral.sh/uv/getting-started/installation/\" target=\"_blank\" rel=\"noopener\">docs.astral.sh/uv/getting-started/installation ↗<\/a><\/td><\/tr><tr><td>uv pip commands<\/td><td><a href=\"https://docs.astral.sh/uv/pip/\" target=\"_blank\" rel=\"noopener\">docs.astral.sh/uv/pip ↗<\/a><\/td><\/tr><tr><td>Virtual environments in uv<\/td><td><a href=\"https://docs.astral.sh/uv/pip/environments/\" target=\"_blank\" rel=\"noopener\">docs.astral.sh/uv/pip/environments ↗<\/a><\/td><\/tr><tr><td>Python venv<\/td><td><a href=\"https://docs.python.org/3/library/venv.html\" target=\"_blank\" rel=\"noopener\">docs.python.org/3/library/venv.html ↗<\/a><\/td><\/tr><tr><td>pip<\/td><td><a href=\"https://pip.pypa.io/en/stable/\" target=\"_blank\" rel=\"noopener\">pip.pypa.io/en/stable ↗<\/a><\/td><\/tr><\/table><\/div><\/figure>\n<hr />", "toc": [{"id": "what-is-a-virtual-environment", "name": "What Is a Virtual Environment?"}, {"id": "what-is-inside-the-folder", "name": "What Is Inside the Folder?"}, {"id": "package-managers-pip-and-uv", "name": "Package Managers: pip and uv"}, {"id": "install-uv", "name": "Install uv"}, {"id": "create-and-activate", "name": "Create and Activate"}, {"id": "what-is-requirementstxt", "name": "What Is requirements.txt?"}, {"id": "setup-in-three-commands", "name": "Setup in Three Commands"}, {"id": "files-to-keep-out-of-git", "name": "Files to Keep Out of Git"}, {"id": "documentation", "name": "Documentation"}], "search": "", "slides": null, "slideCount": 0, "code": []}};</script>
