<script>window.PAGE = {"id": "n07_3", "root": "../", "lesson": {"id": "n07_3", "title": "Prompt Templates", "short": "Prompt Templates", "unit": "Unit 2", "unitName": "Build with LangChain", "pos": 7, "of": 15, "sub": "", "info": "The f-string problem, prompt templates, and templates with many blanks", "html": "<h2 class=\"c3\" id=\"8-your-prompt-works\">1. Your Prompt Works<\/h2>\n<p>You are building a state capital app. You write the question with an f-string, and it works.<\/p>\n<figure class=\"visual\"><div class=\"ft\">\n  <div class=\"ft-code\"><div class=\"hl\" data-x=\"1\"><pre><span class=\"n\">state<\/span> <span class=\"o\">=<\/span> <span class=\"s2\">\"Rajasthan\"<\/span>\n<span class=\"n\">response<\/span> <span class=\"o\">=<\/span> <span class=\"n\">model<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">(<\/span><span class=\"sa\">f<\/span><span class=\"s2\">\"What is the capital of <\/span><span class=\"si\">{<\/span><span class=\"n\">state<\/span><span class=\"si\">}<\/span><span class=\"s2\">?\"<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">response<\/span><span class=\"o\">.<\/span><span class=\"n\">content<\/span><span class=\"p\">)<\/span><\/pre><\/div><\/div>\n  <div class=\"ft-side\"><span class=\"ft-l\">Python fills {state}<\/span><span class=\"ft-p\">\"What is the capital of Rajasthan?\"<\/span><span class=\"ft-a\">&darr; the model answers<\/span><span class=\"ft-r\">Jaipur<\/span><\/div>\n<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c4\" id=\"9-then-your-prompts-multiply\">2. Then Your Prompts Multiply<\/h2>\n<p>The app grows. The same prompt, with the same rules, is now copied into many files. Then the rules change.<\/p>\n<figure class=\"visual\"><div class=\"cp\">\n  <div class=\"cp-files\">\n    <div class=\"cp-f\"><span>app.py<\/span><code>f\"Answer in one word. Capital of {state}?\"<\/code><\/div>\n    <div class=\"cp-f\"><span>bot.py<\/span><code>f\"Answer in one word. Capital of {state}?\"<\/code><\/div>\n    <div class=\"cp-f\"><span>api.py<\/span><code>f\"Answer in one word. Capital of {state}?\"<\/code><\/div>\n    <div class=\"cp-f\"><span>quiz.py<\/span><code>f\"Answer in one word. Capital of {state}?\"<\/code><\/div>\n  <\/div>\n  <div class=\"cp-msg\"><b>Boss:<\/b> \"Make the answer two lines, not one word.\"<span>You must now edit every file. Miss one, and your app answers two different ways.<\/span><\/div>\n<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c5\" id=\"10-the-fix-a-prompt-template\">3. The Fix: A Prompt Template<\/h2>\n<blockquote class=\"def\"><span class=\"deflab\">Definition<\/span>\n<p>A <strong>prompt template<\/strong> is a <mark class=\"hp\">prompt written once<\/mark>, with <mark class=\"hk\">blanks (placeholders)<\/mark> that you fill in later.<\/p>\n<\/blockquote>\n<p>Like a blank form, you print it once and fill it in for every person. In LangChain you fill the blanks with <code>.invoke()<\/code> and a dictionary.<\/p>\n<figure class=\"visual\"><div class=\"tf\">\n  <div class=\"tf-t\"><small>The template: written once<\/small><div class=\"tf-b\">What is the capital of <span>{state}<\/span>?<\/div><\/div>\n  <div class=\"tf-a\"><span>fill the blank<\/span>→<\/div>\n  <div class=\"tf-o\">\n    <div class=\"tf-r\"><i>{\"state\": \"Rajasthan\"}<\/i><b>What is the capital of Rajasthan?<\/b><\/div>\n    <div class=\"tf-r\"><i>{\"state\": \"Punjab\"}<\/i><b>What is the capital of Punjab?<\/b><\/div>\n    <div class=\"tf-r\"><i>{\"state\": \"Gujarat\"}<\/i><b>What is the capital of Gujarat?<\/b><\/div>\n  <\/div>\n<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c1\" id=\"11-three-kinds-of-templates\">4. Three Kinds of Templates<\/h2>\n<p>LangChain has three ways to write a template. The first two give you one plain prompt. The third gives you a system message and a human message. Pick a tab to see the code and what comes back.<\/p>\n<figure class=\"visual\"><div class=\"dw\"><div class=\"dw-c t\">\n  <input type=\"radio\" name=\"dwt\" id=\"t1\" checked><label for=\"t1\">PromptTemplate<\/label>\n  <input type=\"radio\" name=\"dwt\" id=\"t2\"><label for=\"t2\">ChatPromptTemplate.from_template<\/label>\n  <input type=\"radio\" name=\"dwt\" id=\"t3\"><label for=\"t3\">ChatPromptTemplate.from_messages<\/label>\n  <div class=\"hl\" data-x=\"1\"><pre><span class=\"vt1\"><span class=\"n\">template<\/span> <span class=\"o\">=<\/span> <span class=\"n\">PromptTemplate<\/span><span class=\"o\">.<\/span><span class=\"n\">from_template<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"What is the capital of <\/span><span class=\"si\">{state}<\/span><span class=\"s2\">?\"<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">prompt<\/span> <span class=\"o\">=<\/span> <span class=\"n\">template<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">({<\/span><span class=\"s2\">\"state\"<\/span><span class=\"p\">:<\/span> <span class=\"s2\">\"Rajasthan\"<\/span><span class=\"p\">})<\/span><\/span><span class=\"vt2\"><span class=\"n\">template<\/span> <span class=\"o\">=<\/span> <span class=\"n\">ChatPromptTemplate<\/span><span class=\"o\">.<\/span><span class=\"n\">from_template<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"What is the capital of <\/span><span class=\"si\">{state}<\/span><span class=\"s2\">?\"<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">prompt<\/span> <span class=\"o\">=<\/span> <span class=\"n\">template<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">({<\/span><span class=\"s2\">\"state\"<\/span><span class=\"p\">:<\/span> <span class=\"s2\">\"Rajasthan\"<\/span><span class=\"p\">})<\/span><\/span><span class=\"vt3\"><span class=\"n\">template<\/span> <span class=\"o\">=<\/span> <span class=\"n\">ChatPromptTemplate<\/span><span class=\"o\">.<\/span><span class=\"n\">from_messages<\/span><span class=\"p\">([<\/span>\n    <span class=\"p\">(<\/span><span class=\"s2\">\"system\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"Answer in one word.\"<\/span><span class=\"p\">),<\/span>\n    <span class=\"p\">(<\/span><span class=\"s2\">\"human\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"What is the capital of <\/span><span class=\"si\">{state}<\/span><span class=\"s2\">?\"<\/span><span class=\"p\">),<\/span>\n<span class=\"p\">])<\/span>\n<span class=\"n\">prompt<\/span> <span class=\"o\">=<\/span> <span class=\"n\">template<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">({<\/span><span class=\"s2\">\"state\"<\/span><span class=\"p\">:<\/span> <span class=\"s2\">\"Rajasthan\"<\/span><span class=\"p\">})<\/span><\/span><\/pre><\/div>\n  <div class=\"dw-ans tp\"><span class=\"dw-al\">prompt (what the template gives back)<\/span><div class=\"dw-at\"><span class=\"vt1\">StringPromptValue(text='What is the capital of Rajasthan?')<\/span><span class=\"vt2\">ChatPromptValue(messages=[HumanMessage('What is the capital of Rajasthan?')])<\/span><span class=\"vt3\">ChatPromptValue(messages=[SystemMessage('Answer in one word.'), HumanMessage('What is the capital of Rajasthan?')])<\/span><\/div><\/div>\n  <div class=\"dw-cap\"><span class=\"vt1\">One plain text prompt.<\/span><span class=\"vt2\">One Human message.<\/span><span class=\"vt3\">A System message and a Human message. This is the one we use most.<\/span><\/div>\n<\/div><\/div>\n<\/figure>\n<hr />\n<h2 class=\"c2\" id=\"12-template-vs-f-string\">5. Template vs f-String<\/h2>\n<p>Both build a prompt. A template does more for you.<\/p>\n<figure class=\"visual\"><div class=\"pq\">\n  <div class=\"pq-c weak\">\n    <div class=\"pq-t\"><i>f-string<\/i><\/div>\n    <ul class=\"vs-u\"><li><b>Filled:<\/b> right now, once<\/li><li><b>Variables:<\/b> Python does not track them<\/li><li><b>Roles:<\/b> one plain string, or you build the messages by hand<\/li><li><b>Reuse:<\/b> copy and paste it into every file<\/li><\/ul>\n  <\/div>\n  <div class=\"pq-a\">→<\/div>\n  <div class=\"pq-c strong\">\n    <div class=\"pq-t\"><i>Prompt template<\/i><\/div>\n    <ul class=\"vs-u\"><li><b>Filled:<\/b> later, as many times as you want<\/li><li><b>Variables:<\/b> it knows them, <code>['state']<\/code>, and tells you if one is missing<\/li><li><b>Roles:<\/b> system and human messages are built in<\/li><li><b>Reuse:<\/b> write it once and import it everywhere<\/li><\/ul>\n  <\/div>\n<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c3\" id=\"13-more-than-one-blank\">6. More Than One Blank<\/h2>\n<p>A template can have many blanks, in the system message and in the human message. You fill them all with one dictionary. The template also knows which variables it needs: <code>input_variables<\/code>.<\/p>\n<figure class=\"visual\"><div class=\"mb\">\n  <div class=\"mb-c tpl\">\n    <div class=\"mb-l\">The template, with four blanks<\/div>\n    <div class=\"mb-m\"><span class=\"mb-r\">system<\/span>You are an expert <u>{profession}<\/u> with a <u>{tone}<\/u> tone. Answer strictly in 2 lines.<\/div>\n    <div class=\"mb-m\"><span class=\"mb-r\">human<\/span>Explain the concept of <u>{concept}<\/u> to a <u>{audience_level}<\/u> student.<\/div>\n    <div class=\"mb-v\">template.input_variables <b>&rarr; ['audience_level', 'concept', 'profession', 'tone']<\/b><\/div>\n  <\/div>\n  <div class=\"mb-a\"><span>fill all blanks with one dictionary<\/span>&darr;<code>{\"profession\": \"Chef\", \"tone\": \"funny\", \"concept\": \"gravity\", \"audience_level\": \"5-year-old\"}<\/code><\/div>\n  <div class=\"mb-c out\">\n    <div class=\"mb-l\">The filled prompt<\/div>\n    <div class=\"mb-m\"><span class=\"mb-r\">system<\/span>You are an expert <b>Chef<\/b> with a <b>funny<\/b> tone. Answer strictly in 2 lines.<\/div>\n    <div class=\"mb-m\"><span class=\"mb-r\">human<\/span>Explain the concept of <b>gravity<\/b> to a <b>5-year-old<\/b> student.<\/div>\n  <\/div>\n<\/div>\n<\/figure>\n<div class=\"docs\"><span class=\"docs-l\">LangChain docs<\/span><a href=\"https://reference.langchain.com/python/langchain_core/prompts/chat/ChatPromptTemplate\" target=\"_blank\" rel=\"noopener\">ChatPromptTemplate<\/a><\/div>\n\n<div class=\"sc-head code-head\">Code<\/div><details class=\"codecard\"><summary><span class=\"cc-t\">Five ways to send a prompt<\/span><span class=\"cc-f\">prompts.py · 46 lines<\/span><span class=\"cc-show\">Show code<\/span><\/summary><div class=\"hl\"><table class=\"hltable\"><tr><td class=\"linenos\"><div class=\"linenodiv\"><pre><span class=\"normal\"> 1<\/span>\n<span class=\"normal\"> 2<\/span>\n<span class=\"normal\"> 3<\/span>\n<span class=\"normal\"> 4<\/span>\n<span class=\"normal\"> 5<\/span>\n<span class=\"normal\"> 6<\/span>\n<span class=\"normal\"> 7<\/span>\n<span class=\"normal\"> 8<\/span>\n<span class=\"normal\"> 9<\/span>\n<span class=\"normal\">10<\/span>\n<span class=\"normal\">11<\/span>\n<span class=\"normal\">12<\/span>\n<span class=\"normal\">13<\/span>\n<span class=\"normal\">14<\/span>\n<span class=\"normal\">15<\/span>\n<span class=\"normal\">16<\/span>\n<span class=\"normal\">17<\/span>\n<span class=\"normal\">18<\/span>\n<span class=\"normal\">19<\/span>\n<span class=\"normal\">20<\/span>\n<span class=\"normal\">21<\/span>\n<span class=\"normal\">22<\/span>\n<span class=\"normal\">23<\/span>\n<span class=\"normal\">24<\/span>\n<span class=\"normal\">25<\/span>\n<span class=\"normal\">26<\/span>\n<span class=\"normal\">27<\/span>\n<span class=\"normal\">28<\/span>\n<span class=\"normal\">29<\/span>\n<span class=\"normal\">30<\/span>\n<span class=\"normal\">31<\/span>\n<span class=\"normal\">32<\/span>\n<span class=\"normal\">33<\/span>\n<span class=\"normal\">34<\/span>\n<span class=\"normal\">35<\/span>\n<span class=\"normal\">36<\/span>\n<span class=\"normal\">37<\/span>\n<span class=\"normal\">38<\/span>\n<span class=\"normal\">39<\/span>\n<span class=\"normal\">40<\/span>\n<span class=\"normal\">41<\/span>\n<span class=\"normal\">42<\/span>\n<span class=\"normal\">43<\/span>\n<span class=\"normal\">44<\/span><\/pre><\/div><\/td><td class=\"code\"><div><pre><span><\/span><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">dotenv<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">load_dotenv<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain.chat_models<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">init_chat_model<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_core.messages<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">SystemMessage<\/span><span class=\"p\">,<\/span> <span class=\"n\">HumanMessage<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_core.prompts<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">PromptTemplate<\/span><span class=\"p\">,<\/span> <span class=\"n\">ChatPromptTemplate<\/span>\n\n<span class=\"n\">load_dotenv<\/span><span class=\"p\">()<\/span>\n\n<span class=\"n\">model<\/span> <span class=\"o\">=<\/span> <span class=\"n\">init_chat_model<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"mistralai:open-mistral-nemo\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">temperature<\/span><span class=\"o\">=<\/span><span class=\"mi\">0<\/span><span class=\"p\">)<\/span>\n\n<span class=\"n\">state<\/span> <span class=\"o\">=<\/span> <span class=\"nb\">input<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Enter the state name: \"<\/span><span class=\"p\">)<\/span>\n\n<span class=\"c1\"># 1. Plain f-string (long answer)<\/span>\n<span class=\"n\">res1<\/span> <span class=\"o\">=<\/span> <span class=\"n\">model<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">(<\/span><span class=\"sa\">f<\/span><span class=\"s2\">\"What is the capital of <\/span><span class=\"si\">{<\/span><span class=\"n\">state<\/span><span class=\"si\">}<\/span><span class=\"s2\">?\"<\/span><span class=\"p\">)<\/span>\n\n<span class=\"c1\"># 2. Messages: system = rules, human = question<\/span>\n<span class=\"n\">messages<\/span> <span class=\"o\">=<\/span> <span class=\"p\">[<\/span>\n    <span class=\"n\">SystemMessage<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Answer in one word.\"<\/span><span class=\"p\">),<\/span>\n    <span class=\"n\">HumanMessage<\/span><span class=\"p\">(<\/span><span class=\"sa\">f<\/span><span class=\"s2\">\"What is the capital of <\/span><span class=\"si\">{<\/span><span class=\"n\">state<\/span><span class=\"si\">}<\/span><span class=\"s2\">?\"<\/span><span class=\"p\">),<\/span>\n<span class=\"p\">]<\/span>\n<span class=\"n\">res2<\/span> <span class=\"o\">=<\/span> <span class=\"n\">model<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">(<\/span><span class=\"n\">messages<\/span><span class=\"p\">)<\/span>\n\n<span class=\"c1\"># 3. PromptTemplate: one plain text prompt<\/span>\n<span class=\"n\">template3<\/span> <span class=\"o\">=<\/span> <span class=\"n\">PromptTemplate<\/span><span class=\"o\">.<\/span><span class=\"n\">from_template<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"What is the capital of <\/span><span class=\"si\">{state}<\/span><span class=\"s2\">?\"<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">prompt3<\/span> <span class=\"o\">=<\/span> <span class=\"n\">template3<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">({<\/span><span class=\"s2\">\"state\"<\/span><span class=\"p\">:<\/span> <span class=\"n\">state<\/span><span class=\"p\">})<\/span>\n<span class=\"n\">res3<\/span> <span class=\"o\">=<\/span> <span class=\"n\">model<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">(<\/span><span class=\"n\">prompt3<\/span><span class=\"p\">)<\/span>
