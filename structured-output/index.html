<script>window.PAGE = {"id": "n11_2", "root": "../", "lesson": {"id": "n11_2", "title": "Structured Output", "short": "Structured Output", "unit": "Unit 2", "unitName": "Build with LangChain", "pos": 11, "of": 16, "sub": "", "info": "Structured output with a Pydantic schema: PydanticOutputParser and with_structured_output", "html": "<h2 class=\"c5\" id=\"5-what-is-structured-output\">1. What Is Structured Output?<\/h2>\n<p>Structured output means the reply follows a <strong>schema<\/strong> you define: exact fields and types, <strong>checked for you<\/strong>. The <strong>JsonOutputParser<\/strong> from the last tab gives a dict too, but it has no rules.<\/p>\n<figure class=\"visual\"><div class=\"kyp\">\n  <div class=\"kyp-c t\"><div class=\"why-h\"><span class=\"tag t\">JsonOutputParser<\/span><span class=\"stp-l\">The model decides<\/span><\/div>\n    <div class=\"kyp-v\"><code>{'name': 'Aman', 'age': 21, 'occupation': 'college student', 'skills': ['Python', 'FastAPI']}<\/code><\/div>\n    <div class=\"kyp-r\"><b>Fields<\/b>whatever the model chooses<\/div>\n    <div class=\"kyp-r\"><b>Types<\/b>not checked<\/div>\n    <div class=\"kyp-r\"><b>A missing field<\/b>you will not know<\/div><\/div>\n  <div class=\"kyp-c d\"><div class=\"why-h\"><span class=\"tag d\">Structured output<\/span><span class=\"stp-l\">You decide<\/span><\/div>\n    <div class=\"kyp-v\"><code>UserProfile(name='Aman', age=21, is_student=True, skills=['Python', 'FastAPI'])<\/code><\/div>\n    <div class=\"kyp-r\"><b>Fields<\/b>exactly name, age, is_student, skills<\/div>\n    <div class=\"kyp-r\"><b>Types<\/b>checked: age must be an int<\/div>\n    <div class=\"kyp-r\"><b>A missing field<\/b>you get an error<\/div><\/div>\n<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c1\" id=\"6-you-define-the-schema\">2. You Define the Schema<\/h2>\n<blockquote class=\"def\"><span class=\"deflab\">Definition<\/span>\n<p><strong>Pydantic<\/strong> lets you write the schema as a class. The result is an <mark class=\"hp\">object with exactly these fields<\/mark> and types.<\/p>\n<\/blockquote>\n<figure class=\"visual\"><div class=\"hl\" data-x=\"1\"><pre><span class=\"k\">class<\/span><span class=\"w\"> <\/span><span class=\"nc\">UserProfile<\/span><span class=\"p\">(<\/span><span class=\"n\">BaseModel<\/span><span class=\"p\">):<\/span>\n    <span class=\"n\">name<\/span><span class=\"p\">:<\/span> <span class=\"nb\">str<\/span> <span class=\"o\">=<\/span> <span class=\"n\">Field<\/span><span class=\"p\">(<\/span><span class=\"n\">description<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"Full name of the user\"<\/span><span class=\"p\">)<\/span>\n    <span class=\"n\">age<\/span><span class=\"p\">:<\/span> <span class=\"nb\">int<\/span> <span class=\"o\">=<\/span> <span class=\"n\">Field<\/span><span class=\"p\">(<\/span><span class=\"n\">description<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"Age in years as an integer\"<\/span><span class=\"p\">)<\/span>\n    <span class=\"n\">is_student<\/span><span class=\"p\">:<\/span> <span class=\"nb\">bool<\/span> <span class=\"o\">=<\/span> <span class=\"n\">Field<\/span><span class=\"p\">(<\/span><span class=\"n\">description<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"True if the person is studying, else False\"<\/span><span class=\"p\">)<\/span>\n    <span class=\"n\">skills<\/span><span class=\"p\">:<\/span> <span class=\"nb\">list<\/span><span class=\"p\">[<\/span><span class=\"nb\">str<\/span><span class=\"p\">]<\/span> <span class=\"o\">=<\/span> <span class=\"n\">Field<\/span><span class=\"p\">(<\/span><span class=\"n\">description<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"List of technical skills\"<\/span><span class=\"p\">)<\/span><\/pre><\/div>\n<div class=\"px\">\n  <div class=\"px-r\"><span>Text in<\/span><div>Aman is a 21 year old college student who knows Python and FastAPI.<\/div><\/div>\n  <div class=\"px-r hi\"><span>You get<\/span><div><code>UserProfile(name='Aman', age=21, is_student=True, skills=['Python', 'FastAPI'])<\/code><\/div><\/div>\n<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c2\" id=\"7-two-ways-to-get-it\">3. Two Ways to Get It<\/h2>\n<p>Both give you a checked <code>UserProfile<\/code>. The difference is <strong>where the schema goes<\/strong>.<\/p>\n<figure class=\"visual\"><div class=\"dw\"><div class=\"dw-c t\">\n  <input type=\"radio\" name=\"dwq\" id=\"ot1\" checked><label for=\"ot1\">PydanticOutputParser<\/label>\n  <input type=\"radio\" name=\"dwq\" id=\"ot2\"><label for=\"ot2\">with_structured_output<\/label>\n  <div class=\"hl\" data-x=\"1\"><pre><span class=\"vot1\"><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_core.prompts<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">ChatPromptTemplate<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_core.output_parsers<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">PydanticOutputParser<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">pydantic<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">BaseModel<\/span><span class=\"p\">,<\/span> <span class=\"n\">Field<\/span>\n\n<span class=\"k\">class<\/span><span class=\"w\"> <\/span><span class=\"nc\">UserProfile<\/span><span class=\"p\">(<\/span><span class=\"n\">BaseModel<\/span><span class=\"p\">):<\/span>\n    <span class=\"n\">name<\/span><span class=\"p\">:<\/span> <span class=\"nb\">str<\/span> <span class=\"o\">=<\/span> <span class=\"n\">Field<\/span><span class=\"p\">(<\/span><span class=\"n\">description<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"Full name of the user\"<\/span><span class=\"p\">)<\/span>\n    <span class=\"n\">age<\/span><span class=\"p\">:<\/span> <span class=\"nb\">int<\/span> <span class=\"o\">=<\/span> <span class=\"n\">Field<\/span><span class=\"p\">(<\/span><span class=\"n\">description<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"Age in years as an integer\"<\/span><span class=\"p\">)<\/span>\n    <span class=\"n\">is_student<\/span><span class=\"p\">:<\/span> <span class=\"nb\">bool<\/span> <span class=\"o\">=<\/span> <span class=\"n\">Field<\/span><span class=\"p\">(<\/span><span class=\"n\">description<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"True if the person is studying, else False\"<\/span><span class=\"p\">)<\/span>\n    <span class=\"n\">skills<\/span><span class=\"p\">:<\/span> <span class=\"nb\">list<\/span><span class=\"p\">[<\/span><span class=\"nb\">str<\/span><span class=\"p\">]<\/span> <span class=\"o\">=<\/span> <span class=\"n\">Field<\/span><span class=\"p\">(<\/span><span class=\"n\">description<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"List of technical skills\"<\/span><span class=\"p\">)<\/span>\n\n<span class=\"n\">parser<\/span> <span class=\"o\">=<\/span> <span class=\"n\">PydanticOutputParser<\/span><span class=\"p\">(<\/span><span class=\"n\">pydantic_object<\/span><span class=\"o\">=<\/span><span class=\"n\">UserProfile<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">parser<\/span><span class=\"o\">.<\/span><span class=\"n\">get_format_instructions<\/span><span class=\"p\">())<\/span>\n\n<span class=\"n\">template<\/span> <span class=\"o\">=<\/span> <span class=\"n\">ChatPromptTemplate<\/span><span class=\"o\">.<\/span><span class=\"n\">from_template<\/span><span class=\"p\">(<\/span>\n    <span class=\"s2\">\"Extract the user profile from this text: <\/span><span class=\"si\">{bio}<\/span><span class=\"se\">\\n<\/span><span class=\"si\">{format_instructions}<\/span><span class=\"s2\">\"<\/span>\n<span class=\"p\">)<\/span>\n<span class=\"n\">prompt<\/span> <span class=\"o\">=<\/span> <span class=\"n\">template<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">({<\/span>\n    <span class=\"s2\">\"bio\"<\/span><span class=\"p\">:<\/span> <span class=\"s2\">\"Aman is a 21 year old college student who knows Python and FastAPI.\"<\/span><span class=\"p\">,<\/span>\n    <span class=\"s2\">\"format_instructions\"<\/span><span class=\"p\">:<\/span> <span class=\"n\">parser<\/span><span class=\"o\">.<\/span><span class=\"n\">get_format_instructions<\/span><span class=\"p\">(),<\/span>\n<span class=\"p\">})<\/span>\n<span class=\"n\">res1<\/span> <span class=\"o\">=<\/span> <span class=\"n\">model<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">(<\/span><span class=\"n\">prompt<\/span><span class=\"p\">)<\/span>\n\n<span class=\"n\">profile<\/span> <span class=\"o\">=<\/span> <span class=\"n\">parser<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">(<\/span><span class=\"n\">res1<\/span><span class=\"p\">)<\/span><\/span><span class=\"vot2\"><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">pydantic<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">BaseModel<\/span><span class=\"p\">,<\/span> <span class=\"n\">Field<\/span>\n\n<span class=\"k\">class<\/span><span class=\"w\"> <\/span><span class=\"nc\">UserProfile<\/span><span class=\"p\">(<\/span><span class=\"n\">BaseModel<\/span><span class=\"p\">):<\/span>\n    <span class=\"n\">name<\/span><span class=\"p\">:<\/span> <span class=\"nb\">str<\/span> <span class=\"o\">=<\/span> <span class=\"n\">Field<\/span><span class=\"p\">(<\/span><span class=\"n\">description<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"Full name of the user\"<\/span><span class=\"p\">)<\/span>\n    <span class=\"n\">age<\/span><span class=\"p\">:<\/span> <span class=\"nb\">int<\/span> <span class=\"o\">=<\/span> <span class=\"n\">Field<\/span><span class=\"p\">(<\/span><span class=\"n\">description<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"Age in years as an integer\"<\/span><span class=\"p\">)<\/span>\n    <span class=\"n\">is_student<\/span><span class=\"p\">:<\/span> <span class=\"nb\">bool<\/span> <span class=\"o\">=<\/span> <span class=\"n\">Field<\/span><span class=\"p\">(<\/span><span class=\"n\">description<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"True if the person is studying, else False\"<\/span><span class=\"p\">)<\/span>\n    <span class=\"n\">skills<\/span><span class=\"p\">:<\/span> <span class=\"nb\">list<\/span><span class=\"p\">[<\/span><span class=\"nb\">str<\/span><span class=\"p\">]<\/span> <span class=\"o\">=<\/span> <span class=\"n\">Field<\/span><span class=\"p\">(<\/span><span class=\"n\">description<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"List of technical skills\"<\/span><span class=\"p\">)<\/span>\n\n<span class=\"n\">structured_model<\/span> <span class=\"o\">=<\/span> <span class=\"n\">model<\/span><span class=\"o\">.<\/span><span class=\"n\">with_structured_output<\/span><span class=\"p\">(<\/span><span class=\"n\">UserProfile<\/span><span class=\"p\">)<\/span>\n\n<span class=\"n\">res2<\/span> <span class=\"o\">=<\/span> <span class=\"n\">structured_model<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">(<\/span>\n    <span class=\"s2\">\"Priya is a 28 year old software engineer skilled in React, Node and Docker.\"<\/span>\n<span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">res2<\/span><span class=\"p\">)<\/span><\/span><\/pre><\/div>\n  <div class=\"dw-blk ins\"><span class=\"dw-al\">Format instructions: text added to your prompt<\/span><div class=\"hl\" data-x=\"1\"><pre><span class=\"vot1\">The output should be formatted as a JSON instance that conforms to the JSON schema below.\n\nAs an example, for the schema {\"properties\": {\"foo\": {\"title\": \"Foo\", \"description\": \"a list of strings\", \"type\": \"array\", \"items\": {\"type\": \"string\"}}}, \"required\": [\"foo\"]}\nthe object {\"foo\": [\"bar\", \"baz\"]} is a well-formatted instance of the schema. The object {\"properties\": {\"foo\": [\"bar\", \"baz\"]}} is not well-formatted.\n\nHere is the output schema:\n```\n{\"properties\": {\"name\": {\"description\": \"Full name of the user\", \"title\": \"Name\", \"type\": \"string\"}, \"age\": {\"description\": \"Age in years as an integer\", \"title\": \"Age\", \"type\": \"integer\"}, \"is_student\": {\"description\": \"True if the person is studying, else False\", \"title\": \"Is Student\", \"type\": \"boolean\"}, \"skills\": {\"description\": \"List of technical skills\", \"items\": {\"type\": \"string\"}, \"title\": \"Skills\", \"type\": \"array\"}}, \"required\": [\"name\", \"age\", \"is_student\", \"skills\"]}\n```<\/span><span class=\"vot2\">None. The schema goes to the API with the request, not into your prompt.<\/span><\/pre><\/div><\/div>\n  <div class=\"dw-blk\"><span class=\"dw-al\">The model replied<\/span><div class=\"hl\" data-x=\"1\"><pre><span class=\"vot1\">```json\n<span class=\"p\">{<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">\"name\"<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"Aman\"<\/span><span class=\"p\">,<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">\"age\"<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"mi\">21<\/span><span class=\"p\">,<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">\"is_student\"<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"kc\">true<\/span><span class=\"p\">,<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">\"skills\"<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"p\">[<\/span><span class=\"s2\">\"Python\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"FastAPI\"<\/span><span class=\"p\">]<\/span>\n<span class=\"p\">}<\/span>\n```<\/span><span class=\"vot2\">(nothing to read: you get the object directly)<\/span><\/pre><\/div><\/div>\n  <div class=\"dw-blk get\"><span class=\"dw-al\">You get<\/span><div class=\"hl\" data-x=\"1\"><pre><span class=\"vot1\"><span class=\"n\">UserProfile<\/span><span class=\"p\">(<\/span><span class=\"n\">name<\/span><span class=\"o\">=<\/span><span class=\"s1\">'Aman'<\/span><span class=\"p\">,<\/span> <span class=\"n\">age<\/span><span class=\"o\">=<\/span><span class=\"mi\">21<\/span><span class=\"p\">,<\/span> <span class=\"n\">is_student<\/span><span class=\"o\">=<\/span><span class=\"kc\">True<\/span><span class=\"p\">,<\/span> <span class=\"n\">skills<\/span><span class=\"o\">=<\/span><span class=\"p\">[<\/span><span class=\"s1\">'Python'<\/span><span class=\"p\">,<\/span> <span class=\"s1\">'FastAPI'<\/span><span class=\"p\">])<\/span><\/span><span class=\"vot2\"><span class=\"n\">UserProfile<\/span><span class=\"p\">(<\/span><span class=\"n\">name<\/span><span class=\"o\">=<\/span><span class=\"s1\">'Priya'<\/span><span class=\"p\">,<\/span> <span class=\"n\">age<\/span><span class=\"o\">=<\/span><span class=\"mi\">28<\/span><span class=\"p\">,<\/span> <span class=\"n\">is_student<\/span><span class=\"o\">=<\/span><span class=\"kc\">False<\/span><span class=\"p\">,<\/span> <span class=\"n\">skills<\/span><span class=\"o\">=<\/span><span class=\"p\">[<\/span><span class=\"s1\">'React'<\/span><span class=\"p\">,<\/span> <span class=\"s1\">'Node'<\/span><span class=\"p\">,<\/span> <span class=\"s1\">'Docker'<\/span><span class=\"p\">])<\/span><\/span><\/pre><\/div><\/div>\n  <div class=\"dw-cap\"><span class=\"vot1\">The parser turns the reply into a UserProfile and checks the types.<\/span><span class=\"vot2\">Best way. No parser and no format instructions.<\/span><\/div>\n<\/div><\/div>\n<\/figure>\n<div class=\"docs\"><span class=\"docs-l\">LangChain docs<\/span><a href=\"https://docs.langchain.com/oss/python/langchain/models#structured-output\" target=\"_blank\" rel=\"noopener\">Structur
