<script>window.PAGE = {"id": "n07_2", "root": "../", "lesson": {"id": "n07_2", "title": "Writing Messages", "short": "Writing Messages", "unit": "Unit 2", "unitName": "Build with LangChain", "pos": 6, "of": 15, "sub": "", "info": "The four roles, three ways to write messages, personalities and role mistakes", "html": "<h2 class=\"c4\" id=\"4-the-four-roles\">1. The Four Roles<\/h2>\n<p>Every message has a role, because the provider's API must know who is speaking. LangChain writes a role in two ways: a short <strong>tuple<\/strong> like <code>(\"system\", \"...\")<\/code>, or a <strong>message class<\/strong> like <code>SystemMessage<\/code>.<\/p>\n<figure class=\"visual\"><div class=\"rl\">\n  <div class=\"rl-h\"><span>Role<\/span><span>What it is<\/span><span>As a tuple<\/span><span>As a class<\/span><\/div>\n  <div class=\"rl-r\"><span class=\"rl-n sys\">system<\/span><span class=\"rl-d\">The rules, written by the developer<\/span><code>(\"system\", \"...\")<\/code><code>SystemMessage<\/code><\/div>\n  <div class=\"rl-r\"><span class=\"rl-n hum\">human<\/span><span class=\"rl-d\">The user's question<\/span><code>(\"human\", \"...\")<\/code><code>HumanMessage<\/code><\/div>\n  <div class=\"rl-r\"><span class=\"rl-n ai\">ai<\/span><span class=\"rl-d\">The reply from the model<\/span><code>(\"ai\", \"...\")<\/code><code>AIMessage<\/code><\/div>\n  <div class=\"rl-r\"><span class=\"rl-n tool\">tool<\/span><span class=\"rl-d\">The result of a tool. We use it later, when the model calls tools<\/span><code>(\"tool\", \"...\")<\/code><code>ToolMessage<\/code><\/div>\n<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c5\" id=\"5-three-ways-to-send-a-prompt\">2. Three Ways to Send a Prompt<\/h2>\n<p>In LangChain you send a prompt with <code>model.invoke()<\/code>. You can pass a plain string, a list of tuples, or a list of message classes. Same idea, three ways to write it.<\/p>\n<figure class=\"visual\"><div class=\"dw\"><div class=\"dw-c t\">\n  <input type=\"radio\" name=\"dww\" id=\"w1\" checked><label for=\"w1\">String<\/label>\n  <input type=\"radio\" name=\"dww\" id=\"w2\"><label for=\"w2\">Tuples<\/label>\n  <input type=\"radio\" name=\"dww\" id=\"w3\"><label for=\"w3\">Message classes<\/label>\n  <div class=\"hl\" data-x=\"1\"><pre><span class=\"vw1\"><span class=\"n\">response<\/span> <span class=\"o\">=<\/span> <span class=\"n\">model<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"What is a Python list?\"<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">response<\/span><span class=\"o\">.<\/span><span class=\"n\">content<\/span><span class=\"p\">)<\/span><\/span><span class=\"vw2\"><span class=\"n\">messages<\/span> <span class=\"o\">=<\/span> <span class=\"p\">[<\/span>\n    <span class=\"p\">(<\/span><span class=\"s2\">\"system\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"Answer in one line.\"<\/span><span class=\"p\">),<\/span>\n    <span class=\"p\">(<\/span><span class=\"s2\">\"human\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"What is a Python list?\"<\/span><span class=\"p\">),<\/span>\n<span class=\"p\">]<\/span>\n<span class=\"n\">response<\/span> <span class=\"o\">=<\/span> <span class=\"n\">model<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">(<\/span><span class=\"n\">messages<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">response<\/span><span class=\"o\">.<\/span><span class=\"n\">content<\/span><span class=\"p\">)<\/span><\/span><span class=\"vw3\"><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_core.messages<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">SystemMessage<\/span><span class=\"p\">,<\/span> <span class=\"n\">HumanMessage<\/span>\n\n<span class=\"n\">messages<\/span> <span class=\"o\">=<\/span> <span class=\"p\">[<\/span>\n    <span class=\"n\">SystemMessage<\/span><span class=\"p\">(<\/span><span class=\"n\">content<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"Answer in one line.\"<\/span><span class=\"p\">),<\/span>\n    <span class=\"n\">HumanMessage<\/span><span class=\"p\">(<\/span><span class=\"n\">content<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"What is a Python list?\"<\/span><span class=\"p\">),<\/span>\n<span class=\"p\">]<\/span>\n<span class=\"n\">response<\/span> <span class=\"o\">=<\/span> <span class=\"n\">model<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">(<\/span><span class=\"n\">messages<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">response<\/span><span class=\"o\">.<\/span><span class=\"n\">content<\/span><span class=\"p\">)<\/span><\/span><\/pre><\/div>\n  <div class=\"dw-cap\"><span class=\"vw1\">A plain string. LangChain sends it as one Human message.<\/span><span class=\"vw2\">A list of (role, text) tuples. The short way to write System and Human messages.<\/span><span class=\"vw3\">The same list, written with the message classes from LangChain.<\/span><\/div>\n<\/div><\/div>\n<\/figure>\n<hr />\n<h2 class=\"c1\" id=\"6-same-question-new-personality\">3. Same Question, New Personality<\/h2>\n<p>The question stays the same. Only the system prompt changes, and the model changes how it talks. Pick a personality.<\/p>\n<figure class=\"visual\"><div class=\"dw\"><div class=\"dw-c t\">\n  <input type=\"radio\" name=\"dwq\" id=\"q1\" checked><label for=\"q1\">One word<\/label>\n  <input type=\"radio\" name=\"dwq\" id=\"q2\"><label for=\"q2\">Friendly teacher<\/label>\n  <input type=\"radio\" name=\"dwq\" id=\"q3\"><label for=\"q3\">Amitabh Bachchan style<\/label>\n  <input type=\"radio\" name=\"dwq\" id=\"q4\"><label for=\"q4\">Samay Raina style<\/label>\n  <div class=\"hl\" data-x=\"1\"><pre><span class=\"vq1\"><span class=\"n\">messages<\/span> <span class=\"o\">=<\/span> <span class=\"p\">[<\/span>\n    <span class=\"p\">(<\/span><span class=\"s2\">\"system\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"Answer in one word.\"<\/span><span class=\"p\">),<\/span>\n    <span class=\"p\">(<\/span><span class=\"s2\">\"human\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"What is the capital of Rajasthan?\"<\/span><span class=\"p\">),<\/span>\n<span class=\"p\">]<\/span>\n<span class=\"n\">response<\/span> <span class=\"o\">=<\/span> <span class=\"n\">model<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">(<\/span><span class=\"n\">messages<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">response<\/span><span class=\"o\">.<\/span><span class=\"n\">content<\/span><span class=\"p\">)<\/span><\/span><span class=\"vq2\"><span class=\"n\">messages<\/span> <span class=\"o\">=<\/span> <span class=\"p\">[<\/span>\n    <span class=\"p\">(<\/span><span class=\"s2\">\"system\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"You are a friendly teacher. Explain in 2 lines.\"<\/span><span class=\"p\">),<\/span>\n    <span class=\"p\">(<\/span><span class=\"s2\">\"human\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"What is the capital of Rajasthan?\"<\/span><span class=\"p\">),<\/span>\n<span class=\"p\">]<\/span>\n<span class=\"n\">response<\/span> <span class=\"o\">=<\/span> <span class=\"n\">model<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">(<\/span><span class=\"n\">messages<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">response<\/span><span class=\"o\">.<\/span><span class=\"n\">content<\/span><span class=\"p\">)<\/span><\/span><span class=\"vq3\"><span class=\"n\">messages<\/span> <span class=\"o\">=<\/span> <span class=\"p\">[<\/span>\n    <span class=\"p\">(<\/span><span class=\"s2\">\"system\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"Talk like Amitabh Bachchan: a deep, dramatic voice with pauses. Keep it to 2 lines.\"<\/span><span class=\"p\">),<\/span>\n    <span class=\"p\">(<\/span><span class=\"s2\">\"human\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"What is the capital of Rajasthan?\"<\/span><span class=\"p\">),<\/span>\n<span class=\"p\">]<\/span>\n<span class=\"n\">response<\/span> <span class=\"o\">=<\/span> <span class=\"n\">model<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">(<\/span><span class=\"n\">messages<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">response<\/span><span class=\"o\">.<\/span><span class=\"n\">content<\/span><span class=\"p\">)<\/span><\/span><span class=\"vq4\"><span class=\"n\">messages<\/span> <span class=\"o\">=<\/span> <span class=\"p\">[<\/span>\n    <span class=\"p\">(<\/span><span class=\"s2\">\"system\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"Talk like Samay Raina: sarcastic, self-roasting humour. Keep it to 2 lines.\"<\/span><span class=\"p\">),<\/span>\n    <span class=\"p\">(<\/span><span class=\"s2\">\"human\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"What is the capital of Rajasthan?\"<\/span><span class=\"p\">),<\/span>\n<span class=\"p\">]<\/span>\n<span class=\"n\">response<\/span> <span class=\"o\">=<\/span> <span class=\"n\">model<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">(<\/span><span class=\"n\">messages<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">response<\/span><span class=\"o\">.<\/span><span class=\"n\">content<\/span><span class=\"p\">)<\/span><\/span><\/pre><\/div>\n  <div class=\"dw-ans\"><span class=\"dw-al\">AI message<\/span><div class=\"dw-at\"><span class=\"vq1\">Jaipur<\/span><span class=\"vq2\">Jaipur is the capital of Rajasthan.<br>It's known for its vibrant culture, historic palaces, and bustling markets.<\/span><span class=\"vq3\">In the heart of the Rajput kingdom&hellip; the capital rises, a city of forts and history.<br>Jaipur, the Pink City, reigns as Rajasthan's capital.<\/span><span class=\"vq4\">I'm not a geography teacher, but the capital of Rajasthan is Jaipur&mdash;so if you're hoping to get lost in a desert, you've come to the right place.<br>(I'd say I'd be the capital of confusion, but that's just my sense of direction.)<\/span><\/div><\/div>\n  <div class=\"dw-cap\"><span class=\"vqx\">Only the system line changes. These are real answers from a model (gpt-oss-20b on Groq). Your answers will be a little different each time.<\/span><\/div>\n<\/div><\/div>\n<\/figure>\n<hr />\n<h2 class=\"c2\" id=\"7-common-role-mistakes\">4. Common Role Mistakes<\/h2>\n<p>A wrong role fails inside LangChain, before anything is sent to the model. LangChain tells you which role it did not understand.<\/p>\n<figure class=\"visual\"><div class=\"rw rw2\">\n  <div class=\"rw-c no\">\n    <div class=\"rw-m\">✕ Wrong: capital letters<\/div>\n    <code>(\"AI\", \"Hello!\")<\/code>\n    <div class=\"rw-e\">ValueError: Unexpected message type: 'AI'<\/div>\n    <p class=\"rw-f\"><b>Fix:<\/b> write the role in lowercase, <code>\"ai\"<\/code>.<\/p>\n  <\/div>\n  <div class=\"rw-c no\">\n    <div class=\"rw-m\">✕ Wrong: an invented role<\/div>\n    <code>(\"robot\", \"Hello!\")<\/code>\n    <div class=\"rw-e\">ValueError: Unexpected message type: 'robot'<\/div>\n    <p class=\"rw-f\"><b>Fix:<\/b> use one of the allowed roles below.<\/p>\n  <\/div>\n  <div class=\"rw-c ok\">\n    <div class=\"rw-m\">✓ Right<\/div>\n    <code>(\"ai\", \"Hello!\")<\/code>\n    <div class=\"rw-e ok\">No error<\/div>\n    <p class=\"rw-f\">The role is lowercase and it is an allowed role.<\/p>\n  <\/div>\n<\/div>\n<div class=\"rw-allow\"><span>Allowed roles<\/span><i>human<\/i><i>user<\/i><i>ai<\/i><i>assistant<\/i><i>system<\/i><i>tool<\/i><\/div>\n<\/figure>\n", "toc": [{"id": "4-the-four-roles", "name": "4. The Four Roles"}, {"id": "5-three-ways-to-send-a-prompt", "name": "5. Three Ways to Send a Prompt"}, {"id": "6-same-question-new-personality", "name": "6. Same Question, New Personality"}, {"id": "7-common-role-mistakes", "name": "7. Common Role Mistakes"}], "search": "", "slides": null, "slideCount": 0, "code": []}};</script>
