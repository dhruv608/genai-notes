<script>window.PAGE = {"id": "n27_1", "root": "../", "lesson": {"id": "n27_1", "title": "The Pipeline Idea", "short": "The Pipeline Idea", "unit": "Unit 4", "unitName": "Agents with LangGraph", "pos": 8, "of": 16, "sub": "", "info": "Why one big prompt fails, the assembly-line idea, and the three nodes with their roles", "html": "<h2 class=\"c1\" id=\"the-problem-one-big-prompt-does-too-much\">The Problem: One Big Prompt Does Too Much<\/h2>\n<p>We want to turn a rough text into a Hinglish video script.<\/p>\n<figure class=\"visual\"><div class=\"px\">\n  <div class=\"px-r\"><span>The issue<\/span><div>We have a rough text. We want a clean, catchy video script in Hinglish.<\/div><\/div>\n  <div class=\"px-r\"><span>The first try<\/span><div>One prompt: &ldquo;Fix the grammar, make it a video script, and translate it to Hinglish.&rdquo;<\/div><\/div>\n  <div class=\"px-r\"><span>Why it fails<\/span><div>The model does three jobs at once, and does each one a little worse. When the result is bad, you cannot tell which job went wrong. And you cannot change one job without touching the others.<\/div><\/div>\n  <div class=\"px-r hi\"><span>The fix<\/span><div>Split it into <b>three small jobs<\/b>, each in its own node, one after another. This is a sequential workflow.<\/div><\/div>\n<\/div><\/figure>\n<hr />\n<h2 class=\"c2\" id=\"the-idea-an-assembly-line\">The Idea: An Assembly Line<\/h2>\n<blockquote class=\"def\"><span class=\"deflab\">Definition<\/span>\n<p>A <strong>sequential workflow<\/strong> is a graph whose nodes run one after another in a fixed order. Each node reads what the one before it wrote, and writes its own result into the state.<\/p>\n<\/blockquote>\n<figure class=\"visual\"><div class=\"em-fig\"><svg class=\"em-svg\" viewBox=\"0 0 960 120\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"ga\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#9aa3a2\"/><\/marker><\/defs><rect x=\"10.0\" y=\"31.0\" width=\"112\" height=\"38\" rx=\"9\" fill=\"#fbf1d3\" stroke=\"#efdca0\" stroke-width=\"1.6\"/><text x=\"66.0\" y=\"55.0\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#8a6a12\" font-family=\"Consolas, monospace\">raw_input<\/text><rect x=\"144.0\" y=\"31.0\" width=\"120\" height=\"38\" rx=\"9\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"204.0\" y=\"55.2\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">editor<\/text><rect x=\"286.0\" y=\"31.0\" width=\"112\" height=\"38\" rx=\"9\" fill=\"#fbf1d3\" stroke=\"#efdca0\" stroke-width=\"1.6\"/><text x=\"342.0\" y=\"55.0\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#8a6a12\" font-family=\"Consolas, monospace\">edited_text<\/text><rect x=\"420.0\" y=\"31.0\" width=\"120\" height=\"38\" rx=\"9\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"480.0\" y=\"55.2\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">scriptwriter<\/text><rect x=\"562.0\" y=\"31.0\" width=\"112\" height=\"38\" rx=\"9\" fill=\"#fbf1d3\" stroke=\"#efdca0\" stroke-width=\"1.6\"/><text x=\"618.0\" y=\"55.0\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#8a6a12\" font-family=\"Consolas, monospace\">script_text<\/text><rect x=\"696.0\" y=\"31.0\" width=\"120\" height=\"38\" rx=\"9\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"756.0\" y=\"55.2\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">translator<\/text><rect x=\"838.0\" y=\"31.0\" width=\"112\" height=\"38\" rx=\"9\" fill=\"#fbf1d3\" stroke=\"#efdca0\" stroke-width=\"1.6\"/><text x=\"894.0\" y=\"55.0\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#8a6a12\" font-family=\"Consolas, monospace\">final_output<\/text><line x1=\"124.0\" y1=\"50.0\" x2=\"142.0\" y2=\"50.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><line x1=\"266.0\" y1=\"50.0\" x2=\"284.0\" y2=\"50.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><line x1=\"400.0\" y1=\"50.0\" x2=\"418.0\" y2=\"50.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><line x1=\"542.0\" y1=\"50.0\" x2=\"560.0\" y2=\"50.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><line x1=\"676.0\" y1=\"50.0\" x2=\"694.0\" y2=\"50.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><line x1=\"818.0\" y1=\"50.0\" x2=\"836.0\" y2=\"50.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><text x=\"480\" y=\"108\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#7a7367\">state key (gold) &middot; node (teal)<\/text><\/svg><\/div><div class=\"em-tbl\"><table>\n<tr><th>Node<\/th><th>Its job<\/th><th>Reads<\/th><th>Writes<\/th><\/tr>\n<tr><td><code>editor<\/code><\/td><td>fix grammar and spelling, smooth the flow<\/td><td><code>raw_input<\/code><\/td><td><code>edited_text<\/code><\/td><\/tr>\n<tr><td><code>scriptwriter<\/code><\/td><td>turn the clean text into a catchy video script<\/td><td><code>edited_text<\/code><\/td><td><code>script_text<\/code><\/td><\/tr>\n<tr><td><code>translator<\/code><\/td><td>turn the script into natural Hinglish<\/td><td><code>script_text<\/code><\/td><td><code>final_output<\/code><\/td><\/tr>\n<\/table><\/div>\n<div class=\"em-point\"><b>Nothing is passed by hand.<\/b> Each node reads a key that an earlier node wrote. The state carries the work from step to step.<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c3\" id=\"the-three-nodes\">The Three Nodes<\/h2>\n<p>Each node has one job and its own role in the prompt.<\/p>\n<figure class=\"visual\"><div class=\"px\">\n  <div class=\"px-r\"><span>Editor<\/span><div>&ldquo;You are an expert copyeditor.&rdquo; Cleans the text and keeps the meaning.<\/div><\/div>\n  <div class=\"px-r\"><span>Scriptwriter<\/span><div>&ldquo;You are a charismatic YouTube content creator.&rdquo; Makes it punchy and conversational.<\/div><\/div>\n  <div class=\"px-r hi\"><span>Translator<\/span><div>&ldquo;You are an expert content localizer for the Indian market.&rdquo; Writes natural Hinglish, not a word-by-word translation.<\/div><\/div>\n<\/div><div class=\"hl\" data-x=\"1\"><pre><span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">scriptwriter_node<\/span><span class=\"p\">(<\/span><span class=\"n\">state<\/span><span class=\"p\">:<\/span><span class=\"n\">pipelinestate<\/span><span class=\"p\">):<\/span>\n<span class=\"w\">    <\/span><span class=\"sd\">\"\"\"Stage 2: Formats the clean text into an engaging video script style.\"\"\"<\/span>\n\n    <span class=\"n\">prompt<\/span> <span class=\"o\">=<\/span> <span class=\"p\">(<\/span>\n        <span class=\"s2\">\"You are a charismatic YouTube content creator. Take this edited text and transform \"<\/span>\n        <span class=\"s2\">\"it into a highly engaging, punchy, conversational video script hook. Make it sound \"<\/span>\n        <span class=\"s2\">\"like a real person speaking passionately. Return only the script content.<\/span><span class=\"se\">\\n\\n<\/span><span class=\"s2\">\"<\/span>\n        <span class=\"sa\">f<\/span><span class=\"s2\">\"Edited Text:<\/span><span class=\"se\">\\n<\/span><span class=\"si\">{<\/span><span class=\"n\">state<\/span><span class=\"p\">[<\/span><span class=\"s1\">'edited_text'<\/span><span class=\"p\">]<\/span><span class=\"si\">}<\/span><span class=\"s2\">\"<\/span>\n    <span class=\"p\">)<\/span>\n\n    <span class=\"n\">response<\/span> <span class=\"o\">=<\/span> <span class=\"n\">model<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">(<\/span><span class=\"n\">prompt<\/span><span class=\"p\">)<\/span>\n    <span class=\"k\">return<\/span> <span class=\"p\">{<\/span><span class=\"s2\">\"script_text\"<\/span><span class=\"p\">:<\/span> <span class=\"n\">response<\/span><span class=\"o\">.<\/span><span class=\"n\">content<\/span><span class=\"o\">.<\/span><span class=\"n\">strip<\/span><span class=\"p\">()}<\/span><\/pre><\/div>\n<div class=\"em-cap\">The scriptwriter node in full, from your <code>02_sequential.py<\/code>. Every node has the same shape: read one key, build a prompt, call the model, return one key.<\/div>\n<\/figure>\n", "toc": [{"id": "the-problem-one-big-prompt-does-too-much", "name": "The Problem: One Big Prompt Does Too Much"}, {"id": "the-idea-an-assembly-line", "name": "The Idea: An Assembly Line"}, {"id": "the-three-nodes", "name": "The Three Nodes"}], "search": "", "slides": null, "slideCount": 0, "code": []}};</script>
