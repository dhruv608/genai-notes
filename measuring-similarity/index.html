<script>window.PAGE = {"id": "n20_2", "root": "../", "lesson": {"id": "n20_2", "title": "Measuring Similarity", "short": "Measuring Similarity", "unit": "Unit 3", "unitName": "Chat with Your Data (RAG)", "pos": 5, "of": 11, "sub": "", "info": "Cosine similarity, dot product and Euclidean distance with tables, and where you set the choice in Chroma, Pinecone and Qdrant", "html": "<h2 class=\"c5\" id=\"three-ways-to-score-similarity\">Three Ways to Score Similarity<\/h2>\n<p>To find the best chunk we need a <strong>score<\/strong>: one number that says how similar two vectors are. There are three common ways. Look at two vectors as arrows from the same point.<\/p>\n<figure class=\"visual\"><div class=\"em-fig\"><svg class=\"em-svg\" viewBox=\"0 0 520 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"ah\" markerWidth=\"10\" markerHeight=\"10\" refX=\"8\" refY=\"5\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1a5c5b\"/><\/marker><marker id=\"ah2\" markerWidth=\"10\" markerHeight=\"10\" refX=\"8\" refY=\"5\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#c9583a\"/><\/marker><\/defs><line x1=\"60\" y1=\"230\" x2=\"440\" y2=\"230\" stroke=\"#d9d4c8\"/><line x1=\"60\" y1=\"230\" x2=\"60\" y2=\"40\" stroke=\"#d9d4c8\"/><line x1=\"60\" y1=\"230\" x2=\"246.0\" y2=\"168.0\" stroke=\"#1a5c5b\" stroke-width=\"3\" marker-end=\"url(#ah)\"/><line x1=\"60\" y1=\"230\" x2=\"184.0\" y2=\"106.0\" stroke=\"#c9583a\" stroke-width=\"3\" marker-end=\"url(#ah2)\"/><line x1=\"246.0\" y1=\"168.0\" x2=\"184.0\" y2=\"106.0\" stroke=\"#8a6a12\" stroke-width=\"3\"/><path d=\"M 103.6 215.5 A 46 46 0 0 0 92.5 197.5\" fill=\"none\" stroke=\"#1f2a2a\" stroke-width=\"2\"/><text x=\"254.0\" y=\"172.0\" font-size=\"14\" font-weight=\"700\" fill=\"#1a5c5b\">a = (3, 1)<\/text><text x=\"190.0\" y=\"98.0\" font-size=\"14\" font-weight=\"700\" fill=\"#c9583a\">b = (2, 2)<\/text><text x=\"120\" y=\"190\" font-size=\"13\" font-weight=\"700\" fill=\"#1f2a2a\">angle<\/text><text x=\"260.0\" y=\"143.0\" font-size=\"13\" font-weight=\"700\" fill=\"#8a6a12\">straight line between the tips<\/text><\/svg><\/div><div class=\"bnt rt4 three\">\n  <div class=\"bnt-t c3\"><div class=\"bnt-h\">Cosine similarity<\/div><div class=\"bnt-b\">The angle<\/div><div class=\"bnt-p\">How much the arrows point the same way. Length is ignored. <b>Bigger is closer.<\/b><\/div><\/div>\n  <div class=\"bnt-t c4\"><div class=\"bnt-h\">Dot product<\/div><div class=\"bnt-b\">Angle and length<\/div><div class=\"bnt-p\">Pointing the same way and being long both raise the score. <b>Bigger is closer.<\/b><\/div><\/div>\n  <div class=\"bnt-t c1\"><div class=\"bnt-h\">Euclidean distance (L2)<\/div><div class=\"bnt-b\">The straight line<\/div><div class=\"bnt-p\">How far apart the two tips are, like a ruler. <b>Smaller is closer.<\/b><\/div><\/div>\n<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c1\" id=\"cosine-similarity\">Cosine Similarity<\/h2>\n<p>Cosine looks only at the <strong>angle<\/strong> between two arrows. The length of the arrows does not matter.<\/p>\n<figure class=\"visual\"><div class=\"em-fig\" style=\"max-width:560px\"><div class=\"em-fig-i\"><svg class=\"em-svg\" viewBox=\"0 0 360 220\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"sa\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#1a5c5b\"/><\/marker><marker id=\"sb\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#c9583a\"/><\/marker><\/defs><line x1=\"50\" y1=\"190\" x2=\"330\" y2=\"190\" stroke=\"#d9d4c8\"/><line x1=\"50\" y1=\"190\" x2=\"50\" y2=\"20\" stroke=\"#d9d4c8\"/><line x1=\"50\" y1=\"190\" x2=\"260\" y2=\"120\" stroke=\"#1a5c5b\" stroke-width=\"3.5\" marker-end=\"url(#sa)\"/><line x1=\"50\" y1=\"190\" x2=\"190\" y2=\"50\" stroke=\"#c9583a\" stroke-width=\"3.5\" marker-end=\"url(#sb)\"/><text x=\"270\" y=\"125\" font-size=\"16\" font-weight=\"800\" fill=\"#1a5c5b\">a = (3, 1)<\/text><text x=\"200\" y=\"52\" font-size=\"16\" font-weight=\"800\" fill=\"#c9583a\">b = (2, 2)<\/text><path d=\"M 108.8 170.4 A 62 62 0 0 0 93.8 146.2\" fill=\"none\" stroke=\"#8a6a12\" stroke-width=\"3.5\"/><text x=\"129\" y=\"139\" font-size=\"16\" font-weight=\"800\" fill=\"#8a6a12\">angle<\/text><\/svg><\/div><div class=\"em-cap\">The angle between the two arrows. The length does not matter. Cosine = 0.894.<\/div><\/div><div class=\"px\">\n  <div class=\"px-r\"><span>The formula<\/span><div><code>cos(&theta;) = (a &middot; b) / (|a| &times; |b|)<\/code><\/div><\/div>\n  <div class=\"px-r\"><span>Our arrows<\/span><div>a = (3, 1) and b = (2, 2)<\/div><\/div>\n  <div class=\"px-r\"><span>Step 1: dot product<\/span><div>3&times;2 + 1&times;2 = <b>8<\/b><\/div><\/div>\n  <div class=\"px-r\"><span>Step 2: lengths<\/span><div>|a| = &radic;10 = 3.162 &nbsp; |b| = &radic;8 = 2.828<\/div><\/div>\n  <div class=\"px-r\"><span>Step 3: divide<\/span><div>8 / (3.162 &times; 2.828) = <b>0.894<\/b><\/div><\/div>\n  <div class=\"px-r hi\"><span>What it means<\/span><div>The angle is about 26.6 degrees. The score runs from -1 (opposite) through 0 (unrelated) to 1 (same direction).<\/div><\/div>\n<\/div><div class=\"em-point\"><b>Length does not matter.<\/b> Make b twice as long, b = (4, 4), and the cosine is still <b>0.894<\/b>. Only the direction counts. That is why cosine is the favourite for text.<\/div><div class=\"em-tbl\"><table><tr><th>Chunk<\/th><th>Vector<\/th><th>Points, compared with the question (0.6, 0.8)<\/th><th>Cosine<\/th><\/tr><tr><td>Chunk 1<\/td><td><code>[0.8, 0.6]<\/code><\/td><td>the same way<\/td><td><b>0.96<\/b><\/td><\/tr><tr><td>Chunk 2<\/td><td><code>[-0.6, 0.8]<\/code><\/td><td>almost sideways<\/td><td><b>0.28<\/b><\/td><\/tr><tr><td>Chunk 3<\/td><td><code>[0.8, -0.6]<\/code><\/td><td>exactly sideways<\/td><td><b>0<\/b><\/td><\/tr><tr><td>Chunk 4<\/td><td><code>[-0.8, -0.6]<\/code><\/td><td>the opposite way<\/td><td><b>-0.96<\/b><\/td><\/tr><tr><td>Chunk 1, twice as long<\/td><td><code>[1.6, 1.2]<\/code><\/td><td>the same way, but longer<\/td><td><b>0.96<\/b><\/td><\/tr><\/table><\/div><div class=\"em-cap\">Same direction gives 1, sideways gives 0, the opposite way gives -1. The last row is Chunk 1 made twice as long: the cosine does not change.<\/div><\/figure>\n<hr />\n<h2 class=\"c2\" id=\"dot-product\">Dot Product<\/h2>\n<p>The dot product multiplies the two vectors number by number and adds it up. It looks at the angle <strong>and<\/strong> the length.<\/p>\n<figure class=\"visual\"><div class=\"em-fig\" style=\"max-width:560px\"><div class=\"em-fig-i\"><svg class=\"em-svg\" viewBox=\"0 0 360 220\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"sa\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#1a5c5b\"/><\/marker><marker id=\"sb\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#c9583a\"/><\/marker><\/defs><line x1=\"50\" y1=\"190\" x2=\"330\" y2=\"190\" stroke=\"#d9d4c8\"/><line x1=\"50\" y1=\"190\" x2=\"50\" y2=\"20\" stroke=\"#d9d4c8\"/><line x1=\"50\" y1=\"190\" x2=\"218\" y2=\"134\" stroke=\"#8a6a12\" stroke-width=\"9\" stroke-linecap=\"round\" opacity=\".6\"/><line x1=\"190\" y1=\"50\" x2=\"218\" y2=\"134\" stroke=\"#b9b3a6\" stroke-width=\"1.5\"/><line x1=\"50\" y1=\"190\" x2=\"260\" y2=\"120\" stroke=\"#1a5c5b\" stroke-width=\"3.5\" marker-end=\"url(#sa)\"/><line x1=\"50\" y1=\"190\" x2=\"190\" y2=\"50\" stroke=\"#c9583a\" stroke-width=\"3.5\" marker-end=\"url(#sb)\"/><text x=\"270\" y=\"125\" font-size=\"16\" font-weight=\"800\" fill=\"#1a5c5b\">a = (3, 1)<\/text><text x=\"200\" y=\"52\" font-size=\"16\" font-weight=\"800\" fill=\"#c9583a\">b = (2, 2)<\/text><text x=\"212\" y=\"164\" font-size=\"16\" font-weight=\"800\" fill=\"#8a6a12\">reach<\/text><\/svg><\/div><div class=\"em-cap\">Gold: how far b reaches along a. A longer reach, or a longer a, gives a bigger dot product.<\/div><\/div><div class=\"px\">\n  <div class=\"px-r\"><span>The formula<\/span><div><code>a &middot; b = a1&times;b1 + a2&times;b2 + &hellip;<\/code><\/div><\/div>\n  <div class=\"px-r\"><span>Our arrows<\/span><div>3&times;2 + 1&times;2 = <b>8<\/b><\/div><\/div>\n  <div class=\"px-r\"><span>Longer b = (4, 4)<\/span><div>3&times;4 + 1&times;4 = <b>16<\/b>. The score doubled, although the direction did not change.<\/div><\/div>\n  <div class=\"px-r hi\"><span>Bigger is closer<\/span><div>A higher dot product means more similar. Longer vectors score higher.<\/div><\/div>\n<\/div><div class=\"em-point\"><b>The link to cosine:<\/b> if both vectors have length 1, the lengths in the cosine formula are 1 and 1, so <b>dot product = cosine<\/b>. Normalized embeddings make the dot product a fast way to compute cosine.<\/div><div class=\"em-tbl\"><table><tr><th>Chunk<\/th><th>Vector<\/th><th>Points, compared with the question (0.6, 0.8)<\/th><th>Dot product<\/th><\/tr><tr><td>Chunk 1<\/td><td><code>[0.8, 0.6]<\/code><\/td><td>the same way<\/td><td><b>0.96<\/b><\/td><\/tr><tr><td>Chunk 2<\/td><td><code>[-0.6, 0.8]<\/code><\/td><td>almost sideways<\/td><td><b>0.28<\/b><\/td><\/tr><tr><td>Chunk 3<\/td><td><code>[0.8, -0.6]<\/code><\/td><td>exactly sideways<\/td><td><b>0<\/b><\/td><\/tr><tr><td>Chunk 4<\/td><td><code>[-0.8, -0.6]<\/code><\/td><td>the opposite way<\/td><td><b>-0.96<\/b><\/td><\/tr><tr><td>Chunk 1, twice as long<\/td><td><code>[1.6, 1.2]<\/code><\/td><td>the same way, but longer<\/td><td><b>1.92<\/b><\/td><\/tr><\/table><\/div><div class=\"em-cap\">Same direction gives a big positive number, sideways gives 0, the opposite way gives a negative number. The last row is Chunk 1 made twice as long: the score doubles.<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c3\" id=\"euclidean-distance\">Euclidean Distance<\/h2>\n<p>The straight-line distance between the tips of the two arrows. Smaller means closer.<\/p>\n<figure class=\"visual\"><div class=\"em-fig\" style=\"max-width:560px\"><div class=\"em-fig-i\"><svg class=\"em-svg\" viewBox=\"0 0 360 220\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"sa\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#1a5c5b\"/><\/marker><marker id=\"sb\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#c9583a\"/><\/marker><\/defs><line x1=\"50\" y1=\"190\" x2=\"330\" y2=\"190\" stroke=\"#d9d4c8\"/><line x1=\"50\" y1=\"190\" x2=\"50\" y2=\"20\" stroke=\"#d9d4c8\"/><line x1=\"260\" y1=\"120\" x2=\"190\" y2=\"50\" stroke=\"#8a6a12\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"50\" y1=\"190\" x2=\"260\" y2=\"120\" stroke=\"#1a5c5b\" stroke-width=\"3.5\" marker-end=\"url(#sa)\"/><line x1=\"50\" y1=\"190\" x2=\"190\" y2=\"50\" stroke=\"#c9583a\" stroke-width=\"3.5\" marker-end=\"url(#sb)\"/><text x=\"270\" y=\"125\" font-size=\"16\" font-weight=\"800\" fill=\"#1a5c5b\">a = (3, 1)<\/text><text x=\"200\" y=\"52\" font-size=\"16\" font-weight=\"800\" fill=\"#c9583a\">b = (2, 2)<\/text><text x=\"237\" y=\"89\" font-size=\"16\" font-weight=\"800\" fill=\"#8a6a12\">1.41<\/text><\/svg><\/div><div class=\"em-cap\">Gold: the straight line between the two tips. Smaller means closer.<\/div><\/div><div class=\"px\">\n  <div class=\"px-r\"><span>The formula<\/span><div><code>distance = &radic;((a1&minus;b1)&sup2; + (a2&minus;b2)&sup2; + &hellip;)<\/code><\/div><\/div>\n  <div class=\"px-r\"><span>Our arrows<\/span><div>&radic;((3&minus;2)&sup2; + (1&minus;2)&sup2;) = &radic;2 = <b>1.414<\/b><\/div><\/div>\n  <div class=\"px-r\"><span>Longer b = (4, 4)<\/span><div>&radic;((3&minus;4)&sup2; + (1&minus;4)&sup2;) = &radic;10 = <b>3.162<\/b>. The distance grew, although the direction is the same.<\/div><\/div>\n  <div class=\"px-r hi\"><span>Smaller is closer<\/span><div>A distance of 0 means the same point. This is the opposite of cosine and dot product, where bigger is closer.<\/div><\/div>\n<\/div><div class=\"em-point\"><b>The link to cosine:<\/b> for vectors of length 1, <code>distance&sup2; = 2 &minus; 2 &times; cosine<\/code>. So the smaller the distance, the bigger the cosine. Same order.<\/div><div class=\"em-tbl\"><table><tr><th>Chunk<\/th><th>Vector<\/th><th>Points, compared with the question (0.6, 0.8)<\/th><th>Distance<\/th><\/tr><tr><td>Chunk 1<\/td><td><code>[0.8, 0.6]<\/code><\/td><td>the same way<\/td><td><b>0.28<\/b><\/td><\/tr><tr><td>Chunk 2<\/td><td><code>[-0.6, 0.8]<\/code><\/td><td>almost sideways<\/td><td><b>1.20<\/b><\/td><\/tr><tr><td>Chunk 3<\/td><td><code>[0.8, -0.6]<\/code><\/td><td>exactly sideways<\/td><td><b>1.41<\/b><\/td><\/tr><tr><td>Chunk 4<\/td><td><code>[-0.8, -0.6]<\/code><\/td><td>the opposite way<\/td><td><b>1.98<\/b><\/td><\/tr><tr><td>Chunk 1, twice as long<\/td><td><code>[1.6, 1.2]<\/code><\/td><td>the same way, but longer<\/td><td><b>1.08<\/b><\/td><\/tr><\/table><\/div><div class=\"em-cap\">Smaller is closer. The last row is Chunk 1 made twice as long: it points the same way, but its tip is farther from the question, so the distance is bigger.<\/div><\/figure>\n<hr />\n<h2 class=\"c4\" id=\"which-one-should-you-use\">Which One Should You Use?<\/h2>\n<p>For normalized embeddings, all three give the <strong>same ranking<\/strong>.<\/p>\n<figure class=\"visual\"><div class=\"em-tbl\"><table><tr><th>Chunk<\/th><th>Cosine (bigger is closer)<\/th><th>Dot product (bigger is closer)<\/th><th>Distance (smaller is closer)<\/th><\/tr><tr><td>Chunk A<\/td><td>0.995<\/td><td>0.995<\/td><td>0.098<\/td><\/tr><tr><td>Chunk B<\/td><td>0.745<\/td><td>0.745<\/td><td>0.714<\/td><\/tr><tr><td>Chunk C<\/td><td>-0.167<\/td><td>-0.167<\/td><td>1.528<\/td><\/tr><\/table><\/div><div class=\"em-point\"><b>Same order: Chunk A, then Chunk B, then Chunk C.<\/b> All three rank the chunks the same way, because the vectors are normalized. Only the numbers look different.<\/div><div class=\"em-cap\">Toy vectors of length 1.<\/div>\n<div class=\"em-point\"><b>Which one for you?<\/b> Use the one your embedding model's docs recommend. Many embedding APIs return vectors of length 1 (OpenAI says so in its Embeddings FAQ), and for those, all three give the same ranking.<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c5\" id=\"where-do-you-set-it\">Where Do You Set It?<\/h2>\n<p>So far we only compared the three ways. In a real project you choose one when you create the collection in your vector database. Every vector database has this setting, but each one gives it a different name.<\/p>\n<figure class=\"visual\"><div class=\"em-tbl\"><table>\n<tr><th>Vector database<\/th><th>Name of the setting<\/th><th>How you write it<\/th><th>Choices<\/th><\/tr>\n<tr><td><b>Chroma<\/b><\/td><td><code>space<\/code><\/td><td><code>configuration={\"hnsw\": {\"space\": \"cosine\"}}<\/code> when the collection is created<\/td><td><code>cosine<\/code>, <code>ip<\/code> (dot product), <code>l2<\/code> (the default)<\/td><\/tr>\n<tr><td><b>Pinecone<\/b><\/td><td><code>metric<\/code><\/td><td><code>create_index(&hellip;, metric=\"cosine\", &hellip;)<\/code><\/td><td><code>cosine<\/code> (the default), <code>dotproduct<\/code>, <code>euclidean<\/code><\/td><\/tr>\n<tr><td><b>Qdrant<\/b><\/td><td><code>distance<\/code><\/td><td><code>VectorParams(size=1536, distance=Distance.COSINE)<\/code><\/td><td><code>COSINE<\/code>, <code>DOT<\/code>, <code>EUCLID<\/code>, <code>MANHATTAN<\/code><\/td><\/tr>\n<\/table><\/div>\n<div class=\"em-point\"><b>Same idea, three names.<\/b> <code>space<\/code> is only the name Chroma gives to this setting. It is not a Python or LangChain word. Pinecone calls it <code>metric<\/code> and Qdrant calls it <code>distance<\/code>. It tells the database which of the three ways to use when it scores and ranks.<\/div>\n<div class=\"em-point\"><b>Set it once, when you create the collection.<\/b> In Chroma you cannot change <code>space<\/code> later. To change it, you create a new collection. With LangChain you pass the same thing: <code>Chroma(&hellip;, collection_configuration={\"hnsw\": {\"space\": \"cosine\"}})<\/code>.<\/div>\n<\/figure>\n", "toc": [{"id": "three-ways-to-score-similarity", "name": "Three Ways to Score Similarity"}, {"id": "cosine-similarity", "name": "Cosine Similarity"}, {"id": "dot-product", "name": "Dot Product"}, {"id": "euclidean-distance", "name": "Euclidean Distance"}, {"id": "which-one-should-you-use", "name": "Which One Should You Use?"}, {"id": "where-do-you-set-it", "name": "Where Do You Set It?"}], "search": "", "slides": null, "slideCount": 0, "code": []}};</script>
