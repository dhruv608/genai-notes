<script>window.PAGE = {"id": "n18", "root": "../", "lesson": {"id": "n18", "title": "Text Chunking", "short": "Text Chunking", "unit": "Unit 3", "unitName": "Chat with Your Data (RAG)", "pos": 9, "of": 11, "sub": "", "info": "What chunking is and why, chunk_size and chunk_overlap, the four kinds of text splitters, the recursive splitter, split_text and split_documents", "html": "<h2 class=\"c1\" id=\"what-is-chunking\">What Is Chunking?<\/h2>\n<blockquote class=\"def\"><span class=\"deflab\">Definition<\/span>\n<p><strong>Chunking<\/strong> means cutting a long text into small pieces called <strong>chunks<\/strong>. Each chunk is embedded and stored on its own.<\/p>\n<\/blockquote>\n<figure class=\"visual\"><div class=\"ck-text\"><span class=\"ck c1\">Abstract Large pre-trained language models have been shown to store factual knowledge in their parameters, and achieve state-of-the-art results when ﬁne-tuned on down- stream NLP tasks. However, their ability to access and precisely manipulate knowl-<\/span> <span class=\"ck c2\">edge is still limited, and hence on knowledge-intensive tasks, their performance lags behind task-speciﬁc architectures. Additionally, providing provenance for their decisions and updating their world knowledge remain open research problems. Pre-<\/span> <span class=\"ck c3\">trained models with a differentiable access mechanism to explicit non-parametric memory have so far been only investigated for extractive downstream tasks. We explore a general-purpose ﬁne-tuning<\/span><\/div><div class=\"ck-leg\"><span><i class=\"sw c1\"><\/i>chunk 1<\/span><span><i class=\"sw c2\"><\/i>chunk 2<\/span><span><i class=\"sw c3\"><\/i>chunk 3<\/span><\/div><div class=\"em-cap\">The text of a real page of a PDF, cut into 3 chunks. Each colour is one chunk.<\/div><div class=\"em-point\"><b>Input:<\/b> a long text, such as a PDF, a web page or a file. <b>Output:<\/b> many short chunks. Each one is a Document, with the metadata of its source.<\/div><\/figure>\n<hr />\n<h2 class=\"c2\" id=\"text-splitters-four-kinds\">Text Splitters: Four Kinds<\/h2>\n<blockquote class=\"def\"><span class=\"deflab\">Definition<\/span>\n<p>A <strong>text splitter<\/strong> is the LangChain object that does the cutting. You create it, and then call a method on it. LangChain has several, in four kinds.<\/p>\n<\/blockquote>\n<figure class=\"visual\"><div class=\"em-tbl ck-tbl\"><table>\n<tr><th>Strategy<\/th><th>How it decides where to cut<\/th><th>LangChain splitters<\/th><th>Good for<\/th><\/tr>\n<tr><td>Length-based<\/td><td>every N characters, or every N tokens<\/td><td><code>CharacterTextSplitter<\/code><br><code>TokenTextSplitter<\/code><\/td><td>simple text, or a strict token limit<\/td><\/tr>\n<tr class=\"hi\"><td>Text-structure-based<br>(recursive)<\/td><td>paragraph breaks first, then lines, then words, then characters<\/td><td style=\"white-space: nowrap\"><code>RecursiveCharacterTextSplitter<\/code><\/td><td><b>the best general choice<\/b><\/td><\/tr>\n<tr><td>Document-structure-based<\/td><td>follows the structure of the document: headers, tags, objects, functions<\/td><td><code>MarkdownHeaderTextSplitter<\/code><br><code>HTMLHeaderTextSplitter<\/code><br><code>RecursiveJsonSplitter<\/code><br>code splitters (<code>Language<\/code>)<\/td><td>Markdown, HTML, JSON and source code<\/td><\/tr>\n<tr><td>Semantic<\/td><td>where the meaning changes, using embeddings<\/td><td><code>SemanticChunker<\/code><br>(the <code>langchain-experimental<\/code> package)<\/td><td>long texts that jump between topics<\/td><\/tr>\n<\/table><\/div>\n<\/figure>\n<hr />\n<h2 class=\"c3\" id=\"recursivecharactertextsplitter-the-best-choice\">RecursiveCharacterTextSplitter: The Best Choice<\/h2>\n<p>The LangChain docs call it the recommended splitter for generic text. It cuts at natural places, always in the same order.<\/p>\n<figure class=\"visual\"><div class=\"hl\" data-x=\"1\"><pre><span class=\"n\">splitter<\/span> <span class=\"o\">=<\/span> <span class=\"n\">RecursiveCharacterTextSplitter<\/span><span class=\"p\">(<\/span>\n    <span class=\"n\">chunk_size<\/span><span class=\"o\">=<\/span><span class=\"mi\">300<\/span><span class=\"p\">,<\/span>\n    <span class=\"n\">chunk_overlap<\/span><span class=\"o\">=<\/span><span class=\"mi\">40<\/span><span class=\"p\">,<\/span>\n    <span class=\"n\">separators<\/span><span class=\"o\">=<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"<\/span><span class=\"se\">\\n\\n<\/span><span class=\"s2\">\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"<\/span><span class=\"se\">\\n<\/span><span class=\"s2\">\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\" \"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"\"<\/span><span class=\"p\">],<\/span>\n<span class=\"p\">)<\/span><\/pre><\/div>\n<div class=\"bnt rt4 three\" style=\"grid-template-columns: repeat(4, 1fr)\"><div class=\"bnt-t c3\"><div class=\"bnt-h\">Try first<\/div><div class=\"bnt-b\">A paragraph break<\/div><div class=\"bnt-p\"><code>\\n\\n<\/code><\/div><\/div><div class=\"bnt-t c1\"><div class=\"bnt-h\">If a piece is still too big<\/div><div class=\"bnt-b\">A new line<\/div><div class=\"bnt-p\"><code>\\n<\/code><\/div><\/div><div class=\"bnt-t c4\"><div class=\"bnt-h\">Still too big<\/div><div class=\"bnt-b\">A space between words<\/div><div class=\"bnt-p\"><code>&quot; &quot;<\/code><\/div><\/div><div class=\"bnt-t c3\"><div class=\"bnt-h\">Last resort<\/div><div class=\"bnt-b\">Any single character<\/div><div class=\"bnt-p\"><code>&quot;&quot;<\/code><\/div><\/div><\/div><div class=\"em-point\"><b>Recursive<\/b> means: try the best separator first. Only if a piece is still bigger than the chunk size, try the next one. So paragraphs and sentences stay whole wherever they can.<\/div>\n<div class=\"em-point\"><b>Chunk size<\/b> and <b>chunk overlap<\/b> are the other two settings. The next section shows them.<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c4\" id=\"chunk-size-and-chunk-overlap\">Chunk Size and Chunk Overlap<\/h2>\n<blockquote class=\"def\"><span class=\"deflab\">Definition<\/span>\n<p>Two settings control the chunks. <strong>Chunk size<\/strong> is how big each chunk is. <strong>Chunk overlap<\/strong> is how much of the end of a chunk is repeated at the start of the next one.<\/p>\n<\/blockquote>\n<figure class=\"visual\"><div class=\"em-fig\"><svg class=\"em-svg\" viewBox=\"0 0 1026 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"10\" y=\"53\" font-size=\"14\" font-weight=\"800\" fill=\"#0e3b3a\">the page text<\/text><rect x=\"118.0\" y=\"30\" width=\"880.8\" height=\"40\" rx=\"9\" fill=\"#fff\" stroke=\"#c9c3b6\" stroke-width=\"1.6\"/><rect x=\"405.2\" y=\"38\" width=\"323.2\" height=\"24\" rx=\"4\" fill=\"#f3c9bb\"/><text x=\"130.0\" y=\"55\" font-size=\"14\" fill=\"#1f2a2a\" font-family=\"Consolas, monospace\" textLength=\"856.8\" lengthAdjust=\"spacingAndGlyphs\" xml:space=\"preserve\">approach, RAG-Token, can predict each target token based on a different document. In the following, we<\/text><text x=\"10\" y=\"123\" font-size=\"14\" font-weight=\"800\" fill=\"#0e3b3a\">one chunk<\/text><rect x=\"118.0\" y=\"100\" width=\"620.4\" height=\"40\" rx=\"9\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><rect x=\"405.2\" y=\"108\" width=\"323.2\" height=\"24\" rx=\"4\" fill=\"#c9583a\"/><text x=\"130.0\" y=\"125\" font-size=\"14\" fill=\"#1f2a2a\" font-family=\"Consolas, monospace\" textLength=\"277.2\" lengthAdjust=\"spacingAndGlyphs\" xml:space=\"preserve\">approach, RAG-Token, can predict <\/text><text x=\"407.2\" y=\"125\" font-size=\"14\" fill=\"#fff\" font-family=\"Consolas, monospace\" textLength=\"319.2\" lengthAdjust=\"spacingAndGlyphs\" xml:space=\"preserve\">each target token based on a different<\/text><text x=\"10\" y=\"193\" font-size=\"14\" font-weight=\"800\" fill=\"#0e3b3a\">the next chunk<\/text><rect x=\"395.2\" y=\"170\" width=\"603.6\" height=\"40\" rx=\"9\" fill=\"#fbf1d3\" stroke=\"#c9b25f\" stroke-width=\"1.6\"/><rect x=\"405.2\" y=\"178\" width=\"323.2\" height=\"24\" rx=\"4\" fill=\"#c9583a\"/><text x=\"407.2\" y=\"195\" font-size=\"14\" fill=\"#fff\" font-family=\"Consolas, monospace\" textLength=\"319.2\" lengthAdjust=\"spacingAndGlyphs\" xml:space=\"preserve\">each target token based on a different<\/text><text x=\"726.4\" y=\"195\" font-size=\"14\" fill=\"#1f2a2a\" font-family=\"Consolas, monospace\" textLength=\"260.4\" lengthAdjust=\"spacingAndGlyphs\" xml:space=\"preserve\"> document. In the following, we<\/text><path d=\"M 407.2 220 L 407.2 230 L 726.4 230 L 726.4 220\" fill=\"none\" stroke=\"#c9583a\" stroke-width=\"2\"/><text x=\"566.8\" y=\"252\" font-size=\"14\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#c9583a\">the same 38 characters<\/text><\/svg><\/div><div class=\"em-cap\">Two neighbouring chunks of a paragraph. Here the chunk size is 300 and the chunk overlap is 40.<\/div><div class=\"em-point\"><b>Chunk size<\/b> is how big each chunk is, counted in characters.<\/div><div class=\"em-point\"><b>Chunk overlap<\/b> is how many characters are repeated. The end of one chunk appears again at the start of the next, so a sentence cut in between is not lost.<\/div><\/figure>\n<hr />\n<h2 class=\"c5\" id=\"two-ways-to-split\">Two Ways to Split<\/h2>\n<p>A text splitter has two methods. They differ in what you give it, and in what you get back.<\/p>\n<figure class=\"visual\"><div class=\"bnt rt4 three\" style=\"grid-template-columns: repeat(2, 1fr)\">\n  <div class=\"bnt-t c3\"><div class=\"bnt-h\">Method 1<\/div><div class=\"bnt-b\">split_text<\/div><div class=\"bnt-p\"><b>You give:<\/b> a plain string<br><b>You get:<\/b> a list of strings<br><br><code>[&quot;chunk 1 text&quot;,<\/code><br><code>&nbsp;&quot;chunk 2 text&quot;, ...]<\/code><\/div><\/div>\n  <div class=\"bnt-t c4\"><div class=\"bnt-h\">Method 2<\/div><div class=\"bnt-b\">split_documents<\/div><div class=\"bnt-p\"><b>You give:<\/b> a list of Documents, from a loader<br><b>You get:<\/b> a list of Documents, one for each chunk<br><br><code>[Document(<\/code><br><code>&nbsp;&nbsp;metadata={'source': ..., 'page': 0},<\/code><br><code>&nbsp;&nbsp;page_content='chunk 1 text'), ...]<\/code><\/div><\/div>\n<\/div>\n<div class=\"hl\" data-x=\"1\"><pre><span class=\"n\">string_chunks<\/span> <span class=\"o\">=<\/span> <span class=\"n\">splitter<\/span><span class=\"o\">.<\/span><span class=\"n\">split_text<\/span><span class=\"p\">(<\/span><span class=\"n\">raw_string<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">docs_chunks<\/span> <span class=\"o\">=<\/span> <span class=\"n\">splitter<\/span><span class=\"o\">.<\/span><span class=\"n\">split_documents<\/span><span class=\"p\">(<\/span><span class=\"n\">docs<\/span><span class=\"p\">)<\/span><\/pre><\/div>\n<div class=\"em-point\"><b>Use split_documents for files from a loader.<\/b> Every chunk keeps the metadata of its Document, so later we know the source and the page. <code>split_text<\/code> gives only the text, so that information is lost.<\/div>\n<\/figure>\n<div class=\"docs\"><span class=\"docs-l\">Docs<\/span><a href=\"https://docs.langchain.com/oss/python/integrations/splitters/recursive_text_splitter\" target=\"_blank\" rel=\"noopener\">LangChain: recursive text splitter<\/a><a href=\"https://docs.langchain.com/oss/python/integrations/splitters\" target=\"_blank\" rel=\"noopener\">LangChain: all text splitters<\/a><\/div>\n\n<hr /><div class=\"sc-head code-head\">Code<\/div><details class=\"codecard\"><summary><span class=\"cc-t\">Text chunking with the recursive splitter<\/span><span class=\"cc-f\">01_text_chunking.py · 35 lines<\/span><span class=\"cc-show\">Show code<\/span><\/summary><div class=\"hl\"><table class=\"hltable\"><tr><td class=\"linenos\"><div class=\"linenodiv\"><pre><span class=\"normal\"> 1<\/span>\n<span class=\"normal\"> 2<\/span>\n<span class=\"normal\"> 3<\/span>\n<span class=\"normal\"> 4<\/span>\n<span class=\"normal\"> 5<\/span>\n<span class=\"normal\"> 6<\/span>\n<span class=\"normal\"> 7<\/span>\n<span class=\"normal\"> 8<\/span>\n<span class=\"normal\"> 9<\/span>\n<span class=\"normal\">10<\/span>\n<span class=\"normal\">11<\/span>\n<span class=\"normal\">12<\/span>\n<span class=\"normal\">13<\/span>\n<span class=\"normal\">14<\/span>\n<span class=\"normal\">15<\/span>\n<span class=\"normal\">16<\/span>\n<span class=\"normal\">17<\/span>\n<span class=\"normal\">18<\/span>\n<span class=\"normal\">19<\/span>\n<span class=\"normal\">20<\/span>\n<span class=\"normal\">21<\/span>\n<span class=\"normal\">22<\/span>\n<span class=\"normal\">23<\/span>\n<span class=\"normal\">24<\/span>\n<span class=\"normal\">25<\/span>\n<span class=\"normal\">26<\/span>\n<span class=\"normal\">27<\/span>\n<span class=\"normal\">28<\/span>\n<span class=\"normal\">29<\/span>\n<span class=\"normal\">30<\/span>\n<span class=\"normal\">31<\/span>\n<span class=\"normal\">32<\/span>\n<span class=\"normal\">33<\/span>\n<span class=\"normal\">34<\/span>\n<span class=\"normal\">35<\/span><\/pre><\/div><\/td><td class=\"code\"><div><pre><span><\/span><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">dotenv<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">load_dotenv<\/span>\n\n<span class=\"n\">load_dotenv<\/span><span class=\"p\">()<\/span>\n\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_community.document_loaders<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">TextLoader<\/span> <span class=\"p\">,<\/span> <span class=\"n\">PyPDFLoader<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_text_splitters<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">RecursiveCharacterTextSplitter<\/span>\n\n<span class=\"sd\">\"\"\"RecursiveCharacterTextSplitter: tries <\/span>\n\n<span class=\"sd\">, then <\/span>\n<span class=\"sd\">, then space, then any char\"\"\"<\/span>\n<span class=\"n\">splitter<\/span> <span class=\"o\">=<\/span>  <span class=\"n\">RecursiveCharacterTextSplitter<\/span><span class=\"p\">(<\/span><span class=\"n\">chunk_size<\/span><span class=\"o\">=<\/span><span class=\"mi\">300<\/span><span class=\"p\">,<\/span><span class=\"n\">chunk_overlap<\/span><span class=\"o\">=<\/span><span class=\"mi\">40<\/span> <span class=\"p\">,<\/span>  <span class=\"n\">separators<\/span><span class=\"o\">=<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"<\/span><span class=\"se\">\\n\\n<\/span><span class=\"s2\">\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"<\/span><span class=\"se\">\\n<\/span><span class=\"s2\">\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\" \"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"\"<\/span><span class=\"p\">])<\/span>\n\n<span class=\"n\">raw_string<\/span> <span class=\"o\">=<\/span> <span class=\"s2\">\"\"\"<\/span>\n<span class=\"s2\">Generative AI is transforming modern software engineering.<\/span>\n<span class=\"s2\">Developers build agents and RAG pipelines using LangChain and LCEL.<\/span>\n<span class=\"s2\">Text Splitters break large text into smaller, manageable chunks.<\/span>\n<span class=\"s2\">This prevents context window overflow and improves search precision.<\/span>\n<span class=\"s2\">\"\"\"<\/span>\n\n<span class=\"sd\">\"\"\"1. split_text: str -&gt; list of str\"\"\"<\/span>\n<span class=\"n\">string_chunks<\/span> <span class=\"o\">=<\/span> <span class=\"n\">splitter<\/span><span class=\"o\">.<\/span><span class=\"n\">split_text<\/span><span class=\"p\">(<\/span><span class=\"n\">raw_string<\/span><span class=\"p\">)<\/span>\n\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">string_chunks<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"nb\">len<\/span><span class=\"p\">(<\/span><span class=\"n\">string_chunks<\/span><span class=\"p\">))<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"nb\">type<\/span><span class=\"p\">(<\/span><span class=\"n\">string_chunks<\/span><span class=\"p\">[<\/span><span class=\"mi\">0<\/span><span class=\"p\">]))<\/span>\n\n<span class=\"sd\">\"\"\"2. split_documents: list of Documents -&gt; smaller Documents (metadata kept)\"\"\"<\/span>\n<span class=\"n\">loader<\/span> <span class=\"o\">=<\/span> <span class=\"n\">PyPDFLoader<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"data/rag_paper.pdf\"<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">docs<\/span> <span class=\"o\">=<\/span> <span class=\"n\">loader<\/span><span class=\"o\">.<\/span><span class=\"n\">load<\/span><span class=\"p\">()<\/span>\n\n<span class=\"n\">docs_chunks<\/span> <span class=\"o\">=<\/span> <span class=\"n\">splitter<\/span><span class=\"o\">.<\/span><span class=\"n\">split_documents<\/span><span class=\"p\">(<\/span><span class=\"n\">docs<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">docs_chunks<\/span><span class=\"p\">[<\/span><span class=\"mi\">0<\/span><span class=\"p\">]<\/span><span class=\"o\">.<\/span><span class=\"n\">metadata<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"nb\">len<\/span><span class=\"p\">(<\/span><span class=\"n\">docs_chunks<\/span><span class=\"p\">))<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"nb\">type<\/span><span class=\"p\">(<\/span><span class=\"n\">docs_chunks<\/span><span class=\"p\">[<\/span><span class=\"mi\">0<\/span><span class=\"p\">]))<\/span>\n<\/pre><\/div><\/td><\/tr><\/table><\/div>\n<\/details>", "toc": [{"id": "what-is-chunking", "name": "What Is Chunking?"}, {"id": "text-splitters-four-kinds", "name": "Text Splitters: Four Kinds"}, {"id": "recursivecharactertextsplitter-the-best-choice", "name": "RecursiveCharacterTextSplitter: The Best Choice"}, {"id": "chunk-size-and-chunk-overlap", "name": "Chunk Size and Chunk Overlap"}, {"id": "two-ways-to-split", "name": "Two Ways to Split"}], "search": "", "slides": null, "slideCount": 0, "code": []}};</script>
