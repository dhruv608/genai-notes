<script>window.PAGE = {"id": "n23_1", "root": "../", "lesson": {"id": "n23_1", "title": "Why LangGraph?", "short": "Why LangGraph?", "unit": "Unit 4", "unitName": "Agents with LangGraph", "pos": 1, "of": 16, "sub": "", "info": "Why a chain is not enough, the four levels of AI apps, and what state, node and edge mean", "html": "<h2 class=\"c1\" id=\"the-problem-real-tasks-are-not-straight-lines\">The Problem: Real Tasks Are Not Straight Lines<\/h2>\n<p>So far every app we built went in one direction: prompt, model, parser. Real tasks are messier.<\/p>\n<figure class=\"visual\"><div class=\"px\">\n  <div class=\"px-r\"><span>The issue<\/span><div>We want an AI that writes a blog post and checks it before showing it to the user.<\/div><\/div>\n  <div class=\"px-r\"><span>The first try<\/span><div>A chain: the writer writes, the reviewer reviews, we show the result.<\/div><\/div>\n  <div class=\"px-r\"><span>Why it fails<\/span><div>The reviewer says &ldquo;too long, rewrite it&rdquo;. A chain only moves forward. It cannot send the draft back to the writer.<\/div><\/div>\n  <div class=\"px-r hi\"><span>The fix<\/span><div>We need steps that can <b>go back and try again<\/b>, and one place where all the steps keep their notes. A graph gives us both.<\/div><\/div>\n<\/div><\/figure>\n<hr />\n<h2 class=\"c2\" id=\"four-levels-of-ai-apps\">Four Levels of AI Apps<\/h2>\n<p>We have already climbed three steps. LangGraph is the fourth.<\/p>\n<figure class=\"visual\"><div class=\"em-tbl\"><table>\n<tr><th>Level<\/th><th>What it is<\/th><th>The flow<\/th><th>The limit<\/th><\/tr>\n<tr><td><b>GenAI<\/b><\/td><td>one prompt, one answer<\/td><td><code>prompt &rarr; LLM &rarr; text<\/code><\/td><td>no memory, no tools<\/td><\/tr>\n<tr><td><b>LangChain<\/b><\/td><td>steps joined in a chain<\/td><td><code>prompt &rarr; LLM &rarr; parser<\/code><\/td><td>moves forward only<\/td><\/tr>\n<tr><td><b>Tool calling<\/b><\/td><td>the model picks tools in a loop<\/td><td><code>think &rarr; act &rarr; observe<\/code><\/td><td>one loop, little control<\/td><\/tr>\n<tr><td><b>LangGraph<\/b><\/td><td>you draw the whole flow<\/td><td>steps, loops, memory, pauses<\/td><td>you design it, so it takes more work<\/td><\/tr>\n<\/table><\/div>\n<\/figure>\n<hr />\n<h2 class=\"c3\" id=\"what-is-langgraph\">What Is LangGraph?<\/h2>\n<blockquote class=\"def\"><span class=\"deflab\">Definition<\/span>\n<p><strong>LangGraph<\/strong> is a library for building AI apps as a <strong>graph<\/strong>: steps joined by arrows, with a shared notebook that every step can read and write.<\/p>\n<\/blockquote>\n<p>It has three building blocks.<\/p>\n<figure class=\"visual\"><div class=\"em-fig\"><svg class=\"em-svg\" viewBox=\"0 0 700 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"ga\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#9aa3a2\"/><\/marker><marker id=\"gb\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#c9583a\"/><\/marker><\/defs><circle cx=\"50.0\" cy=\"55.0\" r=\"22\" fill=\"#fff\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"50.0\" y=\"59.0\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">start<\/text><rect x=\"135.0\" y=\"35.0\" width=\"110\" height=\"40\" rx=\"9\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"190.0\" y=\"60.2\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">Write<\/text><rect x=\"295.0\" y=\"35.0\" width=\"110\" height=\"40\" rx=\"9\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"350.0\" y=\"60.2\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">Review<\/text><circle cx=\"500.0\" cy=\"55.0\" r=\"22\" fill=\"#fff\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"500.0\" y=\"59.0\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">end<\/text><line x1=\"72.0\" y1=\"55.0\" x2=\"135.0\" y2=\"55.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><line x1=\"245.0\" y1=\"55.0\" x2=\"295.0\" y2=\"55.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><line x1=\"405.0\" y1=\"55.0\" x2=\"478.0\" y2=\"55.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><path d=\"M 350 35 Q 270 5 190 35\" fill=\"none\" stroke=\"#c9583a\" stroke-width=\"2.6\" marker-end=\"url(#gb)\"/><text x=\"270\" y=\"11\" font-size=\"13\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#c9583a\">needs a fix<\/text><line x1=\"190\" y1=\"76\" x2=\"190\" y2=\"150\" stroke=\"#9aa3a2\" stroke-width=\"1.6\"/><line x1=\"350\" y1=\"76\" x2=\"350\" y2=\"150\" stroke=\"#9aa3a2\" stroke-width=\"1.6\"/><rect x=\"90\" y=\"150\" width=\"360\" height=\"62\" rx=\"12\" fill=\"#fbf1d3\" stroke=\"#efdca0\" stroke-width=\"1.6\"/><text x=\"270\" y=\"177\" font-size=\"15\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#8a6a12\">STATE: the shared notebook<\/text><text x=\"270\" y=\"199\" font-size=\"14\" text-anchor=\"middle\" fill=\"#5f4d12\">topic, draft, feedback<\/text><text x=\"530\" y=\"175\" font-size=\"13\" fill=\"#7a7367\">Every step reads it<\/text><text x=\"530\" y=\"194\" font-size=\"13\" fill=\"#7a7367\">and writes to it.<\/text><\/svg><\/div><div class=\"bnt rt4 three\"><div class=\"bnt-t c3\"><div class=\"bnt-h\">State<\/div><div class=\"bnt-b\">The shared notebook<\/div><div class=\"bnt-p\">Every step reads it and writes to it. In your code it is a dictionary with fixed keys.<\/div><\/div><div class=\"bnt-t c1\"><div class=\"bnt-h\">Node<\/div><div class=\"bnt-b\">A worker step<\/div><div class=\"bnt-p\">A normal Python function. It reads the state and returns only the keys it changes.<\/div><\/div><div class=\"bnt-t c4\"><div class=\"bnt-h\">Edge<\/div><div class=\"bnt-b\">An arrow<\/div><div class=\"bnt-p\">It says which step runs next. An edge can also choose between two steps.<\/div><\/div><\/div><\/figure>\n", "toc": [{"id": "the-problem-real-tasks-are-not-straight-lines", "name": "The Problem: Real Tasks Are Not Straight Lines"}, {"id": "four-levels-of-ai-apps", "name": "Four Levels of AI Apps"}, {"id": "what-is-langgraph", "name": "What Is LangGraph?"}], "search": "", "slides": null, "slideCount": 0, "code": []}};</script>
