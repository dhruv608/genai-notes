<script>window.PAGE = {"id": "n16", "root": "../", "lesson": {"id": "n16", "title": "Document Loaders", "short": "Document Loaders", "unit": "Unit 3", "unitName": "Chat with Your Data (RAG)", "pos": 7, "of": 11, "sub": "Load & prepare data", "info": "What a Document is and how to use it, what a loader is, the types of loaders, and how PyPDFLoader works", "html": "<h2 class=\"c1\" id=\"what-is-a-document\">What Is a Document?<\/h2>\n<blockquote class=\"def\"><span class=\"deflab\">Definition<\/span>\n<p>A <strong>Document<\/strong> is a small LangChain object that holds one piece of text. It has two parts: <code>page_content<\/code>, the text itself, and <code>metadata<\/code>, a dictionary with information about that text, such as where it came from.<\/p>\n<\/blockquote>\n<figure class=\"visual\"><div class=\"em-fig\"><svg class=\"em-svg\" viewBox=\"0 0 760 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"150\" y=\"14\" width=\"460\" height=\"222\" rx=\"16\" fill=\"#fff\" stroke=\"#1a5c5b\" stroke-width=\"2.4\"/><text x=\"380\" y=\"46\" font-size=\"18\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#0e3b3a\">Document<\/text><rect x=\"176\" y=\"62\" width=\"408\" height=\"68\" rx=\"12\" fill=\"#eef7f7\" stroke=\"#9fcfce\" stroke-width=\"1.6\"/><text x=\"194\" y=\"88\" font-size=\"16\" font-weight=\"800\" fill=\"#1a5c5b\" font-family=\"Consolas, monospace\">page_content<\/text><text x=\"370\" y=\"88\" font-size=\"14\" fill=\"#4a5f5e\">a string: the text<\/text><text x=\"194\" y=\"113\" font-size=\"15\" fill=\"#1f2a2a\">the text of the page goes here, as one string &hellip;<\/text><rect x=\"176\" y=\"144\" width=\"408\" height=\"76\" rx=\"12\" fill=\"#fbf1d3\" stroke=\"#efdca0\" stroke-width=\"1.6\"/><text x=\"194\" y=\"170\" font-size=\"16\" font-weight=\"800\" fill=\"#8a6a12\" font-family=\"Consolas, monospace\">metadata<\/text><text x=\"300\" y=\"170\" font-size=\"14\" fill=\"#5f4d12\">a dictionary: information about the text<\/text><text x=\"194\" y=\"197\" font-size=\"15\" fill=\"#1f2a2a\" font-family=\"Consolas, monospace\">{ source: the location of the file, page: 0, &hellip; }<\/text><\/svg><\/div><div class=\"em-lane\"><div class=\"stp-l\">What a loader gives back: a list of Documents<\/div><div class=\"hl\" data-x=\"1\"><pre><span class=\"n\">docs<\/span> <span class=\"o\">=<\/span> <span class=\"p\">[<\/span>\n    <span class=\"n\">Document<\/span><span class=\"p\">(<\/span>\n        <span class=\"n\">metadata<\/span><span class=\"o\">=<\/span><span class=\"p\">{<\/span><span class=\"s1\">'source'<\/span><span class=\"p\">:<\/span> <span class=\"s1\">'location of the file'<\/span><span class=\"p\">,<\/span> <span class=\"s1\">'page'<\/span><span class=\"p\">:<\/span> <span class=\"mi\">0<\/span><span class=\"p\">},<\/span>\n        <span class=\"n\">page_content<\/span><span class=\"o\">=<\/span><span class=\"s1\">'text of page 1 ...'<\/span><span class=\"p\">),<\/span>\n    <span class=\"n\">Document<\/span><span class=\"p\">(<\/span>\n        <span class=\"n\">metadata<\/span><span class=\"o\">=<\/span><span class=\"p\">{<\/span><span class=\"s1\">'source'<\/span><span class=\"p\">:<\/span> <span class=\"s1\">'location of the file'<\/span><span class=\"p\">,<\/span> <span class=\"s1\">'page'<\/span><span class=\"p\">:<\/span> <span class=\"mi\">1<\/span><span class=\"p\">},<\/span>\n        <span class=\"n\">page_content<\/span><span class=\"o\">=<\/span><span class=\"s1\">'text of page 2 ...'<\/span><span class=\"p\">),<\/span>\n<span class=\"p\">]<\/span><\/pre><\/div><\/div><div class=\"em-cap\">The shape of what <code>print(docs)<\/code> shows.<\/div><div class=\"px\">\n  <div class=\"px-r\"><span>docs[0]<\/span><div>the first Document in the list<\/div><\/div>\n  <div class=\"px-r\"><span>page_content<\/span><div><code>docs[0].page_content<\/code> is the text of the first Document, a string. This is what we cut into chunks, embed, search and finally give to the LLM.<\/div><\/div>\n  <div class=\"px-r hi\"><span>metadata<\/span><div><code>docs[0].metadata<\/code> is its information, a dictionary. It is <b>about<\/b> the text, not the text itself: where it came from, which page. Later we use it to say <b>where an answer came from<\/b>.<\/div><\/div>\n<\/div><\/figure>\n<hr />\n<h2 class=\"c2\" id=\"what-is-a-document-loader\">What Is a Document Loader?<\/h2>\n<blockquote class=\"def\"><span class=\"deflab\">Definition<\/span>\n<p>A <strong>document loader<\/strong> reads a source, such as a text file, a PDF or a web page, and gives back its text as a <strong>list of Documents<\/strong>.<\/p>\n<\/blockquote>\n<figure class=\"visual\"><div class=\"em-fig\"><svg class=\"em-svg\" viewBox=\"0 0 760 200\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"la\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#9aa3a2\"/><\/marker><\/defs><text x=\"10\" y=\"14\" font-size=\"13\" font-weight=\"800\" fill=\"#7a7367\" letter-spacing=\"1\">A SOURCE<\/text><text x=\"400\" y=\"14\" font-size=\"13\" font-weight=\"800\" fill=\"#7a7367\" letter-spacing=\"1\">A LIST OF DOCUMENTS<\/text><rect x=\"10\" y=\"26\" width=\"130\" height=\"44\" rx=\"8\" fill=\"#fff\" stroke=\"#9aa3a2\" stroke-width=\"1.6\"/><text x=\"75\" y=\"54\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1f2a2a\">text file<\/text><line x1=\"146\" y1=\"48\" x2=\"216\" y2=\"75\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#la)\"/><rect x=\"10\" y=\"84\" width=\"130\" height=\"44\" rx=\"8\" fill=\"#fff\" stroke=\"#9aa3a2\" stroke-width=\"1.6\"/><text x=\"75\" y=\"112\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1f2a2a\">PDF file<\/text><line x1=\"146\" y1=\"106\" x2=\"216\" y2=\"100\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#la)\"/><rect x=\"10\" y=\"142\" width=\"130\" height=\"44\" rx=\"8\" fill=\"#fff\" stroke=\"#9aa3a2\" stroke-width=\"1.6\"/><text x=\"75\" y=\"170\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1f2a2a\">web page<\/text><line x1=\"146\" y1=\"164\" x2=\"216\" y2=\"125\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#la)\"/><rect x=\"220\" y=\"62\" width=\"140\" height=\"76\" rx=\"12\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"2\"/><text x=\"290\" y=\"96\" font-size=\"17\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#0e3b3a\">loader<\/text><text x=\"290\" y=\"119\" font-size=\"13\" text-anchor=\"middle\" fill=\"#4a5f5e\" font-family=\"Consolas, monospace\">.load()<\/text><line x1=\"366\" y1=\"100\" x2=\"394\" y2=\"100\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#la)\"/><rect x=\"400\" y=\"26\" width=\"350\" height=\"44\" rx=\"8\" fill=\"#fbf1d3\" stroke=\"#efdca0\" stroke-width=\"1.6\"/><text x=\"418\" y=\"54\" font-size=\"15\" font-weight=\"800\" fill=\"#8a6a12\">Document<\/text><text x=\"520\" y=\"54\" font-size=\"14\" fill=\"#5f4d12\" font-family=\"Consolas, monospace\">page_content, metadata<\/text><rect x=\"400\" y=\"84\" width=\"350\" height=\"44\" rx=\"8\" fill=\"#fbf1d3\" stroke=\"#efdca0\" stroke-width=\"1.6\"/><text x=\"418\" y=\"112\" font-size=\"15\" font-weight=\"800\" fill=\"#8a6a12\">Document<\/text><text x=\"520\" y=\"112\" font-size=\"14\" fill=\"#5f4d12\" font-family=\"Consolas, monospace\">page_content, metadata<\/text><rect x=\"400\" y=\"142\" width=\"350\" height=\"44\" rx=\"8\" fill=\"#fbf1d3\" stroke=\"#efdca0\" stroke-width=\"1.6\"/><text x=\"418\" y=\"170\" font-size=\"15\" font-weight=\"800\" fill=\"#8a6a12\">Document<\/text><text x=\"520\" y=\"170\" font-size=\"14\" fill=\"#5f4d12\" font-family=\"Consolas, monospace\">page_content, metadata<\/text><\/svg><\/div><div class=\"hl\" data-x=\"1\"><pre><span class=\"n\">loader<\/span> <span class=\"o\">=<\/span> <span class=\"n\">SomeLoader<\/span><span class=\"p\">(<\/span><span class=\"n\">location<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">docs<\/span> <span class=\"o\">=<\/span> <span class=\"n\">loader<\/span><span class=\"o\">.<\/span><span class=\"n\">load<\/span><span class=\"p\">()<\/span><\/pre><\/div>\n<div class=\"em-point\"><b>Every loader works the same way.<\/b> You give it the location of the source and call <code>.load()<\/code>. You always get a list of Documents, so the rest of the pipeline does not care where the text came from.<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c3\" id=\"types-of-loaders\">Types of Loaders<\/h2>\n<p>There is a loader for almost every kind of source. This table shows the common ones.<\/p>\n<figure class=\"visual\"><div class=\"em-tbl\"><table>\n<tr><th>Loader<\/th><th>Reads<\/th><th>One Document is<\/th><th>Good to know<\/th><\/tr>\n<tr><td><code>TextLoader<\/code><\/td><td>a plain text file<\/td><td>the whole file<\/td><td>Metadata: <code>source<\/code>. Give the <code>encoding<\/code> for text that is not plain English.<\/td><\/tr>\n<tr><td><code>PyPDFLoader<\/code><\/td><td>a PDF file<\/td><td>one page<\/td><td>Metadata: <code>source<\/code>, <code>page<\/code>, <code>page_label<\/code>. It reads text only, so a scanned PDF gives no text.<\/td><\/tr>\n<tr><td><code>CSVLoader<\/code><\/td><td>a CSV file<\/td><td>one row<\/td><td>The text is one &ldquo;column: value&rdquo; line for each column, such as <code>name: Asha<\/code> and <code>city: Pune<\/code>. Metadata: <code>source<\/code>, <code>row<\/code>.<\/td><\/tr>\n<tr><td><code>DirectoryLoader<\/code><\/td><td>a folder<\/td><td>whatever its inner loader makes for each file<\/td><td>You give it a pattern, such as all <code>.txt<\/code> files, and the loader class to use on each file.<\/td><\/tr>\n<tr><td><code>WebBaseLoader<\/code><\/td><td>a web page<\/td><td>the whole page<\/td><td>Metadata: <code>source<\/code>, <code>title<\/code>, <code>description<\/code>, <code>language<\/code>. The next lesson covers it.<\/td><\/tr>\n<tr><td>Many more<\/td><td>Word, Excel, Markdown, JSON, HTML, Wikipedia, YouTube&hellip;<\/td><td>depends on the loader<\/td><td>See the docs for the full list. Some loaders need an extra package installed.<\/td><\/tr>\n<\/table><\/div>\n<\/figure>\n<div class=\"docs\"><span class=\"docs-l\">Docs<\/span><a href=\"https://docs.langchain.com/oss/python/integrations/document_loaders/index\" target=\"_blank\" rel=\"noopener\">LangChain: document loaders<\/a><a href=\"https://reference.langchain.com/python/langchain-core/document_loaders/base/BaseLoader\" target=\"_blank\" rel=\"noopener\">BaseLoader reference<\/a><\/div>\n\n<hr />\n<h2 class=\"c4\" id=\"loader-packages-why-we-install-them\">Loader Packages: Why We Install Them<\/h2>\n<p>A loader does not read every file format by itself. For each format, a pre-built package already does the hard work. The loader calls that package and puts the result into Documents.<\/p>\n<figure class=\"visual\"><div class=\"em-flow\">\n  <div class=\"em-fc\"><div class=\"stp-l\">Your code<\/div><code>loader.load()<\/code><\/div><div class=\"em-ar\">&rarr;<\/div>\n  <div class=\"em-fc db\"><div class=\"stp-l\">The LangChain loader<\/div><span>from <code>langchain-community<\/code>. It wraps the package.<\/span><\/div><div class=\"em-ar\">&rarr;<\/div>\n  <div class=\"em-fc\"><div class=\"stp-l\">A pre-built package<\/div><span>does the real reading, such as <code>pypdf<\/code><\/span><\/div><div class=\"em-ar\">&rarr;<\/div>\n  <div class=\"em-fc out\"><div class=\"stp-l\">Documents<\/div>the same shape every time<\/div>\n<\/div>\n<div class=\"em-tbl\"><table>\n<tr><th>Loader<\/th><th>What does the reading<\/th><th>Install<\/th><\/tr>\n<tr><td><code>TextLoader<\/code><\/td><td>plain Python can read a text file<\/td><td>nothing extra<\/td><\/tr>\n<tr><td><code>PyPDFLoader<\/code><\/td><td><code>pypdf<\/code>, a package that reads PDF files<\/td><td><code>pip install pypdf<\/code><\/td><\/tr>\n<tr><td><code>CSVLoader<\/code><\/td><td>Python's built-in <code>csv<\/code> module<\/td><td>nothing extra<\/td><\/tr>\n<tr><td><code>WebBaseLoader<\/code><\/td><td><code>beautifulsoup4<\/code>, which reads the HTML of a page. It also uses <code>requests<\/code> to download the page.<\/td><td><code>pip install beautifulsoup4<\/code><\/td><\/tr>\n<tr><td>The loader classes themselves<\/td><td><code>langchain-community<\/code>: the LangChain package that holds <code>TextLoader<\/code>, <code>PyPDFLoader<\/code>, <code>CSVLoader<\/code> and <code>WebBaseLoader<\/code>. You import them from <code>langchain_community.document_loaders<\/code>.<\/td><td><code>pip install langchain-community<\/code><\/td><\/tr>\n<\/table><\/div>\n<div class=\"px\">\n  <div class=\"px-r\"><span>Two layers<\/span><div><code>langchain-community<\/code> gives you the loader classes. Without it, <code>from langchain_community.document_loaders import PyPDFLoader<\/code> fails. Under each loader, a second package such as <code>pypdf<\/code> or <code>beautifulsoup4<\/code> does the reading. You need both layers.<\/div><\/div>\n  <div class=\"px-r\"><span>Why not build it ourselves<\/span><div>We could write a PDF reader or an HTML reader ourselves. But a PDF is a complex file format, and good, well-tested packages already exist. Using them saves time and avoids bugs.<\/div><\/div>\n  <div class=\"px-r\"><span>What LangChain adds<\/span><div>The <b>same Document shape<\/b> for every source, whatever package reads the file underneath.<\/div><\/div>\n  <div class=\"px-r hi\"><span>When a package is missing<\/span><div>Python stops with an import error that names the missing package. Install it and run again.<\/div><\/div>\n<\/div><div class=\"em-cap\">Your <code>requirements.txt<\/code> already lists <code>langchain-community<\/code>, <code>pypdf<\/code> and <code>beautifulsoup4<\/code>.<\/div><\/figure>\n<hr />\n<h2 class=\"c5\" id=\"pypdfloader-how-it-works\">PyPDFLoader: How It Works<\/h2>\n<p>A very common loader in RAG, because a lot of company knowledge sits in PDFs.<\/p>\n<figure class=\"visual\"><div class=\"em-fig\"><svg class=\"em-svg\" viewBox=\"0 0 760 235\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"pa\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#9aa3a2\"/><\/marker><\/defs><text x=\"10\" y=\"20\" font-size=\"13\" font-weight=\"800\" fill=\"#7a7367\" letter-spacing=\"1\">A PDF FILE<\/text><text x=\"500\" y=\"20\" font-size=\"13\" font-weight=\"800\" fill=\"#7a7367\" letter-spacing=\"1\">A LIST OF DOCUMENTS<\/text><rect x=\"10\" y=\"36\" width=\"120\" height=\"48\" rx=\"8\" fill=\"#fff\" stroke=\"#9aa3a2\" stroke-width=\"1.6\"/><text x=\"70\" y=\"65\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1f2a2a\">page 1<\/text><line x1=\"136\" y1=\"60\" x2=\"246\" y2=\"60\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#pa)\"/><rect x=\"252\" y=\"36\" width=\"170\" height=\"48\" rx=\"8\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"337\" y=\"65\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">pypdf reads the text<\/text><line x1=\"428\" y1=\"60\" x2=\"498\" y2=\"60\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#pa)\"/><rect x=\"504\" y=\"36\" width=\"246\" height=\"48\" rx=\"8\" fill=\"#fbf1d3\" stroke=\"#efdca0\" stroke-width=\"1.6\"/><text x=\"627\" y=\"65\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#5f4d12\">Document, page: 0<\/text><rect x=\"10\" y=\"96\" width=\"120\" height=\"48\" rx=\"8\" fill=\"#fff\" stroke=\"#9aa3a2\" stroke-width=\"1.6\"/><text x=\"70\" y=\"125\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1f2a2a\">page 2<\/text><line x1=\"136\" y1=\"120\" x2=\"246\" y2=\"120\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#pa)\"/><rect x=\"252\" y=\"96\" width=\"170\" height=\"48\" rx=\"8\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"337\" y=\"125\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">pypdf reads the text<\/text><line x1=\"428\" y1=\"120\" x2=\"498\" y2=\"120\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#pa)\"/><rect x=\"504\" y=\"96\" width=\"246\" height=\"48\" rx=\"8\" fill=\"#fbf1d3\" stroke=\"#efdca0\" stroke-width=\"1.6\"/><text x=\"627\" y=\"125\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#5f4d12\">Document, page: 1<\/text><rect x=\"10\" y=\"156\" width=\"120\" height=\"48\" rx=\"8\" fill=\"#fff\" stroke=\"#9aa3a2\" stroke-width=\"1.6\"/><text x=\"70\" y=\"185\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1f2a2a\">page 3<\/text><line x1=\"136\" y1=\"180\" x2=\"246\" y2=\"180\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#pa)\"/><rect x=\"252\" y=\"156\" width=\"170\" height=\"48\" rx=\"8\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"337\" y=\"185\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">pypdf reads the text<\/text><line x1=\"428\" y1=\"180\" x2=\"498\" y2=\"180\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#pa)\"/><rect x=\"504\" y=\"156\" width=\"246\" height=\"48\" rx=\"8\" fill=\"#fbf1d3\" stroke=\"#efdca0\" stroke-width=\"1.6\"/><text x=\"627\" y=\"185\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#5f4d12\">Document, page: 2<\/text><\/svg><\/div><div class=\"px\">\n  <div class=\"px-r\"><span>Install first<\/span><div><code>pip install pypdf<\/code>. <code>PyPDFLoader<\/code> calls this package to read the PDF.<\/div><\/div>\n  <div class=\"px-r\"><span>1. Open<\/span><div>The loader opens the PDF with a Python library called <code>pypdf<\/code>.<\/div><\/div>\n  <div class=\"px-r\"><span>2. Read<\/span><div>It goes through the pages one by one and reads the text of each page.<\/div><\/div>\n  <div class=\"px-r\"><span>3. Make Documents<\/span><div>For each page it makes <b>one Document<\/b>. <code>page_content<\/code> is the text of that page. <code>metadata<\/code> holds <code>source<\/code> (the location of the file), <code>page<\/code> (the page number, starting at 0), <code>page_label<\/code>, <code>total_pages<\/code>, and details of the PDF such as its title and author.<\/div><\/div>\n  <div class=\"px-r hi\"><span>4. Return<\/span><div>A list with one Document for every page.<\/div><\/div>\n<\/div><div class=\"hl\" data-x=\"1\"><pre><span class=\"n\">path<\/span> <span class=\"o\">=<\/span> <span class=\"s2\">\"location of the PDF\"<\/span>\n<span class=\"n\">pdfLoader<\/span> <span class=\"o\">=<\/span> <span class=\"n\">PyPDFLoader<\/span><span class=\"p\">(<\/span><span class=\"n\">path<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">docs<\/span> <span class=\"o\">=<\/span> <span class=\"n\">pdfLoader<\/span><span class=\"o\">.<\/span><span class=\"n\">load<\/span><span class=\"p\">()<\/span>\n<span class=\"n\">page1<\/span> <span class=\"o\">=<\/span> <span class=\"n\">docs<\/span><span class=\"p\">[<\/span><span class=\"mi\">0<\/span><span class=\"p\">]<\/span><\/pre><\/div>\n<div class=\"em-cap\">Put the location of your PDF in <code>path<\/code>. <code>len(docs)<\/code> is the number of pages, and <code>page1.metadata<\/code> is the information of the first page.<\/div>\n<div class=\"em-point\"><b>Why one Document per page:<\/b> a page is a natural unit, and the page number in the metadata lets us tell the user which page an answer came from.<\/div>\n<div class=\"em-point\"><b>Watch out:<\/b> the loader reads the text of the PDF. A scanned PDF is only a picture of each page, so it has no text to read.<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c1\" id=\"textloader-the-simplest-loader\">TextLoader: The Simplest Loader<\/h2>\n<p>Reads a plain text file.<\/p>\n<figure class=\"visual\"><div class=\"hl\" data-x=\"1\"><pre><span class=\"n\">txtLoader<\/span> <span class=\"o\">=<\/span> <span class=\"n\">TextLoader<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"location of the text file\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">encoding<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"utf-8\"<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">docs<\/span> <span class=\"o\">=<\/span> <span class=\"n\">txtLoader<\/span><span class=\"o\">.<\/span><span class=\"n\">load<\/span><span class=\"p\">()<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"nb\">len<\/span><span class=\"p\">(<\/span><span class=\"n\">docs<\/span><span class=\"p\">))<\/span> <span class=\"c1\"># -&gt; 1<\/span><\/pre><\/div>\n<div class=\"px\">\n  <div class=\"px-r\"><span>One file<\/span><div>gives <b>one Document<\/b>, so <code>len(docs)<\/code> is 1.<\/div><\/div>\n  <div class=\"px-r\"><span>page_content<\/span><div>The whole text of the file, as one string.<\/div><\/div>\n  <div class=\"px-r\"><span>metadata<\/span><div>Only <code>source<\/code>: the location of the file.<\/div><\/div>\n  <div class=\"px-r hi\"><span>encoding<\/span><div>How the characters of the file are read. <code>utf-8<\/code> works for most text, including Hindi.<\/div><\/div>\n<\/div><\/figure>\n<hr />\n<h2 class=\"c2\" id=\"loading-methods-load-and-lazy_load\">Loading Methods: load and lazy_load<\/h2>\n<p>Every loader has the same methods. They give the same Documents, but they hand them over in different ways.<\/p>\n<figure class=\"visual\"><div class=\"em-fig\"><svg class=\"em-svg\" viewBox=\"0 0 760 215\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"ma\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#9aa3a2\"/><\/marker><\/defs><text x=\"10\" y=\"18\" font-size=\"14\" font-weight=\"800\" fill=\"#0e3b3a\">load()<\/text><text x=\"400\" y=\"18\" font-size=\"14\" font-weight=\"800\" fill=\"#0e3b3a\">lazy_load()<\/text><rect x=\"10\" y=\"30\" width=\"350\" height=\"140\" rx=\"14\" fill=\"#f6f4f0\"/><text x=\"26\" y=\"52\" font-size=\"12\" font-weight=\"800\" fill=\"#7a7367\" letter-spacing=\"1\">ALL IN MEMORY AT ONCE<\/text><rect x=\"26\" y=\"68\" width=\"74\" height=\"60\" rx=\"8\" fill=\"#fbf1d3\" stroke=\"#efdca0\" stroke-width=\"1.6\"/><text x=\"63\" y=\"103\" font-size=\"13\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#8a6a12\">Doc 1<\/text><rect x=\"108\" y=\"68\" width=\"74\" height=\"60\" rx=\"8\" fill=\"#fbf1d3\" stroke=\"#efdca0\" stroke-width=\"1.6\"/><text x=\"145\" y=\"103\" font-size=\"13\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#8a6a12\">Doc 2<\/text><rect x=\"190\" y=\"68\" width=\"74\" height=\"60\" rx=\"8\" fill=\"#fbf1d3\" stroke=\"#efdca0\" stroke-width=\"1.6\"/><text x=\"227\" y=\"103\" font-size=\"13\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#8a6a12\">Doc 3<\/text><rect x=\"272\" y=\"68\" width=\"74\" height=\"60\" rx=\"8\" fill=\"#fbf1d3\" stroke=\"#efdca0\" stroke-width=\"1.6\"/><text x=\"309\" y=\"103\" font-size=\"13\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#8a6a12\">Doc 4<\/text><text x=\"185\" y=\"156\" font-size=\"13\" text-anchor=\"middle\" fill=\"#4a5f5e\">a list with every Document<\/text><rect x=\"400\" y=\"30\" width=\"350\" height=\"140\" rx=\"14\" fill=\"#f6f4f0\"/><text x=\"416\" y=\"52\" font-size=\"12\" font-weight=\"800\" fill=\"#7a7367\" letter-spacing=\"1\">ONE AT A TIME<\/text><rect x=\"416\" y=\"76\" width=\"52\" height=\"44\" rx=\"8\" fill=\"#fff\" stroke=\"#c9c3b6\" stroke-width=\"1.4\"/><text x=\"442\" y=\"103\" font-size=\"12\" text-anchor=\"middle\" fill=\"#9aa3a2\">waits<\/text><rect x=\"478\" y=\"76\" width=\"52\" height=\"44\" rx=\"8\" fill=\"#fff\" stroke=\"#c9c3b6\" stroke-width=\"1.4\"/><text x=\"504\" y=\"103\" font-size=\"12\" text-anchor=\"middle\" fill=\"#9aa3a2\">waits<\/text><rect x=\"540\" y=\"76\" width=\"52\" height=\"44\" rx=\"8\" fill=\"#fff\" stroke=\"#c9c3b6\" stroke-width=\"1.4\"/><text x=\"566\" y=\"103\" font-size=\"12\" text-anchor=\"middle\" fill=\"#9aa3a2\">waits<\/text><line x1=\"606\" y1=\"98\" x2=\"640\" y2=\"98\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ma)\"/><rect x=\"646\" y=\"68\" width=\"90\" height=\"60\" rx=\"8\" fill=\"#fbf1d3\" stroke=\"#efdca0\" stroke-width=\"1.6\"/><text x=\"691\" y=\"103\" font-size=\"13\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#8a6a12\">1 Document<\/text><text x=\"575\" y=\"156\" font-size=\"13\" text-anchor=\"middle\" fill=\"#4a5f5e\">your loop gets one when it asks<\/text><text x=\"380\" y=\"200\" font-size=\"13\" text-anchor=\"middle\" fill=\"#7a7367\">Both give the same Documents. Only the way they arrive is different.<\/text><\/svg><\/div><div class=\"em-tbl\"><table>\n<tr><th>Method<\/th><th>It gives<\/th><th>How it works<\/th><th>Use it when<\/th><\/tr>\n<tr><td><code>load()<\/code><\/td><td>a list of Documents<\/td><td>reads everything first, then hands over the whole list<\/td><td>the source is a normal size<\/td><\/tr>\n<tr><td><code>lazy_load()<\/code><\/td><td>a generator: one Document at a time<\/td><td>reads the next Document only when your loop asks for it<\/td><td>the source is very big, such as a PDF with thousands of pages, and you want to use little memory<\/td><\/tr>\n<\/table><\/div>\n<div class=\"hl\" data-x=\"1\"><pre><span class=\"k\">for<\/span> <span class=\"n\">doc<\/span> <span class=\"ow\">in<\/span> <span class=\"n\">loader<\/span><span class=\"o\">.<\/span><span class=\"n\">lazy_load<\/span><span class=\"p\">():<\/span>\n    <span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">doc<\/span><span class=\"o\">.<\/span><span class=\"n\">metadata<\/span><span class=\"p\">)<\/span><\/pre><\/div>\n<div class=\"em-cap\"><code>lazy_load()<\/code> is a generator: each step of the loop gives one Document, starting with page 0.<\/div>\n<div class=\"em-point\"><b>load() is built on lazy_load().<\/b> In the library, <code>load()<\/code> simply collects everything that <code>lazy_load()<\/code> gives into a list. So the Documents are the same. Only the way they arrive is different.<\/div>\n<\/figure>\n<hr /><div class=\"sc-head code-head\">Code<\/div><details class=\"codecard\"><summary><span class=\"cc-t\">TextLoader<\/span><span class=\"cc-f\">01_text_loader.py · 26 lines<\/span><span class=\"cc-show\">Show code<\/span><\/summary><div class=\"hl\"><table class=\"hltable\"><tr><td class=\"linenos\"><div class=\"linenodiv\"><pre><span class=\"normal\"> 1<\/span>\n<span class=\"normal\"> 2<\/span>\n<span class=\"normal\"> 3<\/span>\n<span class=\"normal\"> 4<\/span>\n<span class=\"normal\"> 5<\/span>\n<span class=\"normal\"> 6<\/span>\n<span class=\"normal\"> 7<\/span>\n<span class=\"normal\"> 8<\/span>\n<span class=\"normal\"> 9<\/span>\n<span class=\"normal\">10<\/span>\n<span class=\"normal\">11<\/span>\n<span class=\"normal\">12<\/span>\n<span class=\"normal\">13<\/span>\n<span class=\"normal\">14<\/span>\n<span class=\"normal\">15<\/span>\n<span class=\"normal\">16<\/span>\n<span class=\"normal\">17<\/span>\n<span class=\"normal\">18<\/span>\n<span class=\"normal\">19<\/span>\n<span class=\"normal\">20<\/span>\n<span class=\"normal\">21<\/span>\n<span class=\"normal\">22<\/span>\n<span class=\"normal\">23<\/span>\n<span class=\"normal\">24<\/span>\n<span class=\"normal\">25<\/span>\n<span class=\"normal\">26<\/span><\/pre><\/div><\/td><td class=\"code\"><div><pre><span><\/span><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">dotenv<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">load_dotenv<\/span>\n<span class=\"n\">load_dotenv<\/span><span class=\"p\">()<\/span>\n\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain.chat_models<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">init_chat_model<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_core.prompts<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">ChatPromptTemplate<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_core.output_parsers<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">StrOutputParser<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_community.document_loaders<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">TextLoader<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_core.document_loaders<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">BaseLoader<\/span>\n<span class=\"n\">parser<\/span> <span class=\"o\">=<\/span> <span class=\"n\">StrOutputParser<\/span><span class=\"p\">()<\/span>\n<span class=\"n\">model<\/span> <span class=\"o\">=<\/span> <span class=\"n\">init_chat_model<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"mistralai:open-mistral-nemo\"<\/span><span class=\"p\">)<\/span>\n<span class=\"sd\">\"\"\"TextLoader: one .txt file -&gt; 1 Document\"\"\"<\/span>\n<span class=\"n\">txtLoader<\/span> <span class=\"o\">=<\/span> <span class=\"n\">TextLoader<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"data/sample_notes.txt\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">encoding<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"utf-8\"<\/span><span class=\"p\">)<\/span>\n\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"nb\">type<\/span><span class=\"p\">(<\/span><span class=\"n\">txtLoader<\/span><span class=\"p\">))<\/span> <span class=\"c1\"># class<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"nb\">isinstance<\/span><span class=\"p\">(<\/span><span class=\"n\">txtLoader<\/span><span class=\"p\">,<\/span> <span class=\"n\">BaseLoader<\/span><span class=\"p\">))<\/span> <span class=\"c1\"># TRUE<\/span>\n\n<span class=\"sd\">\"\"\"load() gives a list of Documents: page_content + m
