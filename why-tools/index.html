<script>window.PAGE = {"id": "n15_1", "root": "../", "lesson": {"id": "n15_1", "title": "Why Tools?", "short": "Why Tools?", "unit": "Unit 2", "unitName": "Build with LangChain", "pos": 13, "of": 14, "sub": "Tools", "info": "Why LLMs cannot know live data, and how a tool lets them ask for it", "html": "<h2 class=\"c1\" id=\"1-have-you-seen-this\">1. Have You Seen This?<\/h2>\n<p>You ask ChatGPT for today's Bitcoin price. It says \"Searching the web&hellip;\" and then answers. Where did that answer come from?<\/p>\n<figure class=\"visual\"><div class=\"tcw\"><div class=\"win chatwin tcwin\">\n  <div class=\"win-top\"><i><\/i><i><\/i><i><\/i><span>chatgpt.com<\/span><\/div>\n  <div class=\"win-body\">\n    <div class=\"cuser tcu\">What is the Bitcoin price right now?<\/div>\n    <div class=\"crow\"><span class=\"cav\"><svg viewBox=\"0 0 24 24\" aria-label=\"ChatGPT\"><path d=\"M22.2819 9.8211a5.9847 5.9847 0 0 0-.5157-4.9108 6.0462 6.0462 0 0 0-6.5098-2.9A6.0651 6.0651 0 0 0 4.9807 4.1818a5.9847 5.9847 0 0 0-3.9977 2.9 6.0462 6.0462 0 0 0 .7427 7.0966 5.98 5.98 0 0 0 .511 4.9107 6.051 6.051 0 0 0 6.5146 2.9001A5.9847 5.9847 0 0 0 13.2599 24a6.0557 6.0557 0 0 0 5.7718-4.2058 5.9894 5.9894 0 0 0 3.9977-2.9001 6.0557 6.0557 0 0 0-.7475-7.0729zm-9.022 12.6081a4.4755 4.4755 0 0 1-2.8764-1.0408l.1419-.0804 4.7783-2.7582a.7948.7948 0 0 0 .3927-.6813v-6.7369l2.02 1.1686a.071.071 0 0 1 .038.052v5.5826a4.504 4.504 0 0 1-4.4945 4.4944zm-9.6607-4.1254a4.4708 4.4708 0 0 1-.5346-3.0137l.142.0852 4.783 2.7582a.7712.7712 0 0 0 .7806 0l5.8428-3.3685v2.3324a.0804.0804 0 0 1-.0332.0615L9.74 19.9502a4.4992 4.4992 0 0 1-6.1408-1.6464zM2.3408 7.8956a4.485 4.485 0 0 1 2.3655-1.9728V11.6a.7664.7664 0 0 0 .3879.6765l5.8144 3.3543-2.0201 1.1685a.0757.0757 0 0 1-.071 0l-4.8303-2.7865A4.504 4.504 0 0 1 2.3408 7.872zm16.5963 3.8558L13.1038 8.364 15.1192 7.2a.0757.0757 0 0 1 .071 0l4.8303 2.7913a4.4944 4.4944 0 0 1-.6765 8.1042v-5.6772a.79.79 0 0 0-.407-.667zm2.0107-3.0231l-.142-.0852-4.7735-2.7818a.7759.7759 0 0 0-.7854 0L9.409 9.2297V6.8974a.0662.0662 0 0 1 .0284-.0615l4.8303-2.7866a4.4992 4.4992 0 0 1 6.6802 4.66zM8.3065 12.863l-2.02-1.1638a.0804.0804 0 0 1-.038-.0567V6.0742a4.4992 4.4992 0 0 1 7.3757-3.4537l-.142.0805L8.704 5.459a.7948.7948 0 0 0-.3927.6813zm1.0976-2.3654l2.602-1.4998 2.6069 1.4998v2.9994l-2.5974 1.4997-2.6067-1.4997Z\"/><\/svg><\/span><div class=\"cans\">\n      <div class=\"tc-search\"><span class=\"tc-dots\"><b><\/b><b><\/b><b><\/b><\/span>Searching the web&hellip;<\/div>\n      <div class=\"tc-src\"><u class=\"s1\">Source 1<\/u><u class=\"s2\">Source 2<\/u><u class=\"s3\">Source 3<\/u><\/div>\n      <div class=\"tc-ans\">Bitcoin is trading at about <b>$67,000<\/b> right now. <em>(example)<\/em><\/div>\n    <\/div><\/div>\n    <div class=\"cbar\"><span class=\"cplus\">+<\/span><span class=\"ctext\">Ask anything<\/span><b>&uarr;<\/b><\/div>\n  <\/div>\n<\/div><div class=\"tc-q\">How did it know? The model was not trained on today's price.<\/div><\/div>\n<\/figure>\n<hr />\n<h2 class=\"c2\" id=\"2-the-model-does-not-know-this\">2. The Model Does Not Know This<\/h2>\n<p>A model learns from text up to a cutoff date. Nothing after that is inside it. Weather, Bitcoin and stock prices change every minute.<\/p>\n<figure class=\"visual\"><div class=\"tcw\">\n  <div class=\"tl\">\n    <div class=\"tl-train\"><span>Training data<\/span><\/div>\n    <div class=\"tl-gap\"><span>Everything after the cutoff is missing<\/span><\/div>\n    <div class=\"tl-mark cut\"><b>Cutoff<\/b><\/div>\n    <div class=\"tl-mark today\"><b>Today<\/b><\/div>\n  <\/div>\n  <div class=\"tl-cards\">\n    <div class=\"tl-c\"><b>Weather<\/b><span>changes every hour<\/span><u>not in the model<\/u><\/div>\n    <div class=\"tl-c\"><b>Bitcoin<\/b><span>changes every second<\/span><u>not in the model<\/u><\/div>\n    <div class=\"tl-c\"><b>Stock prices<\/b><span>change every minute<\/span><u>not in the model<\/u><\/div>\n    <div class=\"tl-c\"><b>Today's news<\/b><span>happened after the cutoff<\/span><u>not in the model<\/u><\/div>\n  <\/div>\n<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c3\" id=\"3-so-how-does-it-answer\">3. So How Does It Answer?<\/h2>\n<p>It asks us to fetch the data from a third-party API. The helper that does this is called a <strong>tool<\/strong>.<\/p>\n<figure class=\"visual\"><div class=\"tcw\"><div class=\"flw\">\n  <div class=\"fl-n you\"><b>You<\/b><\/div>\n  <div class=\"fl-g\"><div class=\"fl-a\" style=\"animation-delay:0.0s\"><i>&rarr;<\/i><span>question<\/span><\/div><div class=\"fl-a back\" style=\"animation-delay:7.5s\"><i>&larr;<\/i><span>answer<\/span><\/div><\/div>\n  <div class=\"fl-n llm\"><b>LLM<\/b><\/div>\n  <div class=\"fl-g\"><div class=\"fl-a\" style=\"animation-delay:1.5s\"><i>&rarr;<\/i><span>asks for the tool<\/span><\/div><div class=\"fl-a back\" style=\"animation-delay:6.0s\"><i>&larr;<\/i><span>tool result<\/span><\/div><\/div>\n  <div class=\"fl-n tool\"><b>Tool<\/b><span>a Python function<\/span><\/div>\n  <div class=\"fl-g\"><div class=\"fl-a\" style=\"animation-delay:3.0s\"><i>&rarr;<\/i><span>calls the API<\/span><\/div><div class=\"fl-a back\" style=\"animation-delay:4.5s\"><i>&larr;<\/i><span>data<\/span><\/div><\/div>\n  <div class=\"fl-n api\"><b>Third-party API<\/b><span>weather, crypto, search<\/span><\/div>\n<\/div><\/div>\n<\/figure>\n<hr />\n<h2 class=\"c4\" id=\"4-what-is-a-tool\">4. What Is a Tool?<\/h2>\n<blockquote class=\"def\"><span class=\"deflab\">Definition<\/span>\n<p>A <strong>tool<\/strong> is a <mark class=\"hp\">Python function<\/mark> the LLM can <mark class=\"hk\">ask us to run<\/mark>. The LLM never runs it. Our code does.<\/p>\n<\/blockquote>\n<figure class=\"visual\"><div class=\"two2\">\n  <div class=\"two-c t\"><div class=\"why-h\"><span class=\"tag t\">LLM<\/span><span class=\"stp-l\">Decides<\/span><\/div>\n    <div class=\"two-q\">\"I do not know today's Bitcoin price. I need a tool.\"<\/div>\n    <div class=\"two-l\">It asks for<\/div><code class=\"two-code\">get_price(\"bitcoin\")<\/code><\/div>\n  <div class=\"two2-m\"><div class=\"two2-a\"><i>&rarr;<\/i><span>asks<\/span><\/div><div class=\"two2-a back\"><i>&larr;<\/i><span>result<\/span><\/div><\/div>\n  <div class=\"two-c d\"><div class=\"why-h\"><span class=\"tag d\">Our code<\/span><span class=\"stp-l\">Runs<\/span><\/div>\n    <div class=\"two-q\">Runs the function. It calls a crypto API and gets the price.<\/div>\n    <div class=\"two-l\">It sends back<\/div><code class=\"two-code\">$67,000<\/code><\/div>\n<\/div>\n<div class=\"tc-n\">Example. The function name <code>get_price<\/code> is made up for this picture.<\/div>\n<\/figure>\n", "toc": [{"id": "1-have-you-seen-this", "name": "1. Have You Seen This?"}, {"id": "2-the-model-does-not-know-this", "name": "2. The Model Does Not Know This"}, {"id": "3-so-how-does-it-answer", "name": "3. So How Does It Answer?"}, {"id": "4-what-is-a-tool", "name": "4. What Is a Tool?"}], "search": "", "slides": null, "slideCount": 0, "code": []}};</script>
