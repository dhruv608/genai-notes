<script>window.PAGE = {"id": "n03_1", "root": "../", "lesson": {"id": "n03_1", "title": "What is an LLM?", "short": "What is an LLM?", "unit": "Unit 1", "unitName": "Start Here: GenAI Basics", "pos": 3, "of": 7, "sub": "Understand LLMs", "info": "How an LLM predicts, parameters and tokens", "html": "<h2 class=\"c1\" id=\"1-what-is-a-large-language-model-llm\">1. What Is a Large Language Model (LLM)?<\/h2>\n<blockquote class=\"def\"><span class=\"deflab\">Definition<\/span>\n<p>A <strong>Large Language Model<\/strong> is an AI model trained on huge amounts of text that can understand and generate human language. It is the engine behind ChatGPT, Claude and Gemini.<\/p>\n<\/blockquote>\n<ul>\n<li><strong>L<\/strong>arge: billions of parameters, trained on a huge amount of text<\/li>\n<li><strong>L<\/strong>anguage: reads and writes human language<\/li>\n<li><strong>M<\/strong>odel: a program that learned from data, not from written rules<\/li>\n<\/ul>\n<p><strong>Fun fact:<\/strong> Training GPT-4 cost OpenAI more than $100 million (₹800+ crore), as CEO Sam Altman said in 2023.<\/p>\n<hr />\n<h2 class=\"c2\" id=\"2-how-an-llm-thinks-predicts\">2. How an LLM <s>Thinks<\/s> <b>Predicts<\/b><\/h2>\n<p>Prompt: <em>\"The capital of India is ...\"<\/em> goes into the <strong>LLM<\/strong> (a Transformer neural network), which gives a probability for every token in its vocabulary.<\/p>\n<figure class=\"visual\"><div class=\"pred\">\n  <div class=\"pred-flow\">\n    <div class=\"pred-in\">The capital of India is<\/div>\n    <div class=\"pred-arrow\">→<\/div>\n    <div class=\"pred-llm\"><b>LLM<\/b><span>Transformer neural network<\/span><\/div>\n    <div class=\"pred-arrow\">→<\/div>\n    <div class=\"pred-bars\">\n      <div class=\"pred-t\">Probability for every token in the vocabulary<\/div>\n      <div class=\"pr\"><span>New<\/span><i class=\"c1\" style=\"width:81%\"><\/i><b>81%<\/b><\/div>\n      <div class=\"pr\"><span>Delhi<\/span><i class=\"c2\" style=\"width:15%\"><\/i><b>15%<\/b><\/div>\n      <div class=\"pr\"><span>Mumbai<\/span><i class=\"c3\" style=\"width:2%\"><\/i><b>1%<\/b><\/div>\n      <div class=\"pr\"><span>others<\/span><i class=\"c4\" style=\"width:2%\"><\/i><b>&lt;1%<\/b><\/div>\n    <\/div>\n  <\/div>\n  <div class=\"pred-cards\">\n    <div class=\"pc\"><h5>It guesses, it doesn't \"know\"<\/h5><p>Every possible next word gets a probability. The model picks one from the top.<\/p><\/div>\n    <div class=\"pc\"><h5>It learned by itself<\/h5><p>It read huge amounts of text and kept guessing the next word. No one labelled the data.<\/p><\/div>\n    <div class=\"pc\"><h5>A new answer each time<\/h5><p>Because it picks from probabilities, the reply can change every time you ask.<\/p><\/div>\n  <\/div>\n<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c3\" id=\"3-what-are-parameters\">3. What Are Parameters?<\/h2>\n<blockquote class=\"def\"><span class=\"deflab\">Definition<\/span>\n<p><strong>Parameters<\/strong> are the <strong>weights and biases<\/strong> inside a model. They are numbers the model learns during training, and together they store everything it knows. \"8B\" means 8 billion of them.<\/p>\n<p><strong>Weights<\/strong> decide how much each input matters. <strong>Biases<\/strong> shift the result up or down.<\/p>\n<\/blockquote>\n<figure class=\"visual\"><div class=\"psz\">\n  <div class=\"psz-t\">Number of parameters (B = billion)<\/div>\n  <div class=\"jb\"><span>GPT-2<\/span><div class=\"jb-track\"><i style=\"width:2%\"><\/i><\/div><b>1.5B<\/b><\/div>\n  <div class=\"jb\"><span>Llama 3 · small<\/span><div class=\"jb-track\"><i style=\"width:3.5%\"><\/i><\/div><b>8B<\/b><\/div>\n  <div class=\"jb\"><span>Llama 3 · medium<\/span><div class=\"jb-track\"><i style=\"width:17.3%\"><\/i><\/div><b>70B<\/b><\/div>\n  <div class=\"jb\"><span>GPT-3<\/span><div class=\"jb-track\"><i style=\"width:43.2%\"><\/i><\/div><b>175B<\/b><\/div>\n  <div class=\"jb\"><span>Llama 3 · large<\/span><div class=\"jb-track\"><i style=\"width:100%\"><\/i><\/div><b>405B<\/b><\/div>\n  <div class=\"psz-n\">GPT-4, Claude and Gemini: <b>not disclosed<\/b><\/div>\n<\/div>\n<\/figure>\n<p><strong>Bigger is smarter:<\/strong> more parameters usually means a more capable model.<\/p>\n<hr />\n<h2 class=\"c4\" id=\"4-what-is-a-token\">4. What Is a Token?<\/h2>\n<blockquote class=\"def\"><span class=\"deflab\">Definition<\/span>\n<p>A <strong>token<\/strong> is the small piece of text an LLM reads and writes. It can be a whole word, part of a word, or a symbol. The model never sees letters or words, only the <strong>number (ID)<\/strong> of each token.<\/p>\n<\/blockquote>\n<figure class=\"visual\"><div class=\"tok\">\n  <div class=\"tok-l\">Text<\/div>\n  <div class=\"tok-r\"><span class=\"tok-text\">I am learning LangChain<\/span><\/div>\n  <div class=\"tok-a\"><span>↓<\/span> split into tokens<\/div>\n  <div class=\"tok-l\">Tokens<\/div>\n  <div class=\"tok-r\"><span class=\"tk a\">I<\/span><span class=\"tk b\">&nbsp;am<\/span><span class=\"tk a\">&nbsp;learning<\/span><span class=\"tk b\">&nbsp;Lang<\/span><span class=\"tk a\">Chain<\/span><\/div>\n  <div class=\"tok-a\"><span>↓<\/span> each token has a fixed ID<\/div>\n  <div class=\"tok-l\">Token IDs<\/div>\n  <div class=\"tok-r\"><span class=\"tid\">40<\/span><span class=\"tid\">939<\/span><span class=\"tid\">7524<\/span><span class=\"tid\">27830<\/span><span class=\"tid\">20848<\/span><\/div>\n<\/div>\n<\/figure>\n<p><strong>Why do we need tokens?<\/strong> Computers only work with numbers, so text has to become numbers first. Letters would make every text very long. Whole words would need a huge vocabulary and would break on new words. Tokens are the middle way. Cost, speed and the context window are all counted in tokens.<\/p>\n<p><strong>Rule of thumb:<\/strong> <span class=\"math\">1 \\text{ token} \\approx 0.75 \\text{ words}<\/span> (about 4 characters in English). Try it yourself at <a href=\"https://platform.openai.com/tokenizer\">platform.openai.com/tokenizer<\/a>.<\/p>\n<p><strong>Every company has its own tokenizer<\/strong> (its own algorithm and vocabulary), so the same text can become different tokens and IDs in different models.<\/p>\n<p><strong>Recap: what happens after the ID?<\/strong> Each ID is looked up in a table and becomes a list of numbers (an embedding). The Transformer works on these numbers and gives a score to every token in the vocabulary. The scores become the probabilities you saw above, and the model picks the next token.<\/p>\n<p><strong>Vocabulary size<\/strong> is the number of different tokens a model knows. GPT-2 had about 50k (50,257). Llama 3 has about 128k, and newer models go higher.<\/p>\n<p><strong>What about other languages?<\/strong> The vocabulary is shared by all languages, so there is no separate English vocabulary. Languages like Hindi get fewer whole-word tokens, so the same sentence breaks into more pieces. That costs more tokens and fills the context window faster.<\/p>\n", "toc": [{"id": "1-what-is-a-large-language-model-llm", "name": "1. What Is a Large Language Model (LLM)?"}, {"id": "2-how-an-llm-thinks-predicts", "name": "2. How an LLM Thinks Predicts"}, {"id": "3-what-are-parameters", "name": "3. What Are Parameters?"}, {"id": "4-what-is-a-token", "name": "4. What Is a Token?"}], "search": "", "slides": null, "slideCount": 0, "code": []}};</script>
