<script>window.PAGE = {"id": "n23_2", "root": "../", "lesson": {"id": "n23_2", "title": "Six Workflows", "short": "Six Workflows", "unit": "Unit 4", "unitName": "Agents with LangGraph", "pos": 2, "of": 16, "sub": "", "info": "The six workflows we build in this unit, and which job needs which shape", "html": "<h2 class=\"c4\" id=\"six-workflows-we-will-build\">Six Workflows We Will Build<\/h2>\n<p>Each workflow is a different shape of graph. We build them one by one.<\/p>\n<figure class=\"visual\"><div class=\"bnt rt4 three\"><div class=\"bnt-t c3\"><div class=\"bnt-h\">Sequential<\/div><svg class=\"em-svg\" viewBox=\"0 0 250 120\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"ga\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#9aa3a2\"/><\/marker><marker id=\"gb\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#c9583a\"/><\/marker><\/defs><circle cx=\"35.0\" cy=\"60.0\" r=\"15\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"35.0\" y=\"64.0\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">A<\/text><circle cx=\"97.0\" cy=\"60.0\" r=\"15\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"97.0\" y=\"64.0\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">B<\/text><circle cx=\"159.0\" cy=\"60.0\" r=\"15\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"159.0\" y=\"64.0\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">C<\/text><circle cx=\"221.0\" cy=\"60.0\" r=\"15\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"221.0\" y=\"64.0\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">D<\/text><line x1=\"52.0\" y1=\"60.0\" x2=\"78.0\" y2=\"60.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><line x1=\"114.0\" y1=\"60.0\" x2=\"140.0\" y2=\"60.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><line x1=\"176.0\" y1=\"60.0\" x2=\"202.0\" y2=\"60.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><\/svg><div class=\"bnt-b\">A straight line<\/div><div class=\"bnt-p\">Steps in a fixed order. Each one improves the last.<\/div><\/div><div class=\"bnt-t c1\"><div class=\"bnt-h\">Parallel<\/div><svg class=\"em-svg\" viewBox=\"0 0 250 120\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"ga\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#9aa3a2\"/><\/marker><marker id=\"gb\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#c9583a\"/><\/marker><\/defs><circle cx=\"30.0\" cy=\"60.0\" r=\"15\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"30.0\" y=\"64.0\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">A<\/text><circle cx=\"220.0\" cy=\"60.0\" r=\"15\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"220.0\" y=\"64.0\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">E<\/text><circle cx=\"125.0\" cy=\"20.0\" r=\"15\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"125.0\" y=\"24.0\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">B<\/text><line x1=\"45.0\" y1=\"46.0\" x2=\"108.0\" y2=\"24.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><line x1=\"142.0\" y1=\"20.0\" x2=\"203.0\" y2=\"46.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><circle cx=\"125.0\" cy=\"60.0\" r=\"15\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"125.0\" y=\"64.0\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">C<\/text><line x1=\"45.0\" y1=\"60.0\" x2=\"108.0\" y2=\"60.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><line x1=\"142.0\" y1=\"60.0\" x2=\"203.0\" y2=\"60.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><circle cx=\"125.0\" cy=\"100.0\" r=\"15\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"125.0\" y=\"104.0\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">D<\/text><line x1=\"45.0\" y1=\"74.0\" x2=\"108.0\" y2=\"96.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><line x1=\"142.0\" y1=\"100.0\" x2=\"203.0\" y2=\"74.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><\/svg><div class=\"bnt-b\">Split and merge<\/div><div class=\"bnt-p\">Independent steps run at the same time, then the results join.<\/div><\/div><div class=\"bnt-t c4\"><div class=\"bnt-h\">Loop<\/div><svg class=\"em-svg\" viewBox=\"0 0 250 120\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"ga\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#9aa3a2\"/><\/marker><marker id=\"gb\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#c9583a\"/><\/marker><\/defs><circle cx=\"40.0\" cy=\"70.0\" r=\"15\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"40.0\" y=\"74.0\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">A<\/text><circle cx=\"125.0\" cy=\"70.0\" r=\"15\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"125.0\" y=\"74.0\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">B<\/text><circle cx=\"210.0\" cy=\"70.0\" r=\"18\" fill=\"#fff\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"210.0\" y=\"74.0\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">end<\/text><line x1=\"55.0\" y1=\"70.0\" x2=\"108.0\" y2=\"70.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><line x1=\"142.0\" y1=\"70.0\" x2=\"190.0\" y2=\"70.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><path d=\"M 125 55 Q 82 8 40 55\" fill=\"none\" stroke=\"#c9583a\" stroke-width=\"2.6\" marker-end=\"url(#gb)\"/><\/svg><div class=\"bnt-b\">Go back until good<\/div><div class=\"bnt-p\">A reviewer sends the work back until it passes.<\/div><\/div><div class=\"bnt-t c3\"><div class=\"bnt-h\">Memory<\/div><svg class=\"em-svg\" viewBox=\"0 0 250 120\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"ga\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#9aa3a2\"/><\/marker><marker id=\"gb\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#c9583a\"/><\/marker><\/defs><rect x=\"20.0\" y=\"35.0\" width=\"80\" height=\"40\" rx=\"9\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"60.0\" y=\"60.2\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">Chat<\/text><rect x=\"140\" y=\"30\" width=\"90\" height=\"50\" rx=\"10\" fill=\"#fbf1d3\" stroke=\"#efdca0\" stroke-width=\"1.6\"/><text x=\"185\" y=\"60\" font-size=\"14\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#8a6a12\">memory<\/text><line x1=\"104.0\" y1=\"48.0\" x2=\"138.0\" y2=\"48.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><line x1=\"138.0\" y1=\"62.0\" x2=\"104.0\" y2=\"62.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><text x=\"125\" y=\"108\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#7a7367\">one thread per user<\/text><\/svg><div class=\"bnt-b\">Remember the chat<\/div><div class=\"bnt-p\">The graph saves its state, so the next message continues the talk.<\/div><\/div><div class=\"bnt-t c1\"><div class=\"bnt-h\">Human in the loop<\/div><svg class=\"em-svg\" viewBox=\"0 0 250 120\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"ga\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#9aa3a2\"/><\/marker><marker id=\"gb\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#c9583a\"/><\/marker><\/defs><circle cx=\"35.0\" cy=\"60.0\" r=\"15\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"35.0\" y=\"64.0\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">A<\/text><circle cx=\"215.0\" cy=\"60.0\" r=\"15\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"215.0\" y=\"64.0\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">B<\/text><rect x=\"100\" y=\"36\" width=\"50\" height=\"48\" rx=\"10\" fill=\"#fdf1ec\" stroke=\"#c9583a\" stroke-width=\"1.8\"/><rect x=\"115\" y=\"48\" width=\"7\" height=\"24\" fill=\"#c9583a\"/><rect x=\"128\" y=\"48\" width=\"7\" height=\"24\" fill=\"#c9583a\"/><line x1=\"52.0\" y1=\"60.0\" x2=\"98.0\" y2=\"60.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><line x1=\"152.0\" y1=\"60.0\" x2=\"196.0\" y2=\"60.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><text x=\"125\" y=\"106\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c9583a\">waits for a human<\/text><\/svg><div class=\"bnt-b\">Pause for approval<\/div><div class=\"bnt-p\">The graph stops, a person decides, and then it continues.<\/div><\/div><div class=\"bnt-t c4\"><div class=\"bnt-h\">Conditional RAG<\/div><svg class=\"em-svg\" viewBox=\"0 0 250 120\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"ga\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#9aa3a2\"/><\/marker><marker id=\"gb\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#c9583a\"/><\/marker><\/defs><circle cx=\"28.0\" cy=\"60.0\" r=\"15\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"28.0\" y=\"64.0\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">Q<\/text><polygon points=\"95,35 125,60 95,85 65,60\" fill=\"#fbf1d3\" stroke=\"#8a6a12\" stroke-width=\"1.6\"/><line x1=\"44.0\" y1=\"60.0\" x2=\"62.0\" y2=\"60.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><rect x=\"170.0\" y=\"9.0\" width=\"70\" height=\"26\" rx=\"9\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"205.0\" y=\"26.6\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">HR<\/text><line x1=\"122.0\" y1=\"48.6\" x2=\"168.0\" y2=\"22.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><rect x=\"170.0\" y=\"47.0\" width=\"70\" height=\"26\" rx=\"9\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"205.0\" y=\"64.5\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">Finance<\/text><line x1=\"122.0\" y1=\"60.0\" x2=\"168.0\" y2=\"60.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><rect x=\"170.0\" y=\"85.0\" width=\"70\" height=\"26\" rx=\"9\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"205.0\" y=\"102.5\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">IT<\/text><line x1=\"122.0\" y1=\"71.4\" x2=\"168.0\" y2=\"98.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><\/svg><div class=\"bnt-b\">Choose a path<\/div><div class=\"bnt-p\">A router sends each question to the right knowledge base.<\/div><\/div><\/div><\/figure>\n<hr />\n<h2 class=\"c5\" id=\"which-workflow-for-which-job\">Which Workflow for Which Job?<\/h2>\n<p>Choose by the shape of the job.<\/p>\n<figure class=\"visual\"><div class=\"em-tbl\"><table>\n<tr><th>Workflow<\/th><th>Shape<\/th><th>Good for<\/th><\/tr>\n<tr><td><b>Sequential<\/b><\/td><td>a straight line<\/td><td>fixed steps: clean up, rewrite, format<\/td><\/tr>\n<tr><td><b>Parallel<\/b><\/td><td>split and merge<\/td><td>independent checks that can run together<\/td><\/tr>\n<tr><td><b>Loop<\/b><\/td><td>a cycle<\/td><td>write, review, rewrite until the quality is good<\/td><\/tr>\n<tr><td><b>Memory<\/b><\/td><td>a cycle that remembers<\/td><td>support bots and personal assistants<\/td><\/tr>\n<tr><td><b>Human in the loop<\/b><\/td><td>a graph that can pause<\/td><td>risky actions: payments, deleting data, approvals<\/td><\/tr>\n<tr><td><b>Conditional RAG<\/b><\/td><td>a tree of paths<\/td><td>one assistant, many knowledge bases (HR, finance, IT)<\/td><\/tr>\n<\/table><\/div>\n<\/figure>\n<hr />\n<h2 class=\"c1\" id=\"quick-revision\">Quick Revision<\/h2>\n<p>The whole lesson on one page.<\/p>\n<figure class=\"visual\"><div class=\"bnt rt4 three\"><div class=\"bnt-t c3\"><div class=\"bnt-h\">Why<\/div><div class=\"bnt-b\">Real tasks loop<\/div><div class=\"bnt-p\">A chain only goes forward. A graph can go back, share notes and wait.<\/div><\/div><div class=\"bnt-t c1\"><div class=\"bnt-h\">Three blocks<\/div><div class=\"bnt-b\">State, node, edge<\/div><div class=\"bnt-p\">The notebook, the worker functions, and the arrows between them.<\/div><\/div><div class=\"bnt-t c4\"><div class=\"bnt-h\">Six shapes<\/div><div class=\"bnt-b\">One graph, many uses<\/div><div class=\"bnt-p\">Sequential, parallel, loop, memory, human in the loop, conditional RAG.<\/div><\/div><\/div><\/figure>\n<div class=\"docs\"><span class=\"docs-l\">LangGraph docs<\/span><a href=\"https://docs.langchain.com/oss/python/langgraph/overview\" target=\"_blank\" rel=\"noopener\">LangGraph overview<\/a><a href=\"https://docs.langchain.com/oss/python/langgraph/graph-api\" target=\"_blank\" rel=\"noopener\">Graph API<\/a><\/div>\n\n", "toc": [{"id": "six-workflows-we-will-build", "name": "Six Workflows We Will Build"}, {"id": "which-workflow-for-which-job", "name": "Which Workflow for Which Job?"}, {"id": "quick-revision", "name": "Quick Revision"}], "search": "", "slides": null, "slideCount": 0, "code": []}};</script>
