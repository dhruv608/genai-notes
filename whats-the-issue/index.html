<script>window.PAGE = {"id": "n04_2", "root": "../", "lesson": {"id": "n04_2", "title": "What's the Issue?", "short": "What's the Issue?", "unit": "Unit 2", "unitName": "Build with LangChain", "pos": 1, "of": 16, "sub": "Why LangChain", "info": "Switch company and every line changes. We need something better", "html": "<h2 class=\"c2\" id=\"2-day-1-your-app-works\">1. Day 1: Your App Works<\/h2>\n<p>You build your app with Gemini. A few lines, and it works.<\/p>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">google<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">genai<\/span>\n<span class=\"n\">client<\/span> <span class=\"o\">=<\/span> <span class=\"n\">genai<\/span><span class=\"o\">.<\/span><span class=\"n\">Client<\/span><span class=\"p\">(<\/span><span class=\"n\">api_key<\/span><span class=\"o\">=...<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">response<\/span> <span class=\"o\">=<\/span> <span class=\"n\">client<\/span><span class=\"o\">.<\/span><span class=\"n\">models<\/span><span class=\"o\">.<\/span><span class=\"n\">generate_content<\/span><span class=\"p\">(<\/span><span class=\"n\">model<\/span><span class=\"o\">=...<\/span><span class=\"p\">,<\/span> <span class=\"n\">contents<\/span><span class=\"o\">=...<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">response<\/span><span class=\"o\">.<\/span><span class=\"n\">text<\/span><span class=\"p\">)<\/span>\n<\/code><\/pre><\/div>\n\n<hr />\n<h2 class=\"c3\" id=\"3-day-30-switch-to-groq\">2. Day 30: \"Switch to Groq\"<\/h2>\n<p>It sounds like a small change. Look at what happens to the same lines:<\/p>\n<figure class=\"visual\"><div class=\"boss\"><span class=\"boss-av\">B<\/span><div class=\"boss-msg\"><small>Boss · Monday 10:42<\/small>\"Groq is faster and cheaper. Please switch by Friday.\"<\/div><\/div>\n<div class=\"swap\">\n  <div class=\"sw-h\"><span><\/span><span class=\"a\">Day 1 · Gemini<\/span><span><\/span><span class=\"b\">Day 30 · Groq<\/span><\/div>\n  <div class=\"sw-r\"><i>import<\/i><code class=\"a\">from google import genai<\/code><b>→<\/b><code class=\"b\">from groq import Groq<\/code><\/div>\n  <div class=\"sw-r\"><i>client<\/i><code class=\"a\">genai.Client()<\/code><b>→<\/b><code class=\"b\">Groq()<\/code><\/div>\n  <div class=\"sw-r\"><i>call<\/i><code class=\"a\">models.generate_content()<\/code><b>→<\/b><code class=\"b\">chat.completions.create()<\/code><\/div>\n  <div class=\"sw-r\"><i>answer<\/i><code class=\"a\">response.text<\/code><b>→<\/b><code class=\"b\">response.choices[0].message.content<\/code><\/div>\n  <div class=\"sw-n\">4 lines, 4 changes<\/div>\n<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c4\" id=\"4-day-60-now-try-mistral\">3. Day 60: \"Now Try Mistral\"<\/h2>\n<p>A month later, someone finds a model that is better for Hindi. So you do it again.<\/p>\n<figure class=\"visual\"><div class=\"tline\">\n  <div class=\"tl-n n1\"><span class=\"tl-d\">Day 1<\/span><b>Gemini<\/b><em>built<\/em><\/div>\n  <div class=\"tl-a\">→<small>rewrite<\/small><\/div>\n  <div class=\"tl-n n2\"><span class=\"tl-d\">Day 30<\/span><b>Groq<\/b><em>rewrite #1<\/em><\/div>\n  <div class=\"tl-a\">→<small>rewrite<\/small><\/div>\n  <div class=\"tl-n n3\"><span class=\"tl-d\">Day 60<\/span><b>Mistral<\/b><em>rewrite #2<\/em><\/div>\n  <div class=\"tl-a\">→<small>rewrite<\/small><\/div>\n  <div class=\"tl-n n4\"><span class=\"tl-d\">Day 90<\/span><b>???<\/b><em>rewrite #3<\/em><\/div>\n<\/div>\n<\/figure>\n<p>Every move is a rewrite.<\/p>\n<hr />\n<h2 class=\"c5\" id=\"5-now-imagine-50-files\">4. Now Imagine 50 Files<\/h2>\n<p>Your app does not call the model once. It calls it in many places.<\/p>\n<figure class=\"visual\"><div class=\"g50\"><div class=\"g50-s\"><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><span><\/span><\/div><div class=\"g50-t\"><b>50<\/b> functions that call the model. <em>Every one must change.<\/em><\/div><\/div>\n<\/figure>\n<p>Each one needs a new package, a new call and a new way to read the answer. Tests break. Small bugs appear in places you forgot about. And this happens every time you switch.<\/p>\n<hr />\n<h2 class=\"c1\" id=\"6-what-we-need\">5. What We Need<\/h2>\n<p>We do not want to rewrite our code for every company. We want <strong>one way to call any model<\/strong>, where switching means changing only the name.<\/p>\n<figure class=\"visual\"><div class=\"wish\">\n  <div class=\"wish-code\">\n    <span class=\"wc-t\">what we wish for<\/span>\n    <code><i class=\"wk\">model<\/i> = <i class=\"wq\">???<\/i>(<i class=\"ws\">\"gemini\"<\/i>)   <i class=\"wc\"># or \"groq\", or \"mistral\"<\/i><\/code>\n    <code><i class=\"wk\">response<\/i> = model.invoke(<i class=\"ws\">\"What is the capital of India?\"<\/i>)<\/code>\n    <code>print(response.content)<\/code>\n  <\/div>\n  <div class=\"wish-side\"><div><b>Same lines<\/b> for every company.<br>Only the name changes.<\/div><\/div>\n<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c2\" id=\"7-then-someone-built-this\">6. Then Someone Built This<\/h2>\n<figure class=\"visual\"><div class=\"reveal\">\n  <div class=\"rv-chips\"><span class=\"g\">Gemini<\/span><span class=\"q\">Groq<\/span><span class=\"m\">Mistral<\/span><span class=\"o\">OpenAI<\/span><span class=\"c\">Claude<\/span><\/div>\n  <div class=\"rv-funnel\"><i><\/i><i><\/i><i><\/i><i><\/i><i><\/i><\/div>\n  <div class=\"rv-drum\">introducing<\/div>\n  <div class=\"rv-big\"><span class=\"rv-a\">Lang<\/span><span class=\"rv-link\"><i><\/i><i><\/i><\/span><span class=\"rv-b\">Chain<\/span><\/div>\n  <div class=\"rv-tag\">One way to call <b>any<\/b> model.<\/div>\n<\/div>\n<\/figure>\n<p>That is <strong>LangChain<\/strong>. Next: what it is and how it works.<\/p>\n", "toc": [{"id": "2-day-1-your-app-works", "name": "2. Day 1: Your App Works"}, {"id": "3-day-30-switch-to-groq", "name": "3. Day 30: \"Switch to Groq\""}, {"id": "4-day-60-now-try-mistral", "name": "4. Day 60: \"Now Try Mistral\""}, {"id": "5-now-imagine-50-files", "name": "5. Now Imagine 50 Files"}, {"id": "6-what-we-need", "name": "6. What We Need"}, {"id": "7-then-someone-built-this", "name": "7. Then Someone Built This"}], "search": "", "slides": null, "slideCount": 0, "code": []}};</script>
