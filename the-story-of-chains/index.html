<script>window.PAGE = {"id": "n12_1", "root": "../", "lesson": {"id": "n12_1", "title": "The Story of Chains", "short": "The Story of Chains", "unit": "Unit 2", "unitName": "Build with LangChain", "pos": 11, "of": 15, "sub": "Chains", "info": "Old chains, the 3 repeated steps, deprecation", "html": "<h2 class=\"c1\" id=\"1-the-same-3-steps-every-time\">1. The Same 3 Steps Every Time<\/h2>\n<p>Every app we built repeats the same three steps by hand.<\/p>\n<figure class=\"visual\"><div class=\"cflw\">\n  <div class=\"cfl-c\"><div class=\"cfl-l\">Step 1: prompt<\/div><code>template.invoke({...})<\/code><\/div>\n  <div class=\"cfl-a\">&rarr;<\/div>\n  <div class=\"cfl-c\"><div class=\"cfl-l\">Step 2: model<\/div><code>model.invoke(prompt)<\/code><\/div>\n  <div class=\"cfl-a\">&rarr;<\/div>\n  <div class=\"cfl-c\"><div class=\"cfl-l\">Step 3: parser<\/div><code>parser.invoke(res)<\/code><\/div>\n<\/div>\n<div class=\"cflw-n\">Three calls, every time. The output of one is the input of the next.<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c2\" id=\"2-the-first-answer-chains\">2. The First Answer: Chains<\/h2>\n<p>LangChain's first answer (2022) was to join these steps into one object called a <strong>chain<\/strong>. <code>LLMChain<\/code> joins a prompt and a model. <code>SimpleSequentialChain<\/code> joins chain 1 into chain 2.<\/p>\n<figure class=\"visual\"><div class=\"hl\" data-x=\"1\"><pre><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_classic.chains<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">LLMChain<\/span><span class=\"p\">,<\/span> <span class=\"n\">SimpleSequentialChain<\/span>\n\n<span class=\"n\">chain1<\/span> <span class=\"o\">=<\/span> <span class=\"n\">LLMChain<\/span><span class=\"p\">(<\/span><span class=\"n\">llm<\/span><span class=\"o\">=<\/span><span class=\"n\">model<\/span><span class=\"p\">,<\/span> <span class=\"n\">prompt<\/span><span class=\"o\">=<\/span><span class=\"n\">prompt1<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">chain2<\/span> <span class=\"o\">=<\/span> <span class=\"n\">LLMChain<\/span><span class=\"p\">(<\/span><span class=\"n\">llm<\/span><span class=\"o\">=<\/span><span class=\"n\">model<\/span><span class=\"p\">,<\/span> <span class=\"n\">prompt<\/span><span class=\"o\">=<\/span><span class=\"n\">prompt2<\/span><span class=\"p\">)<\/span>\n\n<span class=\"n\">overall_legacy_chain<\/span> <span class=\"o\">=<\/span> <span class=\"n\">SimpleSequentialChain<\/span><span class=\"p\">(<\/span>\n    <span class=\"n\">chains<\/span><span class=\"o\">=<\/span><span class=\"p\">[<\/span><span class=\"n\">chain1<\/span><span class=\"p\">,<\/span> <span class=\"n\">chain2<\/span><span class=\"p\">]<\/span>\n<span class=\"p\">)<\/span>\n\n<span class=\"n\">final_slogan<\/span> <span class=\"o\">=<\/span> <span class=\"n\">overall_legacy_chain<\/span><span class=\"o\">.<\/span><span class=\"n\">run<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Electric Skateboard\"<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">final_slogan<\/span><span class=\"p\">)<\/span><\/pre><\/div>\n<div class=\"px\">\n  <div class=\"px-r\"><span>The result<\/span><div><div class=\"aib\"><b>\"Charge into the future—VoltRush powers your world!\"<\/b> 🚀⚡<\/div><\/div><\/div>\n  <div class=\"px-r hi\"><span>LangChain warns<\/span><div>LangChainDeprecationWarning: The method `Chain.run` was deprecated in langchain-classic 0.1.0 and will be removed in 2.0.0. Use `invoke` instead.<\/div><\/div>\n<\/div><\/figure>\n<hr />\n<h2 class=\"c3\" id=\"3-whats-the-issue-then\">3. What's the Issue, Then?<\/h2>\n<p>Old chains worked, but they had real problems.<\/p>\n<figure class=\"visual\"><div class=\"bnt\">\n  <div class=\"bnt-t big c1\"><div class=\"bnt-h\">Issue 1<\/div><div class=\"bnt-b\">40+ chain classes<\/div>\n    <div class=\"bnt-p\">A new class for almost every job. You had to know all the names:<\/div>\n    <div class=\"bnt-g\"><div class=\"bnt-n\"><code>LLMChain<\/code><span>one prompt + one model<\/span><\/div><div class=\"bnt-n\"><code>SimpleSequentialChain<\/code><span>the output of chain 1 goes into chain 2<\/span><\/div><div class=\"bnt-n\"><code>SequentialChain<\/code><span>many chains, with named inputs and outputs<\/span><\/div><div class=\"bnt-n\"><code>ConversationChain<\/code><span>a chat that remembers<\/span><\/div><div class=\"bnt-n\"><code>ConversationalRetrievalChain<\/code><span>a chat over your documents<\/span><\/div><div class=\"bnt-n\"><code>RetrievalQAWithSourcesChain<\/code><span>answers from documents, with sources<\/span><\/div><div class=\"bnt-n\"><code>StuffDocumentsChain<\/code><span>put all documents into one prompt<\/span><\/div><div class=\"bnt-n\"><code>MapReduceDocumentsChain<\/code><span>summarise each document, then combine<\/span><\/div><div class=\"bnt-n\"><code>RefineDocumentsChain<\/code><span>improve the answer document by document<\/span><\/div><div class=\"bnt-n\"><code>LLMMathChain<\/code><span>solve a maths question with the model<\/span><\/div><div class=\"bnt-n\"><code>MultiPromptChain<\/code><span>pick the right prompt for the question<\/span><\/div><div class=\"bnt-n\"><code>TransformChain<\/code><span>run a plain Python function as a step<\/span><\/div><div class=\"bnt-n\"><code>ConstitutionalChain<\/code><span>check an answer against rules<\/span><\/div><div class=\"bnt-n\"><code>OpenAIModerationChain<\/code><span>flag unsafe text<\/span><\/div><\/div>\n    <div class=\"bnt-p\">&hellip;and 25+ more.<\/div><\/div>\n  <div class=\"bnt-t c2\"><div class=\"bnt-h\">Issue 2<\/div><div class=\"bnt-b\">A black box<\/div>\n    <div class=\"bnt-p\">You could not put your own step inside a chain. For example: clean the company name before chain 2 uses it.<\/div><\/div>\n  <div class=\"bnt-t c3\"><div class=\"bnt-h\">Issue 3<\/div><div class=\"bnt-b\">Different methods<\/div>\n    <div class=\"bnt-p\">One job, three names:<\/div>\n    <div class=\"bnt-m\"><code>chain.run(&hellip;)<\/code><code>chain.predict(&hellip;)<\/code><code>chain.apply(&hellip;)<\/code><\/div><\/div>\n  <div class=\"bnt-t c4\"><div class=\"bnt-h\">Issue 4<\/div><div class=\"bnt-b\">Hard to stream<\/div>\n    <div class=\"bnt-p\">Some chains could not stream the answer, or run many inputs at once.<\/div><\/div>\n  <div class=\"bnt-t wide neutral\"><div class=\"bnt-h\">What happened next<\/div><div class=\"bnt-b\">Deprecated<\/div>\n    <div class=\"bnt-p\">2024: old chains deprecated. Oct 2025: LangChain 1.0 moved them to <code>langchain-classic<\/code>. You only need them to read old code.<\/div><\/div>\n<\/div>\n<\/figure>\n<div class=\"sc-head code-head\">Code<\/div><details class=\"codecard\"><summary><span class=\"cc-t\">01_legacy_chains.py<\/span><span class=\"cc-f\">01_legacy_chains.py · 29 lines<\/span><span class=\"cc-show\">Show code<\/span><\/summary><div class=\"hl\"><table class=\"hltable\"><tr><td class=\"linenos\"><div class=\"linenodiv\"><pre><span class=\"normal\"> 1<\/span>\n<span class=\"normal\"> 2<\/span>\n<span class=\"normal\"> 3<\/span>\n<span class=\"normal\"> 4<\/span>\n<span class=\"normal\"> 5<\/span>\n<span class=\"normal\"> 6<\/span>\n<span class=\"normal\"> 7<\/span>\n<span class=\"normal\"> 8<\/span>\n<span class=\"normal\"> 9<\/span>\n<span class=\"normal\">10<\/span>\n<span class=\"normal\">11<\/span>\n<span class=\"normal\">12<\/span>\n<span class=\"normal\">13<\/span>\n<span class=\"normal\">14<\/span>\n<span class=\"normal\">15<\/span>\n<span class=\"normal\">16<\/span>\n<span class=\"normal\">17<\/span>\n<span class=\"normal\">18<\/span>\n<span class=\"normal\">19<\/span>\n<span class=\"normal\">20<\/span>\n<span class=\"normal\">21<\/span>\n<span class=\"normal\">22<\/span>\n<span class=\"normal\">23<\/span>\n<span class=\"normal\">24<\/span>\n<span class=\"normal\">25<\/span>\n<span class=\"normal\">26<\/span>\n<span class=\"normal\">27<\/span>\n<span class=\"normal\">28<\/span>\n<span class=\"normal\">29<\/span><\/pre><\/div><\/td><td class=\"code\"><div><pre><span><\/span><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">dotenv<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">load_dotenv<\/span>\n\n<span class=\"n\">load_dotenv<\/span><span class=\"p\">()<\/span>\n\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_classic.chains<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">LLMChain<\/span><span class=\"p\">,<\/span> <span class=\"n\">SimpleSequentialChain<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_core.prompts<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">ChatPromptTemplate<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain.chat_models<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">init_chat_model<\/span>\n\n<span class=\"n\">model<\/span> <span class=\"o\">=<\/span> <span class=\"n\">init_chat_model<\/span><span class=\"p\">(<\/span><span class=\"n\">model<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"mistralai:open-mistral-nemo\"<\/span><span class=\"p\">)<\/span>\n\n<span class=\"sd\">\"\"\"Old way (2023): LLMChain = prompt + model in one ready-made class\"\"\"<\/span>\n<span class=\"n\">prompt1<\/span> <span class=\"o\">=<\/span> <span class=\"n\">ChatPromptTemplate<\/span><span class=\"o\">.<\/span><span class=\"n\">from_template<\/span><span class=\"p\">(<\/span>\n    <span class=\"s2\">\"What is a catchy company name for a business that makes <\/span><span class=\"si\">{product}<\/span><span class=\"s2\">? Give ONLY the name in 2-3 words.\"<\/span>\n<span class=\"p\">)<\/span>\n<span class=\"n\">chain1<\/span> <span class=\"o\">=<\/span> <span class=\"n\">LLMChain<\/span><span class=\"p\">(<\/span><span class=\"n\">llm<\/span><span class=\"o\">=<\/span><span class=\"n\">model<\/span><span class=\"p\">,<\/span> <span class=\"n\">prompt<\/span><span class=\"o\">=<\/span><span class=\"n\">prompt1<\/span><span class=\"p\">)<\/span>\n\n\n<span class=\"n\">prompt2<\/span> <span class=\"o\">=<\/span> <span class=\"n\">ChatPromptTemplate<\/span><span class=\"o\">.<\/span><span class=\"n\">from_template<\/span><span class=\"p\">(<\/span>\n    <span class=\"s2\">\"Write a punchy 1-line advertising slogan for a company named <\/span><span class=\"si\">{company_name}<\/span><span class=\"s2\">.\"<\/span>\n<span class=\"p\">)<\/span>\n<span class=\"n\">chain2<\/span> <span class=\"o\">=<\/span> <span class=\"n\">LLMChain<\/span><span class=\"p\">(<\/span><span class=\"n\">llm<\/span><span class=\"o\">=<\/span><span class=\"n\">model<\/span><span class=\"p\">,<\/span> <span class=\"n\">prompt<\/span><span class=\"o\">=<\/span><span class=\"n\">prompt2<\/span><span class=\"p\">)<\/span>\n\n<span class=\"sd\">\"\"\"SimpleSequentialChain: output of chain1 goes into chain2, called with .run()\"\"\"<\/span>\n<span class=\"n\">overall_legacy_chain<\/span> <span class=\"o\">=<\/span> <span class=\"n\">SimpleSequentialChain<\/span><span class=\"p\">(<\/span>\n    <span class=\"n\">chains<\/span><span class=\"o\">=<\/span><span class=\"p\">[<\/span><span class=\"n\">chain1<\/span><span class=\"p\">,<\/span> <span class=\"n\">chain2<\/span><span class=\"p\">]<\/span>\n<span class=\"p\">)<\/span>\n\n<span class=\"n\">final_slogan<\/span> <span class=\"o\">=<\/span> <span class=\"n\">overall_legacy_chain<\/span><span class=\"o\">.<\/span><span class=\"n\">run<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Electric Skateboard\"<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">final_slogan<\/span><span class=\"p\">)<\/span>\n<\/pre><\/div><\/td><\/tr><\/table><\/div>\n<\/details>", "toc": [{"id": "1-the-same-3-steps-every-time", "name": "1. The Same 3 Steps Every Time"}, {"id": "2-the-first-answer-chains", "name": "2. The First Answer: Chains"}, {"id": "3-whats-the-issue-then", "name": "3. What's the Issue, Then?"}], "search": "", "slides": null, "slideCount": 0, "code": []}};</script>
