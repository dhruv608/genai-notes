<script>window.PAGE = {"id": "n32", "root": "../", "lesson": {"id": "n32", "title": "Conditional RAG", "short": "Conditional RAG", "unit": "Unit 4", "unitName": "Agents with LangGraph", "pos": 16, "of": 16, "sub": "Smart routing", "info": "Adaptive routing between RAG paths", "html": "<h2 class=\"c1\" id=\"1-architectural-purpose-mental-model\">1. Architectural Purpose &amp; Mental Model<\/h2>\n<p>In enterprise knowledge systems, dumping all company documents into a single monolithic vector store leads to <strong>retrieval pollution<\/strong> (e.g., searching for \"late fees\" retrieving internal academic probation policies instead of billing policies).\nFurthermore, simple conversational greetings (e.g., <em>\"Hello, how are you?\"<\/em>) should not trigger expensive vector similarity searches across millions of documents.<\/p>\n<h3 id=\"the-solution-adaptive-rag\">The Solution: Adaptive RAG<\/h3>\n<p>An <strong>Adaptive RAG Router<\/strong> uses a fast, lightweight LLM classifier to determine user intent, dynamically routing the query:<\/p>\n<ol>\n<li><strong>Academic Inquiries<\/strong>: Routed to an isolated Academic Regulations vector store.<\/li>\n<li><strong>Fee &amp; Financial Inquiries<\/strong>: Routed to an isolated Billing &amp; Tuition vector store.<\/li>\n<li><strong>General Chit-Chat<\/strong>: Bypasses vector retrieval completely, generating a direct response and saving API latency and compute costs.<\/li>\n<\/ol>\n<hr />\n<h2 class=\"c2\" id=\"2-architecture-diagram\">2. Architecture Diagram<\/h2>\n<figure class=\"diagram\"><pre class=\"mermaid\">flowchart LR\n  START([&quot;START&quot;]) --&gt; Q{&quot;Query classifier&quot;}\n  Q -- &quot;academic&quot; --&gt; A[&quot;Academic RAG node&lt;br/&gt;&lt;small&gt;academics_handbook.pdf&lt;/small&gt;&quot;]\n  Q -- &quot;fee&quot; --&gt; F[&quot;Fee RAG node&lt;br/&gt;&lt;small&gt;fee_structure.pdf&lt;/small&gt;&quot;]\n  Q -- &quot;general&quot; --&gt; G[&quot;General chat node&lt;br/&gt;&lt;small&gt;direct LLM, no vector search&lt;/small&gt;&quot;]\n  A --&gt; END([&quot;END&quot;])\n  F --&gt; END\n  G --&gt; END\nclassDef term fill:#0e3b3a,stroke:#0e3b3a,color:#ffffff,font-weight:bold\nclassDef gate fill:#fdf1ec,stroke:#c9583a,color:#7a2e1a\nclassDef store fill:#f5f5f4,stroke:#57534e,color:#292524\nclassDef c0 fill:#d4ecea,stroke:#2a7a79,color:#0e3b3a\nclassDef c1 fill:#fbe5dc,stroke:#c9583a,color:#7a2e1a\nclassDef c2 fill:#e3f5ee,stroke:#4aa58a,color:#14463a\nclassDef c3 fill:#f6f4f0,stroke:#a7a29a,color:#3f3b35\nclassDef c4 fill:#eef7f7,stroke:#1a5c5b,color:#0e3b3a\nclass START term\nclass Q gate\nclass A c0\nclass F c1\nclass G c2\nclass END term<\/pre><div class=\"dg-ascii\" hidden><div class=\"hl\"><pre><span><\/span><code>+-----------------------------------------------------------------------------------------+\n| ADAPTIVE CONDITIONAL RAG ROUTER                                                         |\n+-----------------------------------------------------------------------------------------+\n|                                                                                         |\n|                                ┌───&gt; [Academic RAG Node] (academics_handbook.pdf) ──┐   |\n|                                │                                                    │   |\n| [START] ──&gt; [Query Classifier] ┼───&gt; [Fee RAG Node]      (fee_structure.pdf)     ───┼──&gt;|\n|                                │                                                    │[END]\n|                                └───&gt; [General Chat Node] (Direct LLM, Zero Vector) ─┘   |\n|                                                                                         |\n+-----------------------------------------------------------------------------------------+\n<\/code><\/pre><\/div><\/div><\/figure>\n\n<hr />\n<h2 class=\"c3\" id=\"3-node-responsibilities-prompts\">3. Node Responsibilities &amp; Prompts<\/h2>\n<ul>\n<li>\n<p><strong>Classifier Prompt<\/strong>:<br />\n  Forces the model to return strictly one of three discrete tokens: <code>'academic'<\/code>, <code>'fee'<\/code>, or <code>'general'<\/code>.<\/p>\n<\/li>\n<li>\n<p><strong>Domain Retrievers<\/strong>:<br />\n  Two completely independent FAISS vector indexes loaded from separate PDF files:<\/p>\n<\/li>\n<li>\n<p><code>data/academics_handbook.pdf<\/code><\/p>\n<\/li>\n<li><code>data/fee_structure.pdf<\/code><\/li>\n<li><strong>Program-Aware Generator Prompt<\/strong>:<br />\n  Personalizes the extracted answer to the student's enrolled programme (e.g., B.Tech vs MBA).<\/li>\n<\/ul>\n<hr />\n<h2 class=\"c4\" id=\"4-production-python-implementation-conditional_ragpy\">4. Production Python Implementation (<code>conditional_RAG.py<\/code>)<\/h2>\n<details class=\"codecard\"><summary><span class=\"cc-t\">Code · 143 lines<\/span><span class=\"cc-f\">01_conditional_rag.py<\/span><span class=\"cc-show\">Show here<\/span><\/summary><div class=\"hl\"><pre><span><\/span><code><span class=\"kn\">import<\/span><span class=\"w\"> <\/span><span class=\"nn\">os<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">dotenv<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">load_dotenv<\/span>\n<span class=\"n\">load_dotenv<\/span><span class=\"p\">()<\/span>\n\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">typing<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">TypedDict<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain.chat_models<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">init_chat_model<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_core.prompts<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">ChatPromptTemplate<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_core.output_parsers<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">StrOutputParser<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_mistralai<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">MistralAIEmbeddings<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_community.document_loaders<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">PyPDFLoader<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_text_splitters<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">RecursiveCharacterTextSplitter<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_community.vectorstores<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">FAISS<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langgraph.graph<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">START<\/span><span class=\"p\">,<\/span> <span class=\"n\">END<\/span><span class=\"p\">,<\/span> <span class=\"n\">StateGraph<\/span>\n\n<span class=\"c1\"># 1. State Schema<\/span>\n<span class=\"k\">class<\/span><span class=\"w\"> <\/span><span class=\"nc\">CollegeBotState<\/span><span class=\"p\">(<\/span><span class=\"n\">TypedDict<\/span><span class=\"p\">):<\/span>\n    <span class=\"n\">query<\/span><span class=\"p\">:<\/span> <span class=\"nb\">str<\/span>\n    <span class=\"n\">programme<\/span><span class=\"p\">:<\/span> <span class=\"nb\">str<\/span>\n    <span class=\"n\">category<\/span><span class=\"p\">:<\/span> <span class=\"nb\">str<\/span>\n    <span class=\"n\">context<\/span><span class=\"p\">:<\/span> <span class=\"nb\">str<\/span>\n    <span class=\"n\">response<\/span><span class=\"p\">:<\/span> <span class=\"nb\">str<\/span>\n\n<span class=\"c1\"># 2. Model &amp; Embedding Setup<\/span>\n<span class=\"n\">model<\/span> <span class=\"o\">=<\/span> <span class=\"n\">init_chat_model<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"mistralai:mistral-small-2603\"<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">embeddings<\/span> <span class=\"o\">=<\/span> <span class=\"n\">MistralAIEmbeddings<\/span><span class=\"p\">(<\/span><span class=\"n\">model<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"mistral-embed\"<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">parser<\/span> <span class=\"o\">=<\/span> <span class=\"n\">StrOutputParser<\/span><span class=\"p\">()<\/span>\n\n<span class=\"c1\"># 3. Helper: Build Independent Domain Vector Retrievers<\/span>\n<span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">build_retriever<\/span><span class=\"p\">(<\/span><span class=\"n\">pdf_path<\/span><span class=\"p\">:<\/span> <span class=\"nb\">str<\/span><span class=\"p\">):<\/span>\n    <span class=\"n\">loader<\/span> <span class=\"o\">=<\/span> <span class=\"n\">PyPDFLoader<\/span><span class=\"p\">(<\/span><span class=\"n\">pdf_path<\/span><span class=\"p\">)<\/span>\n    <span class=\"n\">docs<\/span> <span class=\"o\">=<\/span> <span class=\"n\">loader<\/span><span class=\"o\">.<\/span><span class=\"n\">load<\/span><span class=\"p\">()<\/span>\n    <span class=\"n\">splitter<\/span> <span class=\"o\">=<\/span> <span class=\"n\">RecursiveCharacterTextSplitter<\/span><span class=\"p\">(<\/span><span class=\"n\">chunk_size<\/span><span class=\"o\">=<\/span><span class=\"mi\">500<\/span><span class=\"p\">,<\/span> <span class=\"n\">chunk_overlap<\/span><span class=\"o\">=<\/span><span class=\"mi\">50<\/span><span class=\"p\">)<\/span>\n    <span class=\"n\">chunks<\/span> <span class=\"o\">=<\/span> <span class=\"n\">splitter<\/span><span class=\"o\">.<\/span><span class=\"n\">split_documents<\/span><span class=\"p\">(<\/span><span class=\"n\">docs<\/span><span class=\"p\">)<\/span>\n    <span class=\"n\">vector_store<\/span> <span class=\"o\">=<\/span> <span class=\"n\">FAISS<\/span><span class=\"o\">.<\/span><span class=\"n\">from_documents<\/span><span class=\"p\">(<\/span><span class=\"n\">chunks<\/span><span class=\"p\">,<\/span> <span class=\"n\">embedding<\/span><span class=\"o\">=<\/span><span class=\"n\">embeddings<\/span><span class=\"p\">)<\/span>\n    <span class=\"k\">return<\/span> <span class=\"n\">vector_store<\/span><span class=\"o\">.<\/span><span class=\"n\">as_retriever<\/span><span class=\"p\">(<\/span><span class=\"n\">search_kwargs<\/span><span class=\"o\">=<\/span><span class=\"p\">{<\/span><span class=\"s2\">\"k\"<\/span><span class=\"p\">:<\/span> <span class=\"mi\">3<\/span><span class=\"p\">})<\/span>\n\n<span class=\"c1\"># Ingest isolated knowledge bases<\/span>\n<span class=\"n\">academic_retriever<\/span> <span class=\"o\">=<\/span> <span class=\"n\">build_retriever<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"data/academics_handbook.pdf\"<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">fee_retriever<\/span> <span class=\"o\">=<\/span> <span class=\"n\">build_retriever<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"data/fee_structure.pdf\"<\/span><span class=\"p\">)<\/span>\n\n<span class=\"c1\"># 4. Prompts<\/span>\n<span class=\"n\">classifier_prompt<\/span> <span class=\"o\">=<\/span> <span class=\"n\">ChatPromptTemplate<\/span><span class=\"o\">.<\/span><span class=\"n\">from_messages<\/span><span class=\"p\">([<\/span>\n    <span class=\"p\">(<\/span><span class=\"s2\">\"system\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"\"\"You are a smart college front-desk classifier. <\/span>\n<span class=\"s2\">Classify the following query into EXACTLY ONE of these categories:<\/span>\n<span class=\"s2\">- 'academic': for attendance, exams, grading, credits, course structure, degree requirements.<\/span>\n<span class=\"s2\">- 'fee': for tuition, payment, refund, late charges, scholarships.<\/span>\n<span class=\"s2\">- 'general': for greetings, casual chit-chat, or general questions.<\/span>\n<span class=\"s2\">Return ONLY the single word in lowercase: 'academic', 'fee', or 'general'.\"\"\"<\/span><span class=\"p\">),<\/span>\n    <span class=\"p\">(<\/span><span class=\"s2\">\"human\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"Query:<\/span><span class=\"se\">\\n<\/span><span class=\"si\">{query}<\/span><span class=\"s2\">\"<\/span><span class=\"p\">)<\/span>\n<span class=\"p\">])<\/span>\n\n<span class=\"n\">rag_response_prompt<\/span> <span class=\"o\">=<\/span> <span class=\"n\">ChatPromptTemplate<\/span><span class=\"o\">.<\/span><span class=\"n\">from_messages<\/span><span class=\"p\">([<\/span>\n    <span class=\"p\">(<\/span><span class=\"s2\">\"system\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"\"\"You are a helpful college assistant assisting a <\/span><span class=\"si\">{programme}<\/span><span class=\"s2\"> student.<\/span>\n<span class=\"s2\">Use the provided official context from college documents to answer accurately.<\/span>\n<span class=\"s2\">Highlight rules specific to <\/span><span class=\"si\">{programme}<\/span><span class=\"s2\">. If not found in context, state so politely.<\/span>\n<span class=\"s2\">Official Context:<\/span>\n<span class=\"si\">{context}<\/span><span class=\"s2\">\"\"\"<\/span><span class=\"p\">),<\/span>\n    <span class=\"p\">(<\/span><span class=\"s2\">\"human\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"<\/span><span class=\"si\">{query}<\/span><span class=\"s2\">\"<\/span><span class=\"p\">)<\/span>\n<span class=\"p\">])<\/span>\n\n<span class=\"n\">general_response_prompt<\/span> <span class=\"o\">=<\/span> <span class=\"n\">ChatPromptTemplate<\/span><span class=\"o\">.<\/span><span class=\"n\">from_messages<\/span><span class=\"p\">([<\/span>\n    <span
