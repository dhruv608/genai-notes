<script>window.PAGE = {"id": "n13", "root": "../", "lesson": {"id": "n13", "title": "Common Runnables", "short": "Common Runnables", "unit": "Unit 2", "unitName": "Build with LangChain", "pos": 12, "of": 14, "sub": "", "info": "The common runnables: RunnableSequence, RunnableLambda, RunnableParallel and RunnablePassthrough (and a pointer to more)", "html": "<h2 class=\"c1\" id=\"1-common-types-of-runnables\">1. Common Types of Runnables<\/h2>\n<p>LangChain has many kinds of runnables. These are the ones you will use most, and we have already used the first one.<\/p>\n<figure class=\"visual\"><div class=\"bnt rt4\">\n  <div class=\"bnt-t c3\"><div class=\"bnt-h\">One after another<\/div><div class=\"bnt-b\">RunnableSequence<\/div><div class=\"bnt-p\">Steps that run in order. You make it with <code>|<\/code>.<\/div><\/div>\n  <div class=\"bnt-t c1\"><div class=\"bnt-h\">Your own code<\/div><div class=\"bnt-b\">RunnableLambda<\/div><div class=\"bnt-p\">A Python function as a step. <code>@chain<\/code> makes one too.<\/div><\/div>\n  <div class=\"bnt-t c4\"><div class=\"bnt-h\">At the same time<\/div><div class=\"bnt-b\">RunnableParallel<\/div><div class=\"bnt-p\">The same input to many branches at once. The result is a dict.<\/div><\/div>\n  <div class=\"bnt-t neutral\"><div class=\"bnt-h\">Keep the input<\/div><div class=\"bnt-b\">RunnablePassthrough<\/div><div class=\"bnt-p\">Gives the input back unchanged.<\/div><\/div>\n  <div class=\"bnt-t wide-all neutral\"><div class=\"bnt-h\">And more<\/div><div class=\"bnt-b\">There are more runnables than these<\/div>\n    <div class=\"bnt-p\">For example <code>RunnableBranch<\/code> (if / else routing), <code>RunnableWithFallbacks<\/code> (a backup model), <code>RunnableWithMessageHistory<\/code> (chat memory) and <code>RunnableAssign<\/code> (add keys to a dict). We start with the four above. You can explore the rest in the docs.<\/div><\/div>\n<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c2\" id=\"2-runnablesequence-you-already-use-it\">2. RunnableSequence: You Already Use It<\/h2>\n<p>Steps that run one after another. Every time you write <code>|<\/code>, LangChain builds a <code>RunnableSequence<\/code> for you.<\/p>\n<figure class=\"visual\"><div class=\"seq\">\n  <div class=\"seq-box\"><div class=\"seq-l\">RunnableSequence<\/div>\n    <div class=\"pipe5\"><div class=\"p5-s\">prompt<\/div><div class=\"p5-a\">|<\/div><div class=\"p5-s\">model<\/div><div class=\"p5-a\">|<\/div><div class=\"p5-s\">parser<\/div><\/div><\/div>\n  <div class=\"p5-n\">The output of each step becomes the input of the next. A chain of chains, like <code>{'company_name': chain1} | chain2<\/code>, is a RunnableSequence too.<\/div>\n<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c3\" id=\"3-runnablelambda-your-own-function-as-a-step\">3. RunnableLambda: Your Own Function as a Step<\/h2>\n<p>Sometimes you need a step the model cannot do: make the text uppercase, count the words. Write it as a plain Python function and put it in the pipe, like any other step.<\/p>\n<figure class=\"visual\"><div class=\"pipe5\">\n  <div class=\"p5-s\">prompt<\/div><div class=\"p5-a\">|<\/div><div class=\"p5-s\">model<\/div><div class=\"p5-a\">|<\/div><div class=\"p5-s\">parser<\/div><div class=\"p5-a\">|<\/div><div class=\"p5-s mine\">make_uppercase<\/div><div class=\"p5-a\">|<\/div><div class=\"p5-s mine\">word_counter<\/div>\n<\/div>\n<div class=\"p5-n\">The two teal steps are your own Python functions.<\/div>\n<div class=\"hl\" data-x=\"1\"><pre><span class=\"n\">complete_chain<\/span> <span class=\"o\">=<\/span> <span class=\"n\">prompt<\/span> <span class=\"o\">|<\/span> <span class=\"n\">model<\/span> <span class=\"o\">|<\/span> <span class=\"n\">parser<\/span> <span class=\"o\">|<\/span> <span class=\"n\">make_uppercase<\/span> <span class=\"o\">|<\/span> <span class=\"n\">word_counter_runnable<\/span><\/pre><\/div>\n<div class=\"px\">\n  <div class=\"px-r hi\"><span>You get<\/span><div><div class=\"aib\">1. <b>REDUCES STRESS AND ANXIETY<\/b> BY CALMING THE MIND AND LOWERING CORTISOL LEVELS.<br>2. <b>BOOSTS FOCUS AND CLARITY<\/b> BY IMPROVING CONCENTRATION AND MENTAL SHARPNESS.<br>3. <b>ENHANCES EMOTIONAL WELL-BEING<\/b> BY PROMOTING SELF-AWARENESS AND RESILIENCE.<br>[Total Words : 33 ]<\/div><\/div><\/div>\n<\/div><\/figure>\n<hr />\n<h2 class=\"c4\" id=\"4-two-ways-to-write-it\">4. Two Ways to Write It<\/h2>\n<p>Put <code>@chain<\/code> above the function, or wrap the function with <code>RunnableLambda<\/code>. Both give you a <code>RunnableLambda<\/code>. Pick a tab.<\/p>\n<figure class=\"visual\"><div class=\"dw\"><div class=\"dw-c t\">\n  <input type=\"radio\" name=\"dwc\" id=\"cs1\" checked><label for=\"cs1\">@chain<\/label>\n  <input type=\"radio\" name=\"dwc\" id=\"cs2\"><label for=\"cs2\">RunnableLambda<\/label>\n  <div class=\"hl\" data-x=\"1\"><pre><span class=\"vcs1\"><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_core.runnables<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">chain<\/span>\n\n<span class=\"nd\">@chain<\/span>\n<span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">make_uppercase<\/span><span class=\"p\">(<\/span><span class=\"n\">text<\/span> <span class=\"p\">:<\/span> <span class=\"nb\">str<\/span> <span class=\"p\">)<\/span> <span class=\"o\">-&gt;<\/span> <span class=\"nb\">str<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">    <\/span><span class=\"sd\">\"\"\" A custom Python Function that turns AI Output into UpperCase\"\"\"<\/span>\n    <span class=\"k\">return<\/span> <span class=\"n\">text<\/span><span class=\"o\">.<\/span><span class=\"n\">upper<\/span><span class=\"p\">()<\/span><\/span><span class=\"vcs2\"><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_core.runnables<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">RunnableLambda<\/span>\n\n<span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">count_words<\/span><span class=\"p\">(<\/span><span class=\"n\">text<\/span> <span class=\"p\">:<\/span><span class=\"nb\">str<\/span><span class=\"p\">)<\/span> <span class=\"o\">-&gt;<\/span> <span class=\"nb\">str<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">    <\/span><span class=\"sd\">\"\"\" A Custom Python Function that counts words\"\"\"<\/span>\n    <span class=\"n\">words<\/span> <span class=\"o\">=<\/span> <span class=\"nb\">len<\/span><span class=\"p\">(<\/span><span class=\"n\">text<\/span><span class=\"o\">.<\/span><span class=\"n\">split<\/span><span class=\"p\">())<\/span>\n    <span class=\"k\">return<\/span> <span class=\"sa\">f<\/span><span class=\"s2\">\"<\/span><span class=\"si\">{<\/span><span class=\"n\">text<\/span><span class=\"si\">}<\/span><span class=\"se\">\\n<\/span><span class=\"s2\">[Total Words : <\/span><span class=\"si\">{<\/span><span class=\"n\">words<\/span><span class=\"si\">}<\/span><span class=\"s2\"> ]\"<\/span>\n\n<span class=\"n\">word_counter_runnable<\/span> <span class=\"o\">=<\/span> <span class=\"n\">RunnableLambda<\/span><span class=\"p\">(<\/span><span class=\"n\">count_words<\/span><span class=\"p\">)<\/span><\/span><\/pre><\/div>\n  <div class=\"dw-cap\"><span class=\"vcs1\">Add @chain above the function. The function itself becomes a runnable.<\/span><span class=\"vcs2\">Keep the function as it is and wrap it with RunnableLambda.<\/span><\/div>\n<\/div><\/div>\n<\/figure>\n<hr />\n<h2 class=\"c5\" id=\"5-runnableparallel-and-runnablepassthrough\">5. RunnableParallel and RunnablePassthrough<\/h2>\n<p><code>RunnableParallel<\/code> gives the same input to many branches at once and returns a dict. <code>RunnablePassthrough<\/code> hands the input back unchanged.<\/p>\n<figure class=\"visual\"><div class=\"fan\">\n  <div class=\"fan-in\"><div class=\"stp-l\">One input<\/div><code>{\"topic\": \"cloud computing\"}<\/code><\/div>\n  <div class=\"fan-a\">&rarr;<\/div>\n  <div class=\"fan-br\">\n    <div class=\"fan-b\"><b>simple_chain<\/b><span>explain to a 5-year-old<\/span><\/div>\n    <div class=\"fan-b\"><b>expert_chain<\/b><span>explain to a senior engineer<\/span><\/div>\n    <div class=\"fan-b pass\"><b>RunnablePassthrough<\/b><span>gives the input back unchanged<\/span><\/div>\n  <\/div>\n  <div class=\"fan-a\">&rarr;<\/div>\n  <div class=\"fan-out\"><div class=\"stp-l\">One dict<\/div><code>simple_explanation<\/code><code>expert_explanation<\/code><code>orignal_topic<\/code><\/div>\n<\/div>\n<div class=\"hl\" data-x=\"1\"><pre><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_core.runnables<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">RunnableParallel<\/span><span class=\"p\">,<\/span> <span class=\"n\">RunnablePassthrough<\/span>\n\n<span class=\"n\">parallel_chain<\/span> <span class=\"o\">=<\/span> <span class=\"n\">RunnableParallel<\/span><span class=\"p\">(<\/span>\n    <span class=\"p\">{<\/span>\n        <span class=\"s2\">\"simple_explanation\"<\/span> <span class=\"p\">:<\/span> <span class=\"n\">simple_chain<\/span><span class=\"p\">,<\/span>\n        <span class=\"s2\">\"expert_explanation\"<\/span> <span class=\"p\">:<\/span> <span class=\"n\">expert_chain<\/span><span class=\"p\">,<\/span>\n        <span class=\"s2\">\"orignal_topic\"<\/span> <span class=\"p\">:<\/span> <span class=\"n\">RunnablePassthrough<\/span><span class=\"p\">()<\/span>\n    <span class=\"p\">}<\/span>\n<span class=\"p\">)<\/span>\n\n<span class=\"n\">result<\/span> <span class=\"o\">=<\/span> <span class=\"n\">parallel_chain<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">({<\/span><span class=\"s2\">\"topic\"<\/span><span class=\"p\">:<\/span><span class=\"s2\">\"cloud computing\"<\/span><span class=\"p\">})<\/span><\/pre><\/div>\n<div class=\"rkvs\">\n  <div class=\"rkv\"><code class=\"rkv-k\">simple_explanation<\/code><div class=\"aib\">Imagine your toys are stored in a giant, invisible toy box that you can play with anytime—even when you’re at a friend’s house! That’s kind of what <b>cloud computing<\/b> is for computers—it lets them share big, powerful toys (like games and videos) from a magical online box. 🌟☁️<\/div><\/div>\n  <div class=\"rkv\"><code class=\"rkv-k\">expert_explanation<\/code><div class=\"aib\">\"Cloud computing is the on-demand delivery of scalable compute, storage, networking, and services—abstracted into elastic, pay-as-you-go resources—enabling rapid innovation, cost efficiency, and operational agility while offloading hardware, maintenance, and infrastructure management onto shared, distributed data centers managed by hyperscalers or private providers.\"<\/div><\/div>\n  <div class=\"rkv\"><code class=\"rkv-k\">orignal_topic<\/code><div class=\"aib plainv\"><code>{'topic': 'cloud computing'}<\/code><\/div><\/div>\n<\/div><\/figure>\n<div class=\"docs\"><span class=\"docs-l\">LangChain docs<\/span><a href=\"https://reference.langchain.com/python/langchain_core/runnables/base/RunnableSequence\" target=\"_blank\" rel=\"noopener\">RunnableSequence<\/a><a href=\"https://reference.langchain.com/python/langchain_core/runnables/base/RunnableLambda\" target=\"_blank\" rel=\"noopener\">RunnableLambda<\/a><a href=\"https://reference.langchain.com/python/langchain_core/runnables/base/RunnableParallel\" target=\"_blank\" rel=\"noopener\">RunnableParallel<\/a><a href=\"https://reference.langchain.com/python/langchain_core/runnables/passthrough/RunnablePassthrough\" target=\"_blank\" rel=\"noopener\">RunnablePassthrough<\/a><a href=\"https://reference.langchain.com/python/langchain-core/runnables\" target=\"_blank\" rel=\"noopener\">All runnables<\/a><\/div>\n\n<hr /><div class=\"sc-head code-head\">Code<\/div><details class=\"codecard\"><summary><span class=\"cc-t\">04_custom_runnables.py<\/span><span class=\"cc-f\">04_custom_runnables.py · 34 lines<\/span><span class=\"cc-show\">Show code<\/span><\/summary><div class=\"hl\"><table class=\"hltable\"><tr><td class=\"linenos\"><div class=\"linenodiv\"><pre><span class=\"normal\"> 1<\/span>\n<span class=\"normal\"> 2<\/span>\n<span class=\"normal\"> 3<\/span>\n<span class=\"normal\"> 4<\/span>\n<span class=\"normal\"> 5<\/span>\n<span class=\"normal\"> 6<\/span>\n<span class=\"normal\"> 7<\/span>\n<span class=\"normal\"> 8<\/span>\n<span class=\"normal\"> 9<\/span>\n<span class=\"normal\">10<\/span>\n<span class=\"normal\">11<\/span>\n<span class=\"normal\">12<\/span>\n<span class=\"normal\">13<\/span>\n<span class=\"normal\">14<\/span>\n<span class=\"normal\">15<\/span>\n<span class=\"normal\">16<\/span>\n<span class=\"normal\">17<\/span>\n<span class=\"normal\">18<\/span>\n<span class=\"normal\">19<\/span>\n<span class=\"normal\">20<\/span>\n<span class=\"normal\">21<\/span>\n<span class=\"normal\">22<\/span>\n<span class=\"normal\">23<\/span>\n<span class=\"normal\">24<\/span>\n<span class=\"normal\">25<\/span>\n<span class=\"normal\">26<\/span>\n<span class=\"normal\">27<\/span>\n<span class=\"normal\">28<\/span>\n<span class=\"normal\">29<\/span>\n<span class=\"normal\">30<\/span>\n<span class=\"normal\">31<\/span>\n<span class=\"normal\">32<\/span><\/pre><\/div><\/td><td class=\"code\"><div><pre><span><\/span><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">dotenv<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">load_dotenv<\/span>\n\n<span class=\"n\">load_dotenv<\/span><span class=\"p\">()<\/span>\n\n\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain.chat_models<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">init_chat_model<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_core.output_parsers<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">StrOutputParser
