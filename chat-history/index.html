<script>window.PAGE = {"id": "n10", "root": "../", "lesson": {"id": "n10", "title": "Chat History", "short": "Chat History", "unit": "Unit 2", "unitName": "Build with LangChain", "pos": 8, "of": 15, "sub": "Memory", "info": "Why LLMs forget, resending the history, the context window and MessagesPlaceholder", "html": "<h2 class=\"c1\" id=\"1-an-llm-has-no-memory\">1. An LLM Has No Memory<\/h2>\n<blockquote class=\"def\"><span class=\"deflab\">Definition<\/span>\n<p>An LLM is <mark class=\"hp\">stateless<\/mark>. Every call is new, and the model <mark class=\"hk\">does not remember<\/mark> earlier calls.<\/p>\n<\/blockquote>\n<figure class=\"visual\"><div class=\"cth\">\n  <div class=\"cth-u\">My name is Riya.<\/div>\n  <div class=\"cth-a\">Nice to meet you, Riya!<\/div>\n  <div class=\"cth-sep\"><span>Next call: the model starts from zero<\/span><\/div>\n  <div class=\"cth-u\">What is my name?<\/div>\n  <div class=\"cth-a\">I don't know your name.<\/div>\n<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c2\" id=\"2-memory-is-a-list-you-resend\">2. Memory Is a List You Resend<\/h2>\n<p>The model forgets, so <strong>you<\/strong> keep the memory. Store every message in a list and send the whole list on every call. The reply goes into the list too.<\/p>\n<figure class=\"visual\"><div class=\"cht\">\n  <div class=\"cht-l\"><div class=\"chg-t\">Your list (the memory)<\/div>\n    <div class=\"cx s\"><b>system<\/b>rules<\/div>\n    <div class=\"cx h\"><b>human<\/b>question 1<\/div>\n    <div class=\"cx a\"><b>ai<\/b>answer 1<\/div>\n    <div class=\"cx h\"><b>human<\/b>question 2<\/div><\/div>\n  <div class=\"cht-m\"><span>send the whole list<\/span><i>&rarr;<\/i><\/div>\n  <div class=\"cht-c\"><div class=\"cht-llm\">LLM<\/div><\/div>\n  <div class=\"cht-m\"><span>reply<\/span><i>&rarr;<\/i><\/div>\n  <div class=\"cht-r\"><div class=\"cx a\"><b>ai<\/b>answer 2<\/div><p>Added to the list, ready for the next turn.<\/p><\/div>\n<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c3\" id=\"3-what-is-a-context-window\">3. What Is a Context Window?<\/h2>\n<blockquote class=\"def\"><span class=\"deflab\">Definition<\/span>\n<p>A <strong>context window<\/strong> is the <mark class=\"hp\">maximum number of tokens<\/mark> a model can read in <mark class=\"hk\">one call<\/mark>.<\/p>\n<\/blockquote>\n<p>The list grows every turn, so one day it no longer fits.<\/p>\n<figure class=\"visual\"><div class=\"chw\">\n  <div class=\"chw-x\"><span>Context window sizes<\/span><u>GPT-4o: 128K tokens<\/u><u>Mistral Nemo: 128K tokens<\/u><u>Gemini 2.5 Flash: 1M tokens<\/u><\/div>\n<\/div>\n<\/figure>\n<hr />\n<div class=\"sc-head code-head\">Code<\/div><details class=\"codecard\"><summary><span class=\"cc-t\">Chatbot with history<\/span><span class=\"cc-f\">chat_history.py · 35 lines<\/span><span class=\"cc-show\">Show code<\/span><\/summary><div class=\"hl\"><table class=\"hltable\"><tr><td class=\"linenos\"><div class=\"linenodiv\"><pre><span class=\"normal\"> 1<\/span>\n<span class=\"normal\"> 2<\/span>\n<span class=\"normal\"> 3<\/span>\n<span class=\"normal\"> 4<\/span>\n<span class=\"normal\"> 5<\/span>\n<span class=\"normal\"> 6<\/span>\n<span class=\"normal\"> 7<\/span>\n<span class=\"normal\"> 8<\/span>\n<span class=\"normal\"> 9<\/span>\n<span class=\"normal\">10<\/span>\n<span class=\"normal\">11<\/span>\n<span class=\"normal\">12<\/span>\n<span class=\"normal\">13<\/span>\n<span class=\"normal\">14<\/span>\n<span class=\"normal\">15<\/span>\n<span class=\"normal\">16<\/span>\n<span class=\"normal\">17<\/span>\n<span class=\"normal\">18<\/span>\n<span class=\"normal\">19<\/span>\n<span class=\"normal\">20<\/span>\n<span class=\"normal\">21<\/span>\n<span class=\"normal\">22<\/span>\n<span class=\"normal\">23<\/span>\n<span class=\"normal\">24<\/span>\n<span class=\"normal\">25<\/span>\n<span class=\"normal\">26<\/span>\n<span class=\"normal\">27<\/span>\n<span class=\"normal\">28<\/span>\n<span class=\"normal\">29<\/span>\n<span class=\"normal\">30<\/span>\n<span class=\"normal\">31<\/span>\n<span class=\"normal\">32<\/span>\n<span class=\"normal\">33<\/span>\n<span class=\"normal\">34<\/span><\/pre><\/div><\/td><td class=\"code\"><div><pre><span><\/span><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">dotenv<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">load_dotenv<\/span>\n<span class=\"n\">load_dotenv<\/span><span class=\"p\">()<\/span>\n\n\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_core.messages<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">AIMessage<\/span><span class=\"p\">,<\/span><span class=\"n\">SystemMessage<\/span><span class=\"p\">,<\/span><span class=\"n\">HumanMessage<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain.chat_models<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">init_chat_model<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">rich<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"nb\">print<\/span>\n\n\n<span class=\"n\">model<\/span> <span class=\"o\">=<\/span> <span class=\"n\">init_chat_model<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"mistralai:mistral-small-2603\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">temperature<\/span><span class=\"o\">=<\/span><span class=\"mf\">0.7<\/span><span class=\"p\">)<\/span>\n\n<span class=\"n\">chat_history<\/span> <span class=\"o\">=<\/span> <span class=\"p\">[<\/span>\n    <span class=\"n\">SystemMessage<\/span><span class=\"p\">(<\/span><span class=\"n\">content<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"You are a helpful coding tutor. Keep answers brief.\"<\/span><span class=\"p\">)<\/span>\n<span class=\"p\">]<\/span>\n\n\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">SystemMessage<\/span><span class=\"p\">(<\/span><span class=\"n\">content<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"You are a helpful coding tutor. Keep answers brief.\"<\/span><span class=\"p\">))<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"welcome to chatbot type exit to quit\"<\/span><span class=\"p\">)<\/span>\n\n<span class=\"k\">while<\/span> <span class=\"kc\">True<\/span><span class=\"p\">:<\/span>\n    <span class=\"n\">user_input<\/span> <span class=\"o\">=<\/span> <span class=\"nb\">input<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"You : ask any think: \"<\/span><span class=\"p\">)<\/span>\n    <span class=\"k\">if<\/span> <span class=\"n\">user_input<\/span> <span class=\"o\">==<\/span> <span class=\"s2\">\"exit\"<\/span><span class=\"p\">:<\/span>\n        <span class=\"k\">break<\/span>\n    <span class=\"n\">chat_history<\/span><span class=\"o\">.<\/span><span class=\"n\">append<\/span><span class=\"p\">(<\/span><span class=\"n\">HumanMessage<\/span><span class=\"p\">(<\/span><span class=\"n\">content<\/span><span class=\"o\">=<\/span><span class=\"n\">user_input<\/span><span class=\"p\">))<\/span>\n    \n    <span class=\"n\">response<\/span> <span class=\"o\">=<\/span> <span class=\"n\">model<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">(<\/span><span class=\"n\">chat_history<\/span><span class=\"p\">)<\/span>\n    \n    <span class=\"n\">chat_history<\/span><span class=\"o\">.<\/span><span class=\"n\">append<\/span><span class=\"p\">(<\/span><span class=\"n\">AIMessage<\/span><span class=\"p\">(<\/span><span class=\"n\">content<\/span><span class=\"o\">=<\/span><span class=\"n\">response<\/span><span class=\"o\">.<\/span><span class=\"n\">content<\/span><span class=\"p\">))<\/span>\n    \n    <span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"sa\">f<\/span><span class=\"s2\">\"Bot: <\/span><span class=\"si\">{<\/span><span class=\"n\">response<\/span><span class=\"o\">.<\/span><span class=\"n\">content<\/span><span class=\"si\">}<\/span><span class=\"s2\">\"<\/span><span class=\"p\">)<\/span>\n\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">chat_history<\/span><span class=\"p\">)<\/span>\n    \n        \n<\/pre><\/div><\/td><\/tr><\/table><\/div>\n<\/details><h2 class=\"c4\" id=\"4-messagesplaceholder\">4. MessagesPlaceholder<\/h2>\n<blockquote class=\"def\"><span class=\"deflab\">Definition<\/span>\n<p>A <strong>MessagesPlaceholder<\/strong> is a slot in a <code>ChatPromptTemplate<\/code> that you <mark class=\"hp\">fill with a list of messages<\/mark>.<\/p>\n<\/blockquote>\n<p>A normal blank like <code>{state}<\/code> holds one piece of text. History is a list, so it needs a slot of its own. In code you write it as <code>(\"placeholder\", \"{chat_history}\")<\/code>.<\/p>\n<figure class=\"visual\"><div class=\"chf chf2\">\n  <div class=\"chf-in\">template.invoke({\"chat_history\": chat_history, \"question\": \"What is Python?\"})<\/div>\n  <div class=\"chf-c\"><div class=\"chf-lab\">Before: the slot is empty<\/div>\n    <div class=\"cx s\"><b>system<\/b>You are a helpful assistant.<\/div>\n    <div class=\"cx slot\"><b>placeholder<\/b>{chat_history}<\/div>\n    <div class=\"cx h\"><b>human<\/b>{question}<\/div><\/div>\n  <div class=\"chf-ar\">&rarr;<\/div>\n  <div class=\"chf-c\"><div class=\"chf-lab\">After: the list is unrolled<\/div>\n    <div class=\"cx s\"><b>system<\/b>You are a helpful assistant.<\/div>\n    <div class=\"chx-g\">\n      <div class=\"cx h\"><b>human<\/b>Hello<\/div>\n      <div class=\"cx a\"><b>ai<\/b>Hi!<\/div>\n      <div class=\"cx h\"><b>human<\/b>What is Java?<\/div>\n    <\/div>\n    <div class=\"cx h\"><b>human<\/b>What is Python?<\/div><\/div>\n<\/div>\n<\/figure>\n<div class=\"docs\"><span class=\"docs-l\">LangChain docs<\/span><a href=\"https://reference.langchain.com/python/langchain-core/prompts/chat/MessagesPlaceholder\" target=\"_blank\" rel=\"noopener\">MessagesPlaceholder<\/a><a href=\"https://reference.langchain.com/python/langchain_core/prompts/chat/ChatPromptTemplate\" target=\"_blank\" rel=\"noopener\">ChatPromptTemplate<\/a><\/div>\n\n<hr /><div class=\"sc-head code-head\">Code<\/div><details class=\"codecard\"><summary><span class=\"cc-t\">Chatbot with MessagesPlaceholder<\/span><span class=\"cc-f\">chat_history_placeholder.py · 41 lines<\/span><span class=\"cc-show\">Show code<\/span><\/summary><div class=\"hl\"><table class=\"hltable\"><tr><td class=\"linenos\"><div class=\"linenodiv\"><pre><span class=\"normal\"> 1<\/span>\n<span class=\"normal\"> 2<\/span>\n<span class=\"normal\"> 3<\/span>\n<span class=\"normal\"> 4<\/span>\n<span class=\"normal\"> 5<\/span>\n<span class=\"normal\"> 6<\/span>\n<span class=\"normal\"> 7<\/span>\n<span class=\"normal\"> 8<\/span>\n<span class=\"normal\"> 9<\/span>\n<span class=\"normal\">10<\/span>\n<span class=\"normal\">11<\/span>\n<span class=\"normal\">12<\/span>\n<span class=\"normal\">13<\/span>\n<span class=\"normal\">14<\/span>\n<span class=\"normal\">15<\/span>\n<span class=\"normal\">16<\/span>\n<span class=\"normal\">17<\/span>\n<span class=\"normal\">18<\/span>\n<span class=\"normal\">19<\/span>\n<span class=\"normal\">20<\/span>\n<span class=\"normal\">21<\/span>\n<span class=\"normal\">22<\/span>\n<span class=\"normal\">23<\/span>\n<span class=\"normal\">24<\/span>\n<span class=\"normal\">25<\/span>\n<span class=\"normal\">26<\/span>\n<span class=\"normal\">27<\/span>\n<span class=\"normal\">28<\/span>\n<span class=\"normal\">29<\/span>\n<span class=\"normal\">30<\/span>\n<span class=\"normal\">31<\/span>\n<span class=\"normal\">32<\/span>\n<span class=\"normal\">33<\/span>\n<span class=\"normal\">34<\/span>\n<span class=\"normal\">35<\/span>\n<span class=\"normal\">36<\/span>\n<span class=\"normal\">37<\/span>\n<span class=\"normal\">38<\/span>\n<span class=\"normal\">39<\/span>\n<span class=\"normal\">40<\/span>\n<span class=\"normal\">41<\/span><\/pre><\/div><\/td><td class=\"code\"><div><pre><span><\/span><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">dotenv<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">load_dotenv<\/span>\n<span class=\"n\">load_dotenv<\/span><span class=\"p\">()<\/span>\n\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_core.prompts<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">ChatPromptTemplate<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_core.messages<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">HumanMessage<\/span><span class=\"p\">,<\/span> <span class=\"n\">AIMessage<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain.chat_models<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">init_chat_model<\/span>\n\n<span class=\"n\">model<\/span> <span class=\"o\">=<\/span> <span class=\"n\">init_chat_model<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"mistralai:mistral-small-2603\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">temperature<\/span><span class=\"o\">=<\/span><span class=\"mf\">0.7<\/span><span class=\"p\">)<\/span>\n\n<span class=\"c1\"># 1. Define Template with placeholder in the middle<\/span>\n<span class=\"n\">template<\/span> <span class=\"o\">=<\/span> <span class=\"n\">ChatPromptTemplate<\/span><span class=\"o\">.<\/span><span class=\"n\">from_messages<\/span><span class=\"p\">([<\/span>\n    <span class=\"p\">(<\/span><span class=\"s2\">\"system\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"You are a helpful and concise AI tutor.\"<\/span><span class=\"p\">),<\/span>\n    <span class=\"p\">(<\/span><span class=\"s2\">\"placeholder\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"<\/span><span class=\"si\">{chat_history}<\/span><span class=\"s2\">\"<\/span><span class=\"p\">),<\/span>  <span class=\"c1\"># Dynamic message list slot<\/span>\n    <span class=\"p\">(<\/span><span class=\"s2\">\"human\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"<\/span><span class=\"si\">{question}<\/span><span class=\"s2\">\"<\/span><span class=\"p\">)<\/span>             <span class=\"c1\"># Current user question<\/span>\n<span class=\"p\">])<\/span>\n\n<span class=\"c1\"># 2. History Storage<\/span>\n<span class=\"n\">chat_history<\/span> <span class=\"o\">=<\/span> <span class=\"p\">[]<\/span>\n\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"welcome to chatbot - Type 'exit' to quit\"<\/span><span class=\"p\">)<\/span>\n\n<span class=\"k\">while<\/span> <span class=\"kc\">True<\/span><span class=\"p\">:<\/span>\n    <span class=\"n\">user_query<\/span> <span class=\"o\">=<\/span> <span class=\"nb\">input<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"You: \"<\/span><span class=\"p\">)<\/span>\n    <span class=\"k\">if<\/span> <span class=\"n\">user_query<\/span><span class=\"o\">.<\/span><span class=\"n\">lower<\/span><span class=\"p\">()<\/span> <span class=\"o\">==<\/span> <span class=\"s2\">\"exit\"<\/span><span class=\"p\">:<\/span>\n        <span class=\"k\">break<\/span>\n\n    <span class=\"c1\"># Step A: Format template with history and current question<\/span>\n    <span class=\"n\">formatted_prompt<\/span> <span class=\"o\">=<\/span> <span class=\"n\">template<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">({<\/span>\n        <span class=\"s2\">\"chat_history\"<\/span><span class=\"p\">:<\/span> <span class=\"n\">chat_history<\/span><span class=\"p\">,<\/span>\n        <span class=\"s2\">\"question\"<\/span><span class=\"p\">:<\/span> <span class=\"n\">user_query<\/span>\n    <span class=\"p\">})<\/span>\n\n    <span class=\"c1\"># Step B: Call the model<\/span>\n    <span class=\"n\">response<\/span> <span class=\"o\">=<\/span> <span class=\"n\">model<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">(<\/span><span class=\"n\">formatted_prompt<\/span><span class=\"p\">)<\/span>\n\n    <span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"AI:\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">response<\/span><span class=\"o\">.<\/span><span class=\"n\">content<\/span><span class=\"p\">)<\/span>\n    <span class=\"nb\">print<\/span><span class=\"p\">()<\/span>\n\n    <span class=\"c1\"># Step C: Update history for the next iteration<\/span>\n    <span class=\"n\">chat_history<\/span><span class=\"o\">.<\/span><span class=\"n\">append<\/span><span class=\"p\">(<\/span><span class=\"n\">HumanMessage<\/span><span class=\"p\">(<\/span><span class=\"n\">content<\/span><span class=\"o\">=<\/span><span class=\"n\">user_query<\/span><span class=\"p\">))<\/span>\n    <span class=\"n\">chat_history<\/span><span class=\"o\">.<\/span><span class=\"n\">append<\/span><span class=\"p\">(<\/span><span class=\"n\">AIMessage<\/span><span class=\"p\">(<\/span><span class=\"n\">content<\/span><span class=\"o\">=<\/span><span class=\"n\">response<\/span><span class=\"o\">.<\/span><span class=\"n\">content<\/span><span class=\"p\">))<\/span>\n<\/pre><\/div><\/td><\/tr><\/table><\/div>\n<\/details>", "toc": [{"id": "1-an-llm-has-no-memory", "name": "1. An LLM Has No Memory"}, {"id": "2-memory-is-a-list-you-resend", "name": "2. Memory Is a List You Resend"}, {"id": "3-what-is-a-context-window", "name": "3. What Is a Context Window?"}, {"id": "4-messagesplaceholder", "name": "4. MessagesPlaceholder"}], "search": "", "slides": null, "slideCount": 0, "code": []}};</script>
