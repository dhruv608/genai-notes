<script>window.PAGE = {"id": "n02_1", "root": "../", "lesson": {"id": "n02_1", "title": "What is GenAI?", "short": "What is GenAI?", "unit": "Unit 1", "unitName": "Start Here: GenAI Basics", "pos": 1, "of": 7, "sub": "Understand GenAI", "info": "Definition, Google vs ChatGPT, traditional AI vs GenAI", "html": "<h2 class=\"c1\" id=\"1-what-is-generative-ai\">1. What Is Generative AI?<\/h2>\n<blockquote class=\"def\"><span class=\"deflab\">Definition<\/span>\n<p><strong>Generative AI<\/strong> is a branch of Artificial Intelligence that creates <strong>new, original content<\/strong>, such as text, images, code and audio, based on a user's instruction.<\/p>\n<\/blockquote>\n<figure class=\"visual\"><div class=\"chatwrap\">\n  <div class=\"win chatwin\">\n    <div class=\"win-top\"><i><\/i><i><\/i><i><\/i><span>chatgpt.com<\/span><\/div>\n    <div class=\"win-body\">\n      <div class=\"cuser\">Write a short birthday wish for my friend Mehak. She loves travelling.<\/div>\n      <div class=\"crow\"><span class=\"cav\"><svg viewBox=\"0 0 24 24\" aria-label=\"ChatGPT\"><path d=\"M22.2819 9.8211a5.9847 5.9847 0 0 0-.5157-4.9108 6.0462 6.0462 0 0 0-6.5098-2.9A6.0651 6.0651 0 0 0 4.9807 4.1818a5.9847 5.9847 0 0 0-3.9977 2.9 6.0462 6.0462 0 0 0 .7427 7.0966 5.98 5.98 0 0 0 .511 4.9107 6.051 6.051 0 0 0 6.5146 2.9001A5.9847 5.9847 0 0 0 13.2599 24a6.0557 6.0557 0 0 0 5.7718-4.2058 5.9894 5.9894 0 0 0 3.9977-2.9001 6.0557 6.0557 0 0 0-.7475-7.0729zm-9.022 12.6081a4.4755 4.4755 0 0 1-2.8764-1.0408l.1419-.0804 4.7783-2.7582a.7948.7948 0 0 0 .3927-.6813v-6.7369l2.02 1.1686a.071.071 0 0 1 .038.052v5.5826a4.504 4.504 0 0 1-4.4945 4.4944zm-9.6607-4.1254a4.4708 4.4708 0 0 1-.5346-3.0137l.142.0852 4.783 2.7582a.7712.7712 0 0 0 .7806 0l5.8428-3.3685v2.3324a.0804.0804 0 0 1-.0332.0615L9.74 19.9502a4.4992 4.4992 0 0 1-6.1408-1.6464zM2.3408 7.8956a4.485 4.485 0 0 1 2.3655-1.9728V11.6a.7664.7664 0 0 0 .3879.6765l5.8144 3.3543-2.0201 1.1685a.0757.0757 0 0 1-.071 0l-4.8303-2.7865A4.504 4.504 0 0 1 2.3408 7.872zm16.5963 3.8558L13.1038 8.364 15.1192 7.2a.0757.0757 0 0 1 .071 0l4.8303 2.7913a4.4944 4.4944 0 0 1-.6765 8.1042v-5.6772a.79.79 0 0 0-.407-.667zm2.0107-3.0231l-.142-.0852-4.7735-2.7818a.7759.7759 0 0 0-.7854 0L9.409 9.2297V6.8974a.0662.0662 0 0 1 .0284-.0615l4.8303-2.7866a4.4992 4.4992 0 0 1 6.6802 4.66zM8.3065 12.863l-2.02-1.1638a.0804.0804 0 0 1-.038-.0567V6.0742a4.4992 4.4992 0 0 1 7.3757-3.4537l-.142.0805L8.704 5.459a.7948.7948 0 0 0-.3927.6813zm1.0976-2.3654l2.602-1.4998 2.6069 1.4998v2.9994l-2.5974 1.4997-2.6067-1.4997Z\"/><\/svg><\/span><div class=\"cans\"><p>Happy birthday, Mehak! May this year bring you new cities, long train rides and passport stamps. Keep exploring!<\/p><\/div><\/div>\n      <div class=\"cbar\"><span class=\"cplus\">+<\/span><span class=\"ctext\">Ask anything<\/span><b>↑<\/b><\/div>\n    <\/div>\n  <\/div>\n  <div class=\"chatann\">\n    <div class=\"ann\"><small>You type<\/small>An instruction in plain language<\/div>\n    <div class=\"ann\"><small>Model replies<\/small>A brand-new answer, written word by word<\/div>\n    <div class=\"ann last\">This text did not exist anywhere before. <b>The model created it.<\/b><\/div>\n  <\/div>\n<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c2\" id=\"2-google-vs-chatgpt-the-same-question\">2. Google vs ChatGPT: The Same Question<\/h2>\n<p>Same question: <em>\"Make me a 4-week plan to learn Python, 1 hour a day\"<\/em><\/p>\n<figure class=\"visual\"><div class=\"cmp cmp-screens\">\n  <div class=\"cmp-t\">Before ChatGPT vs after ChatGPT<\/div>\n  <div class=\"cmp-c b\">\n    <h4>Before: Google Search<\/h4>\n    <div class=\"win\">\n      <div class=\"win-top\"><i><\/i><i><\/i><i><\/i><span>google.com<\/span><\/div>\n      <div class=\"win-body\">\n        <span class=\"gword\"><i style=\"color:#4285f4\">G<\/i><i style=\"color:#ea4335\">o<\/i><i style=\"color:#fbbc05\">o<\/i><i style=\"color:#4285f4\">g<\/i><i style=\"color:#34a853\">l<\/i><i style=\"color:#ea4335\">e<\/i><\/span>\n        <div class=\"gbox\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\"><circle cx=\"10\" cy=\"10\" r=\"6.5\" fill=\"none\" stroke=\"#6b7078\" stroke-width=\"2\"/><path d=\"M15 15l6 6\" stroke=\"#6b7078\" stroke-width=\"2\" stroke-linecap=\"round\"/><\/svg><span>Make me a 4-week plan to learn Python, 1 hour a day<\/span><\/div>\n        <div class=\"gres\"><small>pythonblog.com<\/small><a>Learn Python in 30 days<\/a><\/div>\n        <div class=\"gres\"><small>coursesite.com<\/small><a>Top 10 Python courses for 2024<\/a><\/div>\n        <div class=\"gres\"><small>devroadmaps.io<\/small><a>Python roadmap for beginners<\/a><\/div>\n      <\/div>\n    <\/div>\n    <div class=\"cmp-foot\">\n      <div class=\"cmp-flow\">Open tabs → read → compare → <b>make the plan yourself<\/b><\/div>\n      <div class=\"cmp-time slow\">~1 hour<\/div>\n    <\/div>\n  <\/div>\n  <div class=\"cmp-c a\">\n    <h4>Now: ChatGPT<\/h4>\n    <div class=\"win\">\n      <div class=\"win-top\"><i><\/i><i><\/i><i><\/i><span>chatgpt.com<\/span><\/div>\n      <div class=\"win-body\">\n        <div class=\"cuser\">Make me a 4-week plan to learn Python, 1 hour a day<\/div>\n        <div class=\"crow\"><span class=\"cav\"><svg viewBox=\"0 0 24 24\" aria-label=\"ChatGPT\"><path d=\"M22.2819 9.8211a5.9847 5.9847 0 0 0-.5157-4.9108 6.0462 6.0462 0 0 0-6.5098-2.9A6.0651 6.0651 0 0 0 4.9807 4.1818a5.9847 5.9847 0 0 0-3.9977 2.9 6.0462 6.0462 0 0 0 .7427 7.0966 5.98 5.98 0 0 0 .511 4.9107 6.051 6.051 0 0 0 6.5146 2.9001A5.9847 5.9847 0 0 0 13.2599 24a6.0557 6.0557 0 0 0 5.7718-4.2058 5.9894 5.9894 0 0 0 3.9977-2.9001 6.0557 6.0557 0 0 0-.7475-7.0729zm-9.022 12.6081a4.4755 4.4755 0 0 1-2.8764-1.0408l.1419-.0804 4.7783-2.7582a.7948.7948 0 0 0 .3927-.6813v-6.7369l2.02 1.1686a.071.071 0 0 1 .038.052v5.5826a4.504 4.504 0 0 1-4.4945 4.4944zm-9.6607-4.1254a4.4708 4.4708 0 0 1-.5346-3.0137l.142.0852 4.783 2.7582a.7712.7712 0 0 0 .7806 0l5.8428-3.3685v2.3324a.0804.0804 0 0 1-.0332.0615L9.74 19.9502a4.4992 4.4992 0 0 1-6.1408-1.6464zM2.3408 7.8956a4.485 4.485 0 0 1 2.3655-1.9728V11.6a.7664.7664 0 0 0 .3879.6765l5.8144 3.3543-2.0201 1.1685a.0757.0757 0 0 1-.071 0l-4.8303-2.7865A4.504 4.504 0 0 1 2.3408 7.872zm16.5963 3.8558L13.1038 8.364 15.1192 7.2a.0757.0757 0 0 1 .071 0l4.8303 2.7913a4.4944 4.4944 0 0 1-.6765 8.1042v-5.6772a.79.79 0 0 0-.407-.667zm2.0107-3.0231l-.142-.0852-4.7735-2.7818a.7759.7759 0 0 0-.7854 0L9.409 9.2297V6.8974a.0662.0662 0 0 1 .0284-.0615l4.8303-2.7866a4.4992 4.4992 0 0 1 6.6802 4.66zM8.3065 12.863l-2.02-1.1638a.0804.0804 0 0 1-.038-.0567V6.0742a4.4992 4.4992 0 0 1 7.3757-3.4537l-.142.0805L8.704 5.459a.7948.7948 0 0 0-.3927.6813zm1.0976-2.3654l2.602-1.4998 2.6069 1.4998v2.9994l-2.5974 1.4997-2.6067-1.4997Z\"/><\/svg><\/span><div class=\"cans\">\n          <p><b>Week 1<\/b> Variables, loops, functions<\/p>\n          <p><b>Week 2<\/b> Lists, dictionaries, files<\/p>\n          <p><b>Week 3<\/b> Classes and objects<\/p>\n          <p><b>Week 4<\/b> One small project<\/p>\n        <\/div><\/div>\n        <div class=\"cbar\"><span class=\"cplus\">+<\/span><span class=\"ctext\">Ask anything<\/span><b>↑<\/b><\/div>\n      <\/div>\n    <\/div>\n    <div class=\"cmp-foot\">\n      <div class=\"cmp-flow\">A <b>ready plan<\/b>, made for your time<\/div>\n      <div class=\"cmp-time fast\">~10 seconds<\/div>\n    <\/div>\n  <\/div>\n<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c3\" id=\"3-traditional-ai-vs-generative-ai\">3. Traditional AI vs Generative AI<\/h2>\n<figure class=\"visual\"><div class=\"vsgrid\">\n  <div><\/div><div class=\"vs-h a\">Traditional AI<\/div><div class=\"vs-h b\">Generative AI<\/div>\n  <div class=\"vs-k\">Its job<\/div><div class=\"vs-a\">Decides or predicts<\/div><div class=\"vs-b\">Creates something new<\/div>\n  <div class=\"vs-k\">Output<\/div><div class=\"vs-a\">A label or a number<\/div><div class=\"vs-b\">Text, images, code, audio<\/div>\n  <div class=\"vs-k\">Example<\/div><div class=\"vs-a\"><span class=\"vs-m\">Is this email spam?<\/span> → <b>Spam<\/b><\/div><div class=\"vs-b\"><span class=\"vs-m\">Write a leave email<\/span> → <b>a full email<\/b><\/div>\n  <div class=\"vs-k\">Real uses<\/div><div class=\"vs-a\">Fraud detection, face unlock, price prediction<\/div><div class=\"vs-b\">ChatGPT, image generators, coding assistants<\/div>\n  <div class=\"vs-k\">Learns from<\/div><div class=\"vs-a\">Labelled data (input + correct answer)<\/div><div class=\"vs-b\">Huge amounts of raw text, images, code<\/div>\n<\/div>\n<\/figure>\n", "toc": [{"id": "1-what-is-generative-ai", "name": "1. What Is Generative AI?"}, {"id": "2-google-vs-chatgpt-the-same-question", "name": "2. Google vs ChatGPT: The Same Question"}, {"id": "3-traditional-ai-vs-generative-ai", "name": "3. Traditional AI vs Generative AI"}], "search": "", "slides": null, "slideCount": 0, "code": []}};</script>
