<script>window.PAGE = {"id": "n35", "root": "../", "lesson": {"id": "n35", "title": "API Keys and Limits", "short": "API Keys and Limits", "unit": "Unit 1", "unitName": "Start Here: GenAI Basics", "pos": 6, "of": 7, "sub": "", "info": "What an API key is, the .env file, the default key names, free plan limits, and the three common key errors", "html": "<h2 class=\"c1\" id=\"what-is-an-api-key\">What Is an API Key?<\/h2>\n<blockquote class=\"def\"><span class=\"deflab\">Definition<\/span>\n<p>An <strong>API key<\/strong> is a secret password that tells a company's API that the request comes from you. Without it, the API does not answer.<\/p>\n<\/blockquote>\n<figure class=\"visual\"><div class=\"em-point\"><b>One key for each company.<\/b> You get it from the company's website, in your account.<\/div><div class=\"em-point\"><b>Never share it.<\/b> Anyone who has your key can use your account.<\/div><div class=\"em-point\"><b>Keep it out of your code.<\/b> Put it in a <code>.env<\/code> file, and keep that file out of Git.<\/div><\/figure>\n<hr />\n<h2 class=\"c2\" id=\"the-env-file\">The .env File<\/h2>\n<p>You keep each key in a file named <code>.env<\/code>, and your code reads it from there.<\/p>\n<figure class=\"visual\"><div class=\"hl\" data-x=\"1\"><pre>MISTRAL_API_KEY=your key\nGROQ_API_KEY=your key<\/pre><\/div><div class=\"em-point\"><b>.env<\/b> is a plain text file in your project folder. Write the name, then <code>=<\/code>, then your key. No spaces.<\/div><div class=\"hl\" data-x=\"1\"><pre><span class=\"kn\">import<\/span><span class=\"w\"> <\/span><span class=\"nn\">os<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">dotenv<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">load_dotenv<\/span>\n\n<span class=\"n\">load_dotenv<\/span><span class=\"p\">()<\/span>\n\n<span class=\"n\">client<\/span> <span class=\"o\">=<\/span> <span class=\"n\">Mistral<\/span><span class=\"p\">(<\/span><span class=\"n\">api_key<\/span><span class=\"o\">=<\/span><span class=\"n\">os<\/span><span class=\"o\">.<\/span><span class=\"n\">getenv<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"MISTRAL_API_KEY\"<\/span><span class=\"p\">))<\/span><\/pre><\/div><div class=\"em-point\"><b>load_dotenv()<\/b> reads the file.<\/div><div class=\"em-point\"><b>os.getenv(...)<\/b> gives the key that has that name.<\/div><div class=\"em-point\"><b>python-dotenv<\/b> is the package that gives load_dotenv: <code>pip install python-dotenv<\/code><\/div><\/figure>\n<hr />\n<h2 class=\"c3\" id=\"default-key-names\">Default Key Names<\/h2>\n<p>LangChain finds your key by itself when you use its default name in the <code>.env<\/code> file.<\/p>\n<figure class=\"visual\"><div class=\"em-tbl ck-tbl\"><table><tr><th>Company<\/th><th>Name in the .env file<\/th><\/tr><tr><td>OpenAI<\/td><td><code>OPENAI_API_KEY<\/code><\/td><\/tr><tr><td>Anthropic<\/td><td><code>ANTHROPIC_API_KEY<\/code><\/td><\/tr><tr><td>Google Gemini<\/td><td><code>GOOGLE_API_KEY<\/code> &nbsp;or&nbsp; <code>GEMINI_API_KEY<\/code><\/td><\/tr><tr><td>Groq<\/td><td><code>GROQ_API_KEY<\/code><\/td><\/tr><tr><td>Mistral AI<\/td><td><code>MISTRAL_API_KEY<\/code><\/td><\/tr><\/table><\/div><div class=\"em-point\"><b>With LangChain,<\/b> write the default name in <code>.env<\/code> and call <code>load_dotenv()<\/code> once. LangChain reads the key from that name. You do not pass the key in your code.<\/div><div class=\"em-point\"><b>A different name?<\/b> Then LangChain cannot find the key. Use the default name, or pass the key yourself with the <code>api_key<\/code> setting.<\/div><\/figure>\n<hr />\n<h2 class=\"c4\" id=\"free-plan-limits\">Free Plan Limits<\/h2>\n<p>Free plans have limits. When you pass one, the API answers with an error and you must wait.<\/p>\n<figure class=\"visual\"><div class=\"em-tbl ck-tbl\"><table><tr><th>Company<\/th><th>Model<\/th><th>Requests per minute<\/th><th>Tokens per minute<\/th><th>Per day<\/th><\/tr><tr><td>Groq<\/td><td><code>openai/gpt-oss-20b<\/code><\/td><td>30<\/td><td>8,000<\/td><td>1,000 requests and 2,00,000 tokens<\/td><\/tr><tr><td>Mistral<\/td><td><code>open-mistral-nemo<\/code><\/td><td>2<\/td><td>40,000<\/td><td>-<\/td><\/tr><\/table><\/div><div class=\"em-point\"><b>Free plan numbers only.<\/b> They change, so check your own limits on the provider's site: <a href=\"https://console.groq.com/settings/limits\" target=\"_blank\" rel=\"noopener\">Groq limits ↗<\/a> and <a href=\"https://admin.mistral.ai/plateforme/limits\" target=\"_blank\" rel=\"noopener\">Mistral limits ↗<\/a>.<\/div><div class=\"em-point\"><b>A limit belongs to the account.<\/b> Everyone who shares one API key shares one limit. Give each student their own key.<\/div><\/figure>\n<hr />\n<h2 class=\"c5\" id=\"common-key-errors\">Common Key Errors<\/h2>\n<p>Three errors you will meet. Each one tells you what to fix.<\/p>\n<figure class=\"visual\"><div class=\"em-tbl ck-tbl\"><table><tr><th>Error<\/th><th>What it means<\/th><th>What to do<\/th><\/tr><tr><td><code>401 Invalid API Key<\/code><\/td><td>The API did not accept the key.<\/td><td>Check the name in <code>.env<\/code>, and copy the key again.<\/td><\/tr><tr><td><code>403<\/code><\/td><td>This model is not on your plan. Mistral says: not available in your subscription tier.<\/td><td>Pick a model that your plan allows.<\/td><\/tr><tr><td><code>429<\/code><\/td><td>You passed a limit of the free plan.<\/td><td>Wait a minute and try again.<\/td><\/tr><\/table><\/div><div class=\"em-point\"><b>To check that your key is found,<\/b> run this in the project folder. It prints <code>loaded: True<\/code> and the length of the key, never the key itself.<\/div><div class=\"hl\" data-x=\"1\"><pre>python<span class=\"w\"> <\/span>-c<span class=\"w\"> <\/span><span class=\"s2\">\"import os; from dotenv import load_dotenv; load_dotenv(); k=os.getenv('MISTRAL_API_KEY'); print('loaded:', bool(k), '| length:', len(k or ''))\"<\/span><\/pre><\/div><\/figure>\n<hr />", "toc": [{"id": "what-is-an-api-key", "name": "What Is an API Key?"}, {"id": "the-env-file", "name": "The .env File"}, {"id": "default-key-names", "name": "Default Key Names"}, {"id": "free-plan-limits", "name": "Free Plan Limits"}, {"id": "common-key-errors", "name": "Common Key Errors"}], "search": "", "slides": null, "slideCount": 0, "code": []}};</script>
