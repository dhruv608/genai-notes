<script>window.PAGE = {"id": "n07_1", "root": "../", "lesson": {"id": "n07_1", "title": "What is a Prompt?", "short": "What is a Prompt?", "unit": "Unit 2", "unitName": "Build with LangChain", "pos": 4, "of": 14, "sub": "Prompts", "info": "What a prompt is, the three message types and the system prompt", "html": "<h2 class=\"c1\" id=\"1-what-is-a-prompt\">1. What Is a Prompt?<\/h2>\n<blockquote class=\"def\"><span class=\"deflab\">Definition<\/span>\n<p>A <strong>prompt<\/strong> is the <mark class=\"hp\">input<\/mark> you give to a large language model to get the <mark class=\"hk\">response<\/mark> you want.<\/p>\n<\/blockquote>\n<figure class=\"visual\"><div class=\"pq\">\n  <div class=\"pq-c weak\">\n    <div class=\"pq-t\"><i>Weak prompt<\/i><\/div>\n    <div class=\"pq-b\">\"Tell me about tokens.\"<\/div>\n    <ul><li>No clear task<\/li><li>No context: who is asking?<\/li><li>No format: the answer can be any length<\/li><\/ul>\n  <\/div>\n  <div class=\"pq-a\">→<\/div>\n  <div class=\"pq-c strong\">\n    <div class=\"pq-t\"><i>Strong prompt<\/i><\/div>\n    <div class=\"pq-b\"><span class=\"s1\">Explain what a token is<\/span> <span class=\"s2\">to a student who already knows Python<\/span> <span class=\"s3\">in 2 lines, with one example.<\/span><\/div>\n    <div class=\"pq-l\">\n      <span><i class=\"s1\"><\/i><b>Instruction<\/b>what to do<\/span>\n      <span><i class=\"s2\"><\/i><b>Context<\/b>what it needs to know<\/span>\n      <span><i class=\"s3\"><\/i><b>Format<\/b>how the answer should look<\/span>\n    <\/div>\n  <\/div>\n<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c2\" id=\"2-the-system-prompt\">2. The System Prompt<\/h2>\n<blockquote class=\"def\"><span class=\"deflab\">Definition<\/span>\n<p>A <strong>system prompt<\/strong> is an instruction you give the model <mark class=\"hp\">before the conversation<\/mark>. It sets the model's <mark class=\"hk\">role, behaviour and rules<\/mark>.<\/p>\n<\/blockquote>\n<p>Every production chatbot, from a <mark class=\"hp\">finance assistant<\/mark> to a <mark class=\"hp\">health bot<\/mark> or a <mark class=\"hp\">support agent<\/mark>, is configured with a system prompt first. Real products stack more layers on top, and we build those later. At its core, a system prompt fixes the model's <mark class=\"hk\">role<\/mark>, its <mark class=\"hk\">behaviour<\/mark> and its <mark class=\"hk\">rules<\/mark>. A strong one spells out five things, and you add only the ones your app needs.<\/p>\n<figure class=\"visual\"><div class=\"sps\">\n  <div class=\"sps-h\">One system prompt from a finance chatbot, split into its parts<\/div>\n  <div class=\"sps-t\">\n    <span class=\"sps-s a\"><b>Role<\/b>You are a personal finance chatbot.<\/span>\n    <span class=\"sps-s b\"><b>Tone<\/b>Be polite and use simple language.<\/span>\n    <span class=\"sps-s a\"><b>Task<\/b>Help users make a monthly budget.<\/span>\n    <span class=\"sps-s b\"><b>Limits<\/b>Give no stock advice. Answer only finance questions.<\/span>\n    <span class=\"sps-s a\"><b>Format<\/b>Use a maximum of 3 bullet points.<\/span>\n  <\/div>\n<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c3\" id=\"3-three-types-of-messages\">3. Three Types of Messages<\/h2>\n<p>The system prompt is sent as a message. In fact, the model does not get one plain string. It gets a list of messages, and each message has a role. You send System and Human messages. The model sends back an AI message.<\/p>\n<figure class=\"visual\"><div class=\"mg\">\n  <div class=\"mg-in\">\n    <div class=\"mg-m sys\"><span class=\"mg-r\">System message<\/span><div class=\"mg-x\">\"Answer in one word.\"<\/div><small>Rules for the model. Written by you, the developer.<\/small><span class=\"mg-cn\">SystemMessage<\/span><\/div>\n    <div class=\"mg-m hum\"><span class=\"mg-r\">Human message<\/span><div class=\"mg-x\">\"Capital of Rajasthan?\"<\/div><small>The question. It comes from the user.<\/small><span class=\"mg-cn\">HumanMessage<\/span><\/div>\n  <\/div>\n  <div class=\"mg-a\"><span>you send<\/span>→<\/div>\n  <div class=\"mg-llm\"><b>LLM<\/b><span>reads the messages<\/span><\/div>\n  <div class=\"mg-a\"><span>replies<\/span>→<\/div>\n  <div class=\"mg-m ai\"><span class=\"mg-r\">AI message<\/span><div class=\"mg-x\">\"Jaipur\"<\/div><small>The reply from the model.<\/small><span class=\"mg-cn\">AIMessage<\/span><\/div>\n<\/div>\n<\/figure>\n<p><strong>System sets the rules. Human asks. AI answers.<\/strong><\/p>\n", "toc": [{"id": "1-what-is-a-prompt", "name": "1. What Is a Prompt?"}, {"id": "2-the-system-prompt", "name": "2. The System Prompt"}, {"id": "3-three-types-of-messages", "name": "3. Three Types of Messages"}], "search": "", "slides": null, "slideCount": 0, "code": []}};</script>
