<script>window.PAGE = {"id": "n06_1", "root": "../", "lesson": {"id": "n06_1", "title": "What is LangChain?", "short": "What is LangChain?", "unit": "Unit 2", "unitName": "Build with LangChain", "pos": 2, "of": 16, "sub": "LangChain basics", "info": "What LangChain is, and the toolbox of building blocks it gives you", "html": "<h2 class=\"c1\" id=\"1-what-is-langchain\">1. What Is LangChain?<\/h2>\n<blockquote class=\"def\"><span class=\"deflab\">Definition<\/span>\n<p><strong>LangChain<\/strong> is an <mark class=\"hp\">open-source framework<\/mark> for building applications powered by large language models. It gives you <mark class=\"hk\">ready-made building blocks<\/mark> to connect an LLM with <mark class=\"hp\">prompts, memory, your data and tools<\/mark>.<\/p>\n<\/blockquote>\n<p>Created by <strong>Harrison Chase<\/strong> in 2022. Available in <strong>Python<\/strong> and <strong>JavaScript<\/strong>.<\/p>\n<hr />\n<h2 class=\"c2\" id=\"2-what-langchain-gives-you\">2. What LangChain Gives You<\/h2>\n<p>You could write all of this code yourself. But LangChain already gives you <mark class=\"hp\">ready-made, well-managed code<\/mark> that its developers write and maintain. It is <mark class=\"hk\">open source<\/mark>, easy to use, and the best way to build AI applications. That is why we prefer it.<\/p>\n<figure class=\"visual\"><div class=\"tbx\">\n  <div class=\"tbx-label\">The LangChain toolbox<\/div>\n  <div class=\"tbx-grid\">\n    <div class=\"blk g1\" data-n=\"1\" style=\"grid-area:1/1\"><b>Models<\/b><span class=\"bd\">Call any LLM with the same code<\/span><i>Different code for every company?<\/i><\/div>\n    <div class=\"blk g1\" data-n=\"2\" style=\"grid-area:1/2\"><b>Prompts<\/b><span class=\"bd\">Reusable prompts with blanks<\/span><i>Same prompt typed again and again?<\/i><\/div>\n    <div class=\"blk g1\" data-n=\"3\" style=\"grid-area:1/3\"><b>Output Parsers<\/b><span class=\"bd\">Clean, structured data instead of paragraphs<\/span><i>Answers come as messy text?<\/i><\/div>\n    <div class=\"blk g2\" data-n=\"4\" style=\"grid-area:2/1\"><b>Memory<\/b><span class=\"bd\">Keep the conversation history<\/span><i>It forgets the chat?<\/i><\/div>\n    <div class=\"tbx-llm\" style=\"grid-area:2/2\"><small>your app<\/small><b>LLM<\/b><span>+ building blocks<\/span><\/div>\n    <div class=\"blk g3\" data-n=\"7\" style=\"grid-area:2/3\"><b>Chains<\/b><span class=\"bd\">Connect steps one after another<\/span><i>Many steps to join?<\/i><\/div>\n    <div class=\"blk g2\" data-n=\"5\" style=\"grid-area:3/1\"><b>Document Loaders<\/b><span class=\"bd\">Read PDFs, websites and files<\/span><i>It cannot read your PDFs?<\/i><\/div>\n    <div class=\"blk g2\" data-n=\"6\" style=\"grid-area:3/2\"><b>Vector Stores<\/b><span class=\"bd\">Search your data by meaning<\/span><i>Too much data to search?<\/i><\/div>\n    <div class=\"blk g3\" data-n=\"8\" style=\"grid-area:3/3\"><b>Tools<\/b><span class=\"bd\">Let the LLM call functions and take actions<\/span><i>It cannot take actions?<\/i><\/div>\n    <div class=\"blk rbn\" data-n=\"9\" style=\"grid-area:4/1/5/4\">\n      <div class=\"rb-l\"><b>Runnables<\/b><span class=\"bd\">The common standard every block follows. Because of it, any block can connect to any other block.<\/span><\/div>\n      <div class=\"rb-r\"><span class=\"rb-k\">connect with<\/span><code>|<\/code><span class=\"rb-k\">and every block can<\/span><code>.invoke()<\/code><code>.stream()<\/code><code>.batch()<\/code><\/div>\n    <\/div>\n  <\/div>\n<\/div>\n<\/figure>\n", "toc": [{"id": "1-what-is-langchain", "name": "1. What Is LangChain?"}, {"id": "2-what-langchain-gives-you", "name": "2. What LangChain Gives You"}], "search": "", "slides": null, "slideCount": 0, "code": []}};</script>
