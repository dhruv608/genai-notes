<script>window.PAGE = {"id": "n17", "root": "../", "lesson": {"id": "n17", "title": "Web Loaders", "short": "Web Loaders", "unit": "Unit 3", "unitName": "Chat with Your Data (RAG)", "pos": 8, "of": 11, "sub": "", "info": "BeautifulSoup, WebBaseLoader, RecursiveUrlLoader and PlaywrightURLLoader: what each does, the headless browser, and what to install", "html": "<h2 class=\"c1\" id=\"getting-data-from-websites\">Getting Data from Websites<\/h2>\n<p>Our goal now: download data from online websites, and turn it into Documents. LangChain has several web loaders. These are the main three. Start with <code>WebBaseLoader<\/code>, and use the others only when a page needs them.<\/p>\n<figure class=\"visual\"><div class=\"em-tbl\"><table>\n<tr><th>Loader<\/th><th>Use it for<\/th><th>It gives<\/th><\/tr>\n<tr><td style=\"white-space:nowrap\"><code>WebBaseLoader<\/code><\/td><td>one normal page, or a list of pages<\/td><td>one Document for each address<\/td><\/tr>\n<tr><td style=\"white-space:nowrap\"><code>RecursiveUrlLoader<\/code><\/td><td>a website: the start page and the pages it links to<\/td><td>one Document for each page found<\/td><\/tr>\n<tr><td style=\"white-space:nowrap\"><code>PlaywrightURLLoader<\/code><\/td><td>pages that JavaScript builds<\/td><td>one Document for each address<\/td><\/tr>\n<\/table><\/div>\n<\/figure>\n<hr />\n<h2 class=\"c2\" id=\"beautifulsoup-html-to-plain-text\">BeautifulSoup: HTML to Plain Text<\/h2>\n<blockquote class=\"def\"><span class=\"deflab\">Definition<\/span>\n<p><strong>BeautifulSoup<\/strong> converts an HTML page into plain text. A web page arrives as HTML, which is code full of tags. We need only the text, so the loader removes the tags with BeautifulSoup.<\/p>\n<\/blockquote>\n<figure class=\"visual\"><div class=\"em-fig\"><svg class=\"em-svg\" viewBox=\"0 0 790 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"ba\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#9aa3a2\"/><\/marker><\/defs><rect x=\"10\" y=\"22\" width=\"330\" height=\"86\" rx=\"12\" fill=\"#fff\" stroke=\"#9aa3a2\" stroke-width=\"1.8\"/><text x=\"26\" y=\"46\" font-size=\"12\" font-weight=\"800\" fill=\"#7a7367\" letter-spacing=\"1\">HTML OF A PAGE<\/text><text x=\"26\" y=\"76\" font-size=\"13\" fill=\"#1f2a2a\" font-family=\"Consolas, monospace\">&lt;h1&gt;Welcome&lt;/h1&gt;&lt;p&gt;Hello &lt;b&gt;world&lt;/b&gt;&lt;/p&gt;<\/text><text x=\"26\" y=\"96\" font-size=\"13\" fill=\"#1f2a2a\" font-family=\"Consolas, monospace\">&lt;nav&gt;Home About&lt;/nav&gt;<\/text><line x1=\"346\" y1=\"65\" x2=\"440\" y2=\"65\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ba)\"/><text x=\"393\" y=\"52\" font-size=\"13\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#0e3b3a\">get_text()<\/text><rect x=\"446\" y=\"22\" width=\"330\" height=\"86\" rx=\"12\" fill=\"#fbf1d3\" stroke=\"#efdca0\" stroke-width=\"1.8\"/><text x=\"462\" y=\"46\" font-size=\"12\" font-weight=\"800\" fill=\"#7a7367\" letter-spacing=\"1\">PLAIN TEXT<\/text><text x=\"462\" y=\"82\" font-size=\"16\" fill=\"#5f4d12\" font-family=\"Consolas, monospace\">WelcomeHello worldHome About<\/text><\/svg><\/div><div class=\"em-point\"><b>Install:<\/b> <code>pip install beautifulsoup4<\/code>. You import it from <code>bs4<\/code>:<\/div><div class=\"hl\" data-x=\"1\"><pre><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">bs4<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">BeautifulSoup<\/span><\/pre><\/div><\/figure>\n<hr />\n<h2 class=\"c3\" id=\"webbaseloader-one-page-or-a-list-of-pages\">WebBaseLoader: One Page, or a List of Pages<\/h2>\n<blockquote class=\"def\"><span class=\"deflab\">Definition<\/span>\n<p><strong>WebBaseLoader<\/strong> downloads a web page and gives back its text as a <strong>Document<\/strong>, one Document for each address.<\/p>\n<\/blockquote>\n<figure class=\"visual\"><div class=\"em-fig\"><svg class=\"em-svg\" viewBox=\"0 0 790 150\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"wa\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#9aa3a2\"/><\/marker><\/defs><rect x=\"10\" y=\"30\" width=\"160\" height=\"86\" rx=\"12\" fill=\"#fff\" stroke=\"#9aa3a2\" stroke-width=\"1.8\"/><text x=\"90\" y=\"68\" font-size=\"16\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#1f2a2a\">The address<\/text><text x=\"90\" y=\"92\" font-size=\"12\" text-anchor=\"middle\" fill=\"#4a5f5e\">a URL, or a list of URLs<\/text><line x1=\"174\" y1=\"73\" x2=\"206\" y2=\"73\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#wa)\"/><rect x=\"210\" y=\"30\" width=\"160\" height=\"86\" rx=\"12\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.8\"/><text x=\"290\" y=\"68\" font-size=\"16\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#0e3b3a\">requests<\/text><text x=\"290\" y=\"92\" font-size=\"12\" text-anchor=\"middle\" fill=\"#4a5f5e\">downloads the HTML<\/text><line x1=\"374\" y1=\"73\" x2=\"406\" y2=\"73\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#wa)\"/><rect x=\"410\" y=\"30\" width=\"160\" height=\"86\" rx=\"12\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.8\"/><text x=\"490\" y=\"68\" font-size=\"16\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#0e3b3a\">beautifulsoup4<\/text><text x=\"490\" y=\"92\" font-size=\"12\" text-anchor=\"middle\" fill=\"#4a5f5e\">gets the text from the HTML<\/text><line x1=\"574\" y1=\"73\" x2=\"606\" y2=\"73\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#wa)\"/><rect x=\"610\" y=\"30\" width=\"160\" height=\"86\" rx=\"12\" fill=\"#fbf1d3\" stroke=\"#efdca0\" stroke-width=\"1.8\"/><text x=\"690\" y=\"68\" font-size=\"16\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#8a6a12\">Documents<\/text><text x=\"690\" y=\"92\" font-size=\"12\" text-anchor=\"middle\" fill=\"#4a5f5e\">one for each address<\/text><\/svg><\/div><div class=\"hl\" data-x=\"1\"><pre><span class=\"n\">static_loader<\/span> <span class=\"o\">=<\/span> <span class=\"n\">WebBaseLoader<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"address of the web page\"<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">static_docs<\/span> <span class=\"o\">=<\/span> <span class=\"n\">static_loader<\/span><span class=\"o\">.<\/span><span class=\"n\">load<\/span><span class=\"p\">()<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"1. WebBaseLoader Docs Loaded:\"<\/span><span class=\"p\">,<\/span> <span class=\"nb\">len<\/span><span class=\"p\">(<\/span><span class=\"n\">static_docs<\/span><span class=\"p\">))<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Metadata:\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">static_docs<\/span><span class=\"p\">[<\/span><span class=\"mi\">0<\/span><span class=\"p\">]<\/span><span class=\"o\">.<\/span><span class=\"n\">metadata<\/span><span class=\"p\">)<\/span><\/pre><\/div>\n<div class=\"em-point\"><b>It reads only the HTML the server sends.<\/b> Text that JavaScript adds later is missing. The Playwright loader fixes that.<\/div>\n<div class=\"em-point\"><b>The whole page comes back,<\/b> so menu words such as <code>Home<\/code> and <code>Sign in<\/code> are in the text too. The metadata has the <code>source<\/code> (the address) and the <code>title<\/code>.<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c4\" id=\"recursiveurlloader-a-website-and-its-linked-pages\">RecursiveUrlLoader: A Website and Its Linked Pages<\/h2>\n<blockquote class=\"def\"><span class=\"deflab\">Definition<\/span>\n<p><strong>RecursiveUrlLoader<\/strong> is a crawler. It starts at one page, follows the links on it, and loads every page it reaches. Each page becomes one Document.<\/p>\n<\/blockquote>\n<figure class=\"visual\"><div class=\"em-fig\"><svg class=\"em-svg\" viewBox=\"0 0 760 300\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"ca\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#9aa3a2\"/><\/marker><\/defs><line x1=\"380\" y1=\"48\" x2=\"200\" y2=\"98\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ca)\"/><line x1=\"380\" y1=\"48\" x2=\"520\" y2=\"98\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ca)\"/><line x1=\"380\" y1=\"48\" x2=\"700\" y2=\"98\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ca)\"/><line x1=\"200\" y1=\"138\" x2=\"110\" y2=\"198\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ca)\"/><line x1=\"200\" y1=\"138\" x2=\"290\" y2=\"198\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ca)\"/><line x1=\"520\" y1=\"138\" x2=\"470\" y2=\"198\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ca)\"/><line x1=\"520\" y1=\"138\" x2=\"650\" y2=\"198\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ca)\"/><rect x=\"305\" y=\"10\" width=\"150\" height=\"38\" rx=\"9\" fill=\"#1a5c5b\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"380\" y=\"34\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#fff\">start page<\/text><rect x=\"140\" y=\"100\" width=\"120\" height=\"38\" rx=\"9\" fill=\"#d4ecea\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"200\" y=\"124\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">page A<\/text><rect x=\"460\" y=\"100\" width=\"120\" height=\"38\" rx=\"9\" fill=\"#d4ecea\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"520\" y=\"124\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">page B<\/text><rect x=\"60\" y=\"200\" width=\"100\" height=\"38\" rx=\"9\" fill=\"#fbf1d3\" stroke=\"#efdca0\" stroke-width=\"1.6\"/><text x=\"110\" y=\"224\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#5f4d12\">page A1<\/text><rect x=\"240\" y=\"200\" width=\"100\" height=\"38\" rx=\"9\" fill=\"#fbf1d3\" stroke=\"#efdca0\" stroke-width=\"1.6\"/><text x=\"290\" y=\"224\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#5f4d12\">page A2<\/text><rect x=\"420\" y=\"200\" width=\"100\" height=\"38\" rx=\"9\" fill=\"#fbf1d3\" stroke=\"#efdca0\" stroke-width=\"1.6\"/><text x=\"470\" y=\"224\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#5f4d12\">page B1<\/text><rect x=\"600\" y=\"200\" width=\"100\" height=\"38\" rx=\"9\" fill=\"#fbf1d3\" stroke=\"#efdca0\" stroke-width=\"1.6\"/><text x=\"650\" y=\"224\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#5f4d12\">page B2<\/text><rect x=\"640\" y=\"100\" width=\"120\" height=\"38\" rx=\"9\" fill=\"#fdf1ec\" stroke=\"#c9583a\" stroke-width=\"1.6\"/><text x=\"700\" y=\"124\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c9583a\">other site<\/text><text x=\"700\" y=\"166\" font-size=\"24\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#c9583a\">&times;<\/text><text x=\"700\" y=\"186\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#c9583a\">not followed<\/text><rect x=\"30\" y=\"256\" width=\"200\" height=\"34\" rx=\"8\" fill=\"#1a5c5b\"/><text x=\"130\" y=\"278\" font-size=\"13\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#fff\">max_depth=1: 1 page<\/text><rect x=\"280\" y=\"256\" width=\"200\" height=\"34\" rx=\"8\" fill=\"#d4ecea\" stroke=\"#1a5c5b\"/><text x=\"380\" y=\"278\" font-size=\"13\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#0e3b3a\">max_depth=2: 3 pages<\/text><rect x=\"530\" y=\"256\" width=\"200\" height=\"34\" rx=\"8\" fill=\"#fbf1d3\" stroke=\"#efdca0\"/><text x=\"630\" y=\"278\" font-size=\"13\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#5f4d12\">max_depth=3: 7 pages<\/text><\/svg><\/div><div class=\"hl\" data-x=\"1\"><pre><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">bs4<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">BeautifulSoup<\/span>\n\n<span class=\"n\">crawler_loader<\/span> <span class=\"o\">=<\/span> <span class=\"n\">RecursiveUrlLoader<\/span><span class=\"p\">(<\/span>\n    <span class=\"n\">url<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"address of the start page\"<\/span><span class=\"p\">,<\/span>\n    <span class=\"n\">max_depth<\/span><span class=\"o\">=<\/span><span class=\"mi\">2<\/span><span class=\"p\">,<\/span>\n    <span class=\"n\">extractor<\/span><span class=\"o\">=<\/span><span class=\"k\">lambda<\/span> <span class=\"n\">html<\/span><span class=\"p\">:<\/span> <span class=\"n\">BeautifulSoup<\/span><span class=\"p\">(<\/span><span class=\"n\">html<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"html.parser\"<\/span><span class=\"p\">)<\/span><span class=\"o\">.<\/span><span class=\"n\">get_text<\/span><span class=\"p\">(<\/span><span class=\"n\">strip<\/span><span class=\"o\">=<\/span><span class=\"kc\">True<\/span><span class=\"p\">),<\/span>\n    <span class=\"n\">prevent_outside<\/span><span class=\"o\">=<\/span><span class=\"kc\">True<\/span> <span class=\"c1\"># CRITICAL: Prevents crawler from leaving python.org domain!<\/span>\n<span class=\"p\">)<\/span>\n<span class=\"n\">crawled_docs<\/span> <span class=\"o\">=<\/span> <span class=\"n\">crawler_loader<\/span><span class=\"o\">.<\/span><span class=\"n\">load<\/span><span class=\"p\">()<\/span><\/pre><\/div>\n<div class=\"em-point\"><b>max_depth<\/b> is how many levels of links to follow. In the picture, <code>max_depth=1<\/code> loads only the start page. <code>max_depth=2<\/code> also loads the pages it links to. <code>max_depth=3<\/code> goes one level further. The code uses 2.<\/div>\n<div class=\"em-point\"><b>prevent_outside=True<\/b> keeps the crawler on the same website. The link to another site in the picture is not followed.<\/div>\n<div class=\"em-point\"><b>extractor<\/b> decides what text to keep from each page. Without it, each Document is raw HTML, such as <code>&lt;h1&gt;Welcome&lt;/h1&gt;&lt;p&gt;Hello&lt;/p&gt;<\/code>. With it, you get plain text. In the code it is a one-line function: it takes the page's HTML and returns plain text, using BeautifulSoup.<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c5\" id=\"playwrighturlloader-pages-built-by-javascript\">PlaywrightURLLoader: Pages Built by JavaScript<\/h2>\n<blockquote class=\"def\"><span class=\"deflab\">Definition<\/span>\n<p><strong>PlaywrightURLLoader<\/strong> loads a page with a <strong>headless browser<\/strong>: a real web browser that runs in the background, without a screen. The page's JavaScript runs, and then the loader reads the finished page.<\/p>\n<\/blockquote>\n<figure class=\"visual\"><div class=\"em-point\"><b>The problem:<\/b> many websites send an empty frame and a JavaScript script. A browser runs the script, and the content appears. <code>WebBaseLoader<\/code> is not a browser, so it never runs the script and misses the content. Example: on a practice page built this way, it returned only 161 characters and none of the quotes.<\/div>\n<div class=\"em-fig\"><svg class=\"em-svg\" viewBox=\"0 0 790 215\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"ja\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#9aa3a2\"/><\/marker><\/defs><rect x=\"10\" y=\"20\" width=\"220\" height=\"110\" rx=\"12\" fill=\"#fff\" stroke=\"#9aa3a2\" stroke-width=\"1.8\"/><text x=\"120\" y=\"46\" font-size=\"14\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#1f2a2a\">What the server sends<\/text><text x=\"120\" y=\"72\" font-size=\"13\" text-anchor=\"middle\" fill=\"#4a5f5e\">an almost empty page<\/text><text x=\"120\" y=\"92\" font-size=\"13\" text-anchor=\"middle\" fill=\"#4a5f5e\">+ a JavaScript script<\/text><line x1=\"236\" y1=\"75\" x2=\"284\" y2=\"75\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ja)\"/><rect x=\"290\" y=\"20\" width=\"220\" height=\"110\" rx=\"12\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.8\"/><text x=\"400\" y=\"46\" font-size=\"14\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#0e3b3a\">A headless browser<\/text><text x=\"400\" y=\"72\" font-size=\"13\" text-anchor=\"middle\" fill=\"#4a5f5e\">runs the script, which<\/text><text x=\"400\" y=\"92\" font-size=\"13\" text-anchor=\"middle\" fill=\"#4a5f5e\">writes the content into the page<\/text><line x1=\"516\" y1=\"75\" x2=\"564\" y2=\"75\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ja)\"/><rect x=\"570\" y=\"20\" width=\"210\" height=\"110\" rx=\"12\" fill=\"#fbf1d3\" stroke=\"#efdca0\" stroke-width=\"1.8\"/><text x=\"675\" y=\"46\" font-size=\"14\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#8a6a12\">The finished page<\/text><text x=\"675\" y=\"72\" font-size=\"13\" text-anchor=\"middle\" fill=\"#5f4d12\">all the text is there<\/text><text x=\"120\" y=\"156\" font-size=\"13\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#c9583a\">WebBaseLoader reads this<\/text><text x=\"120\" y=\"176\" font-size=\"13\" text-anchor=\"middle\" fill=\"#c9583a\">and misses the content<\/text><text x=\"675\" y=\"156\" font-size=\"13\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#1a5c5b\">PlaywrightURLLoader<\/text><text x=\"675\" y=\"176\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1a5c5b\">reads this<\/text><\/svg><\/div><div class=\"hl\" data-x=\"1\"><pre><span class=\"n\">dynamic_loader<\/span> <span class=\"o\">=<\/span> <span class=\"n\">PlaywrightURLLoader<\/span><span class=\"p\">(<\/span>\n    <span class=\"n\">urls<\/span><span class=\"o\">=<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"address of the page\"<\/span><span class=\"p\">],<\/span>\n    <span class=\"n\">remove_selectors<\/span><span class=\"o\">=<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"header\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"footer\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"nav\"<\/span><span class=\"p\">]<\/span> <span class=\"c1\"># Strip navigation noise<\/span>\n<span class=\"p\">)<\/span>\n<span class=\"n\">dynamic_docs<\/span> <span class=\"o\">=<\/span> <span class=\"n\">dynamic_loader<\/span><span class=\"o\">.<\/span><span class=\"n\">load<\/span><span class=\"p\">()<\/span><\/pre><\/div>\n<div class=\"em-cap\"><code>remove_selectors<\/code> deletes the <code>header<\/code>, <code>footer<\/code> and <code>nav<\/code> parts before the text is read.<\/div><div class=\"em-point\"><b>A headless browser<\/b> is a real browser with no window. It runs in the background, and your Python code controls it. You do not write JavaScript: the website already has it.<\/div>\n<div class=\"em-point\"><b>It is costly:<\/b> the browser runs on your own computer, so it uses your computer's memory (RAM) and processor. Use it only when a simple loader misses the content.<\/div>\n<div class=\"em-point\"><b>Setup:<\/b> <code>pip install playwright<\/code>, then <code>playwright install<\/code> to download the browser, and <code>pip install unstructured<\/code>.<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c1\" id=\"other-web-loaders\">Other Web Loaders<\/h2>\n<p>There are more web loaders. Here are their names.<\/p>\n<figure class=\"visual\"><div class=\"em-point\"><b>Like PlaywrightURLLoader<\/b> (they run a browser too): <code>SeleniumURLLoader<\/code>, <code>AsyncChromiumLoader<\/code>, <code>BrowserbaseLoader<\/code>.<\/div>\n<div class=\"em-point\"><b>Others:<\/b> <code>SitemapLoader<\/code>, <code>AsyncHtmlLoader<\/code>, <code>UnstructuredURLLoader<\/code>, <code>FireCrawlLoader<\/code>, <code>ScrapingAntLoader<\/code>, <code>SpiderLoader<\/code>.<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c2\" id=\"packages-and-install\">Packages and Install<\/h2>\n<p>Each loader reads pages with other packages.<\/p>\n<figure class=\"visual\"><div class=\"em-point\"><b>All three loaders:<\/b> <code>pip install langchain-community<\/code><\/div>\n<div class=\"em-point\"><b>WebBaseLoader and RecursiveUrlLoader:<\/b> <code>pip install beautifulsoup4<\/code>. It does not come with <code>langchain-community<\/code>.<\/div>\n<div class=\"em-point\"><b>PlaywrightURLLoader:<\/b> <code>pip install playwright unstructured<\/code>, then <code>playwright install<\/code>.<\/div>\n<\/figure>\n<div class=\"docs\"><span class=\"docs-l\">Docs<\/span><a href=\"https://docs.langchain.com/oss/python/integrations/document_loaders/index\" target=\"_blank\" rel=\"noopener\">LangChain: document loaders<\/a><\/div>\n\n<hr /><div class=\"sc-head code-head\">Code<\/div><details class=\"codecard\"><summary><span class=\"cc-t\">Web loaders<\/span><span class=\"cc-f\">03_web_loaders.py · 61 lines<\/span><span class=\"cc-show\">Show code<\/span><\/summary><div class=\"hl\"><table class=\"hltable\"><tr><td class=\"linenos\"><div class=\"linenodiv\"><pre><span class=\"normal\"> 1<\/span>\n<span class=\"normal\"> 2<\/span>\n<span class=\"normal\"> 3<\/span>\n<span class=\"normal\"> 4<\/span>\n<span class=\"normal\"> 5<\/span>\n<span class=\"normal\"> 6<\/span>\n<span class=\"normal\"> 7<\/span>\n<span class=\"normal\"> 8<\/span>\n<span class=\"normal\"> 9<\/span>\n<span class=\"normal\">10<\/span>\n<span class=\"normal\">11<\/span>\n<span class=\"normal\">12<\/span>\n<span class=\"normal\">13<\/span>\n<span class=\"normal\">14<\/span>\n<span class=\"normal\">15<\/span>\n<span class=\"normal\">16<\/span>\n<span class=\"normal\">17<\/span>\n<span class=\"normal\">18<\/span>\n<span class=\"normal\">19<\/span>\n<span class=\"normal\">20<\/span>\n<span class=\"normal\">21<\/span>\n<span class=\"normal\">22<\/span>\n<span class=\"normal\">23<\/span>\n<span class=\"normal\">24<\/span>\n<span class=\"normal\">25<\/span>\n<span class=\"normal\">26<\/span>\n<span class=\"normal\">27<\/span>\n<span class=\"normal\">28<\/span>\n<span class=\"normal\">29<\/span>\n<span class=\"normal\">30<\/span>\n<span class=\"normal\">31<\/span>\n<span class=\"normal\">32<\/span>\n<span class=\"normal\">33<\/span>\n<span class=\"normal\">34<\/span>\n<span class=\"normal\">35<\/span>\n<span class=\"normal\">36<\/span>\n<span class=\"normal\">37<\/span>\n<span class=\"normal\">38<\/span>\n<span class=\"normal\">39<\/span>\n<span class=\"normal\">40<\/span>\n<span class=\"normal\">41<\/span>\n<span class=\"normal\">42<\/span>\n<span class=\"normal\">43<\/span>\n<span class=\"normal\">44<\/span>\n<span class=\"normal\">45<\/span>\n<span class=\"normal\">46<\/span>\n<span class=\"normal\">47<\/span>\n<span class=\"normal\">48<\/span>\n<span class=\"normal\">49<\/span>\n<span class=\"normal\">50<\/span>\n<span class=\"normal\">51<\/span>\n<span class=\"normal\">52<\/span>\n<span class=\"normal\">53<\/span>\n<span class=\"normal\">54<\/span>\n<span class=\"normal\">55<\/span>\n<span class=\"normal\">56<\/span>\n<span class=\"normal\">57<\/span>\n<span class=\"normal\">58<\/span>\n<span class=\"normal\">59<\/span>\n<span class=\"normal\">60<\/span>\n<span class=\"normal\">61<\/span><\/pre><\/div><\/td><td class=\"code\"><div><pre><span><\/span><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">dotenv<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">load_dotenv<\/span>\n<span class=\"n\">load_dotenv<\/span><span class=\"p\">()<\/span>\n\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">bs4<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">BeautifulSoup<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_community.document_loaders<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">WebBaseLoader<\/span><span class=\"p\">,<\/span> <span class=\"n\">RecursiveUrlLoader<\/span><span class=\"p\">,<\/span> <span class=\"n\">PlaywrightURLLoader<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_text_splitters<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">RecursiveCharacterTextSplitter<\/span>\n\n\n<span class=\"c1\"># ====================================================================<\/span>\n<span class=\"c1\"># 1. WebBaseLoader: Static Webpage Loader (Single or List of URLs)<\/span>\n<span class=\"c1\"># Requires: pip install beautifulsoup4<\/span>\n<span class=\"c1\"># ====================================================================<\/span>\n<span class=\"n\">static_loader<\/span> <span class=\"o\">=<\/span> <span class=\"n\">WebBaseLoader<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"https://ximverse.com\"<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">static_docs<\/span> <span class=\"o\">=<\/span> <span class=\"n\">static_loader<\/span><span class=\"o\">.<\/span><span class=\"n\">load<\/span><span class=\"p\">()<\/span>\n\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"1. WebBaseLoader Docs Loaded:\"<\/span><span class=\"p\">,<\/span> <span class=\"nb\">len<\/span><span class=\"p\">(<\/span><span class=\"n\">static_docs<\/span><span class=\"p\">))<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Metadata:\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">static_docs<\/span><span class=\"p\">[<\/span><span class=\"mi\">0<\/span><span class=\"p\">]<\/span><span class=\"o\">.<\/span><span class=\"n\">metadata<\/span><span class=\"p\">)<\/span>\n\n\n<span class=\"c1\"># ====================================================================<\/span>\n<span class=\"c1\"># 2. RecursiveUrlLoader: Web Crawler (Crawls sub-links up to max_depth)<\/span>\n<span class=\"c1\"># Requires: pip install beautifulsoup4<\/span>\n<span class=\"c1\"># ====================================================================<\/span>\n<span class=\"n\">crawler_loader<\/span> <span class=\"o\">=<\/span> <span class=\"n\">RecursiveUrlLoader<\/span><span class=\"p\">(<\/span>\n    <span class=\"n\">url<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"https://docs.python.org/3/tutorial/index.html\"<\/span><span class=\"p\">,<\/span>\n    <span class=\"n\">max_depth<\/span><span class=\"o\">=<\/span><span class=\"mi\">2<\/span><span class=\"p\">,<\/span>\n    <span class=\"n\">extractor<\/span><span class=\"o\">=<\/span><span class=\"k\">lambda<\/span> <span class=\"n\">html<\/span><span class=\"p\">:<\/span> <span class=\"n\">BeautifulSoup<\/span><span class=\"p\">(<\/span><span class=\"n\">html<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"html.parser\"<\/span><span class=\"p\">)<\/span><span class=\"o\">.<\/span><span class=\"n\">get_text<\/span><span class=\"p\">(<\/span><span class=\"n\">strip<\/span><span class=\"o\">=<\/span><span class=\"kc\">True<\/span><span class=\"p\">),<\/span>\n    <span class=\"n\">prevent_outside<\/span><span class=\"o\">=<\/span><span class=\"kc\">True<\/span> <span class=\"c1\"># CRITICAL: Prevents crawler from leaving python.org domain!<\/span>\n<span class=\"p\">)<\/span>\n<span class=\"n\">crawled_docs<\/span> <span class=\"o\">=<\/span> <span class=\"n\">crawler_loader<\/span><span class=\"o\">.<\/span><span class=\"n\">load<\/span><span class=\"p\">()<\/span>\n\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"2. RecursiveUrlLoader Docs Crawled:\"<\/span><span class=\"p\">,<\/span> <span class=\"nb\">len<\/span><span class=\"p\">(<\/span><span class=\"n\">crawled_docs<\/span><span class=\"p\">))<\/span>\n\n\n<span class=\"c1\"># ====================================================================<\/span>\n<span class=\"c1\"># 3. PlaywrightURLLoader: Headless Browser for Dynamic JavaScript / React<\/span>\n<span class=\"c1\"># Requires: pip install playwright &amp;&amp; playwright install<\/span>\n<span class=\"c1\"># ====================================================================<\/span>\n<span class=\"n\">dynamic_loader<\/span> <span class=\"o\">=<\/span> <span class=\"n\">PlaywrightURLLoader<\/span><span class=\"p\">(<\/span>\n    <span class=\"n\">urls<\/span><span class=\"o\">=<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"https://quotes.toscrape.com/js/\"<\/span><span class=\"p\">],<\/span>\n    <span class=\"n\">remove_selectors<\/span><span class=\"o\">=<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"header\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"footer\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"nav\"<\/span><span class=\"p\">]<\/span> <span class=\"c1\"># Strip navigation noise<\/span>\n<span class=\"p\">)<\/span>\n<span class=\"n\">dynamic_docs<\/span> <span class=\"o\">=<\/span> <span class=\"n\">dynamic_loader<\/span><span class=\"o\">.<\/span><span class=\"n\">load<\/span><span class=\"p\">()<\/span>\n\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"3. PlaywrightURLLoader Docs Loaded:\"<\/span><span class=\"p\">,<\/span> <span class=\"nb\">len<\/span><span class=\"p\">(<\/span><span class=\"n\">dynamic_docs<\/span><span class=\"p\">))<\/span>\n\n\n<span class=\"c1\"># ====================================================================<\/span>\n<span class=\"c1\"># 4. Splitting Web Documents into Clean Semantic Chunks<\/span>\n<span class=\"c1\"># ====================================================================<\/span>\n<span class=\"n\">splitter<\/span> <span class=\"o\">=<\/span> <span class=\"n\">RecursiveCharacterTextSplitter<\/span><span class=\"p\">(<\/span>\n    <span class=\"n\">chunk_size<\/span><span class=\"o\">=<\/span><span class=\"mi\">500<\/span><span class=\"p\">,<\/span>        <span class=\"c1\"># Maximum characters per chunk<\/span>\n    <span class=\"n\">chunk_overlap<\/span><span class=\"o\">=<\/span><span class=\"mi\">50<\/span>       <span class=\"c1\"># 50 characters overlap to preserve context<\/span>\n<span class=\"p\">)<\/span>\n\n<span class=\"c1\"># Takes list[Document] -&gt; Returns smaller list[Document] (Metadata preserved!)<\/span>\n<span class=\"n\">web_chunks<\/span> <span class=\"o\">=<\/span> <span class=\"n\">splitter<\/span><span class=\"o\">.<\/span><span class=\"n\">split_documents<\/span><span class=\"p\">(<\/span><span class=\"n\">static_docs<\/span><span class=\"p\">)<\/span>\n\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"sa\">f<\/span><span class=\"s2\">\"Total Chunks Created: <\/span><span class=\"si\">{<\/span><span class=\"nb\">len<\/span><span class=\"p\">(<\/span><span class=\"n\">web_chunks<\/span><span class=\"p\">)<\/span><span class=\"si\">}<\/span><span class=\"s2\">\"<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Chunk 1 Metadata (URL &amp; Title Preserved):\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">web_chunks<\/span><span class=\"p\">[<\/span><span class=\"mi\">0<\/span><span class=\"p\">]<\/span><span class=\"o\">.<\/span><span class=\"n\">metadata<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Chunk 1 Content Preview:<\/span><span class=\"se\">\\n<\/span><span class=\"s2\">\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">web_chunks<\/span><span class=\"p\">[<\/span><span class=\"mi\">0<\/span><span class=\"p\">]<\/span><span class=\"o\">.<\/span><span class=\"n\">page_content<\/span><span class=\"p\">[:<\/span><span class=\"mi\">200<\/span><span class=\"p\">])<\/span>\n<\/pre><\/div><\/td><\/tr><\/table><\/div>\n<\/details>", "toc": [{"id": "getting-data-from-websites", "name": "Getting Data from Websites"}, {"id": "beautifulsoup-html-to-plain-text", "name": "BeautifulSoup: HTML to Plain Text"}, {"id": "webbaseloader-one-page-or-a-list-of-pages", "name": "WebBaseLoader: One Page, or a List of Pages"}, {"id": "recursiveurlloader-a-website-and-its-linked-pages", "name": "RecursiveUrlLoader: A Website and Its Linked Pages"}, {"id": "playwrighturlloader-pages-built-by-javascript", "name": "PlaywrightURLLoader: Pages Built by JavaScript"}, {"id": "other-web-loaders", "name": "Other Web Loaders"}, {"id": "packages-and-install", "name": "Packages and Install"}], "search": "", "slides": null, "slideCount": 0, "code": []}};</script>
