<script>window.PAGE = {"id": "n29_1", "root": "../", "lesson": {"id": "n29_1", "title": "Write, Review, Rewrite", "short": "Write, Review, Rewrite", "unit": "Unit 4", "unitName": "Agents with LangGraph", "pos": 12, "of": 16, "sub": "", "info": "Why one try is not enough, reflection, the writer and reviewer nodes, and the stop rule", "html": "<h2 class=\"c1\" id=\"the-problem-one-try-is-not-enough\">The Problem: One Try Is Not Enough<\/h2>\n<p>We want a LinkedIn post that follows five editorial rules.<\/p>\n<figure class=\"visual\"><div class=\"px\">\n  <div class=\"px-r\"><span>The issue<\/span><div>We want a LinkedIn post with a strong hook, short paragraphs, 150 to 200 words, an ending question, and no hashtags.<\/div><\/div>\n  <div class=\"px-r\"><span>The first try<\/span><div>Ask the model once, or use a sequential graph: write, then review.<\/div><\/div>\n  <div class=\"px-r\"><span>Why it fails<\/span><div>The first draft often breaks a rule. A review that only comes at the end cannot send the draft back, so a bad post goes out.<\/div><\/div>\n  <div class=\"px-r hi\"><span>The fix<\/span><div>A <b>loop<\/b>: the reviewer checks the draft. If it fails, its feedback goes <b>back to the writer<\/b>, who rewrites.<\/div><\/div>\n<\/div><\/figure>\n<hr />\n<h2 class=\"c2\" id=\"the-idea-reflection\">The Idea: Reflection<\/h2>\n<blockquote class=\"def\"><span class=\"deflab\">Definition<\/span>\n<p><strong>Reflection<\/strong> means one step writes, another step reviews, and the review is used to rewrite. The loop repeats until the work is good enough.<\/p>\n<\/blockquote>\n<figure class=\"visual\"><div class=\"em-fig\"><svg class=\"em-svg\" viewBox=\"0 0 760 215\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"ga\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#9aa3a2\"/><\/marker><marker id=\"gb\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#c9583a\"/><\/marker><\/defs><circle cx=\"45.0\" cy=\"105.0\" r=\"22\" fill=\"#fff\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"45.0\" y=\"109.0\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#0e3b3a\">START<\/text><rect x=\"120.0\" y=\"86.0\" width=\"100\" height=\"38\" rx=\"9\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"170.0\" y=\"110.2\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">writer<\/text><rect x=\"290.0\" y=\"86.0\" width=\"120\" height=\"38\" rx=\"9\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"350.0\" y=\"110.2\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">reviewer<\/text><circle cx=\"650.0\" cy=\"105.0\" r=\"22\" fill=\"#fff\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"650.0\" y=\"109.0\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#0e3b3a\">END<\/text><line x1=\"67.0\" y1=\"105.0\" x2=\"118.0\" y2=\"105.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><line x1=\"222.0\" y1=\"105.0\" x2=\"288.0\" y2=\"105.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><line x1=\"412.0\" y1=\"105.0\" x2=\"626.0\" y2=\"105.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><text x=\"520\" y=\"90\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a5c5b\">approved, or 3 attempts: END<\/text><path d=\"M 350 86 Q 260 20 170 86\" fill=\"none\" stroke=\"#c9583a\" stroke-width=\"2.6\" marker-end=\"url(#gb)\"/><text x=\"260\" y=\"34\" font-size=\"14\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#c9583a\">rejected: feedback goes back<\/text><rect x=\"55.0\" y=\"174.0\" width=\"70\" height=\"32\" rx=\"8\" fill=\"#fbf1d3\" stroke=\"#efdca0\" stroke-width=\"1.6\"/><text x=\"90.0\" y=\"194.0\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#8a6a12\" font-family=\"Consolas, monospace\">topic<\/text><rect x=\"155.0\" y=\"174.0\" width=\"70\" height=\"32\" rx=\"8\" fill=\"#fbf1d3\" stroke=\"#efdca0\" stroke-width=\"1.6\"/><text x=\"190.0\" y=\"194.0\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#8a6a12\" font-family=\"Consolas, monospace\">draft<\/text><rect x=\"250.0\" y=\"174.0\" width=\"160\" height=\"32\" rx=\"8\" fill=\"#fbf1d3\" stroke=\"#efdca0\" stroke-width=\"1.6\"/><text x=\"330.0\" y=\"194.0\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#8a6a12\" font-family=\"Consolas, monospace\">reviewer_feedback<\/text><rect x=\"440.0\" y=\"174.0\" width=\"120\" height=\"32\" rx=\"8\" fill=\"#fbf1d3\" stroke=\"#efdca0\" stroke-width=\"1.6\"/><text x=\"500.0\" y=\"194.0\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#8a6a12\" font-family=\"Consolas, monospace\">is_approved<\/text><rect x=\"585.0\" y=\"174.0\" width=\"90\" height=\"32\" rx=\"8\" fill=\"#fbf1d3\" stroke=\"#efdca0\" stroke-width=\"1.6\"/><text x=\"630.0\" y=\"194.0\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#8a6a12\" font-family=\"Consolas, monospace\">attempt<\/text><text x=\"10\" y=\"150\" font-size=\"12\" font-weight=\"800\" text-anchor=\"start\" fill=\"#7a7367\">THE STATE<\/text><\/svg><\/div><div class=\"em-tbl\"><table>\n<tr><th>State key<\/th><th>Who writes it<\/th><th>What it holds<\/th><\/tr>\n<tr><td><code>topic<\/code><\/td><td>you, at the start<\/td><td>what the post is about<\/td><\/tr>\n<tr><td><code>draft<\/code><\/td><td>writer<\/td><td>the latest version of the post<\/td><\/tr>\n<tr><td><code>attempt<\/code><\/td><td>writer<\/td><td>how many drafts so far<\/td><\/tr>\n<tr><td><code>reviewer_feedback<\/code><\/td><td>reviewer<\/td><td>what to fix<\/td><\/tr>\n<tr><td><code>is_approved<\/code><\/td><td>reviewer<\/td><td>true or false<\/td><\/tr>\n<\/table><\/div>\n<div class=\"em-cap\">The five keys of your <code>State<\/code> in <code>01_iterative.py<\/code>.<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c3\" id=\"the-writer-and-the-reviewer\">The Writer and the Reviewer<\/h2>\n<p>Each node has one job, and its own temperature.<\/p>\n<figure class=\"visual\"><div class=\"hl\" data-x=\"1\"><pre><span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">writer_node<\/span><span class=\"p\">(<\/span><span class=\"n\">state<\/span><span class=\"p\">:<\/span><span class=\"n\">State<\/span><span class=\"p\">)<\/span><span class=\"o\">-&gt;<\/span><span class=\"nb\">dict<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">    <\/span><span class=\"sd\">\"\"\"Write the post on give topic and also improve if any feedback is there?\"\"\"<\/span>\n    <span class=\"n\">attempt<\/span> <span class=\"o\">=<\/span> <span class=\"n\">state<\/span><span class=\"o\">.<\/span><span class=\"n\">get<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"attempt\"<\/span><span class=\"p\">,<\/span><span class=\"mi\">0<\/span><span class=\"p\">)<\/span> <span class=\"o\">+<\/span><span class=\"mi\">1<\/span>\n    <span class=\"n\">chain<\/span> <span class=\"o\">=<\/span> <span class=\"n\">writter_prompt<\/span> <span class=\"o\">|<\/span> <span class=\"n\">writter_llm<\/span> <span class=\"o\">|<\/span> <span class=\"n\">parser<\/span>\n    <span class=\"n\">response<\/span> <span class=\"o\">=<\/span>  <span class=\"n\">chain<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">({<\/span>\n                        <span class=\"s2\">\"topic\"<\/span><span class=\"p\">:<\/span><span class=\"n\">state<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"topic\"<\/span><span class=\"p\">],<\/span>\n                        <span class=\"s2\">\"draft\"<\/span><span class=\"p\">:<\/span><span class=\"n\">state<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"draft\"<\/span><span class=\"p\">]<\/span> <span class=\"p\">,<\/span>\n                        <span class=\"s2\">\"feedback\"<\/span><span class=\"p\">:<\/span><span class=\"n\">state<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"reviewer_feedback\"<\/span><span class=\"p\">]})<\/span>\n\n    <span class=\"k\">return<\/span> <span class=\"p\">{<\/span><span class=\"s2\">\"draft\"<\/span><span class=\"p\">:<\/span><span class=\"n\">response<\/span><span class=\"p\">,<\/span><span class=\"s2\">\"attempt\"<\/span><span class=\"p\">:<\/span><span class=\"n\">attempt<\/span><span class=\"p\">}<\/span>\n\n<span class=\"k\">class<\/span><span class=\"w\"> <\/span><span class=\"nc\">ReviewerFeedBack<\/span><span class=\"p\">(<\/span><span class=\"n\">BaseModel<\/span><span class=\"p\">):<\/span>\n    <span class=\"n\">is_approved<\/span> <span class=\"p\">:<\/span> <span class=\"nb\">bool<\/span> <span class=\"o\">=<\/span> <span class=\"n\">Field<\/span><span class=\"p\">(<\/span><span class=\"n\">description<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"Weather Draft is approved or not\"<\/span><span class=\"p\">)<\/span>\n    <span class=\"n\">feedback<\/span><span class=\"p\">:<\/span><span class=\"nb\">str<\/span><span class=\"o\">=<\/span><span class=\"n\">Field<\/span><span class=\"p\">(<\/span><span class=\"n\">description<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"Feedback of draft to improve\"<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">structured_reviewer<\/span> <span class=\"o\">=<\/span> <span class=\"n\">reviewer_llm<\/span><span class=\"o\">.<\/span><span class=\"n\">with_structured_output<\/span><span class=\"p\">(<\/span><span class=\"n\">ReviewerFeedBack<\/span><span class=\"p\">)<\/span>\n\n<span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">reviewer_node<\/span><span class=\"p\">(<\/span><span class=\"n\">state<\/span><span class=\"p\">:<\/span><span class=\"n\">State<\/span><span class=\"p\">)<\/span><span class=\"o\">-&gt;<\/span><span class=\"nb\">dict<\/span><span class=\"p\">:<\/span>\n    <span class=\"n\">draft<\/span> <span class=\"o\">=<\/span> <span class=\"n\">state<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"draft\"<\/span><span class=\"p\">]<\/span>\n    <span class=\"n\">topic<\/span> <span class=\"o\">=<\/span> <span class=\"n\">state<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"topic\"<\/span><span class=\"p\">]<\/span>\n    <span class=\"n\">chain<\/span> <span class=\"o\">=<\/span> <span class=\"n\">reviewer_prompt<\/span> <span class=\"o\">|<\/span> <span class=\"n\">structured_reviewer<\/span>\n    <span class=\"n\">response<\/span> <span class=\"o\">=<\/span> <span class=\"n\">chain<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">({<\/span><span class=\"s2\">\"draft\"<\/span><span class=\"p\">:<\/span><span class=\"n\">draft<\/span><span class=\"p\">,<\/span><span class=\"s2\">\"topic\"<\/span><span class=\"p\">:<\/span><span class=\"n\">topic<\/span><span class=\"p\">})<\/span>\n\n    <span class=\"k\">return<\/span> <span class=\"p\">{<\/span><span class=\"s2\">\"reviewer_feedback\"<\/span><span class=\"p\">:<\/span><span class=\"n\">response<\/span><span class=\"o\">.<\/span><span class=\"n\">feedback<\/span><span class=\"p\">,<\/span><span class=\"s2\">\"is_approved\"<\/span><span class=\"p\">:<\/span><span class=\"n\">response<\/span><span class=\"o\">.<\/span><span class=\"n\">is_approved<\/span> <span class=\"p\">}<\/span><\/pre><\/div>\n<div class=\"px\">\n  <div class=\"px-r\"><span>Writer<\/span><div>Adds 1 to <code>attempt<\/code>. On the first try it writes fresh. After a rejection it gets the old draft and the feedback, and rewrites. Its model uses <code>temperature=0.7<\/code>, which is more creative.<\/div><\/div>\n  <div class=\"px-r\"><span>Reviewer<\/span><div>Reads the draft against five criteria and returns <b>two things<\/b>: <code>is_approved<\/code> and <code>feedback<\/code>. Its model uses <code>temperature=0.3<\/code>, which is stricter.<\/div><\/div>\n  <div class=\"px-r hi\"><span>Structured output<\/span><div><code>with_structured_output(ReviewerFeedBack)<\/code> makes the reviewer answer in a fixed shape, so the loop can test <code>is_approved<\/code> as a real true or false. You learned this in the Structured Output lesson.<\/div><\/div>\n<\/div><\/figure>\n<hr />\n<h2 class=\"c4\" id=\"the-stop-rule\">The Stop Rule<\/h2>\n<p>A loop must always know when to stop.<\/p>\n<figure class=\"visual\"><div class=\"hl\" data-x=\"1\"><pre><span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">quality_gate<\/span><span class=\"p\">(<\/span><span class=\"n\">state<\/span><span class=\"p\">:<\/span><span class=\"n\">State<\/span><span class=\"p\">):<\/span>\n    <span class=\"k\">if<\/span> <span class=\"n\">state<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"is_approved\"<\/span><span class=\"p\">]:<\/span>\n        <span class=\"k\">return<\/span> <span class=\"n\">END<\/span>\n    <span class=\"k\">elif<\/span> <span class=\"n\">state<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"attempt\"<\/span><span class=\"p\">]<\/span> <span class=\"o\">&gt;=<\/span><span class=\"mi\">3<\/span><span class=\"p\">:<\/span>\n        <span class=\"k\">return<\/span> <span class=\"n\">END<\/span>\n    <span class=\"k\">else<\/span><span class=\"p\">:<\/span>\n        <span class=\"k\">return<\/span> <span class=\"s2\">\"writer\"<\/span><\/pre><\/div>\n<div class=\"em-tbl\"><table>\n<tr><th>Situation<\/th><th>quality_gate returns<\/th><th>So the graph&hellip;<\/th><\/tr>\n<tr><td>the reviewer approved<\/td><td><code>END<\/code><\/td><td>stops, with a good draft<\/td><\/tr>\n<tr><td>not approved, but <code>attempt<\/code> is 3 or more<\/td><td><code>END<\/code><\/td><td>stops anyway, with the best draft so far<\/td><\/tr>\n<tr><td>not approved, fewer than 3 attempts<\/td><td><code>\"writer\"<\/code><\/td><td>loops: the writer rewrites<\/td><\/tr>\n<\/table><\/div>\n<div class=\"px\">\n  <div class=\"px-r\"><span>Why a limit<\/span><div>A reviewer that never approves would loop forever. Every round costs model calls and money.<\/div><\/div>\n  <div class=\"px-r\"><span>What we saw<\/span><div>We tested a loop with no stop rule on the installed LangGraph. It stopped only after <b>10,007 steps<\/b>, with <code>GraphRecursionError<\/code>. With a real model that is thousands of paid calls.<\/div><\/div>\n  <div class=\"px-r hi\"><span>The rule<\/span><div><b>Every loop needs a stop rule.<\/b> Yours has two: approved, or 3 attempts.<\/div><\/div>\n<\/div><div class=\"em-cap\">We also tested your <code>quality_gate<\/code> logic with fake nodes: with a reviewer that never approves, the graph stops with <code>attempt<\/code> equal to 3.<\/div>\n<\/figure>\n", "toc": [{"id": "the-problem-one-try-is-not-enough", "name": "The Problem: One Try Is Not Enough"}, {"id": "the-idea-reflection", "name": "The Idea: Reflection"}, {"id": "the-writer-and-the-reviewer", "name": "The Writer and the Reviewer"}, {"id": "the-stop-rule", "name": "The Stop Rule"}], "search": "", "slides": null, "slideCount": 0, "code": []}};</script>
