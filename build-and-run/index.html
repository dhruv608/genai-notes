<script>window.PAGE = {"id": "n27_2", "root": "../", "lesson": {"id": "n27_2", "title": "Build and Run", "short": "Build and Run", "unit": "Unit 4", "unitName": "Agents with LangGraph", "pos": 9, "of": 16, "sub": "", "info": "The full graph, running it, an example result, and why a pipeline beats one prompt", "html": "<h2 class=\"c4\" id=\"putting-the-graph-together\">Putting the Graph Together<\/h2>\n<p>You already know these lines from the Building a Graph lesson. Here is the full pipeline.<\/p>\n<figure class=\"visual\"><div class=\"hl\" data-x=\"1\"><pre><span class=\"n\">graph<\/span> <span class=\"o\">=<\/span> <span class=\"n\">StateGraph<\/span><span class=\"p\">(<\/span><span class=\"n\">pipelinestate<\/span><span class=\"p\">)<\/span>\n\n<span class=\"n\">graph<\/span><span class=\"o\">.<\/span><span class=\"n\">add_node<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"editor\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">editor_node<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">graph<\/span><span class=\"o\">.<\/span><span class=\"n\">add_node<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"scriptwriter\"<\/span><span class=\"p\">,<\/span><span class=\"n\">scriptwriter_node<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">graph<\/span><span class=\"o\">.<\/span><span class=\"n\">add_node<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"translator\"<\/span><span class=\"p\">,<\/span><span class=\"n\">tranlator_node<\/span><span class=\"p\">)<\/span>\n\n\n<span class=\"n\">graph<\/span><span class=\"o\">.<\/span><span class=\"n\">add_edge<\/span><span class=\"p\">(<\/span><span class=\"n\">START<\/span><span class=\"p\">,<\/span><span class=\"s2\">\"editor\"<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">graph<\/span><span class=\"o\">.<\/span><span class=\"n\">add_edge<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"editor\"<\/span><span class=\"p\">,<\/span><span class=\"s2\">\"scriptwriter\"<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">graph<\/span><span class=\"o\">.<\/span><span class=\"n\">add_edge<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"scriptwriter\"<\/span><span class=\"p\">,<\/span><span class=\"s2\">\"translator\"<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">graph<\/span><span class=\"o\">.<\/span><span class=\"n\">add_edge<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"translator\"<\/span><span class=\"p\">,<\/span><span class=\"n\">END<\/span><span class=\"p\">)<\/span><\/pre><\/div>\n<div class=\"em-fig\"><svg class=\"em-svg\" viewBox=\"0 0 760 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"ga\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#9aa3a2\"/><\/marker><\/defs><circle cx=\"45\" cy=\"50\" r=\"22\" fill=\"#fff\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"45\" y=\"54\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#0e3b3a\">START<\/text><rect x=\"120.0\" y=\"31.0\" width=\"100\" height=\"38\" rx=\"9\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"170.0\" y=\"55.2\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">editor<\/text><rect x=\"265.0\" y=\"31.0\" width=\"140\" height=\"38\" rx=\"9\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"335.0\" y=\"55.2\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">scriptwriter<\/text><rect x=\"440.0\" y=\"31.0\" width=\"120\" height=\"38\" rx=\"9\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"500.0\" y=\"55.2\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">translator<\/text><circle cx=\"660\" cy=\"50\" r=\"22\" fill=\"#fff\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"660\" y=\"54\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#0e3b3a\">END<\/text><line x1=\"67.0\" y1=\"50.0\" x2=\"118.0\" y2=\"50.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><line x1=\"222.0\" y1=\"50.0\" x2=\"263.0\" y2=\"50.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><line x1=\"407.0\" y1=\"50.0\" x2=\"438.0\" y2=\"50.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><line x1=\"562.0\" y1=\"50.0\" x2=\"636.0\" y2=\"50.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><\/svg><\/div><div class=\"em-point\"><b>Three nodes, four edges.<\/b> <code>START<\/code> to the editor, then each node to the next, and the translator to <code>END<\/code>. The order of the edges is the order of the work.<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c5\" id=\"run-it-and-read-the-result\">Run It and Read the Result<\/h2>\n<p>We invoke the graph with only the raw text.<\/p>\n<figure class=\"visual\"><div class=\"hl\" data-x=\"1\"><pre><span class=\"n\">app<\/span> <span class=\"o\">=<\/span> <span class=\"n\">graph<\/span><span class=\"o\">.<\/span><span class=\"n\">compile<\/span><span class=\"p\">()<\/span>\n<span class=\"n\">result<\/span> <span class=\"o\">=<\/span> <span class=\"n\">app<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">({<\/span>\n    <span class=\"s2\">\"raw_input\"<\/span> <span class=\"p\">:<\/span><span class=\"s2\">\"AI agents are the future of tech. They can think, plan, and act on their own. LangGraph helps you build these agents with proper control and memory.\"<\/span>\n<span class=\"p\">})<\/span>\n\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">result<\/span><span class=\"p\">[<\/span><span class=\"s1\">'final_output'<\/span><span class=\"p\">])<\/span><\/pre><\/div>\n<div class=\"em-tbl\"><table>\n<tr><th>Step<\/th><th>State key<\/th><th>Example text<\/th><\/tr>\n<tr><td>Input<\/td><td><b>raw_input<\/b><\/td><td>AI agents are the future of tech. They can think, plan, and act on their own. LangGraph helps you build these agents with proper control and memory.<\/td><\/tr><tr><td>Editor<\/td><td><b>edited_text<\/b><\/td><td>AI agents are the future of technology. They can think, plan and act on their own. LangGraph helps you build these agents with proper control and memory.<\/td><\/tr><tr><td>Scriptwriter<\/td><td><b>script_text<\/b><\/td><td>Imagine software that thinks, plans and acts all by itself. That is an AI agent! And LangGraph gives you the control and the memory to build one.<\/td><\/tr><tr><td>Translator<\/td><td><b>final_output<\/b><\/td><td>Socho, ek software jo khud sochta hai, plan banata hai aur kaam bhi karta hai. Wahi hai AI agent! Aur LangGraph tumhe control aur memory deta hai, taaki tum apna agent bana sako.<\/td><\/tr>\n<\/table><\/div>\n<div class=\"em-cap\">An <b>example<\/b>, written by hand to show the idea. It is not real model output. Your model will word it differently.<\/div>\n<div class=\"em-point\"><b>invoke returns the whole final state.<\/b> It holds all four keys, so you can print any middle step, such as <code>result['edited_text']<\/code>, to see what a node did. <code>print(result['final_output'])<\/code> shows only the last one.<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c1\" id=\"why-a-pipeline-beats-one-big-prompt\">Why a Pipeline Beats One Big Prompt<\/h2>\n<p>It costs more calls, but it gives you more control.<\/p>\n<figure class=\"visual\"><div class=\"em-tbl\"><table>\n<tr><th><\/th><th>One big prompt<\/th><th>Sequential graph<\/th><\/tr>\n<tr><td><b>Quality<\/b><\/td><td>one model call does three jobs, so each job gets less care<\/td><td>each node does one small job well<\/td><\/tr>\n<tr><td><b>Finding a problem<\/b><\/td><td>you only see the final text<\/td><td>every step's result is in the state, so you see where it went wrong<\/td><\/tr>\n<tr><td><b>Changing one job<\/b><\/td><td>you rewrite the whole prompt<\/td><td>you change one node, such as a new role for the translator<\/td><\/tr>\n<tr><td><b>The cost<\/b><\/td><td>one model call<\/td><td>three model calls: more time and money<\/td><\/tr>\n<\/table><\/div>\n<div class=\"em-point\"><b>Use a sequential workflow when the steps always run in the same order,<\/b> for example clean up, rewrite, then format. If a step may need a retry, or the path depends on the result, you need a loop or a conditional edge instead.<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c2\" id=\"quick-revision\">Quick Revision<\/h2>\n<p>The whole lesson on one page.<\/p>\n<figure class=\"visual\"><div class=\"bnt rt4 three\"><div class=\"bnt-t c3\"><div class=\"bnt-h\">Idea<\/div><div class=\"bnt-b\">An assembly line<\/div><div class=\"bnt-p\">Small jobs, one after another. Each node reads what the one before wrote.<\/div><\/div><div class=\"bnt-t c1\"><div class=\"bnt-h\">In code<\/div><div class=\"bnt-b\">Nodes, edges, state<\/div><div class=\"bnt-p\">Three node functions, four edges from START to END, and a state with one key for each result.<\/div><\/div><div class=\"bnt-t c4\"><div class=\"bnt-h\">Trade-off<\/div><div class=\"bnt-b\">More calls, more control<\/div><div class=\"bnt-p\">Three calls cost more than one, but each step is easy to read, test and change.<\/div><\/div><\/div><\/figure>\n<div class=\"docs\"><span class=\"docs-l\">LangGraph docs<\/span><a href=\"https://docs.langchain.com/oss/python/langgraph/workflows-agents\" target=\"_blank\" rel=\"noopener\">Workflows and agents<\/a><\/div>\n\n<div class=\"sc-head code-head\">Code<\/div><details class=\"codecard\"><summary><span class=\"cc-t\">02_sequential.py<\/span><span class=\"cc-f\">02_sequential.py · 95 lines<\/span><span class=\"cc-show\">Show code<\/span><\/summary><div class=\"hl\"><table class=\"hltable\"><tr><td class=\"linenos\"><div class=\"linenodiv\"><pre><span class=\"normal\"> 1<\/span>\n<span class=\"normal\"> 2<\/span>\n<span class=\"normal\"> 3<\/span>\n<span class=\"normal\"> 4<\/span>\n<span class=\"normal\"> 5<\/span>\n<span class=\"normal\"> 6<\/span>\n<span class=\"normal\"> 7<\/span>\n<span class=\"normal\"> 8<\/span>\n<span class=\"normal\"> 9<\/span>\n<span class=\"normal\">10<\/span>\n<span class=\"normal\">11<\/span>\n<span class=\"normal\">12<\/span>\n<span class=\"normal\">13<\/span>\n<span class=\"normal\">14<\/span>\n<span class=\"normal\">15<\/span>\n<span class=\"normal\">16<\/span>\n<span class=\"normal\">17<\/span>\n<span class=\"normal\">18<\/span>\n<span class=\"normal\">19<\/span>\n<span class=\"normal\">20<\/span>\n<span class=\"normal\">21<\/span>\n<span class=\"normal\">22<\/span>\n<span class=\"normal\">23<\/span>\n<span class=\"normal\">24<\/span>\n<span class=\"normal\">25<\/span>\n<span class=\"normal\">26<\/span>\n<span class=\"normal\">27<\/span>\n<span class=\"normal\">28<\/span>\n<span class=\"normal\">29<\/span>\n<span class=\"normal\">30<\/span>\n<span class=\"normal\">31<\/span>\n<span class=\"normal\">32<\/span>\n<span class=\"normal\">33<\/span>\n<span class=\"normal\">34<\/span>\n<span class=\"normal\">35<\/span>\n<span class=\"normal\">36<\/span>\n<span class=\"normal\">37<\/span>\n<span class=\"normal\">38<\/span>\n<span class=\"normal\">39<\/span>\n<span class=\"normal\">40<\/span>\n<span class=\"normal\">41<\/span>\n<span class=\"normal\">42<\/span>\n<span class=\"normal\">43<\/span>\n<span class=\"normal\">44<\/span>\n<span class=\"normal\">45<\/span>\n<span class=\"normal\">46<\/span>\n<span class=\"normal\">47<\/span>\n<span class=\"normal\">48<\/span>\n<span class=\"normal\">49<\/span>\n<span class=\"normal\">50<\/span>\n<span class=\"normal\">51<\/span>\n<span class=\"normal\">52<\/span>\n<span class=\"normal\">53<\/span>\n<span class=\"normal\">54<\/span>\n<span class=\"normal\">55<\/span>\n<span class=\"normal\">56<\/span>\n<span class=\"normal\">57<\/span>\n<span class=\"normal\">58<\/span>\n<span class=\"normal\">59<\/span>\n<span class=\"normal\">60<\/span>\n<span class=\"normal\">61<\/span>\n<span class=\"normal\">62<\/span>\n<span class=\"normal\">63<\/span>\n<span class=\"normal\">64<\/span>\n<span class=\"normal\">65<\/span>\n<span class=\"normal\">66<\/span>\n<span class=\"normal\">67<\/span>\n<span class=\"normal\">68<\/span>\n<span class=\"normal\">69<\/span>\n<span class=\"normal\">70<\/span>\n<span class=\"normal\">71<\/span>\n<span class=\"normal\">72<\/span>\n<span class=\"normal\">73<\/span>\n<span class=\"normal\">74<\/span>\n<span class=\"normal\">75<\/span>\n<span class=\"normal\">76<\/span>\n<span class=\"normal\">77<\/span>\n<span class=\"normal\">78<\/span>\n<span class=\"normal\">79<\/span>\n<span class=\"normal\">80<\/span>\n<span class=\"normal\">81<\/span>\n<span class=\"normal\">82<\/span>\n<span class=\"normal\">83<\/span>\n<span class=\"normal\">84<\/span>\n<span class=\"normal\">85<\/span>\n<span class=\"normal\">86<\/span>\n<span class=\"normal\">87<\/span>\n<span class=\"normal\">88<\/span>\n<span class=\"normal\">89<\/span>\n<span class=\"normal\">90<\/span>\n<span class=\"normal\">91<\/span>\n<span class=\"normal\">92<\/span>\n<span class=\"normal\">93<\/span>\n<span class=\"normal\">94<\/span>\n<span class=\"normal\">95<\/span><\/pre><\/div><\/td><td class=\"code\"><div><pre><span><\/span><span class=\"kn\">import<\/span><span class=\"w\"> <\/span><span class=\"nn\">os<\/span>\n\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">dotenv<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">load_dotenv<\/span>\n\n<span class=\"n\">load_dotenv<\/span><span class=\"p\">()<\/span>\n\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">typing<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">TypedDict<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">rich<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"nb\">print<\/span>\n<span class=\"sd\">\"\"\"State: the shared data that every node reads and updates\"\"\"<\/span>\n<span class=\"k\">class<\/span><span class=\"w\"> <\/span><span class=\"nc\">pipelinestate<\/span><span class=\"p\">(<\/span><span class=\"n\">TypedDict<\/span><span class=\"p\">):<\/span>\n    <span class=\"n\">raw_input<\/span> <span class=\"p\">:<\/span> <span class=\"nb\">str<\/span>\n    <span class=\"n\">edited_text<\/span> <span class=\"p\">:<\/span> <span class=\"nb\">str<\/span>\n    <span class=\"n\">script_text<\/span> <span class=\"p\">:<\/span><span class=\"nb\">str<\/span>\n    <span class=\"n\">final_output<\/span><span class=\"p\">:<\/span><span class=\"nb\">str<\/span>\n\n\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain.chat_models<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">init_chat_model<\/span>\n\n\n<span class=\"n\">model<\/span> <span class=\"o\">=<\/span> <span class=\"n\">init_chat_model<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"mistralai:open-mistral-nemo\"<\/span><span class=\"p\">)<\/span>\n\n<span class=\"sd\">\"\"\"Node = a normal Python function: takes the state, returns only the keys it changes\"\"\"<\/span>\n<span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">editor_node<\/span><span class=\"p\">(<\/span><span class=\"n\">state<\/span><span class=\"p\">:<\/span><span class=\"n\">pipelinestate<\/span><span class=\"p\">):<\/span>\n<span class=\"w\">    <\/span><span class=\"sd\">\"\"\"Stage 1 cleans up the grammer and removes types mistake and refine the tone\"\"\"<\/span>\n    \n    <span class=\"n\">prompt<\/span> <span class=\"o\">=<\/span> <span class=\"p\">(<\/span>\n        <span class=\"sa\">f<\/span><span class=\"s2\">\"\"\"<\/span>\n<span class=\"s2\">        You are an expert copyeditor. Clean up the following raw text. <\/span>\n<span class=\"s2\">        Fix any grammatical errors, spelling mistakes, and smooth out the transition flow <\/span>\n<span class=\"s2\">        while keeping the core message intact. Return only the edited text.<\/span><span class=\"se\">\\n\\n<\/span><span class=\"s2\">\"<\/span>\n<span class=\"s2\">        Text:<\/span><span class=\"se\">\\n<\/span><span class=\"si\">{<\/span><span class=\"n\">state<\/span><span class=\"p\">[<\/span><span class=\"s1\">'raw_input'<\/span><span class=\"p\">]<\/span><span class=\"si\">}<\/span>\n<span class=\"s2\">        \"\"\"<\/span>\n    <span class=\"p\">)<\/span>\n    <span class=\"n\">response<\/span> <span class=\"o\">=<\/span> <span class=\"n\">model<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">(<\/span><span class=\"n\">prompt<\/span><span class=\"p\">)<\/span>\n    \n    <span class=\"k\">return<\/span> <span class=\"p\">{<\/span><span class=\"s2\">\"edited_text\"<\/span><span class=\"p\">:<\/span><span class=\"n\">response<\/span><span class=\"o\">.<\/span><span class=\"n\">content<\/span><span class=\"o\">.<\/span><span class=\"n\">strip<\/span><span class=\"p\">()}<\/span>\n\n<span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">scriptwriter_node<\/span><span class=\"p\">(<\/span><span class=\"n\">state<\/span><span class=\"p\">:<\/span><span class=\"n\">pipelinestate<\/span><span class=\"p\">):<\/span>\n<span class=\"w\">    <\/span><span class=\"sd\">\"\"\"Stage 2: Formats the clean text into an engaging video script style.\"\"\"<\/span>\n    \n    <span class=\"n\">prompt<\/span> <span class=\"o\">=<\/span> <span class=\"p\">(<\/span>\n        <span class=\"s2\">\"You are a charismatic YouTube content creator. Take this edited text and transform \"<\/span>\n        <span class=\"s2\">\"it into a highly engaging, punchy, conversational video script hook. Make it sound \"<\/span>\n        <span class=\"s2\">\"like a real person speaking passionately. Return only the script content.<\/span><span class=\"se\">\\n\\n<\/span><span class=\"s2\">\"<\/span>\n        <span class=\"sa\">f<\/span><span class=\"s2\">\"Edited Text:<\/span><span class=\"se\">\\n<\/span><span class=\"si\">{<\/span><span class=\"n\">state<\/span><span class=\"p\">[<\/span><span class=\"s1\">'edited_text'<\/span><span class=\"p\">]<\/span><span class=\"si\">}<\/span><span class=\"s2\">\"<\/span>\n    <span class=\"p\">)<\/span>\n    \n    <span class=\"n\">response<\/span> <span class=\"o\">=<\/span> <span class=\"n\">model<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">(<\/span><span class=\"n\">prompt<\/span><span class=\"p\">)<\/span>\n    <span class=\"k\">return<\/span> <span class=\"p\">{<\/span><span class=\"s2\">\"script_text\"<\/span><span class=\"p\">:<\/span> <span class=\"n\">response<\/span><span class=\"o\">.<\/span><span class=\"n\">content<\/span><span class=\"o\">.<\/span><span class=\"n\">strip<\/span><span class=\"p\">()}<\/span>\n        \n        \n<span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">tranlator_node<\/span><span class=\"p\">(<\/span><span class=\"n\">state<\/span><span class=\"p\">:<\/span><span class=\"n\">pipelinestate<\/span><span class=\"p\">):<\/span>\n<span class=\"w\">    <\/span><span class=\"sd\">\"\"\"Stage 3: Translates the script into natural flowing Hinglish.\"\"\"<\/span>\n        \n    <span class=\"n\">prompt<\/span> <span class=\"o\">=<\/span> <span class=\"p\">(<\/span>\n        <span class=\"s2\">\"You are an expert content localizer for the Indian market. Take the following script \"<\/span>\n        <span class=\"s2\">\"and convert it into natural, flowing 'Hinglish'. Do not simply translate it sentence-by-sentence \"<\/span>\n        <span class=\"s2\">\"or repeat information. Alternating comfortably between Hindi and English phrases just like \"<\/span>\n        <span class=\"s2\">\"an intellectual tech educator would speak naturally on a live stream. Keep the energy high! \"<\/span>\n        <span class=\"s2\">\"Return only the final Hinglish text.<\/span><span class=\"se\">\\n\\n<\/span><span class=\"s2\">\"<\/span>\n        <span class=\"sa\">f<\/span><span class=\"s2\">\"Script:<\/span><span class=\"se\">\\n<\/span><span class=\"si\">{<\/span><span class=\"n\">state<\/span><span class=\"p\">[<\/span><span class=\"s1\">'script_text'<\/span><span class=\"p\">]<\/span><span class=\"si\">}<\/span><span class=\"s2\">\"<\/span>\n    <span class=\"p\">)<\/span>\n    \n    <span class=\"n\">response<\/span> <span class=\"o\">=<\/span> <span class=\"n\">model<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">(<\/span><span class=\"n\">prompt<\/span><span class=\"p\">)<\/span>\n    <span class=\"k\">return<\/span> <span class=\"p\">{<\/span><span class=\"s2\">\"final_output\"<\/span><span class=\"p\">:<\/span> <span class=\"n\">response<\/span><span class=\"o\">.<\/span><span class=\"n\">content<\/span><span class=\"o\">.<\/span><span class=\"n\">strip<\/span><span class=\"p\">()}<\/span>\n\n\n\n\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langgraph.graph<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">StateGraph<\/span> <span class=\"p\">,<\/span><span class=\"n\">START<\/span> <span class=\"p\">,<\/span> <span class=\"n\">END<\/span>\n\n\n<span class=\"sd\">\"\"\"Build the graph: add nodes (steps), then edges (the order)\"\"\"<\/span>\n<span class=\"n\">graph<\/span> <span class=\"o\">=<\/span> <span class=\"n\">StateGraph<\/span><span class=\"p\">(<\/span><span class=\"n\">pipelinestate<\/span><span class=\"p\">)<\/span>\n\n<span class=\"n\">graph<\/span><span class=\"o\">.<\/span><span class=\"n\">add_node<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"editor\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">editor_node<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">graph<\/span><span class=\"o\">.<\/span><span class=\"n\">add_node<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"scriptwriter\"<\/span><span class=\"p\">,<\/span><span class=\"n\">scriptwriter_node<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">graph<\/span><span class=\"o\">.<\/span><span class=\"n\">add_node<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"translator\"<\/span><span class=\"p\">,<\/span><span class=\"n\">tranlator_node<\/span><span class=\"p\">)<\/span>\n\n\n<span class=\"n\">graph<\/span><span class=\"o\">.<\/span><span class=\"n\">add_edge<\/span><span class=\"p\">(<\/span><span class=\"n\">START<\/span><span class=\"p\">,<\/span><span class=\"s2\">\"editor\"<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">graph<\/span><span class=\"o\">.<\/span><span class=\"n\">add_edge<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"editor\"<\/span><span class=\"p\">,<\/span><span class=\"s2\">\"scriptwriter\"<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">graph<\/span><span class=\"o\">.<\/span><span class=\"n\">add_edge<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"scriptwriter\"<\/span><span class=\"p\">,<\/span><span class=\"s2\">\"translator\"<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">graph<\/span><span class=\"o\">.<\/span><span class=\"n\">add_edge<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"translator\"<\/span><span class=\"p\">,<\/span><span class=\"n\">END<\/span><span class=\"p\">)<\/span>\n\n\n<span class=\"sd\">\"\"\"compile() turns the graph into a Runnable, so we can .invoke() it\"\"\"<\/span>\n<span class=\"n\">app<\/span> <span class=\"o\">=<\/span> <span class=\"n\">graph<\/span><span class=\"o\">.<\/span><span class=\"n\">compile<\/span><span class=\"p\">()<\/span>\n\n\n<span class=\"n\">result<\/span> <span class=\"o\">=<\/span> <span class=\"n\">app<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">({<\/span>\n    <span class=\"s2\">\"raw_input\"<\/span> <span class=\"p\">:<\/span><span class=\"s2\">\"AI agents are the future of tech. They can think, plan, and act on their own. LangGraph helps you build these agents with proper control and memory.\"<\/span>\n<span class=\"p\">})<\/span>\n\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">result<\/span><span class=\"p\">[<\/span><span class=\"s1\">'final_output'<\/span><span class=\"p\">])<\/span>\n<\/pre><\/div><\/td><\/tr><\/table><\/div>\n<\/details>", "toc": [{"id": "putting-the-graph-together", "name": "Putting the Graph Together"}, {"id": "run-it-and-read-the-result", "name": "Run It and Read the Result"}, {"id": "why-a-pipeline-beats-one-big-prompt", "name": "Why a Pipeline Beats One Big Prompt"}, {"id": "quick-revision", "name": "Quick Revision"}], "search": "", "slides": null, "slideCount": 0, "code": []}};</script>
