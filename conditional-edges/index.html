<script>window.PAGE = {"id": "n26_2", "root": "../", "lesson": {"id": "n26_2", "title": "Conditional Edges", "short": "Conditional Edges", "unit": "Unit 4", "unitName": "Agents with LangGraph", "pos": 7, "of": 16, "sub": "", "info": "Conditional edges: a router function that picks the next node, for a loop and for many paths", "html": "<h2 class=\"c5\" id=\"the-problem-not-every-path-is-straight\">The Problem: Not Every Path Is Straight<\/h2>\n<p>Sometimes the next step depends on what happened.<\/p>\n<figure class=\"visual\"><div class=\"px\">\n  <div class=\"px-r\"><span>The issue<\/span><div>After the reviewer, the graph must either stop or go back to the writer.<\/div><\/div>\n  <div class=\"px-r\"><span>The first try<\/span><div>A normal edge from <code>reviewer<\/code> to <code>writer<\/code>: the graph loops forever. A normal edge to <code>END<\/code>: it never loops.<\/div><\/div>\n  <div class=\"px-r\"><span>Why it fails<\/span><div>A normal edge always goes to the same place. The right path depends on the state: is the post approved?<\/div><\/div>\n  <div class=\"px-r hi\"><span>The fix<\/span><div>A <b>conditional edge<\/b>: a small function reads the state and says where to go next.<\/div><\/div>\n<\/div><\/figure>\n<hr />\n<h2 class=\"c1\" id=\"conditional-edges-a-router-function\">Conditional Edges: A Router Function<\/h2>\n<p>A normal edge always goes to the same place. A conditional edge asks a function where to go.<\/p>\n<figure class=\"visual\"><div class=\"hl\" data-x=\"1\"><pre><span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">quality_gate<\/span><span class=\"p\">(<\/span><span class=\"n\">state<\/span><span class=\"p\">:<\/span><span class=\"n\">State<\/span><span class=\"p\">):<\/span>\n    <span class=\"k\">if<\/span> <span class=\"n\">state<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"is_approved\"<\/span><span class=\"p\">]:<\/span>\n        <span class=\"k\">return<\/span> <span class=\"n\">END<\/span>\n    <span class=\"k\">elif<\/span> <span class=\"n\">state<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"attempt\"<\/span><span class=\"p\">]<\/span> <span class=\"o\">&gt;=<\/span><span class=\"mi\">3<\/span><span class=\"p\">:<\/span>\n        <span class=\"k\">return<\/span> <span class=\"n\">END<\/span>\n    <span class=\"k\">else<\/span><span class=\"p\">:<\/span>\n        <span class=\"k\">return<\/span> <span class=\"s2\">\"writer\"<\/span>\n\n<span class=\"n\">graph<\/span><span class=\"o\">.<\/span><span class=\"n\">add_conditional_edges<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"reviewer\"<\/span><span class=\"p\">,<\/span><span class=\"n\">quality_gate<\/span><span class=\"p\">)<\/span><\/pre><\/div>\n<div class=\"em-fig\"><svg class=\"em-svg\" viewBox=\"0 0 760 150\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"ga\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#9aa3a2\"/><\/marker><marker id=\"gb\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#c9583a\"/><\/marker><\/defs><circle cx=\"45.0\" cy=\"90.0\" r=\"22\" fill=\"#fff\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"45.0\" y=\"94.0\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#0e3b3a\">START<\/text><rect x=\"120.0\" y=\"71.0\" width=\"100\" height=\"38\" rx=\"9\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"170.0\" y=\"95.2\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">writer<\/text><rect x=\"275.0\" y=\"71.0\" width=\"120\" height=\"38\" rx=\"9\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"335.0\" y=\"95.2\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">reviewer<\/text><circle cx=\"650.0\" cy=\"90.0\" r=\"22\" fill=\"#fff\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"650.0\" y=\"94.0\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#0e3b3a\">END<\/text><line x1=\"67.0\" y1=\"90.0\" x2=\"118.0\" y2=\"90.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><line x1=\"222.0\" y1=\"90.0\" x2=\"273.0\" y2=\"90.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><line x1=\"397.0\" y1=\"90.0\" x2=\"626.0\" y2=\"90.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><text x=\"512\" y=\"76\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a5c5b\">approved, or 3 attempts: END<\/text><path d=\"M 335 71 Q 252 12 170 71\" fill=\"none\" stroke=\"#c9583a\" stroke-width=\"2.6\" marker-end=\"url(#gb)\"/><text x=\"252\" y=\"22\" font-size=\"14\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#c9583a\">otherwise: back to writer<\/text><\/svg><\/div><div class=\"px\">\n  <div class=\"px-r\"><span>The function<\/span><div>Reads the state and returns the <b>name of the next node<\/b>, or <code>END<\/code>.<\/div><\/div>\n  <div class=\"px-r\"><span>Conditional edge<\/span><div><code>add_conditional_edges(&quot;reviewer&quot;, quality_gate)<\/code>: after <code>reviewer<\/code> finishes, call <code>quality_gate<\/code> and go where it says.<\/div><\/div>\n  <div class=\"px-r hi\"><span>In your loop<\/span><div>Approved, or 3 attempts used: <code>END<\/code>. Otherwise: back to <code>writer<\/code>.<\/div><\/div>\n<\/div><div class=\"em-cap\">The code is from your <code>01_iterative.py<\/code>. The full loop is built in the Loops lesson.<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c2\" id=\"one-source-many-paths\">One Source, Many Paths<\/h2>\n<p>The same call can choose between more than two paths.<\/p>\n<figure class=\"visual\"><div class=\"hl\" data-x=\"1\"><pre><span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">route_query<\/span><span class=\"p\">(<\/span><span class=\"n\">state<\/span><span class=\"p\">:<\/span><span class=\"n\">State<\/span><span class=\"p\">)<\/span> <span class=\"o\">-&gt;<\/span> <span class=\"nb\">str<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">    <\/span><span class=\"sd\">\"\"\"Traffic officer: routes to academic_rag, fee_rag, or general.\"\"\"<\/span>\n    <span class=\"k\">if<\/span> <span class=\"n\">state<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"query_type\"<\/span><span class=\"p\">]<\/span> <span class=\"o\">==<\/span> <span class=\"s2\">\"academic\"<\/span><span class=\"p\">:<\/span>\n        <span class=\"k\">return<\/span> <span class=\"s2\">\"academic_rag\"<\/span>\n    <span class=\"k\">elif<\/span> <span class=\"n\">state<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"query_type\"<\/span><span class=\"p\">]<\/span> <span class=\"o\">==<\/span> <span class=\"s2\">\"fee\"<\/span><span class=\"p\">:<\/span>\n        <span class=\"k\">return<\/span> <span class=\"s2\">\"fee_rag\"<\/span>\n    <span class=\"k\">else<\/span><span class=\"p\">:<\/span>\n        <span class=\"k\">return<\/span> <span class=\"s2\">\"general\"<\/span>\n\n<span class=\"n\">workflow<\/span><span class=\"o\">.<\/span><span class=\"n\">add_conditional_edges<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"classifier\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">route_query<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">workflow<\/span><span class=\"o\">.<\/span><span class=\"n\">add_edge<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"academic_rag\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"response\"<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">workflow<\/span><span class=\"o\">.<\/span><span class=\"n\">add_edge<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"fee_rag\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"response\"<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">workflow<\/span><span class=\"o\">.<\/span><span class=\"n\">add_edge<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"general\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"response\"<\/span><span class=\"p\">)<\/span><\/pre><\/div>\n<div class=\"em-fig\"><svg class=\"em-svg\" viewBox=\"0 0 760 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"ga\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#9aa3a2\"/><\/marker><marker id=\"gb\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#c9583a\"/><\/marker><\/defs><circle cx=\"35.0\" cy=\"135.0\" r=\"22\" fill=\"#fff\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"35.0\" y=\"139.0\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#0e3b3a\">START<\/text><rect x=\"70.0\" y=\"116.0\" width=\"110\" height=\"38\" rx=\"9\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"125.0\" y=\"140.2\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">classifier<\/text><polygon points=\"268,103 326,135 268,167 210,135\" fill=\"#fbf1d3\" stroke=\"#8a6a12\" stroke-width=\"1.6\"/><text x=\"268\" y=\"139\" font-size=\"13\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#8a6a12\">route_query<\/text><rect x=\"365.0\" y=\"26.0\" width=\"130\" height=\"38\" rx=\"9\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"430.0\" y=\"50.2\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">academic_rag<\/text><line x1=\"318.0\" y1=\"103.5\" x2=\"364.0\" y2=\"45.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><line x1=\"496.0\" y1=\"45.0\" x2=\"540.0\" y2=\"103.5\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><rect x=\"365.0\" y=\"116.0\" width=\"130\" height=\"38\" rx=\"9\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"430.0\" y=\"140.2\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">fee_rag<\/text><line x1=\"318.0\" y1=\"135.0\" x2=\"364.0\" y2=\"135.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><line x1=\"496.0\" y1=\"135.0\" x2=\"540.0\" y2=\"135.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><rect x=\"365.0\" y=\"206.0\" width=\"130\" height=\"38\" rx=\"9\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"430.0\" y=\"230.2\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">general<\/text><line x1=\"318.0\" y1=\"166.5\" x2=\"364.0\" y2=\"225.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><line x1=\"496.0\" y1=\"225.0\" x2=\"540.0\" y2=\"166.5\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><rect x=\"558.0\" y=\"116.0\" width=\"100\" height=\"38\" rx=\"9\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"608.0\" y=\"140.2\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">response<\/text><circle cx=\"725.0\" cy=\"135.0\" r=\"20\" fill=\"#fff\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"725.0\" y=\"139.0\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#0e3b3a\">END<\/text><line x1=\"57.0\" y1=\"135.0\" x2=\"78.0\" y2=\"135.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><line x1=\"192.0\" y1=\"135.0\" x2=\"202.0\" y2=\"135.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><line x1=\"658.0\" y1=\"135.0\" x2=\"705.0\" y2=\"135.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><\/svg><\/div><div class=\"px\">\n  <div class=\"px-r\"><span>The router<\/span><div><code>route_query<\/code> returns <code>academic_rag<\/code>, <code>fee_rag<\/code> or <code>general<\/code>. The same call handles three paths.<\/div><\/div>\n  <div class=\"px-r hi\"><span>Back together<\/span><div>The three paths each have a normal edge to one <code>response<\/code> node.<\/div><\/div>\n<\/div><div class=\"em-cap\">The code is from your <code>01_conditional_rag.py<\/code>. You will build it in the Conditional RAG lesson.<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c3\" id=\"quick-revision\">Quick Revision<\/h2>\n<p>The whole lesson on one page.<\/p>\n<figure class=\"visual\"><div class=\"bnt rt4 three\"><div class=\"bnt-t c3\"><div class=\"bnt-h\">Nodes<\/div><div class=\"bnt-b\">add_node(name, function)<\/div><div class=\"bnt-p\">A node is a function with a name. The arrows use the name.<\/div><\/div><div class=\"bnt-t c1\"><div class=\"bnt-h\">Edges<\/div><div class=\"bnt-b\">add_edge, and conditional edges<\/div><div class=\"bnt-p\"><code>add_edge(from, to)<\/code> is always the same path. A conditional edge asks a function which node is next. <code>START<\/code> and <code>END<\/code> mark the ends.<\/div><\/div><div class=\"bnt-t c4\"><div class=\"bnt-h\">Run it<\/div><div class=\"bnt-b\">compile, then invoke<\/div><div class=\"bnt-p\"><code>compile()<\/code> makes the app. <code>invoke(state)<\/code> runs it and returns the final state.<\/div><\/div><\/div><\/figure>\n<div class=\"docs\"><span class=\"docs-l\">LangGraph docs<\/span><a href=\"https://docs.langchain.com/oss/python/langgraph/graph-api\" target=\"_blank\" rel=\"noopener\">Graph API<\/a><\/div>\n\n", "toc": [{"id": "the-problem-not-every-path-is-straight", "name": "The Problem: Not Every Path Is Straight"}, {"id": "conditional-edges-a-router-function", "name": "Conditional Edges: A Router Function"}, {"id": "one-source-many-paths", "name": "One Source, Many Paths"}, {"id": "quick-revision", "name": "Quick Revision"}], "search": "", "slides": null, "slideCount": 0, "code": []}};</script>
