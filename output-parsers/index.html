<script>window.PAGE = {"id": "n11_1", "root": "../", "lesson": {"id": "n11_1", "title": "Output Parsers", "short": "Output Parsers", "unit": "Unit 2", "unitName": "Build with LangChain", "pos": 8, "of": 14, "sub": "Output", "info": "What output parsers are and the string, list, JSON and Pydantic parsers", "html": "<h2 class=\"c1\" id=\"1-why-structured-output\">1. Why Structured Output?<\/h2>\n<p>Apps send data through an API, save it in a database, or show it on a screen. All of them need <strong>data<\/strong>. But an LLM always answers in <strong>text<\/strong>.<\/p>\n<figure class=\"visual\"><div class=\"why\">\n  <div class=\"why-m\"><div class=\"why-h\"><span class=\"tag t\">Text<\/span><span class=\"stp-l\">What the LLM gives<\/span><\/div><div class=\"why-t\">Here are four popular programming languages widely used today: 1. **Python** &ndash; Known for its simplicity&hellip;<\/div><\/div>\n  <div class=\"why-a\">&darr;<span>so we convert it<\/span><\/div>\n  <div class=\"why-h\"><span class=\"tag d\">Data<\/span><span class=\"stp-l\">What your app needs<\/span><\/div>\n  <div class=\"why-g\">\n    <div class=\"pxc\"><div class=\"pxc-n\">An API<\/div><div class=\"pxc-v\"><code>{\"languages\": [\"Python\", \"Java\"]}<\/code><\/div><div class=\"pxc-l\">sends JSON<\/div><\/div>\n    <div class=\"pxc\"><div class=\"pxc-n\">A database<\/div><div class=\"pxc-v\"><code>one row per language<\/code><\/div><div class=\"pxc-l\">saves values<\/div><\/div>\n    <div class=\"pxc\"><div class=\"pxc-n\">A screen<\/div><div class=\"btns\"><u>Python<\/u><u>Java<\/u><\/div><div class=\"pxc-l\">shows a list<\/div><\/div>\n  <\/div>\n<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c2\" id=\"2-what-is-an-output-parser\">2. What Is an Output Parser?<\/h2>\n<blockquote class=\"def\"><span class=\"deflab\">Definition<\/span>\n<p>An <strong>output parser<\/strong> <mark class=\"hp\">converts the model's reply text<\/mark> into the <mark class=\"hk\">structure<\/mark> your app needs.<\/p>\n<\/blockquote>\n<figure class=\"visual\"><div class=\"pxflow\">\n  <div class=\"pxc\"><div class=\"pxc-l\">The model replied<\/div><div class=\"pxc-v\"><code>Python, JavaScript, Java, C++<\/code><\/div><div class=\"pxc-l\"><span class=\"tag t\">Text<\/span><\/div><\/div>\n  <div class=\"pxflow-a\">&rarr;<span>output parser<\/span><\/div>\n  <div class=\"pxc\"><div class=\"pxc-l\">Your app gets<\/div><div class=\"btns\"><u>Python<\/u><u>JavaScript<\/u><u>Java<\/u><u>C++<\/u><\/div><div class=\"pxc-l\"><span class=\"tag d\">Data: a list<\/span><\/div><\/div>\n<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c3\" id=\"3-types-of-output-parsers\">3. Types of Output Parsers<\/h2>\n<p>LangChain gives you ready-made parsers. Some of them also give you <strong>format instructions<\/strong>: text you add to your prompt, so the model writes in the right shape. You get it by calling <code>get_format_instructions()<\/code> on the parser.<\/p>\n<figure class=\"visual\"><div class=\"ovl\">\n  <div class=\"ovl-h\"><span>Parser<\/span><span>Gives you<\/span><span>Format instructions<\/span><\/div>\n  <div class=\"ovl-r\"><code>StrOutputParser<\/code><u class=\"d\">str<\/u><u class=\"n\">none<\/u><\/div>\n  <div class=\"ovl-r\"><code>CommaSeparatedListOutputParser<\/code><u class=\"d\">list<\/u><u class=\"t\">added to the prompt<\/u><\/div>\n  <div class=\"ovl-r\"><code>JsonOutputParser<\/code><u class=\"d\">dict<\/u><u class=\"t\">added to the prompt<\/u><\/div>\n  <div class=\"ovl-r\"><code>PydanticOutputParser<\/code><u class=\"d\">your own object<\/u><u class=\"t\">added to the prompt<\/u><\/div>\n<\/div>\n<div class=\"dw\"><div class=\"dw-c t\">\n  <input type=\"radio\" name=\"dwo\" id=\"op1\" checked><label for=\"op1\">StrOutputParser<\/label>\n  <input type=\"radio\" name=\"dwo\" id=\"op2\"><label for=\"op2\">CommaSeparatedListOutputParser<\/label>\n  <input type=\"radio\" name=\"dwo\" id=\"op3\"><label for=\"op3\">JsonOutputParser<\/label>\n  <div class=\"hl\" data-x=\"1\"><pre><span class=\"vop1\"><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_core.output_parsers<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">StrOutputParser<\/span>\n\n<span class=\"n\">res1<\/span> <span class=\"o\">=<\/span> <span class=\"n\">model<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"What is the capital of India? Answer in one word.\"<\/span><span class=\"p\">)<\/span>\n\n<span class=\"n\">str_parser<\/span> <span class=\"o\">=<\/span> <span class=\"n\">StrOutputParser<\/span><span class=\"p\">()<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">str_parser<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">(<\/span><span class=\"n\">res1<\/span><span class=\"p\">))<\/span><\/span><span class=\"vop2\"><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_core.output_parsers<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">CommaSeparatedListOutputParser<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_core.prompts<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">ChatPromptTemplate<\/span>\n\n<span class=\"n\">list_parser<\/span> <span class=\"o\">=<\/span> <span class=\"n\">CommaSeparatedListOutputParser<\/span><span class=\"p\">()<\/span>\n\n<span class=\"n\">template2<\/span> <span class=\"o\">=<\/span> <span class=\"n\">ChatPromptTemplate<\/span><span class=\"o\">.<\/span><span class=\"n\">from_template<\/span><span class=\"p\">(<\/span>\n    <span class=\"s2\">\"Give 4 popular programming languages.<\/span><span class=\"se\">\\n<\/span><span class=\"si\">{format_instructions}<\/span><span class=\"s2\">\"<\/span>\n<span class=\"p\">)<\/span>\n<span class=\"n\">prompt2<\/span> <span class=\"o\">=<\/span> <span class=\"n\">template2<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">({<\/span>\n    <span class=\"s2\">\"format_instructions\"<\/span><span class=\"p\">:<\/span> <span class=\"n\">list_parser<\/span><span class=\"o\">.<\/span><span class=\"n\">get_format_instructions<\/span><span class=\"p\">(),<\/span>\n<span class=\"p\">})<\/span>\n<span class=\"n\">res2<\/span> <span class=\"o\">=<\/span> <span class=\"n\">model<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">(<\/span><span class=\"n\">prompt2<\/span><span class=\"p\">)<\/span>\n\n<span class=\"n\">languages<\/span> <span class=\"o\">=<\/span> <span class=\"n\">list_parser<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">(<\/span><span class=\"n\">res2<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">languages<\/span><span class=\"p\">)<\/span><\/span><span class=\"vop3\"><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_core.output_parsers<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">JsonOutputParser<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_core.prompts<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">ChatPromptTemplate<\/span>\n\n<span class=\"n\">json_parser<\/span> <span class=\"o\">=<\/span> <span class=\"n\">JsonOutputParser<\/span><span class=\"p\">()<\/span>\n\n<span class=\"n\">template3<\/span> <span class=\"o\">=<\/span> <span class=\"n\">ChatPromptTemplate<\/span><span class=\"o\">.<\/span><span class=\"n\">from_template<\/span><span class=\"p\">(<\/span>\n    <span class=\"s2\">\"Give the capital and currency of <\/span><span class=\"si\">{country}<\/span><span class=\"s2\">.<\/span><span class=\"se\">\\n<\/span><span class=\"si\">{format_instructions}<\/span><span class=\"s2\">\"<\/span>\n<span class=\"p\">)<\/span>\n<span class=\"n\">prompt3<\/span> <span class=\"o\">=<\/span> <span class=\"n\">template3<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">({<\/span>\n    <span class=\"s2\">\"country\"<\/span><span class=\"p\">:<\/span> <span class=\"s2\">\"Japan\"<\/span><span class=\"p\">,<\/span>\n    <span class=\"s2\">\"format_instructions\"<\/span><span class=\"p\">:<\/span> <span class=\"n\">json_parser<\/span><span class=\"o\">.<\/span><span class=\"n\">get_format_instructions<\/span><span class=\"p\">(),<\/span>\n<span class=\"p\">})<\/span>\n<span class=\"n\">res3<\/span> <span class=\"o\">=<\/span> <span class=\"n\">model<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">(<\/span><span class=\"n\">prompt3<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">res3<\/span><span class=\"o\">.<\/span><span class=\"n\">content<\/span><span class=\"p\">)<\/span>\n\n<span class=\"n\">data<\/span> <span class=\"o\">=<\/span> <span class=\"n\">json_parser<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">(<\/span><span class=\"n\">res3<\/span><span class=\"p\">)<\/span><\/span><\/pre><\/div>\n  <div class=\"dw-blk ins\"><span class=\"dw-al\">Format instructions: text added to your prompt<\/span><div class=\"hl\" data-x=\"1\"><pre><span class=\"vop1\">None. StrOutputParser adds nothing to your prompt.<\/span><span class=\"vop2\">Your response should be a list of comma separated values, eg: `foo, bar, baz` or `foo,bar,baz`<\/span><span class=\"vop3\">Return a JSON object.<\/span><\/pre><\/div><\/div>\n  <div class=\"dw-blk\"><span class=\"dw-al\">The model replied<\/span><div class=\"hl\" data-x=\"1\"><pre><span class=\"vop1\"><span class=\"n\">AIMessage<\/span><span class=\"p\">(<\/span><span class=\"n\">content<\/span><span class=\"o\">=<\/span><span class=\"s1\">'New Delhi'<\/span><span class=\"p\">,<\/span> <span class=\"n\">response_metadata<\/span><span class=\"o\">=<\/span><span class=\"p\">{<\/span><span class=\"err\">…<\/span><span class=\"p\">}<\/span><\/span><span class=\"vop2\">Python, JavaScript, Java, C++<\/span><span class=\"vop3\">```json\n<span class=\"p\">{<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">\"country\"<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"Japan\"<\/span><span class=\"p\">,<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">\"capital\"<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"Tokyo\"<\/span><span class=\"p\">,<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">\"currency\"<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"nt\">\"code\"<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"JPY\"<\/span><span class=\"p\">,<\/span>\n<span class=\"w\">    <\/span><span class=\"nt\">\"name\"<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"Japanese Yen\"<\/span><span class=\"p\">,<\/span>\n<span class=\"w\">    <\/span><span class=\"nt\">\"symbol\"<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"¥\"<\/span>\n<span class=\"w\">  <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span>\n```<\/span><\/pre><\/div><\/div>\n  <div class=\"dw-blk get\"><span class=\"dw-al\">You get<\/span><div class=\"hl\" data-x=\"1\"><pre><span class=\"vop1\"><span class=\"s1\">'New Delhi'<\/span><\/span><span class=\"vop2\"><span class=\"p\">[<\/span><span class=\"s1\">'Python'<\/span><span class=\"p\">,<\/span> <span class=\"s1\">'JavaScript'<\/span><span class=\"p\">,<\/span> <span class=\"s1\">'Java'<\/span><span class=\"p\">,<\/span> <span class=\"s1\">'C++'<\/span><span class=\"p\">]<\/span><\/span><span class=\"vop3\"><span class=\"p\">{<\/span><span class=\"s1\">'country'<\/span><span class=\"p\">:<\/span> <span class=\"s1\">'Japan'<\/span><span class=\"p\">,<\/span> <span class=\"s1\">'capital'<\/span><span class=\"p\">:<\/span> <span class=\"s1\">'Tokyo'<\/span><span class=\"p\">,<\/span> <span class=\"s1\">'currency'<\/span><span class=\"p\">:<\/span> <span class=\"p\">{<\/span><span class=\"s1\">'code'<\/span><span class=\"p\">:<\/span> <span class=\"s1\">'JPY'<\/span><span class=\"p\">,<\/span> <span class=\"s1\">'name'<\/span><span class=\"p\">:<\/span> <span class=\"s1\">'Japanese Yen'<\/span><span class=\"p\">,<\/span> <span class=\"s1\">'symbol'<\/span><span class=\"p\">:<\/span> <span class=\"s1\">'¥'<\/span><span class=\"p\">}}<\/span><\/span><\/pre><\/div><\/div>\n  <div class=\"dw-cap\"><span class=\"vop1\">Takes the text out of the AIMessage.<\/span><span class=\"vop2\">Splits the reply on commas into a list.<\/span><span class=\"vop3\">Removes the fences and reads the JSON into a dict.<\/span><\/div>\n<\/div><\/div>\n<\/figure>\n<div class=\"docs\"><span class=\"docs-l\">LangChain docs<\/span><a href=\"https://reference.langchain.com/python/langchain_core/output_parsers/string/StrOutputParser\" target=\"_blank\" rel=\"noopener\">StrOutputParser<\/a><a href=\"https://reference.langchain.com/python/langchain_core/output_parsers/list/CommaSeparatedListOutputParser\" target=\"_blank\" rel=\"noopener\">CommaSeparatedListOutputParser<\/a><a href=\"https://reference.langchain.com/python/langchain_core/output_parsers/json/JsonOutputParser\" target=\"_blank\" rel=\"noopener\">JsonOutputParser<\/a><a href=\"https://reference.langchain.com/python/langchain_core/output_parsers/pydantic/PydanticOutputParser\" target=\"_blank\" rel=\"noopener\">PydanticOutputParser<\/a><\/div>\n\n<div class=\"sc-head code-head\">Code<\/div><details class=\"codecard\"><summary><span class=\"cc-t\">Output parsers<\/span><span class=\"cc-f\">01_output_parsers.py · 55 lines<\/span><span class=\"cc-show\"
