<script>window.PAGE = {"id": "n02_2", "root": "../", "lesson": {"id": "n02_2", "title": "GenAI in Action", "short": "GenAI in Action", "unit": "Unit 1", "unitName": "Start Here: GenAI Basics", "pos": 2, "of": 7, "sub": "", "info": "What GenAI creates and what AI engineers build", "html": "<h2 class=\"c4\" id=\"4-what-can-generative-ai-create\">1. What Can Generative AI Create?<\/h2>\n<figure class=\"visual\"><div class=\"exl\">\n  <div class=\"exl-h\"><span><\/span><span>Type<\/span><span>What it creates<\/span><\/div>\n  <div class=\"exl-r\"><span class=\"n\">01<\/span><b>Text<\/b><span class=\"d\">Answers, emails, summaries, stories<\/span><\/div>\n  <div class=\"exl-r\"><span class=\"n\">02<\/span><b>Images<\/b><span class=\"d\">Art, posters, product photos<\/span><\/div>\n  <div class=\"exl-r\"><span class=\"n\">03<\/span><b>Audio<\/b><span class=\"d\">Human-like voices and music<\/span><\/div>\n  <div class=\"exl-r\"><span class=\"n\">04<\/span><b>Video<\/b><span class=\"d\">Short clips from a description<\/span><\/div>\n  <div class=\"exl-r\"><span class=\"n\">05<\/span><b>Code<\/b><span class=\"d\">Writes, explains and fixes programs<\/span><\/div>\n<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c5\" id=\"5-meet-the-ai-engineer\">2. Meet the AI Engineer<\/h2>\n<p>An <strong>AI Engineer<\/strong> builds real products with LLMs:<\/p>\n<figure class=\"visual\"><div class=\"hub2\">\n  <div class=\"hub2-top\"><b>AI Engineer<\/b><span>builds real products with LLMs<\/span><\/div>\n  <div class=\"hub2-stem\"><\/div>\n  <div class=\"hub2-kids\">\n    <div class=\"hub2-kid\"><h5>Build LLM apps<\/h5><p>Chatbots, assistants and automation<\/p><\/div>\n    <div class=\"hub2-kid\"><h5>Connect company data<\/h5><p>RAG: answers from your own documents<\/p><\/div>\n    <div class=\"hub2-kid\"><h5>Build agents<\/h5><p>AI that uses tools and completes tasks<\/p><\/div>\n    <div class=\"hub2-kid\"><h5>Deploy &amp; monitor<\/h5><p>Run AI in production: cost, speed, quality<\/p><\/div>\n    <div class=\"hub2-kid\"><h5>Customise models<\/h5><p>Fine-tune a model on your own data<\/p><\/div>\n  <\/div>\n<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c1\" id=\"6-what-ai-engineers-build\">3. What AI Engineers Build<\/h2>\n<p>An AI Engineer takes a model like ChatGPT or Gemini and builds it into something people actually use.<\/p>\n<figure class=\"visual\"><div class=\"exl ae\">\n  <div class=\"exl-h\"><span><\/span><span>What<\/span><span>What it is<\/span><span>Example<\/span><\/div>\n  <div class=\"exl-r\"><span class=\"n\">01<\/span><b>AI platforms<\/b><span class=\"d\">Assistants and tools that people log in to use<\/span><span class=\"in\">A support assistant for a company<\/span><\/div>\n  <div class=\"exl-r\"><span class=\"n\">02<\/span><b>AI agents<\/b><span class=\"d\">AI that uses tools and finishes tasks for you<\/span><span class=\"in\">Books a meeting, emails the invite<\/span><\/div>\n  <div class=\"exl-r\"><span class=\"n\">03<\/span><b>AI in workflows<\/b><span class=\"d\">Add AI to the tools a team already uses<\/span><span class=\"in\">Summarise emails, draft replies<\/span><\/div>\n<\/div>\n<\/figure>", "toc": [{"id": "4-what-can-generative-ai-create", "name": "4. What Can Generative AI Create?"}, {"id": "5-meet-the-ai-engineer", "name": "5. Meet the AI Engineer"}, {"id": "6-what-ai-engineers-build", "name": "6. What AI Engineers Build"}], "search": "", "slides": null, "slideCount": 0, "code": []}};</script>
