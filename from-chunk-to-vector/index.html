<script>window.PAGE = {"id": "n19_2", "root": "../", "lesson": {"id": "n19_2", "title": "From Chunk to Vector", "short": "From Chunk to Vector", "unit": "Unit 3", "unitName": "Chat with Your Data (RAG)", "pos": 3, "of": 11, "sub": "", "info": "A chunk to a vector: the ready-made model, its table, attention, average and normalize", "html": "<h2 class=\"c5\" id=\"5-the-goal\">1. The Goal<\/h2>\n<p>We have a chunk of text, \"the river bank\". We want one vector for it. Who turns the chunk into a vector?<\/p>\n<figure class=\"visual\"><div class=\"em-g2\">\n  <div class=\"em-g2-b\"><div class=\"stp-l\">We have<\/div><div class=\"em-q\">\"the river bank\"<\/div><div class=\"em-goal-s\">one chunk of text<\/div><\/div>\n  <div class=\"em-g2-m\"><div class=\"em-g2-a\">&rarr;<\/div><div class=\"em-g2-c\"><b>Embedding<\/b><b>model<\/b><\/div><div class=\"em-g2-a\">&rarr;<\/div><\/div>\n  <div class=\"em-g2-b out\"><div class=\"stp-l\">We want<\/div><div class=\"em-q\">[0.9, 0.3, 0.3]<\/div><div class=\"em-goal-s\">one vector, the same size every time<\/div><\/div>\n<\/div>\n<div class=\"em-ans\"><div class=\"stp-l\">The answer<\/div><div class=\"em-ans-p\">The embedding model turns the chunk into the vector. A company such as OpenAI or Mistral already made it. We do not build it. Next we look inside it, to see how it works.<\/div><\/div>\n<\/figure>\n<hr />\n<h2 class=\"c1\" id=\"6-inside-the-embedding-model-four-steps\">2. Inside the Embedding Model: Four Steps<\/h2>\n<p>The embedding model is already made by a company. We are not building it. We only look inside to see how it works. It does four steps, one after another.<\/p>\n<figure class=\"visual\"><div class=\"em-steps\">\n  <div class=\"em-sp\"><div class=\"em-sp-h\">Step 1<\/div><div class=\"em-sp-b\"><b>Tokenizer<\/b>Cut the chunk into pieces and give each piece an ID.<\/div><div class=\"em-sp-o\"><span>comes out<\/span><code>318, 12456, 6190<\/code><\/div><\/div>\n  <div class=\"em-sp\"><div class=\"em-sp-h\">Step 2<\/div><div class=\"em-sp-b\"><b>Embedding table<\/b>Look up one row of numbers for each ID, and copy it.<\/div><div class=\"em-sp-o\"><span>comes out<\/span>3 rows of numbers<\/div><\/div>\n  <div class=\"em-sp\"><div class=\"em-sp-h\">Step 3<\/div><div class=\"em-sp-b\"><b>Attention<\/b>Each row looks at the other rows and changes using the context.<\/div><div class=\"em-sp-o\"><span>comes out<\/span>3 rows that know the context<\/div><\/div>\n  <div class=\"em-sp last\"><div class=\"em-sp-h\">Step 4<\/div><div class=\"em-sp-b\"><b>Average and normalize<\/b>Mix the rows into one, and set its length to 1.<\/div><div class=\"em-sp-o\"><span>comes out<\/span>1 vector<\/div><\/div>\n<\/div>\n<div class=\"em-cap\">Steps 1 and 4 are plain programs. Steps 2 and 3 use numbers that were learned when the company trained the model.<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c2\" id=\"7-step-1-the-tokenizer-cuts-the-text\">3. Step 1: The Tokenizer Cuts the Text<\/h2>\n<p>The first step cuts the chunk into small pieces, and gives each piece an ID.<\/p>\n<figure class=\"visual\"><div class=\"em-lk\">\n  <div class=\"em-lk-r\"><span class=\"em-lk-h\">The chunk<\/span><div class=\"em-chips\"><u>the river bank<\/u><\/div><\/div>\n  <div class=\"em-lk-r\"><span class=\"em-lk-h\">Cut into pieces<\/span><div class=\"em-chips\"><u>the<\/u><u>river<\/u><u>bank<\/u><\/div><\/div>\n  <div class=\"em-lk-r\"><span class=\"em-lk-h\">Each piece gets an ID<\/span><div class=\"em-chips\"><u class=\"id\">318<\/u><u class=\"id\">12456<\/u><u class=\"id\">6190<\/u><\/div><\/div>\n<\/div>\n<ul class=\"emp-pts\">\n  <li><b>The tokenizer is a normal program.<\/b> It is not a neural network. It has a fixed list of pieces and cuts the text using it.<\/li>\n  <li><b>Pieces are not always whole words.<\/b> A rare word can be split into several pieces. That is how the model can handle any word.<\/li>\n  <li><b>The ID is a row number.<\/b> In the next step we use it to find a row in the embedding table.<\/li>\n  <li><b>A model needs its own tokenizer.<\/b> Its IDs match the rows of its own embedding table.<\/li>\n<\/ul>\n<\/figure>\n<hr />\n<h2 class=\"c3\" id=\"8-step-2-the-embedding-table-gives-the-rows\">4. Step 2: The Embedding Table Gives the Rows<\/h2>\n<p>The second step looks up one row of numbers for each ID in the <strong>embedding table<\/strong>.<\/p>\n<figure class=\"visual\"><div class=\"em-lk\">\n  <div class=\"em-lk-r\"><span class=\"em-lk-h\">Text<\/span><div class=\"em-chips\"><u>the<\/u><u>river<\/u><u>bank<\/u><\/div><\/div>\n  <div class=\"em-lk-r\"><span class=\"em-lk-h\">IDs from the tokenizer<\/span><div class=\"em-chips\"><u class=\"id\">318<\/u><u class=\"id\">12456<\/u><u class=\"id\">6190<\/u><\/div><\/div>\n  <div class=\"em-lk-r\"><span class=\"em-lk-h\">Rows copied from the embedding table<\/span><div><div class=\"em-mat \"><table><tr><th><\/th><th>col 1<\/th><th>col 2<\/th><th>col 3<\/th><\/tr><tr><th>the<\/th><td>0.50<\/td><td>0.40<\/td><td>1.60<\/td><\/tr><tr><th>river<\/th><td>2.80<\/td><td>0.40<\/td><td>0.50<\/td><\/tr><tr><th>bank<\/th><td>1.60<\/td><td>1.40<\/td><td>0.30<\/td><\/tr><\/table><\/div><\/div><\/div>\n<\/div>\n<div class=\"em-point\"><b>The ID is the row number in the embedding table.<\/b> We copy the row. The embedding table never changes while we use it. Its numbers were learned when the model was trained. But the row for \"bank\" is the same in every sentence, so it does not yet know if this is a river bank or a money bank.<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c4\" id=\"9-step-3-attention-uses-the-context\">5. Step 3: Attention Uses the Context<\/h2>\n<p>Our rows are generic. Attention changes them using the other words in the sentence.<\/p>\n<figure class=\"visual\"><p><b>Where we are.<\/b> After steps 1 and 2 we have three generic rows. \"bank\" has the same row in every sentence, so it does not know that this one is about a river.<\/p>\n<div class=\"em-mat \"><table><tr><th><\/th><th>col 1<\/th><th>col 2<\/th><th>col 3<\/th><\/tr><tr><th>the<\/th><td>0.50<\/td><td>0.40<\/td><td>1.60<\/td><\/tr><tr><th>river<\/th><td>2.80<\/td><td>0.40<\/td><td>0.50<\/td><\/tr><tr><th>bank<\/th><td>1.60<\/td><td>1.40<\/td><td>0.30<\/td><\/tr><\/table><\/div>\n<blockquote class=\"def\"><span class=\"deflab\">Definition<\/span>\n<p><b>Attention<\/b> lets each word look at the other words in the sentence and take a share of their meaning, so that its row fits the sentence.<\/p><\/blockquote>\n<p>We do it for \"bank\" in three steps:<\/p>\n<div class=\"fs4\">\n  <div class=\"fs4-b a\"><div class=\"fs4-h\">Step A: Compare<\/div><div class=\"fs4-row\"><div class=\"fs4-c\"><small>the<\/small><b>1.84<\/b><\/div><div class=\"fs4-c\"><small>river<\/small><b>5.19<\/b><\/div><div class=\"fs4-c\"><small>bank<\/small><b>4.61<\/b><\/div><\/div><div class=\"fs4-s\">How related is each word to \"bank\"? A score for each word.<\/div><\/div>\n  <div class=\"fs4-a\">&rarr;<\/div>\n  <div class=\"fs4-b b\"><div class=\"fs4-h\">Step B: Make shares<\/div><div class=\"fs4-row\"><div class=\"fs4-c\"><small>the<\/small><b>2%<\/b><\/div><div class=\"fs4-c\"><small>river<\/small><b>63%<\/b><\/div><div class=\"fs4-c\"><small>bank<\/small><b>35%<\/b><\/div><\/div><div class=\"fs4-s\">Softmax turns the scores into shares that add up to 100%.<\/div><\/div>\n  <div class=\"fs4-a\">&rarr;<\/div>\n  <div class=\"fs4-b c\"><div class=\"fs4-h\">Step C: Mix<\/div><div class=\"fs4-row\"><div class=\"fs4-c\"><small>col 1<\/small><b>2.33<\/b><\/div><div class=\"fs4-c\"><small>col 2<\/small><b>0.75<\/b><\/div><div class=\"fs4-c\"><small>col 3<\/small><b>0.45<\/b><\/div><\/div><div class=\"fs4-s\">The new \"bank\" row: each word's row times its share, added up.<\/div><\/div>\n<\/div>\n\n<p><b>Step A: compare.<\/b> Multiply the matching numbers of two rows and add them up (a <b>dot product<\/b>). A bigger score means the rows are more alike.<\/p>\n<div class=\"em-tbl\"><table><tr><th>\"bank\" with<\/th><th>Multiply the matching numbers, and add<\/th><th>Score<\/th><\/tr><tr><td>the<\/td><td>1.6&times;0.5 + 1.4&times;0.4 + 0.3&times;1.6<\/td><td><b>1.84<\/b><\/td><\/tr><tr><td>river<\/td><td>1.6&times;2.8 + 1.4&times;0.4 + 0.3&times;0.5<\/td><td><b>5.19<\/b><\/td><\/tr><tr><td>bank<\/td><td>1.6&times;1.6 + 1.4&times;1.4 + 0.3&times;0.3<\/td><td><b>4.61<\/b><\/td><\/tr><\/table><\/div>\n<p><b>Step B: make shares.<\/b> <b>Softmax<\/b>: raise e (about 2.718) to the power of each score, then divide each by the total. The shares add up to 1.<\/p>\n<div class=\"em-tbl\"><table><tr><th>Word<\/th><th>Score<\/th><th>e to the power of the score<\/th><th>Share = that number &divide; 286.2<\/th><\/tr><tr><td>the<\/td><td>1.84<\/td><td>6.3<\/td><td><b>0.022<\/b> (2.2%)<\/td><\/tr><tr><td>river<\/td><td>5.19<\/td><td>179.5<\/td><td><b>0.627<\/b> (62.7%)<\/td><\/tr><tr><td>bank<\/td><td>4.61<\/td><td>100.5<\/td><td><b>0.351<\/b> (35.1%)<\/td><\/tr><tr class=\"tot\"><td><b>Total<\/b><\/td><td><\/td><td><b>286.2<\/b><\/td><td><b>1.000 (100%)<\/b><\/td><\/tr><\/table><\/div>\n<p><b>Step C: mix.<\/b> Multiply each word's row by its share, then add the three results.<\/p>\n<div class=\"em-tbl\"><table><tr><th>Word<\/th><th>Share<\/th><th>Its row<\/th><th>Share &times; its row<\/th><\/tr><tr><td>the<\/td><td>0.022<\/td><td>[0.5, 0.4, 1.6]<\/td><td>[0.011, 0.009, 0.035]<\/td><\/tr><tr><td>river<\/td><td>0.627<\/td><td>[2.8, 0.4, 0.5]<\/td><td>[1.756, 0.251, 0.313]<\/td><\/tr><tr><td>bank<\/td><td>0.351<\/td><td>[1.6, 1.4, 0.3]<\/td><td>[0.562, 0.491, 0.105]<\/td><\/tr><tr class=\"tot\"><td><b>Add them up<\/b><\/td><td><\/td><td><\/td><td><b>[2.328, 0.751, 0.454]<\/b><\/td><\/tr><\/table><\/div>\n<div class=\"em-lk\">\n<div class=\"em-lk-r\"><span class=\"em-lk-h\">Before<\/span><div>[1.6, 1.4, 0.3] &nbsp; closeness to the &ldquo;river&rdquo; row: <b>0.84<\/b><\/div><\/div>\n<div class=\"em-lk-r\"><span class=\"em-lk-h\">After (river sentence)<\/span><div>[2.328, 0.751, 0.454] &nbsp; closeness to the &ldquo;river&rdquo; row: <b>0.99<\/b><\/div><\/div>\n<\/div>\n<p>In \"the <b>money<\/b> bank\" the same steps use the \"money\" row, [0.3, 2.7, 0.6], instead of \"river\". The scores become 1.84, 4.44 and 4.61, and the new \"bank\" row is [0.989, 1.942, 0.475]: it moves toward \"money\" (closeness 0.74 to 0.94). The embedding table does not change. Only the copies change, for this sentence.<\/p>\n<p class=\"em-cap\">It is called attention because each word pays attention to the other words and decides how much each one matters. A real model does this for every word at once, and repeats it in many layers.<\/p>\n<\/figure>\n<hr />\n<h2 class=\"c5\" id=\"10-step-4-average-and-normalize\">6. Step 4: Average and Normalize<\/h2>\n<p>The last step turns many rows into one vector.<\/p>\n<figure class=\"visual\"><p><b>Where we are.<\/b> After attention we have three rows, one for each word. We need <b>one<\/b> vector for the whole chunk, so we average them and then normalize. Three steps:<\/p>\n<div class=\"fs4\">\n  <div class=\"fs4-b a\"><div class=\"fs4-h\">Step A: Average<\/div><div class=\"fs4-row\"><div class=\"fs4-c\"><small>col 1<\/small><b>2.143<\/b><\/div><div class=\"fs4-c\"><small>col 2<\/small><b>0.590<\/b><\/div><div class=\"fs4-c\"><small>col 3<\/small><b>0.668<\/b><\/div><\/div><div class=\"fs4-s\">Add the three rows and divide by 3. One row for the whole chunk.<\/div><\/div>\n  <div class=\"fs4-a\">&rarr;<\/div>\n  <div class=\"fs4-b b\"><div class=\"fs4-h\">Step B: Magnitude<\/div><div class=\"fs4-row\"><div class=\"fs4-c\"><small>sum of squares<\/small><b>5.385<\/b><\/div><div class=\"fs4-c\"><small>magnitude<\/small><b>2.321<\/b><\/div><\/div><div class=\"fs4-s\">Square each number and add them. The square root is the magnitude.<\/div><\/div>\n  <div class=\"fs4-a\">&rarr;<\/div>\n  <div class=\"fs4-b c\"><div class=\"fs4-h\">Step C: Divide<\/div><div class=\"fs4-row\"><div class=\"fs4-c\"><small>col 1<\/small><b>0.923<\/b><\/div><div class=\"fs4-c\"><small>col 2<\/small><b>0.254<\/b><\/div><div class=\"fs4-c\"><small>col 3<\/small><b>0.288<\/b><\/div><\/div><div class=\"fs4-s\">Divide each number by the magnitude. This is the embedding.<\/div><\/div>\n<\/div>\n\n<p><b>Step A: average.<\/b> Add the three rows column by column, then divide by 3.<\/p>\n<div class=\"em-tbl\"><table><tr><th><\/th><th>col 1<\/th><th>col 2<\/th><th>col 3<\/th><\/tr><tr><td>the<\/td><td>1.360<\/td><td>0.573<\/td><td>1.055<\/td><\/tr><tr><td>river<\/td><td>2.740<\/td><td>0.445<\/td><td>0.494<\/td><\/tr><tr><td>bank<\/td><td>2.328<\/td><td>0.751<\/td><td>0.454<\/td><\/tr><tr class=\"tot\"><td><b>Add the three rows<\/b><\/td><td>6.428<\/td><td>1.769<\/td><td>2.003<\/td><\/tr><tr class=\"tot\"><td><b>Divide by 3 (the average)<\/b><\/td><td><b>2.143<\/b><\/td><td><b>0.590<\/b><\/td><td><b>0.668<\/b><\/td><\/tr><\/table><\/div>\n<p>The last line is one row of numbers for the whole chunk.<\/p>\n<p><b>Step B and Step C: normalize.<\/b> Normalizing means scaling the row so its <b>magnitude<\/b> becomes 1, without changing its direction. The magnitude is the length of the row as an arrow: square each number, add the squares, take the square root (Step B). Then divide every number by it (Step C).<\/p>\n<div class=\"em-tbl\"><table><tr><th>What we do<\/th><th>col 1<\/th><th>col 2<\/th><th>col 3<\/th><th>All three<\/th><\/tr><tr><td>The average row<\/td><td>2.143<\/td><td>0.590<\/td><td>0.668<\/td><td><\/td><\/tr><tr><td>Square each number<\/td><td>4.592<\/td><td>0.348<\/td><td>0.446<\/td><td>add them: <b>5.385<\/b><\/td><\/tr><tr><td>Square root of that sum = the magnitude<\/td><td><\/td><td><\/td><td><\/td><td><b>2.321<\/b><\/td><\/tr><tr class=\"tot\"><td><b>Divide each number by 2.321 = the embedding<\/b><\/td><td><b>0.923<\/b><\/td><td><b>0.254<\/b><\/td><td><b>0.288<\/b><\/td><td><\/td><\/tr><\/table><\/div>\n<p>This final row, <b>[0.923, 0.254, 0.288]<\/b>, is the embedding of \"the river bank\". Its magnitude is 1.<\/p>\n<p><b>Why divide by the magnitude?<\/b> A long chunk and a short chunk about the same topic give arrows of different lengths, but the same direction. The direction carries the meaning. Dividing by the magnitude keeps only the direction, so comparisons between vectors are fair. Here is the idea with a small example.<\/p>\n<div class=\"em-pair b\"><div class=\"em-fig-i\"><svg class=\"em-svg\" viewBox=\"0 0 460 330\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"0\" y=\"0\" width=\"460\" height=\"330\" rx=\"12\" fill=\"#fff\" stroke=\"#e4dfd6\"/><line x1=\"64\" y1=\"276\" x2=\"64\" y2=\"29\" stroke=\"#f0ece3\"/><line x1=\"64\" y1=\"276\" x2=\"388\" y2=\"276\" stroke=\"#f0ece3\"/><line x1=\"122\" y1=\"276\" x2=\"122\" y2=\"29\" stroke=\"#f0ece3\"/><line x1=\"64\" y1=\"218\" x2=\"388\" y2=\"218\" stroke=\"#f0ece3\"/><text x=\"122\" y=\"294\" font-size=\"12\" fill=\"#7a7367\" text-anchor=\"middle\">1<\/text><text x=\"54\" y=\"222\" font-size=\"12\" fill=\"#7a7367\" text-anchor=\"end\">1<\/text><line x1=\"180\" y1=\"276\" x2=\"180\" y2=\"29\" stroke=\"#f0ece3\"/><line x1=\"64\" y1=\"160\" x2=\"388\" y2=\"160\" stroke=\"#f0ece3\"/><text x=\"180\" y=\"294\" font-size=\"12\" fill=\"#7a7367\" text-anchor=\"middle\">2<\/text><text x=\"54\" y=\"164\" font-size=\"12\" fill=\"#7a7367\" text-anchor=\"end\">2<\/text><line x1=\"238\" y1=\"276\" x2=\"238\" y2=\"29\" stroke=\"#f0ece3\"/><line x1=\"64\" y1=\"102\" x2=\"388\" y2=\"102\" stroke=\"#f0ece3\"/><text x=\"238\" y=\"294\" font-size=\"12\" fill=\"#7a7367\" text-anchor=\"middle\">3<\/text><text x=\"54\" y=\"106\" font-size=\"12\" fill=\"#7a7367\" text-anchor=\"end\">3<\/text><line x1=\"296\" y1=\"276\" x2=\"296\" y2=\"29\" stroke=\"#f0ece3\"/><line x1=\"64\" y1=\"44\" x2=\"388\" y2=\"44\" stroke=\"#f0ece3\"/><text x=\"296\" y=\"294\" font-size=\"12\" fill=\"#7a7367\" text-anchor=\"middle\">4<\/text><text x=\"54\" y=\"48\" font-size=\"12\" fill=\"#7a7367\" text-anchor=\"end\">4<\/text><line x1=\"354\" y1=\"276\" x2=\"354\" y2=\"29\" stroke=\"#f0ece3\"/><text x=\"354\" y=\"294\" font-size=\"12\" fill=\"#7a7367\" text-anchor=\"middle\">5<\/text><line x1=\"64\" y1=\"276\" x2=\"388\" y2=\"276\" stroke=\"#bdb7aa\" stroke-width=\"2\"/><line x1=\"64\" y1=\"276\" x2=\"64\" y2=\"29\" stroke=\"#bdb7aa\" stroke-width=\"2\"/><path d=\"M 122 276 A 58 58 0 0 0 64 218\" fill=\"none\" stroke=\"#1a5c5b\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/><line x1=\"238\" y1=\"44\" x2=\"238\" y2=\"276\" stroke=\"#c9583a\" stroke-dasharray=\"4 4\" opacity=\".45\"/><line x1=\"238\" y1=\"44\" x2=\"64\" y2=\"44\" stroke=\"#c9583a\" stroke-dasharray=\"4 4\" opacity=\".45\"/><line x1=\"64\" y1=\"276\" x2=\"232.6\" y2=\"51.2\" stroke=\"#c9583a\" stroke-width=\"4\" stroke-linecap=\"round\"/><polygon points=\"238.0,44.0 235.6,61.0 222.4,51.0\" fill=\"#c9583a\"/><line x1=\"64\" y1=\"276\" x2=\"94.6\" y2=\"235.2\" stroke=\"#1a5c5b\" stroke-width=\"5\" stroke-linecap=\"round\"/><polygon points=\"98.8,229.6 97.0,242.0 87.4,234.8\" fill=\"#1a5c5b\"/><circle cx=\"64\" cy=\"276\" r=\"4\" fill=\"#fff\" stroke=\"#bdb7aa\" stroke-width=\"2\"/><text x=\"250\" y=\"50\" font-size=\"16\" font-weight=\"800\" fill=\"#c9583a\">[3, 4]<\/text><text x=\"250\" y=\"68\" font-size=\"13\" fill=\"#c9583a\">length 5<\/text><line x1=\"102\" y1=\"232\" x2=\"172\" y2=\"237\" stroke=\"#1a5c5b\" stroke-width=\"1.5\"/><text x=\"176\" y=\"242\" font-size=\"16\" font-weight=\"800\" fill=\"#1a5c5b\">[0.6, 0.8]<\/text><text x=\"176\" y=\"260\" font-size=\"13\" fill=\"#1a5c5b\">length 1<\/text><text x=\"24\" y=\"17\" font-size=\"13\" font-weight=\"800\" fill=\"#7a7367\" letter-spacing=\"1\">SAME DIRECTION, DIFFERENT LENGTH<\/text><\/svg><\/div>\n<div class=\"em-lk\">\n<div class=\"em-lk-r\"><span class=\"em-lk-h\">The example<\/span><div>The row [3, 4]<\/div><\/div>\n<div class=\"em-lk-r\"><span class=\"em-lk-h\">Its magnitude<\/span><div>&radic;(3&times;3 + 4&times;4) = &radic;25 = <b>5<\/b><\/div><\/div>\n<div class=\"em-lk-r\"><span class=\"em-lk-h\">Divide by 5<\/span><div>[3 &divide; 5, 4 &divide; 5] = <b>[0.6, 0.8]<\/b><\/div><\/div>\n<div class=\"em-lk-r\"><span class=\"em-lk-h\">The new magnitude<\/span><div>&radic;(0.6&times;0.6 + 0.8&times;0.8) = &radic;1 = <b>1<\/b><\/div><\/div>\n<\/div><\/div>\n<p class=\"em-cap\">The red arrow is [3, 4], the green arrow is [0.6, 0.8]. They point the same way. Only the length changed, from 5 to 1.<\/p>\n<\/figure>\n<hr />\n<h2 class=\"c1\" id=\"11-does-the-length-carry-meaning\">7. Does the Length Carry Meaning?<\/h2>\n<p>We divided by the magnitude and kept only the direction. Is the length really worth nothing?<\/p>\n<figure class=\"visual\"><p><b>Why do we throw the length away?<\/b> It depends on how the model was trained. It is not a law of maths that length means nothing. Most text embedding models are trained so that texts with the same meaning point the <b>same way<\/b>. Only the direction is rewarded, so the model has no reason to put anything useful into the length. The length is what is left over.<\/p>\n<p><b>What is the difference between [3, 4] and [6, 8]?<\/b> They point the same way, and the second is twice as long. It depends on the model:<\/p>\n<div class=\"em-tbl\"><table>\n<tr><th><\/th><th>A model trained on direction<br>(most text embedding models)<\/th><th>A model trained for the dot product<br>(a few models)<\/th><\/tr>\n<tr><td>What the length means<\/td><td>Nothing useful. It can come from things like the length of the text, or how the words were averaged.<\/td><td>It can carry a signal, such as how important or popular something is.<\/td><\/tr>\n<tr><td>Are [3, 4] and [6, 8] the same?<\/td><td>Yes, the same meaning.<\/td><td>No. The longer one can score higher for every question.<\/td><\/tr>\n<tr><td>What we do<\/td><td>Normalize. Compare by direction (cosine).<\/td><td>Do not normalize. Use the metric the docs say, the dot product.<\/td><\/tr>\n<\/table><\/div>\n<p><b>The exception<\/b> is the second column. The dot product uses the angle and the length together, so a model trained for it can use the length. If you used cosine on such a model, or normalized its vectors, you would throw that signal away.<\/p>\n<p><b>What this means for us.<\/b> For the models in this course, the direction is the meaning. Many text embedding models already return vectors of length 1, or normalize inside, so this step costs nothing. Check your model's docs for which metric it was trained for. If it says dot product, follow it.<\/p>\n<\/figure>\n<hr />\n<h2 class=\"c2\" id=\"12-in-code\">8. In Code<\/h2>\n<p>One call does all four steps for you. Which model you call depends on your app.<\/p>\n<figure class=\"visual\"><p><b>Which embedding model do I use?<\/b> It depends on the provider of your app. Every provider has its own LangChain class. You change only the import and the model name, because all of them have the same two methods: <code>embed_query<\/code> for one text and <code>embed_documents<\/code> for a list of chunks. The code below is the one from your file.<\/p>\n<div class=\"dw\"><div class=\"dw-c t\">\n    <div class=\"dw-h\"><b>Pick one<\/b>an embedding class for each provider<\/div>\n    <input type=\"radio\" name=\"dwe\" id=\"e1\" checked><label for=\"e1\">Mistral<\/label>\n    <input type=\"radio\" name=\"dwe\" id=\"e2\"><label for=\"e2\">OpenAI<\/label>\n    <input type=\"radio\" name=\"dwe\" id=\"e3\"><label for=\"e3\">Gemini<\/label>\n    <input type=\"radio\" name=\"dwe\" id=\"e4\"><label for=\"e4\">Open source<\/label>\n    <div class=\"dw-inst\">install: <code>pip install <span class=\"ve1\">langchain-mistralai<\/span><span class=\"ve2\">langchain-openai<\/span><span class=\"ve3\">langchain-google-genai<\/span><span class=\"ve4\">langchain-huggingface sentence-transformers<\/span><\/code><\/div>\n    <div class=\"hl\" data-x=\"1\"><pre><span class=\"ve1\"><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_mistralai<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">MistralAIEmbeddings<\/span>\n\n<span class=\"n\">embedding_model<\/span> <span class=\"o\">=<\/span> <span class=\"n\">MistralAIEmbeddings<\/span><span class=\"p\">(<\/span><span class=\"n\">model<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"mistral-embed\"<\/span><span class=\"p\">)<\/span>\n\n<span class=\"n\">query<\/span> <span class=\"o\">=<\/span> <span class=\"s2\">\"What is the capital of France?\"<\/span>\n<span class=\"n\">query_vec<\/span> <span class=\"o\">=<\/span> <span class=\"n\">embedding_model<\/span><span class=\"o\">.<\/span><span class=\"n\">embed_query<\/span><span class=\"p\">(<\/span><span class=\"n\">query<\/span><span class=\"p\">)<\/span>\n\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"sa\">f<\/span><span class=\"s2\">\"Vector Dimensions: <\/span><span class=\"si\">{<\/span><span class=\"nb\">len<\/span><span class=\"p\">(<\/span><span class=\"n\">query_vec<\/span><span class=\"p\">)<\/span><span class=\"si\">}<\/span><span class=\"s2\">\"<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"sa\">f<\/span><span class=\"s2\">\"Sample First 5 Floats: <\/span><span class=\"si\">{<\/span><span class=\"n\">query_vec<\/span><span class=\"p\">[:<\/span><span class=\"mi\">5<\/span><span class=\"p\">]<\/span><span class=\"si\">}<\/span><span class=\"s2\">\"<\/span><span class=\"p\">)<\/span><\/span><span class=\"ve2\"><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_openai<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">OpenAIEmbeddings<\/span>\n\n<span class=\"n\">embedding_model<\/span> <span class=\"o\">=<\/span> <span class=\"n\">OpenAIEmbeddings<\/span><span class=\"p\">(<\/span><span class=\"n\">model<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"text-embedding-3-small\"<\/span><span class=\"p\">)<\/span>\n\n<span class=\"n\">query<\/span> <span class=\"o\">=<\/span> <span class=\"s2\">\"What is the capital of France?\"<\/span>\n<span class=\"n\">query_vec<\/span> <span class=\"o\">=<\/span> <span class=\"n\">embedding_model<\/span><span class=\"o\">.<\/span><span class=\"n\">embed_query<\/span><span class=\"p\">(<\/span><span class=\"n\">query<\/span><span class=\"p\">)<\/span>\n\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"sa\">f<\/span><span class=\"s2\">\"Vector Dimensions: <\/span><span class=\"si\">{<\/span><span class=\"nb\">len<\/span><span class=\"p\">(<\/span><span class=\"n\">query_vec<\/span><span class=\"p\">)<\/span><span class=\"si\">}<\/span><span class=\"s2\">\"<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"sa\">f<\/span><span class=\"s2\">\"Sample First 5 Floats: <\/span><span class=\"si\">{<\/span><span class=\"n\">query_vec<\/span><span class=\"p\">[:<\/span><span class=\"mi\">5<\/span><span class=\"p\">]<\/span><span class=\"si\">}<\/span><span class=\"s2\">\"<\/span><span class=\"p\">)<\/span><\/span><span class=\"ve3\"><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_google_genai<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">GoogleGenerativeAIEmbeddings<\/span>\n\n<span class=\"n\">embedding_model<\/span> <span class=\"o\">=<\/span> <span class=\"n\">GoogleGenerativeAIEmbeddings<\/span><span class=\"p\">(<\/span><span class=\"n\">model<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"gemini-embedding-001\"<\/span><span class=\"p\">)<\/span>\n\n<span class=\"n\">query<\/span> <span class=\"o\">=<\/span> <span class=\"s2\">\"What is the capital of France?\"<\/span>\n<span class=\"n\">query_vec<\/span> <span class=\"o\">=<\/span> <span class=\"n\">embedding_model<\/span><span class=\"o\">.<\/span><span class=\"n\">embed_query<\/span><span class=\"p\">(<\/span><span class=\"n\">query<\/span><span class=\"p\">)<\/span>\n\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"sa\">f<\/span><span class=\"s2\">\"Vector Dimensions: <\/span><span class=\"si\">{<\/span><span class=\"nb\">len<\/span><span class=\"p\">(<\/span><span class=\"n\">query_vec<\/span><span class=\"p\">)<\/span><span class=\"si\">}<\/span><span class=\"s2\">\"<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"sa\">f<\/span><span class=\"s2\">\"Sample First 5 Floats: <\/span><span class=\"si\">{<\/span><span class=\"n\">query_vec<\/span><span class=\"p\">[:<\/span><span class=\"mi\">5<\/span><span class=\"p\">]<\/span><span class=\"si\">}<\/span><span class=\"s2\">\"<\/span><span class=\"p\">)<\/span><\/span><span class=\"ve4\"><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_huggingface<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">HuggingFaceEmbeddings<\/span>\n\n<span class=\"n\">embedding_model<\/span> <span class=\"o\">=<\/span> <span class=\"n\">HuggingFaceEmbeddings<\/span><span class=\"p\">(<\/span><span class=\"n\">model_name<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"sentence-transformers/all-MiniLM-L6-v2\"<\/span><span class=\"p\">)<\/span>\n\n<span class=\"n\">query<\/span> <span class=\"o\">=<\/span> <span class=\"s2\">\"What is the capital of France?\"<\/span>\n<span class=\"n\">query_vec<\/span> <span class=\"o\">=<\/span> <span class=\"n\">embedding_model<\/span><span class=\"o\">.<\/span><span class=\"n\">embed_query<\/span><span class=\"p\">(<\/span><span class=\"n\">query<\/span><span class=\"p\">)<\/span>\n\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"sa\">f<\/span><span class=\"s2\">\"Vector Dimensions: <\/span><span class=\"si\">{<\/span><span class=\"nb\">len<\/span><span class=\"p\">(<\/span><span class=\"n\">query_vec<\/span><span class=\"p\">)<\/span><span class=\"si\">}<\/span><span class=\"s2\">\"<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"sa\">f<\/span><span class=\"s2\">\"Sample First 5 Floats: <\/span><span class=\"si\">{<\/span><span class=\"n\">query_vec<\/span><span class=\"p\">[:<\/span><span class=\"mi\">5<\/span><span class=\"p\">]<\/span><span class=\"si\">}<\/span><span class=\"s2\">\"<\/span><span class=\"p\">)<\/span><\/span><\/pre><\/div>\n    <div class=\"em-out2\"><span class=\"em-out2-l\">Output (example)<\/span><div class=\"hl\" data-x=\"1\"><pre><span class=\"ve1\">Vector Dimensions: 1024\nSample First 5 Floats: [-0.0069, -0.053, 0.040, 0.218, -0.031]<\/span><span class=\"ve2\">Vector Dimensions: 1536\nSample First 5 Floats: [0.012, -0.034, 0.057, -0.008, 0.021]<\/span><span class=\"ve3\">Vector Dimensions: 3072\nSample First 5 Floats: [0.004, -0.021, 0.018, 0.033, -0.009]<\/span><span class=\"ve4\">Vector Dimensions: 384\nSample First 5 Floats: [-0.045, 0.012, 0.087, -0.003, 0.031]<\/span><\/pre><\/div><\/div>\n    <ul class=\"dw-n\"><li>Only two lines change from tab to tab: the <b>import<\/b> and the <b>model line<\/b>. The query and the two prints stay the same.<\/li><li>Import the embedding class from the provider's own package: <span class=\"ve1\"><code>langchain_mistralai<\/code><\/span><span class=\"ve2\"><code>langchain_openai<\/code><\/span><span class=\"ve3\"><code>langchain_google_genai<\/code><\/span><span class=\"ve4\"><code>langchain_huggingface<\/code><\/span>. Create the model with the class <span class=\"ve1\"><b>MistralAIEmbeddings<\/b><\/span><span class=\"ve2\"><b>OpenAIEmbeddings<\/b><\/span><span class=\"ve3\"><b>GoogleGenerativeAIEmbeddings<\/b><\/span><span class=\"ve4\"><b>HuggingFaceEmbeddings<\/b><\/span>, and put the model name inside the brackets.<\/li><li>The size of the vector depends on the model: <span class=\"ve1\"><b>1,024<\/b><\/span><span class=\"ve2\"><b>1,536<\/b><\/span><span class=\"ve3\"><b>3,072<\/b><\/span><span class=\"ve4\"><b>384<\/b><\/span> numbers here.<\/li><li><span class=\"ve1\">Put its API key in your <code>.env<\/code> file. This is the one used in this course.<\/span><span class=\"ve2\">Put its API key in your <code>.env<\/code> file. <\/span><span class=\"ve3\">Put its API key in your <code>.env<\/code> file. <\/span><span class=\"ve4\">No API key is needed. The model is downloaded the first time you run it. <\/span><\/li><\/ul>\n  <\/div><\/div>\n<ul class=\"emp-pts\">\n  <li><b>The embedding model and the chat model are separate choices.<\/b> You can embed with Mistral and answer with Gemini. Pick the embedding model by quality, cost and size, and the chat model by what you want to say.<\/li>\n  <li><b>Use the same embedding model for the chunks and the question.<\/b> The vectors of two models do not match.<\/li>\n  <li><b>The vector database must match the size.<\/b> A collection fixed at 1,024 numbers cannot take a 1,536-number vector. If you change the model, embed all the chunks again into a new collection.<\/li>\n  <li><b>Some models let you shorten the vector.<\/b> OpenAI has a <code>dimensions<\/code> setting, and Google has <code>output_dimensionality<\/code>. A shorter vector saves space but keeps less detail.<\/li>\n  <li><b>Model names and sizes change.<\/b> These are examples, so check the provider's docs for the current names.<\/li>\n<\/ul>\n<p class=\"em-cap\">The output numbers are examples. Yours will differ, but the size is fixed for each model.<\/p><\/figure>\n<div class=\"docs\"><span class=\"docs-l\">LangChain docs<\/span><a href=\"https://reference.langchain.com/python/langchain_core/embeddings/embeddings/Embeddings\" target=\"_blank\" rel=\"noopener\">Embeddings<\/a><a href=\"https://reference.langchain.com/python/langchain-openai/embeddings/base/OpenAIEmbeddings\" target=\"_blank\" rel=\"noopener\">OpenAIEmbeddings<\/a><a href=\"https://reference.langchain.com/python/langchain-google-genai/embeddings/GoogleGenerativeAIEmbeddings\" target=\"_blank\" rel=\"noopener\">GoogleGenerativeAIEmbeddings<\/a><\/div>\n\n", "toc": [{"id": "5-the-goal", "name": "5. The Goal"}, {"id": "6-inside-the-embedding-model-four-steps", "name": "6. Inside the Embedding Model: Four Steps"}, {"id": "7-step-1-the-tokenizer-cuts-the-text", "name": "7. Step 1: The Tokenizer Cuts the Text"}, {"id": "8-step-2-the-embedding-table-gives-the-rows", "name": "8. Step 2: The Embedding Table Gives the Rows"}, {"id": "9-step-3-attention-uses-the-context", "name": "9. Step 3: Attention Uses the Context"}, {"id": "10-step-4-average-and-normalize", "name": "10. Step 4: Average and Normalize"}, {"id": "11-does-the-length-carry-meaning", "name": "11. Does the Length Carry Meaning?"}, {"id": "12-in-code", "name": "12. In Code"}], "search": "", "slides": null, "slideCount": 0, "code": []}};</script>
