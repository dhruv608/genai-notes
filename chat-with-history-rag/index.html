<script>window.PAGE = {"id": "n22", "root": "../", "lesson": {"id": "n22", "title": "Chat with History (RAG)", "short": "Chat with History (RAG)", "unit": "Unit 3", "unitName": "Chat with Your Data (RAG)", "pos": 11, "of": 11, "sub": "", "info": "Multi-turn chat that retrieves", "html": "<h2 class=\"c1\" id=\"1-why-naive-rag-fails-in-multi-turn-conversations\">1. Why Naive RAG Fails in Multi-Turn Conversations<\/h2>\n<p>Standard (Naive) RAG assumes every question is an isolated, single-turn query. In real-world chat applications (\"Chat with your PDF\", enterprise support bots), conversations are inherently contextual.<\/p>\n<p>Consider this two-turn conversation:<\/p>\n<div class=\"hl\"><pre><span><\/span><code>Turn 1:\nUser: \"What is the warranty period for the Acme X100 server?\"\nRetriever searches: \"What is the warranty period for the Acme X100 server?\"\nVector Store returns: Relevant chunk: \"Acme X100 includes a 3-year hardware warranty.\"\nAI: \"The Acme X100 server comes with a 3-year hardware warranty.\"\n\nTurn 2:\nUser: \"Can you explain its renewal conditions?\"\nRetriever searches: \"Can you explain its renewal conditions?\"\nVector Store returns: IRRELEVANT CHUNKS (Nothing matches \"its renewal conditions\").\nAI: Hallucinates or says \"I don't have enough information.\"\n<\/code><\/pre><\/div>\n\n<h3 id=\"the-root-cause\">The Root Cause:<\/h3>\n<p>The vector retriever has no access to previous conversation turns. It performs semantic search using only the raw string <code>\"Can you explain its renewal conditions?\"<\/code>. Because pronouns like <code>\"it\"<\/code>, <code>\"its\"<\/code>, or <code>\"that\"<\/code> lack semantic keywords, the vector search retrieves irrelevant chunks.<\/p>\n<hr />\n<h2 class=\"c2\" id=\"2-the-solution-two-stage-conversational-rag-architecture\">2. The Solution: Two-Stage Conversational RAG Architecture<\/h2>\n<p>To solve this, production conversational RAG systems decouple retrieval into two specialized sub-chains:<\/p>\n<figure class=\"diagram\"><pre class=\"mermaid\">flowchart TB\n  subgraph S1[&quot;1 · Query reformulation&quot;]\n    H[&quot;Chat history + follow-up question&quot;] -- &quot;LLM call: rewrite into a standalone question&quot; --&gt; SQ[&quot;Standalone search query&lt;br/&gt;&lt;small&gt;&#x27;What are the warranty renewal conditions for X100?&#x27;&lt;/small&gt;&quot;]\n  end\n  subgraph S2[&quot;2 · Retrieval&quot;]\n    SQ -- &quot;vector search&quot; --&gt; CH[&quot;Relevant document chunks&quot;]\n  end\n  subgraph S3[&quot;3 · Answer&quot;]\n    CH --&gt; F[&quot;Chunks + chat history + original question&quot;] -- &quot;LLM final call&quot; --&gt; ANS[&quot;Grounded answer&quot;]\n  end\nclassDef term fill:#0e3b3a,stroke:#0e3b3a,color:#ffffff,font-weight:bold\nclassDef gate fill:#fdf1ec,stroke:#c9583a,color:#7a2e1a\nclassDef store fill:#f5f5f4,stroke:#57534e,color:#292524\nclassDef c0 fill:#d4ecea,stroke:#2a7a79,color:#0e3b3a\nclassDef c1 fill:#fbe5dc,stroke:#c9583a,color:#7a2e1a\nclassDef c2 fill:#e3f5ee,stroke:#4aa58a,color:#14463a\nclassDef c3 fill:#f6f4f0,stroke:#a7a29a,color:#3f3b35\nclassDef c4 fill:#eef7f7,stroke:#1a5c5b,color:#0e3b3a\nclass S1 c0\nclass H c1\nclass SQ c2\nclass S2 c3\nclass CH c4\nclass S3 c0\nclass F c1\nclass ANS c2\nstyle S1 fill:#f4fafa,stroke:#9fcfce,stroke-width:1.5px\nstyle S2 fill:#fdf6f3,stroke:#ecc0ae,stroke-width:1.5px\nstyle S3 fill:#f3faf7,stroke:#9fe0c7,stroke-width:1.5px<\/pre><div class=\"dg-ascii\" hidden><div class=\"hl\"><pre><span><\/span><code>+-----------------------------------------------------------------------------------+\n| CONVERSATIONAL RAG WORKFLOW                                                       |\n+-----------------------------------------------------------------------------------+\n|                                                                                   |\n| 1. Query Reformulation Sub-Chain:                                                 |\n|    [Chat History] + [Raw Follow-up Question]                                      |\n|            │                                                                      |\n|            ▼ (LLM Sub-call: Reformulates pronoun-heavy prompt)                    |\n|    [Standalone Search Query: \"What are the warranty renewal conditions for X100?\"]|\n|            │                                                                      |\n| 2. Vector DB Retrieval:                                                           |\n|            ▼ (Vector Store semantic search)                                       |\n|    [Relevant Document Chunks]                                                     |\n|            │                                                                      |\n| 3. Final Answer Generation:                                                       |\n|    [Retrieved Chunks] + [Chat History] + [Original Question]                      |\n|            │                                                                      |\n|            ▼ (LLM Final call)                                                     |\n|    [Grounded Natural Language Response]                                           |\n+-----------------------------------------------------------------------------------+\n<\/code><\/pre><\/div><\/div><\/figure>\n\n<ol>\n<li><strong>Stage 1 (Query Reformulation)<\/strong>: A lightweight prompt takes the chat history and the latest user query, rewriting it into a <strong>standalone search query<\/strong> that contains all necessary entity names.<\/li>\n<li><strong>Stage 2 (Grounded Generation)<\/strong>: The standalone query retrieves the correct chunks from the vector database. Those chunks, along with conversation history, are passed to the final generator to answer the user.<\/li>\n<\/ol>\n<hr />\n<h2 class=\"c3\" id=\"3-production-implementation-history-aware-rag-in-langchain\">3. Production Implementation: History-Aware RAG in LangChain<\/h2>\n<p>Complete working script combining <code>create_history_aware_retriever<\/code>, <code>create_retrieval_chain<\/code>, and ChromaDB:<\/p>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"kn\">import<\/span><span class=\"w\"> <\/span><span class=\"nn\">os<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">dotenv<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">load_dotenv<\/span>\n<span class=\"n\">load_dotenv<\/span><span class=\"p\">()<\/span>\n\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_mistralai<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">ChatMistralAI<\/span><span class=\"p\">,<\/span> <span class=\"n\">MistralAIEmbeddings<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_chroma<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">Chroma<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_core.documents<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">Document<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_core.messages<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">HumanMessage<\/span><span class=\"p\">,<\/span> <span class=\"n\">AIMessage<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_core.prompts<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">ChatPromptTemplate<\/span><span class=\"p\">,<\/span> <span class=\"n\">MessagesPlaceholder<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain.chains<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">create_history_aware_retriever<\/span><span class=\"p\">,<\/span> <span class=\"n\">create_retrieval_chain<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain.chains.combine_documents<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">create_stuff_documents_chain<\/span>\n\n<span class=\"c1\"># 1. Initialize LLM and Embedding Model<\/span>\n<span class=\"n\">llm<\/span> <span class=\"o\">=<\/span> <span class=\"n\">ChatMistralAI<\/span><span class=\"p\">(<\/span><span class=\"n\">model<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"mistral-large-latest\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">temperature<\/span><span class=\"o\">=<\/span><span class=\"mf\">0.1<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">embeddings<\/span> <span class=\"o\">=<\/span> <span class=\"n\">MistralAIEmbeddings<\/span><span class=\"p\">(<\/span><span class=\"n\">model<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"mistral-embed\"<\/span><span class=\"p\">)<\/span>\n\n<span class=\"c1\"># 2. Setup Vector Store with Sample Knowledge Base<\/span>\n<span class=\"n\">sample_docs<\/span> <span class=\"o\">=<\/span> <span class=\"p\">[<\/span>\n    <span class=\"n\">Document<\/span><span class=\"p\">(<\/span>\n        <span class=\"n\">page_content<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"The Acme X100 server has a standard 3-year hardware warranty covering parts and labor.\"<\/span><span class=\"p\">,<\/span>\n        <span class=\"n\">metadata<\/span><span class=\"o\">=<\/span><span class=\"p\">{<\/span><span class=\"s2\">\"source\"<\/span><span class=\"p\">:<\/span> <span class=\"s2\">\"warranty_manual.pdf\"<\/span><span class=\"p\">}<\/span>\n    <span class=\"p\">),<\/span>\n    <span class=\"n\">Document<\/span><span class=\"p\">(<\/span>\n        <span class=\"n\">page_content<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"To renew the Acme X100 warranty, the renewal request must be submitted 30 days prior to expiration and requires a certified hardware inspection.\"<\/span><span class=\"p\">,<\/span>\n        <span class=\"n\">metadata<\/span><span class=\"o\">=<\/span><span class=\"p\">{<\/span><span class=\"s2\">\"source\"<\/span><span class=\"p\">:<\/span> <span class=\"s2\">\"warranty_manual.pdf\"<\/span><span class=\"p\">}<\/span>\n    <span class=\"p\">)<\/span>\n<span class=\"p\">]<\/span>\n\n<span class=\"n\">vector_store<\/span> <span class=\"o\">=<\/span> <span class=\"n\">Chroma<\/span><span class=\"o\">.<\/span><span class=\"n\">from_documents<\/span><span class=\"p\">(<\/span>\n    <span class=\"n\">documents<\/span><span class=\"o\">=<\/span><span class=\"n\">sample_docs<\/span><span class=\"p\">,<\/span>\n    <span class=\"n\">embedding<\/span><span class=\"o\">=<\/span><span class=\"n\">embeddings<\/span><span class=\"p\">,<\/span>\n    <span class=\"n\">collection_name<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"warranty_kb\"<\/span>\n<span class=\"p\">)<\/span>\n<span class=\"n\">retriever<\/span> <span class=\"o\">=<\/span> <span class=\"n\">vector_store<\/span><span class=\"o\">.<\/span><span class=\"n\">as_retriever<\/span><span class=\"p\">(<\/span><span class=\"n\">search_kwargs<\/span><span class=\"o\">=<\/span><span class=\"p\">{<\/span><span class=\"s2\">\"k\"<\/span><span class=\"p\">:<\/span> <span class=\"mi\">2<\/span><span class=\"p\">})<\/span>\n\n<span class=\"c1\"># 3. Sub-Chain 1: History-Aware Query Reformulation Prompt<\/span>\n<span class=\"n\">contextualize_q_system_prompt<\/span> <span class=\"o\">=<\/span> <span class=\"p\">(<\/span>\n    <span class=\"s2\">\"Given a chat history and the latest user question \"<\/span>\n    <span class=\"s2\">\"which might reference context in the chat history, \"<\/span>\n    <span class=\"s2\">\"formulate a standalone question which can be understood \"<\/span>\n    <span class=\"s2\">\"without the chat history. Do NOT answer the question, \"<\/span>\n    <span class=\"s2\">\"just reformulate it if needed and otherwise return it as is.\"<\/span>\n<span class=\"p\">)<\/span>\n<span class=\"n\">contextualize_q_prompt<\/span> <span class=\"o\">=<\/span> <span class=\"n\">ChatPromptTemplate<\/span><span class=\"o\">.<\/span><span class=\"n\">from_messages<\/span><span class=\"p\">([<\/span>\n    <span class=\"p\">(<\/span><span class=\"s2\">\"system\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">contextualize_q_system_prompt<\/span><span class=\"p\">),<\/span>\n    <span class=\"n\">MessagesPlaceholder<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"chat_history\"<\/span><span class=\"p\">),<\/span>\n    <span class=\"p\">(<\/span><span class=\"s2\">\"human\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"<\/span><span class=\"si\">{input}<\/span><span class=\"s2\">\"<\/span><span class=\"p\">),<\/span>\n<span class=\"p\">])<\/span>\n\n<span class=\"n\">history_aware_retriever<\/span> <span class=\"o\">=<\/span> <span class=\"n\">create_history_aware_retriever<\/span><span class=\"p\">(<\/span>\n    <span class=\"n\">llm<\/span><span class=\"p\">,<\/span> <span class=\"n\">retriever<\/span><span class=\"p\">,<\/span> <span class=\"n\">contextualize_q_prompt<\/span>\n<span class=\"p\">)<\/span>\n\n<span class=\"c1\"># 4. Sub-Chain 2: Question-Answering Prompt Grounded in Context<\/span>\n<span class=\"n\">qa_system_prompt<\/span> <span class=\"o\">=<\/span> <span class=\"p\">(<\/span>\n    <span class=\"s2\">\"You are an assistant for question-answering tasks. \"<\/span>\n    <span class=\"s2\">\"Use the following pieces of retrieved context to answer \"<\/span>\n    <span class=\"s2\">\"the question. If you don't know the answer, say that you \"<\/span>\n    <span class=\"s2\">\"don't know. Keep the answer concise.<\/span><span class=\"se\">\\n\\n<\/span><span class=\"s2\">\"<\/span>\n    <span class=\"s2\">\"<\/span><span class=\"si\">{context}<\/span><span class=\"s2\">\"<\/span>\n<span class=\"p\">)<\/span>\n<span class=\"n\">qa_prompt<\/span> <span class=\"o\">=<\/span> <span class=\"n\">ChatPromptTemplate<\/span><span class=\"o\">.<\/span><span class=\"n\">from_messages<\/span><span class=\"p\">([<\/span>\n    <span class=\"p\">(<\/span><span class=\"s2\">\"system\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">qa_system_prompt<\/span><span class=\"p\">),<\/span>\n    <span class=\"n\">MessagesPlaceholder<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"chat_history\"<\/span><span class=\"p\">),<\/span>\n    <span class=\"p\">(<\/span><span class=\"s2\">\"human\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"<\/span><span class=\"si\">{input}<\/span><span class=\"s2\">\"<\/span><span class=\"p\">),<\/span>\n<span class=\"p\">])<\/span>\n\n<span class=\"n\">question_answer_chain<\/span> <span class=\"o\">=<\/span> <span class=\"n\">create_stuff_documents_chain<\/span><span class=\"p\">(<\/span><span class=\"n\">llm<\/span><span class=\"p\">,<\/span> <span class=\"n\">qa_prompt<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">rag_chain<\/span> <span class=\"o\">=<\/span> <span class=\"n\">create_retrieval_chain<\/span><span class=\"p\">(<\/span><span class=\"n\">history_aware_retriever<\/span><span class=\"p\">,<\/span> <span class=\"n\">question_answer_chain<\/span><span class=\"p\">)<\/span>\n\n<span class=\"c1\"># 5. Multi-Turn Interactive Execution Loop<\/span>\n<span class=\"n\">chat_history<\/span> <span class=\"o\">=<\/span> <span class=\"p\">[]<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"=== CONVERSATIONAL RAG (Type 'exit' to quit) ===<\/span><span class=\"se\">\\n<\/span><span class=\"s2\">\"<\/span><span class=\"p\">)<\/span>\n\n<span class=\"k\">while<\/span> <span class=\"kc\">True<\/span><span class=\"p\">:<\/span>\n    <span class=\"n\">user_input<\/span> <span class=\"o\">=<\/span> <span class=\"nb\">input<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"You: \"<\/span><span class=\"p\">)<\/span>\n    <span class=\"k\">if<\/span> <span class=\"n\">user_input<\/span><span class=\"o\">.<\/span><span class=\"n\">lower<\/span><span class=\"p\">()<\/span> <span class=\"ow\">in<\/span> <span class=\"p\">[<\/span><span class=\"s2\">\"exit\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"quit\"<\/span><span class=\"p\">]:<\/span>\n        <span class=\"k\">break<\/span>\n\n    <span class=\"c1\"># Execute chain with both query and accumulated history<\/span>\n    <span class=\"n\">response<\/span> <span class=\"o\">=<\/span> <span class=\"n\">rag_chain<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">({<\/span>\n        <span class=\"s2\">\"input\"<\/span><span class=\"p\">:<\/span> <span class=\"n\">user_input<\/span><span class=\"p\">,<\/span>\n        <span class=\"s2\">\"chat_history\"<\/span><span class=\"p\">:<\/span> <span class=\"n\">chat_history<\/span>\n    <span class=\"p\">})<\/span>\n\n    <span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"sa\">f<\/span><span class=\"s2\">\"<\/span><span class=\"se\">\\n<\/span><span class=\"s2\">AI: <\/span><span class=\"si\">{<\/span><span class=\"n\">response<\/span><span class=\"p\">[<\/span><span class=\"s1\">'answer'<\/span><span class=\"p\">]<\/span><span class=\"si\">}<\/span><span class=\"se\">\\n<\/span><span class=\"s2\">\"<\/span><span class=\"p\">)<\/span>\n\n    <span class=\"c1\"># Update conversational history<\/span>\n    <span class=\"n\">chat_history<\/span><span class=\"o\">.<\/span><span class=\"n\">append<\/span><span class=\"p\">(<\/span><span class=\"n\">HumanMessage<\/span><span class=\"p\">(<\/span><span class=\"n\">content<\/span><span class=\"o\">=<\/span><span class=\"n\">user_input<\/span><span class=\"p\">))<\/span>\n    <span class=\"n\">chat_history<\/span><span class=\"o\">.<\/span><span class=\"n\">append<\/span><span class=\"p\">(<\/span><span class=\"n\">AIMessage<\/span><span class=\"p\">(<\/span><span class=\"n\">content<\/span><span class=\"o\">=<\/span><span class=\"n\">response<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"answer\"<\/span><span class=\"p\">]))<\/span>\n<\/code><\/pre><\/div>\n\n<hr />\n<h2 class=\"c4\" id=\"4-architectural-comparison-naive-rag-vs-conversational-rag\">4. Architectural Comparison: Naive RAG vs. Conversational RAG<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Evaluation Metric<\/th>\n<th>Naive RAG (Single-Turn)<\/th>\n<th>Conversational RAG (Multi-Turn)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>LLM Calls per Request<\/strong><\/td>\n<td>1 call (Final answer generation)<\/td>\n<td>2 calls (1 for query re-writing + 1 for answer generation)<\/td>\n<\/tr>\n<tr>\n<td><strong>Latency Overhead<\/strong><\/td>\n<td>Lower (<span class=\"math\">\\approx 1\\times<\/span>)<\/td>\n<td>Slightly higher (<span class=\"math\">\\approx 1.5\\times<\/span> to <span class=\"math\">2\\times<\/span>)<\/td>\n<\/tr>\n<tr>\n<td><strong>Pronoun Resolution<\/strong><\/td>\n<td>Fails on words like \"it\", \"they\", \"that\"<\/td>\n<td>Seamlessly resolves pronouns to specific entities<\/td>\n<\/tr>\n<tr>\n<td><strong>Context Grounding<\/strong><\/td>\n<td>High for standalone queries<\/td>\n<td>High across all turns of long dialogues<\/td>\n<\/tr>\n<tr>\n<td><strong>Production Viability<\/strong><\/td>\n<td>One-off search bars &amp; documentation lookup<\/td>\n<td>Enterprise AI chat agents, customer support, and PDF copilots<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>", "toc": [{"id": "1-why-naive-rag-fails-in-multi-turn-conversations", "name": "1. Why Naive RAG Fails in Multi-Turn Conversations"}, {"id": "2-the-solution-two-stage-conversational-rag-architecture", "name": "2. The Solution: Two-Stage Conversational RAG Architecture"}, {"id": "3-production-implementation-history-aware-rag-in-langchain", "name": "3. Production Implementation: History-Aware RAG in LangChain"}, {"id": "4-architectural-comparison-naive-rag-vs-conversational-rag", "name": "4. Architectural
