<script>window.PAGE = {"id": "n20_3", "root": "../", "lesson": {"id": "n20_3", "title": "Fast Search (ANN)", "short": "Fast Search (ANN)", "unit": "Unit 3", "unitName": "Chat with Your Data (RAG)", "pos": 6, "of": 11, "sub": "", "info": "Why brute force is slow, what ANN is, its five families, and IVF, HNSW and PQ explained", "html": "<h2 class=\"c1\" id=\"why-do-we-need-ann\">Why Do We Need ANN?<\/h2>\n<p>Searching a few thousand vectors is easy. Searching millions is the problem. Here is the story.<\/p>\n<figure class=\"visual\"><div class=\"px\">\n  <div class=\"px-r\"><span>The issue<\/span><div>A company stores <b>1 million<\/b> chunks. A user asks a question, and we must find the few best chunks, fast.<\/div><\/div>\n  <div class=\"px-r\"><span>The first try<\/span><div>Score the question against every vector, then sort. This is called <b>brute force<\/b>. It is exact: it always finds the true best chunks.<\/div><\/div>\n  <div class=\"px-r\"><span>Why it fails<\/span><div>One question costs 1 million scores. Each score multiplies 1,536 pairs of numbers, so one question needs about <b>1.5 billion<\/b> multiplications. Ten times more chunks means ten times more work, written <b>O(N)<\/b>. And it is paid on <b>every question<\/b>.<\/div><\/div>\n  <div class=\"px-r hi\"><span>The fix<\/span><div>Do not score everything. Look only in the places where the best chunks are likely to be. Once in a while we may miss the true best one, but the search becomes many times faster. This is <b>ANN<\/b>.<\/div><\/div>\n<\/div><div class=\"em-cap\">How the work grows with the number of vectors, for one question.<\/div><div class=\"em-tbl\"><table><tr><th>Vectors stored (N)<\/th><th>Multiplications for ONE question (N &times; 1,536)<\/th><th>Feeling<\/th><\/tr><tr><td>10,000<\/td><td>15,360,000<\/td><td>a moment<\/td><\/tr><tr><td>1,000,000<\/td><td>1,536,000,000<\/td><td>slow<\/td><\/tr><tr><td>100,000,000<\/td><td>153,600,000,000<\/td><td>far too slow<\/td><\/tr><\/table><\/div>\n<div class=\"em-point\"><b>Big O: the work grows in a straight line with N.<\/b> This is called <b>flat<\/b> or <b>brute-force<\/b> search, and written O(N &times; d). It is exact, but it is paid on <b>every question<\/b>.<\/div>\n<div class=\"em-cap\">d = 1,536 is the size of an OpenAI small embedding.<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c2\" id=\"what-is-ann\">What Is ANN?<\/h2>\n<p>ANN stands for <strong>Approximate Nearest Neighbor<\/strong>. Let us break the name into its words.<\/p>\n<figure class=\"visual\"><div class=\"px\">\n  <div class=\"px-r\"><span>Nearest neighbor<\/span><div>The stored vector that is closest to the question. We want the k nearest ones.<\/div><\/div>\n  <div class=\"px-r\"><span>Approximate<\/span><div>We accept &ldquo;very close&rdquo; instead of &ldquo;guaranteed the closest&rdquo;. Rarely, the true best chunk is missed.<\/div><\/div>\n  <div class=\"px-r hi\"><span>What we get<\/span><div>A big gain in speed, for a tiny loss in accuracy.<\/div><\/div>\n<\/div><div class=\"two\">\n  <div class=\"two-c t\"><div class=\"why-h\"><span class=\"tag t\">Exact search<\/span><\/div><div class=\"two-p\">Compare with <b>every<\/b> vector. Always finds the true closest ones. Slow on big data.<\/div><\/div>\n  <div class=\"two-c d\"><div class=\"why-h\"><span class=\"tag d\">Approximate search<\/span><\/div><div class=\"two-p\">Look at a <b>small part<\/b> of the vectors, chosen cleverly. Very fast. Might miss a true neighbour now and then.<\/div><\/div>\n<\/div>\n<div class=\"em-point\"><b>Recall<\/b> tells you how good an ANN index is: of the true top 10, how many did it find? A recall of 0.95 means 9 or 10 of them. You can trade speed for recall with the index settings.<\/div>\n<div class=\"px\">\n  <div class=\"px-r\"><span>What ANN is<\/span><div>A shortcut that chooses <b>which<\/b> vectors to score, so we do not score all of them.<\/div><\/div>\n  <div class=\"px-r\"><span>What it is not<\/span><div>A new way to score. We still score with cosine, dot product or Euclidean.<\/div><\/div>\n  <div class=\"px-r hi\"><span>The flow<\/span><div>ANN picks a small set of candidates. The score ranks them. The top-k come back.<\/div><\/div>\n<\/div><\/figure>\n<hr />\n<h2 class=\"c3\" id=\"the-families-of-ann-algorithms\">The Families of ANN Algorithms<\/h2>\n<p>There are dozens of ANN algorithms. You do not need to learn them all. They fall into <strong>five families<\/strong>, and each family uses one main trick.<\/p>\n<figure class=\"visual\"><div class=\"em-tbl\"><table>\n<tr><th>Family<\/th><th>The trick<\/th><th>A picture<\/th><th>Algorithms<\/th><\/tr>\n<tr><td><b>Groups<\/b><\/td><td>Sort the vectors into groups. Search only the nearest groups.<\/td><td>Books sorted into sections<\/td><td>IVF<\/td><\/tr>\n<tr><td><b>Graphs<\/b><\/td><td>Link each vector to its neighbours. Walk from link to link toward the question.<\/td><td>A road network<\/td><td>HNSW, DiskANN<\/td><\/tr>\n<tr><td><b>Compression<\/b><\/td><td>Store a smaller copy of each vector, so more fit in memory and scoring is faster.<\/td><td>A short summary instead of the whole book<\/td><td>PQ, ScaNN (ScaNN also uses groups)<\/td><\/tr>\n<tr><td><b>Hashing<\/b><\/td><td>Give similar vectors the same label. Search only the matching label.<\/td><td>Same postcode, same area<\/td><td>LSH<\/td><\/tr>\n<tr><td><b>Trees<\/b><\/td><td>Cut the space in two, again and again, like a game of twenty questions.<\/td><td>Twenty questions<\/td><td>Annoy<\/td><\/tr>\n<\/table><\/div>\n<div class=\"em-point\"><b>We explain three in detail:<\/b> IVF (groups), HNSW (graphs) and PQ (compression). For the others, know the name and the trick. Real systems often mix families, for example IVF together with PQ. A library such as FAISS gives you several of these, ready made.<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c4\" id=\"ivf-search-only-the-right-section\">IVF: Search Only the Right Section<\/h2>\n<p>IVF stands for <strong>Inverted File<\/strong>. Before the picture, let us see what the name means.<\/p>\n<figure class=\"visual\"><div class=\"px\">\n  <div class=\"px-r\"><span>File<\/span><div>Just a stored list of things.<\/div><\/div>\n  <div class=\"px-r\"><span>The normal way<\/span><div>For each vector, write which group it belongs to: vector 1 is in group A, vector 2 is in group C, and so on. To get all vectors of a group, you must read the whole list.<\/div><\/div>\n  <div class=\"px-r\"><span>Inverted<\/span><div>Flip it. For each group, keep the list of the vectors inside it: group A holds vectors 1, 4, 9 and so on. It is the same as the index at the back of a book, which goes from a word to its pages.<\/div><\/div>\n  <div class=\"px-r hi\"><span>In IVF<\/span><div>Each centre keeps the list of its vectors. We find the nearest centre, and then we read its list. That is all.<\/div><\/div>\n<\/div><div class=\"em-tbl\"><table>\n<tr><th>Centre (one group)<\/th><th>Its list of vectors<\/th><\/tr>\n<tr><td>Centre A<\/td><td><code>vector 1, vector 4, vector 9, &hellip;<\/code><\/td><\/tr>\n<tr><td>Centre B<\/td><td><code>vector 2, vector 5, vector 8, &hellip;<\/code><\/td><\/tr>\n<tr><td>Centre C<\/td><td><code>vector 3, vector 6, vector 7, &hellip;<\/code><\/td><\/tr>\n<\/table><\/div>\n<div class=\"em-cap\">Example lists.<\/div>\n<div class=\"em-fig\"><svg class=\"em-svg\" viewBox=\"0 0 980 330\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"8\" y=\"4\" width=\"318\" height=\"322\" rx=\"14\" fill=\"#f6f4f0\"/><text x=\"22\" y=\"30\" font-size=\"17\" font-weight=\"800\" fill=\"#0e3b3a\">1. Group the vectors (once)<\/text><circle cx=\"79\" cy=\"127\" r=\"6\" fill=\"#1a5c5b\" opacity=\"1\"/><circle cx=\"99\" cy=\"97\" r=\"6\" fill=\"#1a5c5b\" opacity=\"1\"/><circle cx=\"73\" cy=\"97\" r=\"6\" fill=\"#1a5c5b\" opacity=\"1\"/><circle cx=\"88\" cy=\"104\" r=\"6\" fill=\"#1a5c5b\" opacity=\"1\"/><circle cx=\"91\" cy=\"75\" r=\"6\" fill=\"#1a5c5b\" opacity=\"1\"/><circle cx=\"105\" cy=\"103\" r=\"6\" fill=\"#1a5c5b\" opacity=\"1\"/><circle cx=\"90\" cy=\"103\" r=\"6\" fill=\"#1a5c5b\" opacity=\"1\"/><circle cx=\"72\" cy=\"112\" r=\"6\" fill=\"#1a5c5b\" opacity=\"1\"/><circle cx=\"180\" cy=\"77\" r=\"6\" fill=\"#c9583a\" opacity=\"1\"/><circle cx=\"163\" cy=\"91\" r=\"6\" fill=\"#c9583a\" opacity=\"1\"/><circle cx=\"151\" cy=\"56\" r=\"6\" fill=\"#c9583a\" opacity=\"1\"/><circle cx=\"173\" cy=\"69\" r=\"6\" fill=\"#c9583a\" opacity=\"1\"/><circle cx=\"133\" cy=\"67\" r=\"6\" fill=\"#c9583a\" opacity=\"1\"/><circle cx=\"158\" cy=\"61\" r=\"6\" fill=\"#c9583a\" opacity=\"1\"/><circle cx=\"141\" cy=\"81\" r=\"6\" fill=\"#c9583a\" opacity=\"1\"/><circle cx=\"181\" cy=\"76\" r=\"6\" fill=\"#c9583a\" opacity=\"1\"/><circle cx=\"248\" cy=\"126\" r=\"6\" fill=\"#8a6a12\" opacity=\"1\"/><circle cx=\"273\" cy=\"115\" r=\"6\" fill=\"#8a6a12\" opacity=\"1\"/><circle cx=\"270\" cy=\"137\" r=\"6\" fill=\"#8a6a12\" opacity=\"1\"/><circle cx=\"257\" cy=\"107\" r=\"6\" fill=\"#8a6a12\" opacity=\"1\"/><circle cx=\"267\" cy=\"124\" r=\"6\" fill=\"#8a6a12\" opacity=\"1\"/><circle cx=\"280\" cy=\"99\" r=\"6\" fill=\"#8a6a12\" opacity=\"1\"/><circle cx=\"250\" cy=\"107\" r=\"6\" fill=\"#8a6a12\" opacity=\"1\"/><circle cx=\"232\" cy=\"122\" r=\"6\" fill=\"#8a6a12\" opacity=\"1\"/><circle cx=\"120\" cy=\"198\" r=\"6\" fill=\"#3b6ea5\" opacity=\"1\"/><circle cx=\"135\" cy=\"223\" r=\"6\" fill=\"#3b6ea5\" opacity=\"1\"/><circle cx=\"122\" cy=\"216\" r=\"6\" fill=\"#3b6ea5\" opacity=\"1\"/><circle cx=\"127\" cy=\"189\" r=\"6\" fill=\"#3b6ea5\" opacity=\"1\"/><circle cx=\"121\" cy=\"220\" r=\"6\" fill=\"#3b6ea5\" opacity=\"1\"/><circle cx=\"81\" cy=\"216\" r=\"6\" fill=\"#3b6ea5\" opacity=\"1\"/><circle cx=\"107\" cy=\"223\" r=\"6\" fill=\"#3b6ea5\" opacity=\"1\"/><circle cx=\"104\" cy=\"210\" r=\"6\" fill=\"#3b6ea5\" opacity=\"1\"/><circle cx=\"234\" cy=\"206\" r=\"6\" fill=\"#7a5aa6\" opacity=\"1\"/><circle cx=\"238\" cy=\"218\" r=\"6\" fill=\"#7a5aa6\" opacity=\"1\"/><circle cx=\"236\" cy=\"212\" r=\"6\" fill=\"#7a5aa6\" opacity=\"1\"/><circle cx=\"246\" cy=\"230\" r=\"6\" fill=\"#7a5aa6\" opacity=\"1\"/><circle cx=\"225\" cy=\"230\" r=\"6\" fill=\"#7a5aa6\" opacity=\"1\"/><circle cx=\"249\" cy=\"249\" r=\"6\" fill=\"#7a5aa6\" opacity=\"1\"/><circle cx=\"201\" cy=\"234\" r=\"6\" fill=\"#7a5aa6\" opacity=\"1\"/><circle cx=\"236\" cy=\"218\" r=\"6\" fill=\"#7a5aa6\" opacity=\"1\"/><rect x=\"71\" y=\"98\" width=\"14\" height=\"14\" fill=\"#1a5c5b\" stroke=\"#fff\" stroke-width=\"2\" transform=\"rotate(45 78 105)\"/><rect x=\"159\" y=\"73\" width=\"14\" height=\"14\" fill=\"#c9583a\" stroke=\"#fff\" stroke-width=\"2\" transform=\"rotate(45 166 80)\"/><rect x=\"254\" y=\"113\" width=\"14\" height=\"14\" fill=\"#8a6a12\" stroke=\"#fff\" stroke-width=\"2\" transform=\"rotate(45 261 120)\"/><rect x=\"104\" y=\"203\" width=\"14\" height=\"14\" fill=\"#3b6ea5\" stroke=\"#fff\" stroke-width=\"2\" transform=\"rotate(45 111 210)\"/><rect x=\"221\" y=\"213\" width=\"14\" height=\"14\" fill=\"#7a5aa6\" stroke=\"#fff\" stroke-width=\"2\" transform=\"rotate(45 228 220)\"/><text x=\"22\" y=\"286\" font-size=\"16\" fill=\"#4a5f5e\">Each colour is one group.<\/text><text x=\"22\" y=\"307\" font-size=\"16\" fill=\"#4a5f5e\">The diamond is its centre.<\/text><rect x=\"332\" y=\"4\" width=\"318\" height=\"322\" rx=\"14\" fill=\"#f6f4f0\"/><text x=\"346\" y=\"30\" font-size=\"17\" font-weight=\"800\" fill=\"#0e3b3a\">2. Compare with the centres only<\/text><line x1=\"512\" y1=\"122\" x2=\"402\" y2=\"105\" stroke=\"#a8a294\" stroke-width=\"1.5\" opacity=\"0.7\"/><line x1=\"512\" y1=\"122\" x2=\"490\" y2=\"80\" stroke=\"#c9583a\" stroke-width=\"3.5\" opacity=\"1\"/><line x1=\"512\" y1=\"122\" x2=\"585\" y2=\"120\" stroke=\"#a8a294\" stroke-width=\"1.5\" opacity=\"0.7\"/><line x1=\"512\" y1=\"122\" x2=\"435\" y2=\"210\" stroke=\"#a8a294\" stroke-width=\"1.5\" opacity=\"0.7\"/><line x1=\"512\" y1=\"122\" x2=\"552\" y2=\"220\" stroke=\"#a8a294\" stroke-width=\"1.5\" opacity=\"0.7\"/><circle cx=\"403\" cy=\"127\" r=\"6\" fill=\"#b9b3a6\" opacity=\"1\"/><circle cx=\"423\" cy=\"97\" r=\"6\" fill=\"#b9b3a6\" opacity=\"1\"/><circle cx=\"397\" cy=\"97\" r=\"6\" fill=\"#b9b3a6\" opacity=\"1\"/><circle cx=\"412\" cy=\"104\" r=\"6\" fill=\"#b9b3a6\" opacity=\"1\"/><circle cx=\"415\" cy=\"75\" r=\"6\" fill=\"#b9b3a6\" opacity=\"1\"/><circle cx=\"429\" cy=\"103\" r=\"6\" fill=\"#b9b3a6\" opacity=\"1\"/><circle cx=\"414\" cy=\"103\" r=\"6\" fill=\"#b9b3a6\" opacity=\"1\"/><circle cx=\"396\" cy=\"112\" r=\"6\" fill=\"#b9b3a6\" opacity=\"1\"/><circle cx=\"504\" cy=\"77\" r=\"6\" fill=\"#b9b3a6\" opacity=\"1\"/><circle cx=\"487\" cy=\"91\" r=\"6\" fill=\"#b9b3a6\" opacity=\"1\"/><circle cx=\"475\" cy=\"56\" r=\"6\" fill=\"#b9b3a6\" opacity=\"1\"/><circle cx=\"497\" cy=\"69\" r=\"6\" fill=\"#b9b3a6\" opacity=\"1\"/><circle cx=\"457\" cy=\"67\" r=\"6\" fill=\"#b9b3a6\" opacity=\"1\"/><circle cx=\"482\" cy=\"61\" r=\"6\" fill=\"#b9b3a6\" opacity=\"1\"/><circle cx=\"465\" cy=\"81\" r=\"6\" fill=\"#b9b3a6\" opacity=\"1\"/><circle cx=\"505\" cy=\"76\" r=\"6\" fill=\"#b9b3a6\" opacity=\"1\"/><circle cx=\"572\" cy=\"126\" r=\"6\" fill=\"#b9b3a6\" opacity=\"1\"/><circle cx=\"597\" cy=\"115\" r=\"6\" fill=\"#b9b3a6\" opacity=\"1\"/><circle cx=\"594\" cy=\"137\" r=\"6\" fill=\"#b9b3a6\" opacity=\"1\"/><circle cx=\"581\" cy=\"107\" r=\"6\" fill=\"#b9b3a6\" opacity=\"1\"/><circle cx=\"591\" cy=\"124\" r=\"6\" fill=\"#b9b3a6\" opacity=\"1\"/><circle cx=\"604\" cy=\"99\" r=\"6\" fill=\"#b9b3a6\" opacity=\"1\"/><circle cx=\"574\" cy=\"107\" r=\"6\" fill=\"#b9b3a6\" opacity=\"1\"/><circle cx=\"556\" cy=\"122\" r=\"6\" fill=\"#b9b3a6\" opacity=\"1\"/><circle cx=\"444\" cy=\"198\" r=\"6\" fill=\"#b9b3a6\" opacity=\"1\"/><circle cx=\"459\" cy=\"223\" r=\"6\" fill=\"#b9b3a6\" opacity=\"1\"/><circle cx=\"446\" cy=\"216\" r=\"6\" fill=\"#b9b3a6\" opacity=\"1\"/><circle cx=\"451\" cy=\"189\" r=\"6\" fill=\"#b9b3a6\" opacity=\"1\"/><circle cx=\"445\" cy=\"220\" r=\"6\" fill=\"#b9b3a6\" opacity=\"1\"/><circle cx=\"405\" cy=\"216\" r=\"6\" fill=\"#b9b3a6\" opacity=\"1\"/><circle cx=\"431\" cy=\"223\" r=\"6\" fill=\"#b9b3a6\" opacity=\"1\"/><circle cx=\"428\" cy=\"210\" r=\"6\" fill=\"#b9b3a6\" opacity=\"1\"/><circle cx=\"558\" cy=\"206\" r=\"6\" fill=\"#b9b3a6\" opacity=\"1\"/><circle cx=\"562\" cy=\"218\" r=\"6\" fill=\"#b9b3a6\" opacity=\"1\"/><circle cx=\"560\" cy=\"212\" r=\"6\" fill=\"#b9b3a6\" opacity=\"1\"/><circle cx=\"570\" cy=\"230\" r=\"6\" fill=\"#b9b3a6\" opacity=\"1\"/><circle cx=\"549\" cy=\"230\" r=\"6\" fill=\"#b9b3a6\" opacity=\"1\"/><circle cx=\"573\" cy=\"249\" r=\"6\" fill=\"#b9b3a6\" opacity=\"1\"/><circle cx=\"525\" cy=\"234\" r=\"6\" fill=\"#b9b3a6\" opacity=\"1\"/><circle cx=\"560\" cy=\"218\" r=\"6\" fill=\"#b9b3a6\" opacity=\"1\"/><rect x=\"395\" y=\"98\" width=\"14\" height=\"14\" fill=\"#1a5c5b\" stroke=\"#fff\" stroke-width=\"2\" transform=\"rotate(45 402 105)\"/><rect x=\"483\" y=\"73\" width=\"14\" height=\"14\" fill=\"#c9583a\" stroke=\"#fff\" stroke-width=\"2\" transform=\"rotate(45 490 80)\"/><rect x=\"578\" y=\"113\" width=\"14\" height=\"14\" fill=\"#8a6a12\" stroke=\"#fff\" stroke-width=\"2\" transform=\"rotate(45 585 120)\"/><rect x=\"428\" y=\"203\" width=\"14\" height=\"14\" fill=\"#3b6ea5\" stroke=\"#fff\" stroke-width=\"2\" transform=\"rotate(45 435 210)\"/><rect x=\"545\" y=\"213\" width=\"14\" height=\"14\" fill=\"#7a5aa6\" stroke=\"#fff\" stroke-width=\"2\" transform=\"rotate(45 552 220)\"/><text x=\"514\" y=\"131\" font-size=\"26\" text-anchor=\"middle\" fill=\"#c9583a\">&#9733;<\/text><text x=\"514\" y=\"152\" font-size=\"13\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#c9583a\">QUESTION<\/text><text x=\"346\" y=\"286\" font-size=\"16\" fill=\"#4a5f5e\">The question is compared with<\/text><text x=\"346\" y=\"307\" font-size=\"16\" fill=\"#4a5f5e\">5 centres, not every dot.<\/text><rect x=\"656\" y=\"4\" width=\"318\" height=\"322\" rx=\"14\" fill=\"#f6f4f0\"/><text x=\"670\" y=\"30\" font-size=\"17\" font-weight=\"800\" fill=\"#0e3b3a\">3. Search inside that group<\/text><circle cx=\"727\" cy=\"127\" r=\"6\" fill=\"#d3cec3\" opacity=\"1\"/><circle cx=\"747\" cy=\"97\" r=\"6\" fill=\"#d3cec3\" opacity=\"1\"/><circle cx=\"721\" cy=\"97\" r=\"6\" fill=\"#d3cec3\" opacity=\"1\"/><circle cx=\"736\" cy=\"104\" r=\"6\" fill=\"#d3cec3\" opacity=\"1\"/><circle cx=\"739\" cy=\"75\" r=\"6\" fill=\"#d3cec3\" opacity=\"1\"/><circle cx=\"753\" cy=\"103\" r=\"6\" fill=\"#d3cec3\" opacity=\"1\"/><circle cx=\"738\" cy=\"103\" r=\"6\" fill=\"#d3cec3\" opacity=\"1\"/><circle cx=\"720\" cy=\"112\" r=\"6\" fill=\"#d3cec3\" opacity=\"1\"/><circle cx=\"828\" cy=\"77\" r=\"6\" fill=\"#c9583a\" opacity=\"1\"/><circle cx=\"811\" cy=\"91\" r=\"6\" fill=\"#c9583a\" opacity=\"1\"/><circle cx=\"799\" cy=\"56\" r=\"6\" fill=\"#c9583a\" opacity=\"1\"/><circle cx=\"821\" cy=\"69\" r=\"6\" fill=\"#c9583a\" opacity=\"1\"/><circle cx=\"781\" cy=\"67\" r=\"6\" fill=\"#c9583a\" opacity=\"1\"/><circle cx=\"806\" cy=\"61\" r=\"6\" fill=\"#c9583a\" opacity=\"1\"/><circle cx=\"789\" cy=\"81\" r=\"6\" fill=\"#c9583a\" opacity=\"1\"/><circle cx=\"829\" cy=\"76\" r=\"6\" fill=\"#c9583a\" opacity=\"1\"/><circle cx=\"896\" cy=\"126\" r=\"6\" fill=\"#d3cec3\" opacity=\"1\"/><circle cx=\"921\" cy=\"115\" r=\"6\" fill=\"#d3cec3\" opacity=\"1\"/><circle cx=\"918\" cy=\"137\" r=\"6\" fill=\"#d3cec3\" opacity=\"1\"/><circle cx=\"905\" cy=\"107\" r=\"6\" fill=\"#d3cec3\" opacity=\"1\"/><circle cx=\"915\" cy=\"124\" r=\"6\" fill=\"#d3cec3\" opacity=\"1\"/><circle cx=\"928\" cy=\"99\" r=\"6\" fill=\"#d3cec3\" opacity=\"1\"/><circle cx=\"898\" cy=\"107\" r=\"6\" fill=\"#d3cec3\" opacity=\"1\"/><circle cx=\"880\" cy=\"122\" r=\"6\" fill=\"#d3cec3\" opacity=\"1\"/><circle cx=\"768\" cy=\"198\" r=\"6\" fill=\"#d3cec3\" opacity=\"1\"/><circle cx=\"783\" cy=\"223\" r=\"6\" fill=\"#d3cec3\" opacity=\"1\"/><circle cx=\"770\" cy=\"216\" r=\"6\" fill=\"#d3cec3\" opacity=\"1\"/><circle cx=\"775\" cy=\"189\" r=\"6\" fill=\"#d3cec3\" opacity=\"1\"/><circle cx=\"769\" cy=\"220\" r=\"6\" fill=\"#d3cec3\" opacity=\"1\"/><circle cx=\"729\" cy=\"216\" r=\"6\" fill=\"#d3cec3\" opacity=\"1\"/><circle cx=\"755\" cy=\"223\" r=\"6\" fill=\"#d3cec3\" opacity=\"1\"/><circle cx=\"752\" cy=\"210\" r=\"6\" fill=\"#d3cec3\" opacity=\"1\"/><circle cx=\"882\" cy=\"206\" r=\"6\" fill=\"#d3cec3\" opacity=\"1\"/><circle cx=\"886\" cy=\"218\" r=\"6\" fill=\"#d3cec3\" opacity=\"1\"/><circle cx=\"884\" cy=\"212\" r=\"6\" fill=\"#d3cec3\" opacity=\"1\"/><circle cx=\"894\" cy=\"230\" r=\"6\" fill=\"#d3cec3\" opacity=\"1\"/><circle cx=\"873\" cy=\"230\" r=\"6\" fill=\"#d3cec3\" opacity=\"1\"/><circle cx=\"897\" cy=\"249\" r=\"6\" fill=\"#d3cec3\" opacity=\"1\"/><circle cx=\"849\" cy=\"234\" r=\"6\" fill=\"#d3cec3\" opacity=\"1\"/><circle cx=\"884\" cy=\"218\" r=\"6\" fill=\"#d3cec3\" opacity=\"1\"/><rect x=\"807\" y=\"73\" width=\"14\" height=\"14\" fill=\"#c9583a\" stroke=\"#fff\" stroke-width=\"2\" transform=\"rotate(45 814 80)\"/><text x=\"838\" y=\"131\" font-size=\"26\" text-anchor=\"middle\" fill=\"#c9583a\">&#9733;<\/text><text x=\"838\" y=\"152\" font-size=\"13\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#c9583a\">QUESTION<\/text><text x=\"670\" y=\"286\" font-size=\"16\" fill=\"#4a5f5e\">Only the red group is scored.<\/text><text x=\"670\" y=\"307\" font-size=\"16\" fill=\"#4a5f5e\">The other groups are skipped.<\/text><\/svg><\/div>\n<div class=\"bnt rt4 three\">\n  <div class=\"bnt-t c3\"><div class=\"bnt-h\">Build once<\/div><div class=\"bnt-b\">Make clusters<\/div><div class=\"bnt-p\">Group the vectors with k-means. Each group has a centre.<\/div><\/div>\n  <div class=\"bnt-t c1\"><div class=\"bnt-h\">For each question<\/div><div class=\"bnt-b\">Find the nearest centres<\/div><div class=\"bnt-p\">Compare the question with the few centres, not with all vectors.<\/div><\/div>\n  <div class=\"bnt-t c4\"><div class=\"bnt-h\">Then<\/div><div class=\"bnt-b\">Search inside those clusters<\/div><div class=\"bnt-p\">The setting <code>nprobe<\/code> says how many clusters to open. More: better recall, slower.<\/div><\/div>\n<\/div>\n<div class=\"em-point\"><b>The catch:<\/b> if the true closest vector sits in a cluster you did not open, you miss it. A question near the edge of two clusters is the risky case.<\/div>\n<\/figure>\n<p>How are the groups made? With a simple method called <strong>k-means<\/strong>. Say we have 100,000 vectors and want 100 groups.<\/p>\n<figure class=\"visual\"><div class=\"px\">\n  <div class=\"px-r\"><span>Start<\/span><div>Pick 100 of the vectors at random. These are the first <b>centres<\/b>.<\/div><\/div>\n  <div class=\"px-r\"><span>Assign<\/span><div>Give every vector to its nearest centre. Now there are 100 groups. They are uneven: one may hold 5,000 vectors and another 20,000.<\/div><\/div>\n  <div class=\"px-r\"><span>Move<\/span><div>Move each centre to the <b>average<\/b> of the vectors in its group. The centres now sit in the middle of their groups.<\/div><\/div>\n  <div class=\"px-r\"><span>Repeat<\/span><div>Assign again with the new centres, then move the centres again. Stop when the centres hardly move. A few rounds are usually enough (10 to 20 is common).<\/div><\/div>\n  <div class=\"px-r hi\"><span>Result<\/span><div>100 centres. Every vector belongs to the group of its nearest centre.<\/div><\/div>\n<\/div><div class=\"em-point\"><b>The groups do not become equal in size.<\/b> The goal is not equal groups. The goal is that each centre sits in the middle of its own group.<\/div>\n<div class=\"em-point\"><b>Why this is fast:<\/b> with 100 groups of about 1,000 vectors each, a search compares the question with the 100 centres, then with one group of about 1,000. That is about 1,100 comparisons instead of 100,000.<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c5\" id=\"hnsw-a-graph-with-highways\">HNSW: A Graph with Highways<\/h2>\n<p>HNSW stands for <strong>Hierarchical Navigable Small World<\/strong>. It is the most widely used ANN method, and the one Chroma uses.<\/p>\n<figure class=\"visual\"><div class=\"em-fig\"><svg class=\"em-svg\" viewBox=\"0 0 640 275\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"10\" y=\"29\" width=\"620\" height=\"52\" rx=\"10\" fill=\"#f6f4f0\" stroke=\"#e4dfd6\"/><text x=\"18\" y=\"43\" font-size=\"11\" font-weight=\"800\" fill=\"#7a7367\" letter-spacing=\"1\">LAYER 2<\/text><line x1=\"40\" y1=\"55\" x2=\"280\" y2=\"55\" stroke=\"#bdb7aa\" stroke-width=\"1.5\"/><line x1=\"280\" y1=\"55\" x2=\"520\" y2=\"55\" stroke=\"#bdb7aa\" stroke-width=\"1.5\"/><circle cx=\"40\" cy=\"55\" r=\"6\" fill=\"#fff\" stroke=\"#1a5c5b\" stroke-width=\"2\"/><circle cx=\"280\" cy=\"55\" r=\"6\" fill=\"#fff\" stroke=\"#1a5c5b\" stroke-width=\"2\"/><circle cx=\"520\" cy=\"55\" r=\"6\" fill=\"#fff\" stroke=\"#1a5c5b\" stroke-width=\"2\"/><rect x=\"10\" y=\"104\" width=\"620\" height=\"52\" rx=\"10\" fill=\"#f6f4f0\" stroke=\"#e4dfd6\"/><text x=\"18\" y=\"118\" font-size=\"11\" font-weight=\"800\" fill=\"#7a7367\" letter-spacing=\"1\">LAYER 1<\/text><line x1=\"40\" y1=\"130\" x2=\"136\" y2=\"130\" stroke=\"#bdb7aa\" stroke-width=\"1.5\"/><line x1=\"136\" y1=\"130\" x2=\"280\" y2=\"130\" stroke=\"#bdb7aa\" stroke-width=\"1.5\"/><line x1=\"280\" y1=\"130\" x2=\"376\" y2=\"130\" stroke=\"#bdb7aa\" stroke-width=\"1.5\"/><line x1=\"376\" y1=\"130\" x2=\"472\" y2=\"130\" stroke=\"#bdb7aa\" stroke-width=\"1.5\"/><line x1=\"472\" y1=\"130\" x2=\"520\" y2=\"130\" stroke=\"#bdb7aa\" stroke-width=\"1.5\"/><circle cx=\"40\" cy=\"130\" r=\"6\" fill=\"#fff\" stroke=\"#1a5c5b\" stroke-width=\"2\"/><circle cx=\"136\" cy=\"130\" r=\"6\" fill=\"#fff\" stroke=\"#1a5c5b\" stroke-width=\"2\"/><circle cx=\"280\" cy=\"130\" r=\"6\" fill=\"#fff\" stroke=\"#1a5c5b\" stroke-width=\"2\"/><circle cx=\"376\" cy=\"130\" r=\"6\" fill=\"#fff\" stroke=\"#1a5c5b\" stroke-width=\"2\"/><circle cx=\"472\" cy=\"130\" r=\"6\" fill=\"#fff\" stroke=\"#1a5c5b\" stroke-width=\"2\"/><circle cx=\"520\" cy=\"130\" r=\"6\" fill=\"#fff\" stroke=\"#1a5c5b\" stroke-width=\"2\"/><rect x=\"10\" y=\"179\" width=\"620\" height=\"52\" rx=\"10\" fill=\"#eef7f7\" stroke=\"#e4dfd6\"/><text x=\"18\" y=\"193\" font-size=\"11\" font-weight=\"800\" fill=\"#7a7367\" letter-spacing=\"1\">LAYER 0<\/text><line x1=\"40\" y1=\"205\" x2=\"88\" y2=\"205\" stroke=\"#bdb7aa\" stroke-width=\"1.5\"/><line x1=\"88\" y1=\"205\" x2=\"136\" y2=\"205\" stroke=\"#bdb7aa\" stroke-width=\"1.5\"/><line x1=\"136\" y1=\"205\" x2=\"184\" y2=\"205\" stroke=\"#bdb7aa\" stroke-width=\"1.5\"/><line x1=\"184\" y1=\"205\" x2=\"232\" y2=\"205\" stroke=\"#bdb7aa\" stroke-width=\"1.5\"/><line x1=\"232\" y1=\"205\" x2=\"280\" y2=\"205\" stroke=\"#bdb7aa\" stroke-width=\"1.5\"/><line x1=\"280\" y1=\"205\" x2=\"328\" y2=\"205\" stroke=\"#bdb7aa\" stroke-width=\"1.5\"/><line x1=\"328\" y1=\"205\" x2=\"376\" y2=\"205\" stroke=\"#bdb7aa\" stroke-width=\"1.5\"/><line x1=\"376\" y1=\"205\" x2=\"424\" y2=\"205\" stroke=\"#bdb7aa\" stroke-width=\"1.5\"/><line x1=\"424\" y1=\"205\" x2=\"472\" y2=\"205\" stroke=\"#bdb7aa\" stroke-width=\"1.5\"/><line x1=\"472\" y1=\"205\" x2=\"520\" y2=\"205\" stroke=\"#bdb7aa\" stroke-width=\"1.5\"/><line x1=\"520\" y1=\"205\" x2=\"568\" y2=\"205\" stroke=\"#bdb7aa\" stroke-width=\"1.5\"/><circle cx=\"40\" cy=\"205\" r=\"6\" fill=\"#fff\" stroke=\"#1a5c5b\" stroke-width=\"2\"/><text x=\"40\" y=\"225\" font-size=\"10\" text-anchor=\"middle\" fill=\"#4a5f5e\">n1<\/text><circle cx=\"88\" cy=\"205\" r=\"6\" fill=\"#fff\" stroke=\"#1a5c5b\" stroke-width=\"2\"/><text x=\"88\" y=\"225\" font-size=\"10\" text-anchor=\"middle\" fill=\"#4a5f5e\">n2<\/text><circle cx=\"136\" cy=\"205\" r=\"6\" fill=\"#fff\" stroke=\"#1a5c5b\" stroke-width=\"2\"/><text x=\"136\" y=\"225\" font-size=\"10\" text-anchor=\"middle\" fill=\"#4a5f5e\">n3<\/text><circle cx=\"184\" cy=\"205\" r=\"6\" fill=\"#fff\" stroke=\"#1a5c5b\" stroke-width=\"2\"/><text x=\"184\" y=\"225\" font-size=\"10\" text-anchor=\"middle\" fill=\"#4a5f5e\">n4<\/text><circle cx=\"232\" cy=\"205\" r=\"6\" fill=\"#fff\" stroke=\"#1a5c5b\" stroke-width=\"2\"/><text x=\"232\" y=\"225\" font-size=\"10\" text-anchor=\"middle\" fill=\"#4a5f5e\">n5<\/text><circle cx=\"280\" cy=\"205\" r=\"6\" fill=\"#fff\" stroke=\"#1a5c5b\" stroke-width=\"2\"/><text x=\"280\" y=\"225\" font-size=\"10\" text-anchor=\"middle\" fill=\"#4a5f5e\">n6<\/text><circle cx=\"328\" cy=\"205\" r=\"6\" fill=\"#fff\" stroke=\"#1a5c5b\" stroke-width=\"2\"/><text x=\"328\" y=\"225\" font-size=\"10\" text-anchor=\"middle\" fill=\"#4a5f5e\">n7<\/text><circle cx=\"376\" cy=\"205\" r=\"6\" fill=\"#fff\" stroke=\"#1a5c5b\" stroke-width=\"2\"/><text x=\"376\" y=\"225\" font-size=\"10\" text-anchor=\"middle\" fill=\"#4a5f5e\">n8<\/text><circle cx=\"424\" cy=\"205\" r=\"6\" fill=\"#fff\" stroke=\"#1a5c5b\" stroke-width=\"2\"/><text x=\"424\" y=\"225\" font-size=\"10\" text-anchor=\"middle\" fill=\"#4a5f5e\">n9<\/text><circle cx=\"472\" cy=\"205\" r=\"6\" fill=\"#fff\" stroke=\"#1a5c5b\" stroke-width=\"2\"/><text x=\"472\" y=\"225\" font-size=\"10\" text-anchor=\"middle\" fill=\"#4a5f5e\">n10<\/text><circle cx=\"520\" cy=\"205\" r=\"6\" fill=\"#fff\" stroke=\"#1a5c5b\" stroke-width=\"2\"/><text x=\"520\" y=\"225\" font-size=\"10\" text-anchor=\"middle\" fill=\"#4a5f5e\">n11<\/text><circle cx=\"568\" cy=\"205\" r=\"6\" fill=\"#fff\" stroke=\"#1a5c5b\" stroke-width=\"2\"/><text x=\"568\" y=\"225\" font-size=\"10\" text-anchor=\"middle\" fill=\"#4a5f5e\">n12<\/text><line x1=\"40\" y1=\"61\" x2=\"40\" y2=\"124\" stroke=\"#d9d4c8\" stroke-width=\"1\"/><line x1=\"280\" y1=\"61\" x2=\"280\" y2=\"124\" stroke=\"#d9d4c8\" stroke-width=\"1\"/><line x1=\"520\" y1=\"61\" x2=\"520\" y2=\"124\" stroke=\"#d9d4c8\" stroke-width=\"1\"/><line x1=\"40\" y1=\"136\" x2=\"40\" y2=\"199\" stroke=\"#d9d4c8\" stroke-width=\"1\"/><line x1=\"136\" y1=\"136\" x2=\"136\" y2=\"199\" stroke=\"#d9d4c8\" stroke-width=\"1\"/><line x1=\"280\" y1=\"136\" x2=\"280\" y2=\"199\" stroke=\"#d9d4c8\" stroke-width=\"1\"/><line x1=\"376\" y1=\"136\" x2=\"376\" y2=\"199\" stroke=\"#d9d4c8\" stroke-width=\"1\"/><line x1=\"472\" y1=\"136\" x2=\"472\" y2=\"199\" stroke=\"#d9d4c8\" stroke-width=\"1\"/><line x1=\"520\" y1=\"136\" x2=\"520\" y2=\"199\" stroke=\"#d9d4c8\" stroke-width=\"1\"/><line class=\"hn-p\" style=\"animation-delay:0.0s\" x1=\"40\" y1=\"55\" x2=\"280\" y2=\"55\"/><circle class=\"hn-c\" style=\"animation-delay:0.0s\" cx=\"280\" cy=\"55\" r=\"8\"/><line class=\"hn-p\" style=\"animation-delay:1.2s\" x1=\"280\" y1=\"55\" x2=\"520\" y2=\"55\"/><circle class=\"hn-c\" style=\"animation-delay:1.2s\" cx=\"520\" cy=\"55\" r=\"8\"/><line class=\"hn-p\" style=\"animation-delay:2.4s\" x1=\"520\" y1=\"61\" x2=\"520\" y2=\"124\"/><line class=\"hn-p\" style=\"animation-delay:3.6s\" x1=\"520\" y1=\"130\" x2=\"472\" y2=\"130\"/><circle class=\"hn-c\" style=\"animation-delay:3.6s\" cx=\"472\" cy=\"130\" r=\"8\"/><line class=\"hn-p\" style=\"animation-delay:4.8s\" x1=\"472\" y1=\"136\" x2=\"472\" y2=\"199\"/><line class=\"hn-p\" style=\"animation-delay:6.0s\" x1=\"472\" y1=\"205\" x2=\"424\" y2=\"205\"/><circle class=\"hn-c\" style=\"animation-delay:6.0s\" cx=\"424\" cy=\"205\" r=\"8\"/><text x=\"440\" y=\"249\" font-size=\"22\" text-anchor=\"middle\" fill=\"#c9583a\">&#9733;<\/text><text x=\"440\" y=\"263\" font-size=\"11\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#c9583a\">QUESTION<\/text><\/svg><div class=\"em-cap\">Each dot is a stored vector. The search starts at the top, takes big jumps, and goes down layer by layer. The red path replays every few seconds.<\/div><\/div>\n<div class=\"bnt rt4 three\">\n  <div class=\"bnt-t c3\"><div class=\"bnt-h\">Start<\/div><div class=\"bnt-b\">At the top layer<\/div><div class=\"bnt-p\">Few dots, long links. Big jumps across the space.<\/div><\/div>\n  <div class=\"bnt-t c1\"><div class=\"bnt-h\">Move<\/div><div class=\"bnt-b\">To the closest neighbour<\/div><div class=\"bnt-p\">Look at the linked dots. Step to the one nearest the question.<\/div><\/div>\n  <div class=\"bnt-t c4\"><div class=\"bnt-h\">Drop<\/div><div class=\"bnt-b\">When nothing is closer<\/div><div class=\"bnt-p\">Go down one layer. More dots, shorter links. Repeat until layer 0.<\/div><\/div>\n<\/div>\n<\/figure>\n<p>HNSW has three settings you will meet in the docs.<\/p>\n<figure class=\"visual\"><div class=\"px\">\n  <div class=\"px-r\"><span>max_neighbors (M)<\/span><div>How many links each dot keeps. More links: better recall, more memory. In the installed Chroma: <b>16<\/b>.<\/div><\/div>\n  <div class=\"px-r\"><span>ef_construction<\/span><div>How careful the index is when it is built. Higher: a better graph, slower build. In the installed Chroma: <b>100<\/b>.<\/div><\/div>\n  <div class=\"px-r\"><span>ef_search<\/span><div>How many candidate dots the search keeps in mind. Higher: better recall, slower search. In the installed Chroma: <b>100<\/b>.<\/div><\/div>\n  <div class=\"px-r hi\"><span>The cost<\/span><div>The work grows roughly with log N, not N. The price: the graph takes memory, and the result is approximate.<\/div><\/div>\n<\/div><\/figure>\n<hr />\n<h2 class=\"c1\" id=\"pq-make-each-vector-smaller\">PQ: Make Each Vector Smaller<\/h2>\n<p>PQ stands for <strong>Product Quantization<\/strong>. It does not choose where to search. It makes every vector smaller, so more of them fit in memory and scoring is faster.<\/p>\n<figure class=\"visual\"><div class=\"px\">\n  <div class=\"px-r\"><span>The issue<\/span><div>1 billion vectors of 1,536 numbers each need about <b>6 terabytes<\/b> (every number takes 4 bytes). That does not fit in memory.<\/div><\/div>\n  <div class=\"px-r\"><span>The idea<\/span><div>Keep a rough copy of each vector instead of the exact one. A rough copy is much smaller.<\/div><\/div>\n  <div class=\"px-r\"><span>Cut<\/span><div>Cut each vector into pieces. A vector of 128 numbers becomes 8 pieces of 16 numbers.<\/div><\/div>\n  <div class=\"px-r\"><span>Make a menu<\/span><div>For each piece position, the system learns a menu of 256 typical pieces. It uses k-means, the same trick as IVF.<\/div><\/div>\n  <div class=\"px-r\"><span>Replace<\/span><div>Replace each piece by the <b>number<\/b> of its closest menu item. A number from 0 to 255 fits in one byte.<\/div><\/div>\n  <div class=\"px-r hi\"><span>Result<\/span><div>128 numbers (512 bytes) become 8 small numbers (8 bytes). That is 64 times smaller, and a little less exact.<\/div><\/div>\n<\/div><div class=\"em-flow\">\n  <div class=\"em-fc\"><div class=\"stp-l\">One vector<\/div>128 numbers<br><code>[0.12, -0.50, 0.31, &hellip;]<\/code><\/div><div class=\"em-ar\">&rarr;<\/div>\n  <div class=\"em-fc\"><div class=\"stp-l\">Cut<\/div>8 pieces of 16 numbers each<\/div><div class=\"em-ar\">&rarr;<\/div>\n  <div class=\"em-fc\"><div class=\"stp-l\">Each piece becomes a menu number<\/div>one byte each<\/div><div class=\"em-ar\">&rarr;<\/div>\n  <div class=\"em-fc out\"><div class=\"stp-l\">Stored instead<\/div><code>[17, 203, 5, 88, 140, 9, 61, 254]<\/code><\/div>\n<\/div>\n<div class=\"em-cap\">Example codes.<\/div>\n<div class=\"em-point\"><b>PQ is often used with IVF.<\/b> IVF picks the groups to search, and PQ makes the scoring inside them cheap. The combination is called IVF-PQ. The price of PQ is a small loss of accuracy.<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c2\" id=\"other-ideas-to-know\">Other Ideas to Know<\/h2>\n<p>There are more ways to speed up search. You do not need all the details now, but you should know the names.<\/p>\n<figure class=\"visual\"><div class=\"bnt rt4 three\">\n  <div class=\"bnt-t c1\"><div class=\"bnt-h\">Hashing<\/div><div class=\"bnt-b\">LSH: Locality-Sensitive Hashing<\/div><div class=\"bnt-p\">Hash vectors so that similar ones land in the same bucket. Search only the matching bucket. Simple, but usually less accurate than HNSW.<\/div><\/div>\n  <div class=\"bnt-t c4\"><div class=\"bnt-h\">Trees<\/div><div class=\"bnt-b\">Annoy<\/div><div class=\"bnt-p\">Builds many random trees that split the space. Search walks down the trees. Made at Spotify.<\/div><\/div>\n  <div class=\"bnt-t neutral\"><div class=\"bnt-h\">Google<\/div><div class=\"bnt-b\">ScaNN<\/div><div class=\"bnt-p\">Google's method, built for fast maximum inner-product search.<\/div><\/div>\n  <div class=\"bnt-t neutral\"><div class=\"bnt-h\">On disk<\/div><div class=\"bnt-b\">DiskANN<\/div><div class=\"bnt-p\">A graph method designed for huge data kept on disk, not only in memory.<\/div><\/div>\n  <div class=\"bnt-t neutral\"><div class=\"bnt-h\">A library<\/div><div class=\"bnt-b\">FAISS<\/div><div class=\"bnt-p\">A popular library from Meta. It has flat search, IVF, PQ and HNSW, so you can try them side by side.<\/div><\/div>\n<\/div>\n<div class=\"px\">\n  <div class=\"px-r\"><span>Algorithm<\/span><div>The trick for searching faster: IVF, HNSW, PQ, LSH and so on.<\/div><\/div>\n  <div class=\"px-r\"><span>Index<\/span><div>The structure built in advance with that trick, ready to search. Some people call it the map.<\/div><\/div>\n  <div class=\"px-r hi\"><span>Library<\/span><div>Ready-made code that gives you several algorithms. FAISS is one.<\/div><\/div>\n<\/div><\/figure>\n<hr />\n<h2 class=\"c3\" id=\"in-chroma\">In Chroma<\/h2>\n<p>Your code uses Chroma. Here is what it does for you.<\/p>\n<figure class=\"visual\"><div class=\"hl\" data-x=\"1\"><pre><span class=\"n\">vector_store<\/span> <span class=\"o\">=<\/span> <span class=\"n\">Chroma<\/span><span class=\"o\">.<\/span><span class=\"n\">from_documents<\/span><span class=\"p\">(<\/span><span class=\"n\">documents<\/span><span class=\"o\">=<\/span><span class=\"n\">doc_chunks<\/span><span class=\"p\">,<\/span>\n    <span class=\"n\">embedding<\/span><span class=\"o\">=<\/span><span class=\"n\">embeddingModel<\/span><span class=\"p\">,<\/span>\n    <span class=\"n\">persist_directory<\/span><span class=\"o\">=<\/span><span class=\"n\">DB_DIR<\/span><span class=\"p\">,<\/span>\n    <span class=\"n\">collection_name<\/span><span class=\"o\">=<\/span><span class=\"n\">COLLECTION_NAME<\/span><span class=\"p\">)<\/span>\n\n<span class=\"n\">retrieved_docs<\/span><span class=\"o\">=<\/span> <span class=\"n\">vector_store<\/span><span class=\"o\">.<\/span><span class=\"n\">similarity_search<\/span><span class=\"p\">(<\/span><span class=\"n\">query<\/span><span class=\"o\">=<\/span><span class=\"n\">user_question<\/span><span class=\"p\">,<\/span><span class=\"n\">k<\/span><span class=\"o\">=<\/span><span class=\"mi\">3<\/span><span class=\"p\">)<\/span><\/pre><\/div>\n<div class=\"px\">\n  <div class=\"px-r\"><span>from_documents<\/span><div>Embeds every chunk with the embedding model, builds the HNSW index, and saves the chunk text and metadata with each vector.<\/div><\/div>\n  <div class=\"px-r\"><span>persist_directory<\/span><div>Saves everything to a folder, so the next run opens the saved database instead of embedding again.<\/div><\/div>\n  <div class=\"px-r\"><span>similarity_search<\/span><div>Embeds the question, searches the index, and returns the chunk texts of the top k.<\/div><\/div>\n  <div class=\"px-r hi\"><span>The metric<\/span><div>The default space is <code>l2<\/code>, the squared Euclidean distance. To use cosine, set <code>space<\/code> to <code>cosine<\/code> when the collection is created (see Where Do You Set It?).<\/div><\/div>\n<\/div><\/figure>\n<div class=\"docs\"><span class=\"docs-l\">Docs<\/span><a href=\"https://docs.trychroma.com/docs/collections/configure\" target=\"_blank\" rel=\"noopener\">Chroma: configure collections<\/a><a href=\"https://reference.langchain.com/python/langchain_core/embeddings/embeddings/Embeddings\" target=\"_blank\" rel=\"noopener\">LangChain Embeddings<\/a><\/div>\n\n<hr />\n<h2 class=\"c4\" id=\"quick-revision\">Quick Revision<\/h2>\n<p>The whole lesson on one page.<\/p>\n<figure class=\"visual\"><div class=\"bnt rt4 three\">\n  <div class=\"bnt-t c3\"><div class=\"bnt-h\">Embeddings<\/div><div class=\"bnt-b\">Meaning as numbers<\/div><div class=\"bnt-p\">A model turns each chunk into one fixed-size vector. Close vectors mean close meaning. Same model for chunks and questions.<\/div><\/div>\n  <div class=\"bnt-t c1\"><div class=\"bnt-h\">Similarity<\/div><div class=\"bnt-b\">Three ways to score<\/div><div class=\"bnt-p\">Cosine = angle. Dot product = angle and length. Euclidean = straight-line distance. For normalized vectors they rank the same. You set the choice when you create the collection: <code>space<\/code> in Chroma, <code>metric<\/code> in Pinecone, <code>distance<\/code> in Qdrant.<\/div><\/div>\n  <div class=\"bnt-t c4\"><div class=\"bnt-h\">Search<\/div><div class=\"bnt-b\">Exact is slow, ANN is fast<\/div><div class=\"bnt-p\">Brute force scores everything, on every question. ANN scores only a small part. Five families: groups (IVF), graphs (HNSW), compression (PQ), hashing (LSH), trees (Annoy). A little recall is traded for a lot of speed.<\/div><\/div>\n<\/div>\n<div class=\"em-point\"><b>Store the chunk too.<\/b> The vector finds the chunk. The chunk text goes to the LLM.<\/div>\n<\/figure>\n<div class=\"sc-head code-head\">Code<\/div><details class=\"codecard\"><summary><span class=\"cc-t\">Simple RAG with Chroma and Mistral<\/span><span class=\"cc-f\">01_simple_rag.py · 63 lines<\/span><span class=\"cc-show\">Show code<\/span><\/summary><div class=\"hl\"><table class=\"hltable\"><tr><td class=\"linenos\"><div class=\"linenodiv\"><pre><span class=\"normal\"> 1<\/span>\n<span class=\"normal\"> 2<\/span>\n<span class=\"normal\"> 3<\/span>\n<span class=\"normal\"> 4<\/span>\n<span class=\"normal\"> 5<\/span>\n<span class=\"normal\"> 6<\/span>\n<span class=\"normal\"> 7<\/span>\n<span class=\"normal\"> 8<\/span>\n<span class=\"normal\"> 9<\/span>\n<span class=\"normal\">10<\/span>\n<span class=\"normal\">11<\/span>\n<span class=\"normal\">12<\/span>\n<span class=\"normal\">13<\/span>\n<span class=\"normal\">14<\/span>\n<span class=\"normal\">15<\/span>\n<span class=\"normal\">16<\/span>\n<span class=\"normal\">17<\/span>\n<span class=\"normal\">18<\/span>\n<span class=\"normal\">19<\/span>\n<span class=\"normal\">20<\/span>\n<span class=\"normal\">21<\/span>\n<span class=\"normal\">22<\/span>\n<span class=\"normal\">23<\/span>\n<span class=\"normal\">24<\/span>\n<span class=\"normal\">25<\/span>\n<span class=\"normal\">26<\/span>\n<span class=\"normal\">27<\/span>\n<span class=\"normal\">28<\/span>\n<span class=\"normal\">29<\/span>\n<span class=\"normal\">30<\/span>\n<span class=\"normal\">31<\/span>\n<span class=\"normal\">32<\/span>\n<span class=\"normal\">33<\/span>\n<span class=\"normal\">34<\/span>\n<span class=\"normal\">35<\/span>\n<span class=\"normal\">36<\/span>\n<span class=\"normal\">37<\/span>\n<span class=\"normal\">38<\/span>\n<span class=\"normal\">39<\/span>\n<span class=\"normal\">40<\/span>\n<span class=\"normal\">41<\/span>\n<span class=\"normal\">42<\/span>\n<span class=\"normal\">43<\/span>\n<span class=\"normal\">44<\/span>\n<span class=\"normal\">45<\/span>\n<span class=\"normal\">46<\/span>\n<span class=\"normal\">47<\/span>\n<span class=\"normal\">48<\/span>\n<span class=\"normal\">49<\/span>\n<span class=\"normal\">50<\/span>\n<span class=\"normal\">51<\/span>\n<span class=\"normal\">52<\/span>\n<span class=\"normal\">53<\/span>\n<span class=\"normal\">54<\/span>\n<span class=\"normal\">55<\/span>\n<span class=\"normal\">56<\/span>\n<span class=\"normal\">57<\/span>\n<span class=\"normal\">58<\/span>\n<span class=\"normal\">59<\/span>\n<span class=\"normal\">60<\/span>\n<span class=\"normal\">61<\/span>\n<span class=\"normal\">62<\/span>\n<span class=\"normal\">63<\/span><\/pre><\/div><\/td><td class=\"code\"><div><pre><span><\/span><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">dotenv<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">load_dotenv<\/span>\n<span class=\"n\">load_dotenv<\/span><span class=\"p\">()<\/span>\n<span class=\"kn\">import<\/span><span class=\"w\"> <\/span><span class=\"nn\">os<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_community.document_loaders<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">PyPDFLoader<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_text_splitters<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">RecursiveCharacterTextSplitter<\/span>\n\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_mistralai<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">MistralAIEmbeddings<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_chroma<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">Chroma<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain.chat_models<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">init_chat_model<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_core.prompts<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">ChatPromptTemplate<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_core.output_parsers<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">StrOutputParser<\/span>\n\n<span class=\"n\">DB_DIR<\/span> <span class=\"o\">=<\/span> <span class=\"s2\">\"./chroma_db\"<\/span>\n<span class=\"n\">COLLECTION_NAME<\/span> <span class=\"o\">=<\/span> <span class=\"s2\">\"rag_knowledge\"<\/span>\n\n<span class=\"c1\"># print(f\"Step 1: Loaded {len(docs)} pages from PDF.\")<\/span>\n<span class=\"c1\"># print(f\"Step 2: Created {len(doc_chunks)} chunks.\")<\/span>\n\n\n<span class=\"sd\">\"\"\"Embedding model: text -&gt; a list of numbers (vector)\"\"\"<\/span>\n<span class=\"n\">embeddingModel<\/span> <span class=\"o\">=<\/span> <span class=\"n\">MistralAIEmbeddings<\/span><span class=\"p\">(<\/span><span class=\"n\">model<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"mistral-embed\"<\/span><span class=\"p\">)<\/span>\n\n<span class=\"sd\">\"\"\"First run: load -&gt; split -&gt; embed -&gt; store in Chroma (saved in ./chroma_db). Next runs: open the saved DB\"\"\"<\/span>\n<span class=\"k\">if<\/span> <span class=\"ow\">not<\/span> <span class=\"n\">os<\/span><span class=\"o\">.<\/span><span class=\"n\">path<\/span><span class=\"o\">.<\/span><span class=\"n\">exists<\/span><span class=\"p\">(<\/span><span class=\"n\">DB_DIR<\/span><span class=\"p\">):<\/span>\n    <span class=\"n\">loader<\/span> <span class=\"o\">=<\/span> <span class=\"n\">PyPDFLoader<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"data/rag_paper.pdf\"<\/span><span class=\"p\">)<\/span>\n    <span class=\"n\">docs<\/span> <span class=\"o\">=<\/span> <span class=\"n\">loader<\/span><span class=\"o\">.<\/span><span class=\"n\">load<\/span><span class=\"p\">()<\/span>\n    <span class=\"n\">splitter<\/span> <span class=\"o\">=<\/span> <span class=\"n\">RecursiveCharacterTextSplitter<\/span><span class=\"p\">(<\/span><span class=\"n\">chunk_size<\/span><span class=\"o\">=<\/span><span class=\"mi\">500<\/span><span class=\"p\">,<\/span><span class=\"n\">chunk_overlap<\/span><span class=\"o\">=<\/span><span class=\"mi\">50<\/span><span class=\"p\">)<\/span>\n    <span class=\"n\">doc_chunks<\/span> <span class=\"o\">=<\/span> <span class=\"n\">splitter<\/span><span class=\"o\">.<\/span><span class=\"n\">split_documents<\/span><span class=\"p\">(<\/span><span class=\"n\">docs<\/span><span class=\"p\">)<\/span>\n    \n    <span class=\"n\">vector_store<\/span> <span class=\"o\">=<\/span> <span class=\"n\">Chroma<\/span><span class=\"o\">.<\/span><span class=\"n\">from_documents<\/span><span class=\"p\">(<\/span><span class=\"n\">documents<\/span><span class=\"o\">=<\/span><span class=\"n\">doc_chunks<\/span><span class=\"p\">,<\/span>\n                                     <span class=\"n\">embedding<\/span><span class=\"o\">=<\/span><span class=\"n\">embeddingModel<\/span><span class=\"p\">,<\/span>\n                                     <span class=\"n\">persist_directory<\/span><span class=\"o\">=<\/span><span class=\"n\">DB_DIR<\/span><span class=\"p\">,<\/span>\n                                     <span class=\"n\">collection_name<\/span><span class=\"o\">=<\/span><span class=\"n\">COLLECTION_NAME<\/span>\n                                     <span class=\"p\">)<\/span>\n<span class=\"k\">else<\/span><span class=\"p\">:<\/span>\n     <span class=\"n\">vector_store<\/span> <span class=\"o\">=<\/span> <span class=\"n\">Chroma<\/span><span class=\"p\">(<\/span>\n        <span class=\"n\">persist_directory<\/span><span class=\"o\">=<\/span><span class=\"n\">DB_DIR<\/span><span class=\"p\">,<\/span>\n        <span class=\"n\">embedding_function<\/span><span class=\"o\">=<\/span><span class=\"n\">embeddingModel<\/span><span class=\"p\">,<\/span>\n        <span class=\"n\">collection_name<\/span><span class=\"o\">=<\/span><span class=\"n\">COLLECTION_NAME<\/span>\n     <span class=\"p\">)<\/span>\n    \n<span class=\"n\">user_question<\/span> <span class=\"o\">=<\/span> <span class=\"s2\">\"what is main advantage of Retrieval-Augmented Generation?\"<\/span>\n\n<span class=\"sd\">\"\"\"Retrieve: find the 3 chunks closest in meaning to the question\"\"\"<\/span>\n<span class=\"n\">retrieved_docs<\/span><span class=\"o\">=<\/span> <span class=\"n\">vector_store<\/span><span class=\"o\">.<\/span><span class=\"n\">similarity_search<\/span><span class=\"p\">(<\/span><span class=\"n\">query<\/span><span class=\"o\">=<\/span><span class=\"n\">user_question<\/span><span class=\"p\">,<\/span><span class=\"n\">k<\/span><span class=\"o\">=<\/span><span class=\"mi\">3<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">context_text<\/span> <span class=\"o\">=<\/span> <span class=\"s2\">\"<\/span><span class=\"se\">\\n\\n<\/span><span class=\"s2\">\"<\/span><span class=\"o\">.<\/span><span class=\"n\">join<\/span><span class=\"p\">([<\/span><span class=\"n\">doc<\/span><span class=\"o\">.<\/span><span class=\"n\">page_content<\/span> <span class=\"k\">for<\/span> <span class=\"n\">doc<\/span> <span class=\"ow\">in<\/span> <span class=\"n\">retrieved_docs<\/span><span class=\"p\">])<\/span>\n\n<span class=\"sd\">\"\"\"Augment + Generate: put the chunks in the prompt, the LLM answers from them\"\"\"<\/span>\n<span class=\"n\">rag_prompt<\/span> <span class=\"o\">=<\/span> <span class=\"n\">ChatPromptTemplate<\/span><span class=\"o\">.<\/span><span class=\"n\">from_messages<\/span><span class=\"p\">([<\/span>\n    <span class=\"p\">(<\/span><span class=\"s2\">\"system\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"You are a helpful AI assistant. Answer the user's question ONLY based on the provided context. If the answer cannot be found in the context, say 'I cannot find the answer in the provided documents.'\"<\/span><span class=\"p\">),<\/span>\n    <span class=\"p\">(<\/span><span class=\"s2\">\"human\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"Context:<\/span><span class=\"se\">\\n<\/span><span class=\"si\">{context}<\/span><span class=\"se\">\\n\\n<\/span><span class=\"s2\">Question: <\/span><span class=\"si\">{question}<\/span><span class=\"s2\">\"<\/span><span class=\"p\">)<\/span>\n<span class=\"p\">])<\/span>\n\n<span class=\"n\">model<\/span> <span class=\"o\">=<\/span> <span class=\"n\">init_chat_model<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"mistralai:open-mistral-nemo\"<\/span><span class=\"p\">)<\/span>\n\n<span class=\"n\">rag_chain<\/span> <span class=\"o\">=<\/span> <span class=\"n\">rag_prompt<\/span> <span class=\"o\">|<\/span> <span class=\"n\">model<\/span> <span class=\"o\">|<\/span> <span class=\"n\">StrOutputParser<\/span><span class=\"p\">()<\/span>\n\n<span class=\"n\">response<\/span> <span class=\"o\">=<\/span> <span class=\"n\">rag_chain<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">({<\/span><span class=\"s2\">\"context\"<\/span><span class=\"p\">:<\/span><span class=\"n\">context_text<\/span> <span class=\"p\">,<\/span> <span class=\"s2\">\"question\"<\/span><span class=\"p\">:<\/span><span class=\"n\">user_question<\/span><span class=\"p\">})<\/span>\n\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">response<\/span><span class=\"p\">)<\/span>\n\n\n<span class=\"c1\"># <\/span>\n<\/pre><\/div><\/td><\/tr><\/table><\/div>\n<\/details>", "toc": [{"id": "why-do-we-need-ann", "name": "Why Do We Need ANN?"}, {"id": "what-is-ann", "name": "What Is ANN?"}, {"id": "the-families-of-ann-algorithms", "name": "The Families of ANN Algorithms"}, {"id": "ivf-search-only-the-right-section", "name": "IVF: Search Only the Right Section"}, {"id": "hnsw-a-graph-with-highways", "name": "HNSW: A Graph with Highways"}, {"id": "pq-make-each-vector-smaller", "name": "PQ: Make Each Vector Smaller"}, {"id": "other-ideas-to-know", "name": "Other Ideas to Know"}, {"id": "in-chroma", "name": "In Chroma"}, {"id": "quick-revision", "name": "Quick Revision"}], "search": "", "slides": null, "slideCount": 0, "code": []}};</script>
