<script>window.PAGE = {"id": "n25_2", "root": "../", "lesson": {"id": "n25_2", "title": "State Types & Reducers", "short": "State Types & Reducers", "unit": "Unit 4", "unitName": "Agents with LangGraph", "pos": 5, "of": 16, "sub": "", "info": "The four ways to write the state, and reducers: overwrite or merge", "html": "<h2 class=\"c4\" id=\"four-ways-to-write-the-state\">Four Ways to Write the State<\/h2>\n<p>The state is a class that lists the keys. LangGraph accepts four kinds of class. Your <code>01_states.py<\/code> shows all four.<\/p>\n<figure class=\"visual\"><div class=\"em-lane\"><div class=\"stp-l\">Way 1: TypedDict. Simple, and the most common.<\/div><div class=\"hl\" data-x=\"1\"><pre><span class=\"k\">class<\/span><span class=\"w\"> <\/span><span class=\"nc\">State<\/span><span class=\"p\">(<\/span><span class=\"n\">TypedDict<\/span><span class=\"p\">):<\/span>\n    <span class=\"n\">topic<\/span><span class=\"p\">:<\/span><span class=\"nb\">str<\/span>\n    <span class=\"n\">summary<\/span><span class=\"p\">:<\/span><span class=\"nb\">str<\/span>\n    <span class=\"n\">score<\/span><span class=\"p\">:<\/span><span class=\"nb\">str<\/span><\/pre><\/div><\/div><div class=\"em-lane\"><div class=\"stp-l\">Way 2: Pydantic. It checks the data: here, the score must not be negative.<\/div><div class=\"hl\" data-x=\"1\"><pre><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">pydantic<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">BaseModel<\/span> <span class=\"p\">,<\/span> <span class=\"n\">field_validator<\/span>\n\n<span class=\"k\">class<\/span><span class=\"w\"> <\/span><span class=\"nc\">State<\/span><span class=\"p\">(<\/span><span class=\"n\">BaseModel<\/span><span class=\"p\">):<\/span>\n    <span class=\"n\">topic<\/span><span class=\"p\">:<\/span><span class=\"nb\">str<\/span>\n    <span class=\"n\">score<\/span><span class=\"p\">:<\/span><span class=\"nb\">int<\/span>\n    <span class=\"n\">summary<\/span><span class=\"p\">:<\/span><span class=\"nb\">str<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"\"<\/span>\n\n    <span class=\"nd\">@field_validator<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"score\"<\/span><span class=\"p\">)<\/span>\n    <span class=\"nd\">@classmethod<\/span>\n    <span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">score_postive<\/span><span class=\"p\">(<\/span><span class=\"bp\">cls<\/span> <span class=\"p\">,<\/span><span class=\"n\">v<\/span><span class=\"p\">):<\/span>\n        <span class=\"k\">if<\/span> <span class=\"n\">v<\/span> <span class=\"o\">&lt;<\/span><span class=\"mi\">0<\/span><span class=\"p\">:<\/span>\n            <span class=\"k\">raise<\/span> <span class=\"ne\">ValueError<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"score must be postive\"<\/span><span class=\"p\">)<\/span>\n        <span class=\"k\">return<\/span> <span class=\"n\">v<\/span><\/pre><\/div><\/div><div class=\"em-lane\"><div class=\"stp-l\">Way 3: dataclass. It lets you give default values.<\/div><div class=\"hl\" data-x=\"1\"><pre><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">dataclasses<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">dataclass<\/span> <span class=\"p\">,<\/span> <span class=\"n\">field<\/span>\n\n\n<span class=\"nd\">@dataclass<\/span>\n<span class=\"k\">class<\/span><span class=\"w\"> <\/span><span class=\"nc\">State<\/span><span class=\"p\">():<\/span>\n    <span class=\"n\">topic<\/span><span class=\"p\">:<\/span><span class=\"nb\">str<\/span> <span class=\"o\">=<\/span><span class=\"s2\">\"\"<\/span>\n    <span class=\"n\">score<\/span> <span class=\"p\">:<\/span><span class=\"nb\">int<\/span><span class=\"o\">=<\/span><span class=\"mi\">0<\/span>\n    <span class=\"n\">messages<\/span> <span class=\"p\">:<\/span><span class=\"nb\">list<\/span> <span class=\"o\">=<\/span> <span class=\"n\">field<\/span><span class=\"p\">(<\/span><span class=\"n\">default_factory<\/span><span class=\"o\">=<\/span><span class=\"nb\">list<\/span><span class=\"p\">)<\/span><\/pre><\/div><\/div><div class=\"em-lane\"><div class=\"stp-l\">Way 4: MessagesState. For chatbots: it already has a <code>messages<\/code> list.<\/div><div class=\"hl\" data-x=\"1\"><pre><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langgraph.graph<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">MessagesState<\/span>\n\n<span class=\"k\">class<\/span><span class=\"w\"> <\/span><span class=\"nc\">State<\/span><span class=\"p\">(<\/span><span class=\"n\">MessagesState<\/span><span class=\"p\">):<\/span>\n    <span class=\"n\">user_name<\/span><span class=\"p\">:<\/span><span class=\"nb\">str<\/span>\n    <span class=\"n\">language<\/span><span class=\"p\">:<\/span><span class=\"nb\">str<\/span><\/pre><\/div><\/div><div class=\"em-tbl\"><table>\n<tr><th>Way<\/th><th>Use it when<\/th><\/tr>\n<tr><td><code>TypedDict<\/code><\/td><td>you want it simple. Most graphs use this.<\/td><\/tr>\n<tr><td>Pydantic <code>BaseModel<\/code><\/td><td>the data must be checked, for example a score that must be positive.<\/td><\/tr>\n<tr><td><code>@dataclass<\/code><\/td><td>you want default values.<\/td><\/tr>\n<tr><td><code>MessagesState<\/code><\/td><td>you are building a chatbot and want the message list ready made.<\/td><\/tr>\n<\/table><\/div>\n<\/figure>\n<hr />\n<h2 class=\"c5\" id=\"overwrite-or-merge-reducers\">Overwrite or Merge? Reducers<\/h2>\n<p>By default, a new value <strong>replaces<\/strong> the old one. Sometimes that loses data.<\/p>\n<figure class=\"visual\"><div class=\"em-pair\">\n  <div class=\"em-fc\"><div class=\"stp-l\">Without a reducer: overwrite<\/div><span>One check writes <code>{'toxicity': 12}<\/code>.<\/span><span>Another check writes <code>{'copyright_risk': 8}<\/code>.<\/span><span><b>One after the other:<\/b> the second overwrites the first, and the first score is lost.<\/span><span><b>At the same time:<\/b> LangGraph stops with an error, because a key can receive only one value per step.<\/span><\/div>\n  <div class=\"em-fc out\"><div class=\"stp-l\">With a reducer: merge<\/div><span>One check writes <code>{'toxicity': 12}<\/code>.<\/span><span>Another check writes <code>{'copyright_risk': 8}<\/code>.<\/span><span><b>The state keeps both:<\/b> <code>{&#39;toxicity&#39;: 12, &#39;copyright_risk&#39;: 8}<\/code><\/span><\/div>\n<\/div>\n<div class=\"em-cap\">Example scores. The merge is exactly what your <code>merge_score_dicts<\/code> does. We tested both cases on the installed LangGraph.<\/div>\n<div class=\"hl\" data-x=\"1\"><pre><span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">merge_score_dicts<\/span><span class=\"p\">(<\/span><span class=\"n\">existing<\/span> <span class=\"p\">:<\/span> <span class=\"nb\">dict<\/span> <span class=\"p\">,<\/span> <span class=\"n\">newUpdate<\/span><span class=\"p\">:<\/span><span class=\"nb\">dict<\/span><span class=\"p\">)<\/span> <span class=\"o\">-&gt;<\/span> <span class=\"nb\">dict<\/span><span class=\"p\">:<\/span>\n    <span class=\"k\">if<\/span> <span class=\"n\">existing<\/span> <span class=\"ow\">is<\/span> <span class=\"kc\">None<\/span><span class=\"p\">:<\/span>\n        <span class=\"k\">return<\/span> <span class=\"n\">newUpdate<\/span>\n    <span class=\"k\">return<\/span> <span class=\"p\">{<\/span><span class=\"o\">**<\/span><span class=\"n\">existing<\/span><span class=\"p\">,<\/span> <span class=\"o\">**<\/span><span class=\"n\">newUpdate<\/span><span class=\"p\">}<\/span>\n\n<span class=\"k\">class<\/span><span class=\"w\"> <\/span><span class=\"nc\">AnlayzerState<\/span><span class=\"p\">(<\/span><span class=\"n\">TypedDict<\/span><span class=\"p\">):<\/span>\n    <span class=\"n\">raw_text<\/span> <span class=\"p\">:<\/span> <span class=\"nb\">str<\/span>\n    <span class=\"n\">safety_scores<\/span> <span class=\"p\">:<\/span><span class=\"n\">Annotated<\/span><span class=\"p\">[<\/span><span class=\"nb\">dict<\/span><span class=\"p\">[<\/span><span class=\"nb\">str<\/span><span class=\"p\">,<\/span><span class=\"nb\">int<\/span><span class=\"p\">],<\/span><span class=\"n\">merge_score_dicts<\/span><span class=\"p\">]<\/span><\/pre><\/div>\n<div class=\"px\">\n  <div class=\"px-r\"><span>Reducer<\/span><div>A function that says how to <b>combine<\/b> the old value and the new value of one key.<\/div><\/div>\n  <div class=\"px-r\"><span>Annotated<\/span><div><code>Annotated[type, reducer]<\/code> attaches the reducer to that key. Keys without it simply overwrite.<\/div><\/div>\n  <div class=\"px-r hi\"><span>Built in<\/span><div><code>MessagesState<\/code> already uses a reducer for <code>messages<\/code>, so new messages are <b>added<\/b> to the list, not overwritten.<\/div><\/div>\n<\/div><div class=\"em-cap\">The code is from your <code>01_parallel_reducers.py<\/code>. You will use it in the Parallel lesson, where three nodes write at the same time.<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c1\" id=\"quick-revision\">Quick Revision<\/h2>\n<p>The whole lesson on one page.<\/p>\n<figure class=\"visual\"><div class=\"bnt rt4 three\"><div class=\"bnt-t c3\"><div class=\"bnt-h\">State<\/div><div class=\"bnt-b\">The shared notebook<\/div><div class=\"bnt-p\">A dictionary with fixed keys. Every node reads it and writes to it.<\/div><\/div><div class=\"bnt-t c1\"><div class=\"bnt-h\">Nodes<\/div><div class=\"bnt-b\">Return only what changes<\/div><div class=\"bnt-p\">A node gets the whole state and returns a small dictionary. LangGraph merges it in.<\/div><\/div><div class=\"bnt-t c4\"><div class=\"bnt-h\">Reducers<\/div><div class=\"bnt-b\">Overwrite or merge<\/div><div class=\"bnt-p\">By default a key is overwritten. A reducer, attached with <code>Annotated<\/code>, merges the old and new values.<\/div><\/div><\/div><\/figure>\n<div class=\"docs\"><span class=\"docs-l\">LangGraph docs<\/span><a href=\"https://docs.langchain.com/oss/python/langgraph/graph-api\" target=\"_blank\" rel=\"noopener\">Graph API: state and reducers<\/a><\/div>\n\n<div class=\"sc-head code-head\">Code<\/div><details class=\"codecard\"><summary><span class=\"cc-t\">01_states.py<\/span><span class=\"cc-f\">01_states.py · 49 lines<\/span><span class=\"cc-show\">Show code<\/span><\/summary><div class=\"hl\"><table class=\"hltable\"><tr><td class=\"linenos\"><div class=\"linenodiv\"><pre><span class=\"normal\"> 1<\/span>\n<span class=\"normal\"> 2<\/span>\n<span class=\"normal\"> 3<\/span>\n<span class=\"normal\"> 4<\/span>\n<span class=\"normal\"> 5<\/span>\n<span class=\"normal\"> 6<\/span>\n<span class=\"normal\"> 7<\/span>\n<span class=\"normal\"> 8<\/span>\n<span class=\"normal\"> 9<\/span>\n<span class=\"normal\">10<\/span>\n<span class=\"normal\">11<\/span>\n<span class=\"normal\">12<\/span>\n<span class=\"normal\">13<\/span>\n<span class=\"normal\">14<\/span>\n<span class=\"normal\">15<\/span>\n<span class=\"normal\">16<\/span>\n<span class=\"normal\">17<\/span>\n<span class=\"normal\">18<\/span>\n<span class=\"normal\">19<\/span>\n<span class=\"normal\">20<\/span>\n<span class=\"normal\">21<\/span>\n<span class=\"normal\">22<\/span>\n<span class=\"normal\">23<\/span>\n<span class=\"normal\">24<\/span>\n<span class=\"normal\">25<\/span>\n<span class=\"normal\">26<\/span>\n<span class=\"normal\">27<\/span>\n<span class=\"normal\">28<\/span>\n<span class=\"normal\">29<\/span>\n<span class=\"normal\">30<\/span>\n<span class=\"normal\">31<\/span>\n<span class=\"normal\">32<\/span>\n<span class=\"normal\">33<\/span>\n<span class=\"normal\">34<\/span>\n<span class=\"normal\">35<\/span>\n<span class=\"normal\">36<\/span>\n<span class=\"normal\">37<\/span>\n<span class=\"normal\">38<\/span>\n<span class=\"normal\">39<\/span>\n<span class=\"normal\">40<\/span>\n<span class=\"normal\">41<\/span>\n<span class=\"normal\">42<\/span>\n<span class=\"normal\">43<\/span>\n<span class=\"normal\">44<\/span>\n<span class=\"normal\">45<\/span>\n<span class=\"normal\">46<\/span>\n<span class=\"normal\">47<\/span>\n<span class=\"normal\">48<\/span><\/pre><\/div><\/td><td class=\"code\"><div><pre><span><\/span><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">typing<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">TypedDict<\/span>\n\n\n<span class=\"c1\"># 1  typed DICT<\/span>\n\n<span class=\"k\">class<\/span><span class=\"w\"> <\/span><span class=\"nc\">State<\/span><span class=\"p\">(<\/span><span class=\"n\">TypedDict<\/span><span class=\"p\">):<\/span>\n    <span class=\"n\">topic<\/span><span class=\"p\">:<\/span><span class=\"nb\">str<\/span>\n    <span class=\"n\">summary<\/span><span class=\"p\">:<\/span><span class=\"nb\">str<\/span>\n    <span class=\"n\">score<\/span><span class=\"p\">:<\/span><span class=\"nb\">str<\/span>\n\n<span class=\"c1\">#2 pydantic approch <\/span>\n<span class=\"c1\"># it is good at data validaition<\/span>\n\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">pydantic<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">BaseModel<\/span> <span class=\"p\">,<\/span> <span class=\"n\">field_validator<\/span>\n\n<span class=\"k\">class<\/span><span class=\"w\"> <\/span><span class=\"nc\">State<\/span><span class=\"p\">(<\/span><span class=\"n\">BaseModel<\/span><span class=\"p\">):<\/span>\n    <span class=\"n\">topic<\/span><span class=\"p\">:<\/span><span class=\"nb\">str<\/span>\n    <span class=\"n\">score<\/span><span class=\"p\">:<\/span><span class=\"nb\">int<\/span>\n    <span class=\"n\">summary<\/span><span class=\"p\">:<\/span><span class=\"nb\">str<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"\"<\/span>\n    \n    <span class=\"nd\">@field_validator<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"score\"<\/span><span class=\"p\">)<\/span>\n    <span class=\"nd\">@classmethod<\/span>\n    <span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">score_postive<\/span><span class=\"p\">(<\/span><span class=\"bp\">cls<\/span> <span class=\"p\">,<\/span><span class=\"n\">v<\/span><span class=\"p\">):<\/span>\n        <span class=\"k\">if<\/span> <span class=\"n\">v<\/span> <span class=\"o\">&lt;<\/span><span class=\"mi\">0<\/span><span class=\"p\">:<\/span>\n            <span class=\"k\">raise<\/span> <span class=\"ne\">ValueError<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"score must be postive\"<\/span><span class=\"p\">)<\/span>\n        <span class=\"k\">return<\/span> <span class=\"n\">v<\/span>\n        \n\n<span class=\"c1\"># 3 python dataclasses<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">dataclasses<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">dataclass<\/span> <span class=\"p\">,<\/span> <span class=\"n\">field<\/span>\n\n\n<span class=\"nd\">@dataclass<\/span>\n<span class=\"k\">class<\/span><span class=\"w\"> <\/span><span class=\"nc\">State<\/span><span class=\"p\">():<\/span>\n    <span class=\"n\">topic<\/span><span class=\"p\">:<\/span><span class=\"nb\">str<\/span> <span class=\"o\">=<\/span><span class=\"s2\">\"\"<\/span>\n    <span class=\"n\">score<\/span> <span class=\"p\">:<\/span><span class=\"nb\">int<\/span><span class=\"o\">=<\/span><span class=\"mi\">0<\/span>\n    <span class=\"n\">messages<\/span> <span class=\"p\">:<\/span><span class=\"nb\">list<\/span> <span class=\"o\">=<\/span> <span class=\"n\">field<\/span><span class=\"p\">(<\/span><span class=\"n\">default_factory<\/span><span class=\"o\">=<\/span><span class=\"nb\">list<\/span><span class=\"p\">)<\/span>\n\n\n<span class=\"c1\"># 4 <\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langgraph.graph<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">MessagesState<\/span>\n\n<span class=\"k\">class<\/span><span class=\"w\"> <\/span><span class=\"nc\">State<\/span><span class=\"p\">(<\/span><span class=\"n\">MessagesState<\/span><span class=\"p\">):<\/span>\n    <span class=\"n\">user_name<\/span><span class=\"p\">:<\/span><span class=\"nb\">str<\/span>\n    <span class=\"n\">language<\/span><span class=\"p\">:<\/span><span class=\"nb\">str<\/span>\n\n\n    \n<\/pre><\/div><\/td><\/tr><\/table><\/div>\n<\/details>", "toc": [{"id": "four-ways-to-write-the-state", "name": "Four Ways to Write the State"}, {"id": "overwrite-or-merge-reducers", "name": "Overwrite or Merge? Reducers"}, {"id": "quick-revision", "name": "Quick Revision"}], "search": "", "slides": null, "slideCount": 0, "code": []}};</script>
