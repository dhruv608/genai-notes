<script>window.PAGE = {"id": "n06_2", "root": "../", "lesson": {"id": "n06_2", "title": "Your First LangChain Call", "short": "Your First LangChain Call", "unit": "Unit 2", "unitName": "Build with LangChain", "pos": 3, "of": 14, "sub": "", "info": "Install a package, then create the model with a class or init_chat_model", "html": "<h2 class=\"c3\" id=\"3-two-ways-to-call-a-model\">1. Two Ways to Call a Model<\/h2>\n<p>Remember \"What's the Issue?\" This is the fix. Pick your company in each way and you get the full code. The last three lines are the same in both.<\/p>\n<figure class=\"visual\"><div class=\"dw\">\n  <div class=\"dw-c t\">\n    <div class=\"dw-h\"><b>Way 1<\/b>a class for each company<\/div>\n    <input type=\"radio\" name=\"dwa\" id=\"a1\" checked><label for=\"a1\">Gemini<\/label>\n    <input type=\"radio\" name=\"dwa\" id=\"a2\"><label for=\"a2\">Groq<\/label>\n    <input type=\"radio\" name=\"dwa\" id=\"a3\"><label for=\"a3\">Mistral<\/label>\n    <input type=\"radio\" name=\"dwa\" id=\"a4\"><label for=\"a4\">OpenAI<\/label>\n    <div class=\"dw-inst\">install: <code>pip install <span class=\"va1\">langchain-google-genai<\/span><span class=\"va2\">langchain-groq<\/span><span class=\"va3\">langchain-mistralai<\/span><span class=\"va4\">langchain-openai<\/span><\/code><\/div>\n    <div class=\"hl\" data-x=\"1\"><pre><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">dotenv<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">load_dotenv<\/span>\n<span class=\"va1\"><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_google_genai<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">ChatGoogleGenerativeAI<\/span><\/span><span class=\"va2\"><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_groq<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">ChatGroq<\/span><\/span><span class=\"va3\"><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_mistralai<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">ChatMistralAI<\/span><\/span><span class=\"va4\"><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_openai<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">ChatOpenAI<\/span><\/span>\n\n<span class=\"n\">load_dotenv<\/span><span class=\"p\">()<\/span>\n\n<span class=\"va1\"><span class=\"n\">model<\/span> <span class=\"o\">=<\/span> <span class=\"n\">ChatGoogleGenerativeAI<\/span><span class=\"p\">(<\/span><span class=\"n\">model<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"gemini-2.5-flash\"<\/span><span class=\"p\">)<\/span><\/span><span class=\"va2\"><span class=\"n\">model<\/span> <span class=\"o\">=<\/span> <span class=\"n\">ChatGroq<\/span><span class=\"p\">(<\/span><span class=\"n\">model<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"openai/gpt-oss-20b\"<\/span><span class=\"p\">)<\/span><\/span><span class=\"va3\"><span class=\"n\">model<\/span> <span class=\"o\">=<\/span> <span class=\"n\">ChatMistralAI<\/span><span class=\"p\">(<\/span><span class=\"n\">model<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"open-mistral-nemo\"<\/span><span class=\"p\">)<\/span><\/span><span class=\"va4\"><span class=\"n\">model<\/span> <span class=\"o\">=<\/span> <span class=\"n\">ChatOpenAI<\/span><span class=\"p\">(<\/span><span class=\"n\">model<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"gpt-4o-mini\"<\/span><span class=\"p\">)<\/span><\/span>\n<span class=\"n\">response<\/span> <span class=\"o\">=<\/span> <span class=\"n\">model<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"What is the capital of India?\"<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">response<\/span><span class=\"o\">.<\/span><span class=\"n\">content<\/span><span class=\"p\">)<\/span><\/pre><\/div>\n    <ul class=\"dw-n\"><li>Import the model class from the company's own package: <span class=\"va1\"><code>langchain_google_genai<\/code><\/span><span class=\"va2\"><code>langchain_groq<\/code><\/span><span class=\"va3\"><code>langchain_mistralai<\/code><\/span><span class=\"va4\"><code>langchain_openai<\/code><\/span>.<\/li><li>Create the model with the class <span class=\"va1\"><b>ChatGoogleGenerativeAI<\/b><\/span><span class=\"va2\"><b>ChatGroq<\/b><\/span><span class=\"va3\"><b>ChatMistralAI<\/b><\/span><span class=\"va4\"><b>ChatOpenAI<\/b><\/span>. The model name goes inside the brackets.<\/li><li>Extra settings, like <code>temperature=0<\/code>, go inside the same brackets.<\/li><\/ul>\n  <\/div>\n  <div class=\"dw-c t\">\n    <div class=\"dw-h\"><b>Way 2<\/b>one function for every company<\/div>\n    <input type=\"radio\" name=\"dwb\" id=\"b1\" checked><label for=\"b1\">Gemini<\/label>\n    <input type=\"radio\" name=\"dwb\" id=\"b2\"><label for=\"b2\">Groq<\/label>\n    <input type=\"radio\" name=\"dwb\" id=\"b3\"><label for=\"b3\">Mistral<\/label>\n    <input type=\"radio\" name=\"dwb\" id=\"b4\"><label for=\"b4\">OpenAI<\/label>\n    <div class=\"dw-inst\">install: <code>pip install <span class=\"vb1\">langchain-google-genai<\/span><span class=\"vb2\">langchain-groq<\/span><span class=\"vb3\">langchain-mistralai<\/span><span class=\"vb4\">langchain-openai<\/span><\/code><\/div>\n    <div class=\"hl\" data-x=\"1\"><pre><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">dotenv<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">load_dotenv<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain.chat_models<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">init_chat_model<\/span>\n\n<span class=\"n\">load_dotenv<\/span><span class=\"p\">()<\/span>\n\n<span class=\"vb1\"><span class=\"n\">model<\/span> <span class=\"o\">=<\/span> <span class=\"n\">init_chat_model<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"google_genai:gemini-2.5-flash\"<\/span><span class=\"p\">)<\/span><\/span><span class=\"vb2\"><span class=\"n\">model<\/span> <span class=\"o\">=<\/span> <span class=\"n\">init_chat_model<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"groq:openai/gpt-oss-20b\"<\/span><span class=\"p\">)<\/span><\/span><span class=\"vb3\"><span class=\"n\">model<\/span> <span class=\"o\">=<\/span> <span class=\"n\">init_chat_model<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"mistralai:open-mistral-nemo\"<\/span><span class=\"p\">)<\/span><\/span><span class=\"vb4\"><span class=\"n\">model<\/span> <span class=\"o\">=<\/span> <span class=\"n\">init_chat_model<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"openai:gpt-4o-mini\"<\/span><span class=\"p\">)<\/span><\/span>\n<span class=\"n\">response<\/span> <span class=\"o\">=<\/span> <span class=\"n\">model<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"What is the capital of India?\"<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">response<\/span><span class=\"o\">.<\/span><span class=\"n\">content<\/span><span class=\"p\">)<\/span><\/pre><\/div>\n    <ul class=\"dw-n\"><li>One import, <code>init_chat_model<\/code>, is the same for every company.<\/li><li>Write the company and the model as one string: <code>\"provider:model\"<\/code>. For this company the provider is <span class=\"vb1\"><code>google_genai<\/code><\/span><span class=\"vb2\"><code>groq<\/code><\/span><span class=\"vb3\"><code>mistralai<\/code><\/span><span class=\"vb4\"><code>openai<\/code><\/span>.<\/li><li>To switch company, change only this string. Nothing else in your code changes.<\/li><\/ul>\n  <\/div>\n<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c4\" id=\"4-what-comes-back\">2. What Comes Back<\/h2>\n<p>When you call <mark class=\"hp\">model.invoke()<\/mark>, LangChain gives back one standard object called an <mark class=\"hk\">AIMessage<\/mark>.<\/p>\n<ul>\n<li><code>response<\/code> is the whole AIMessage.<\/li>\n<li><code>response.content<\/code> is the text of the answer.<\/li>\n<li>It is the same for every company, so the rest of your code never changes.<\/li>\n<\/ul>\n<hr />\n<h2 class=\"c5\" id=\"5-which-way-should-you-use\">3. Which Way Should You Use?<\/h2>\n<ul>\n<li><strong>Way 1:<\/strong> use it when you need settings that only one company has.<\/li>\n<li><strong>Way 2:<\/strong> use it when you want to switch companies easily. This is our default in the course.<\/li>\n<\/ul>\n<div class=\"sc-head code-head\">Code<\/div><details class=\"codecard\"><summary><span class=\"cc-t\">Calling with LangChain<\/span><span class=\"cc-f\">callingbylangchain.py · 30 lines<\/span><span class=\"cc-show\">Show code<\/span><\/summary><div class=\"cc-install\">First install the package: <code>pip install langchain langchain-mistralai langchain-google-genai python-dotenv<\/code><\/div><div class=\"hl\"><table class=\"hltable\"><tr><td class=\"linenos\"><div class=\"linenodiv\"><pre><span class=\"normal\"> 1<\/span>\n<span class=\"normal\"> 2<\/span>\n<span class=\"normal\"> 3<\/span>\n<span class=\"normal\"> 4<\/span>\n<span class=\"normal\"> 5<\/span>\n<span class=\"normal\"> 6<\/span>\n<span class=\"normal\"> 7<\/span>\n<span class=\"normal\"> 8<\/span>\n<span class=\"normal\"> 9<\/span>\n<span class=\"normal\">10<\/span>\n<span class=\"normal\">11<\/span>\n<span class=\"normal\">12<\/span>\n<span class=\"normal\">13<\/span>\n<span class=\"normal\">14<\/span>\n<span class=\"normal\">15<\/span>\n<span class=\"normal\">16<\/span>\n<span class=\"normal\">17<\/span>\n<span class=\"normal\">18<\/span>\n<span class=\"normal\">19<\/span>\n<span class=\"normal\">20<\/span>\n<span class=\"normal\">21<\/span>\n<span class=\"normal\">22<\/span>\n<span class=\"normal\">23<\/span>\n<span class=\"normal\">24<\/span>\n<span class=\"normal\">25<\/span>\n<span class=\"normal\">26<\/span>\n<span class=\"normal\">27<\/span>\n<span class=\"normal\">28<\/span>\n<span class=\"normal\">29<\/span><\/pre><\/div><\/td><td class=\"code\"><div><pre><span><\/span><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">dotenv<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">load_dotenv<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_mistralai<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">ChatMistralAI<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_google_genai<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">ChatGoogleGenerativeAI<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain.chat_models<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">init_chat_model<\/span>\n\n<span class=\"n\">load_dotenv<\/span><span class=\"p\">()<\/span>\n\n<span class=\"c1\"># temperature = 0 -&gt; same answer every time<\/span>\n<span class=\"c1\"># temperature = 1 -&gt; new answer every time<\/span>\n\n<span class=\"c1\"># Way 1: a separate class for each company<\/span>\n<span class=\"n\">model1<\/span> <span class=\"o\">=<\/span> <span class=\"n\">ChatMistralAI<\/span><span class=\"p\">(<\/span><span class=\"n\">model<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"open-mistral-nemo\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">temperature<\/span><span class=\"o\">=<\/span><span class=\"mi\">0<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">model2<\/span> <span class=\"o\">=<\/span> <span class=\"n\">ChatGoogleGenerativeAI<\/span><span class=\"p\">(<\/span><span class=\"n\">model<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"gemini-2.5-flash\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">temperature<\/span><span class=\"o\">=<\/span><span class=\"mi\">0<\/span><span class=\"p\">)<\/span>\n\n<span class=\"c1\"># Way 2: one function for every company, \"provider:model\"<\/span>\n<span class=\"n\">model3<\/span> <span class=\"o\">=<\/span> <span class=\"n\">init_chat_model<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"mistralai:open-mistral-nemo\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">temperature<\/span><span class=\"o\">=<\/span><span class=\"mi\">1<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">model4<\/span> <span class=\"o\">=<\/span> <span class=\"n\">init_chat_model<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"google_genai:gemini-2.5-flash\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">temperature<\/span><span class=\"o\">=<\/span><span class=\"mi\">1<\/span><span class=\"p\">)<\/span>\n\n<span class=\"n\">question<\/span> <span class=\"o\">=<\/span> <span class=\"s2\">\"Give me one name for a coffee shop. Only the name.\"<\/span>\n\n<span class=\"n\">res1<\/span> <span class=\"o\">=<\/span> <span class=\"n\">model1<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">(<\/span><span class=\"n\">question<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">res2<\/span> <span class=\"o\">=<\/span> <span class=\"n\">model2<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">(<\/span><span class=\"n\">question<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">res3<\/span> <span class=\"o\">=<\/span> <span class=\"n\">model3<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">(<\/span><span class=\"n\">question<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">res4<\/span> <span class=\"o\">=<\/span> <span class=\"n\">model4<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">(<\/span><span class=\"n\">question<\/span><span class=\"p\">)<\/span>\n\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">res1<\/span><span class=\"o\">.<\/span><span class=\"n\">content<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">res2<\/span><span class=\"o\">.<\/span><span class=\"n\">content<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">res3<\/span><span class=\"o\">.<\/span><span class=\"n\">content<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">res4<\/span><span class=\"o\">.<\/span><span class=\"n\">content<\/span><span class=\"p\">)<\/span>\n<\/pre><\/div><\/td><\/tr><\/table><\/div>\n<\/details>", "toc": [{"id": "3-two-ways-to-call-a-model", "name": "3. Two Ways to Call a Model"}, {"id": "4-what-comes-back", "name": "4. What Comes Back"}, {"id": "5-which-way-should-you-use", "name": "5. Which Way Should You Use?"}], "search": "", "slides": null, "slideCount": 0, "code": []}};</script>
