<script>window.PAGE = {"id": "n29_2", "root": "../", "lesson": {"id": "n29_2", "title": "Run It, Then Add Tools", "short": "Run It, Then Add Tools", "unit": "Unit 4", "unitName": "Agents with LangGraph", "pos": 13, "of": 16, "sub": "", "info": "Running the loop, adding a search tool, and two loops in one graph", "html": "<h2 class=\"c5\" id=\"run-it-watch-the-attempts\">Run It: Watch the Attempts<\/h2>\n<p>We start with a topic, an empty draft and attempt 0.<\/p>\n<figure class=\"visual\"><div class=\"hl\" data-x=\"1\"><pre><span class=\"n\">graph<\/span> <span class=\"o\">=<\/span> <span class=\"n\">StateGraph<\/span><span class=\"p\">(<\/span><span class=\"n\">State<\/span><span class=\"p\">)<\/span>\n\n<span class=\"n\">graph<\/span><span class=\"o\">.<\/span><span class=\"n\">add_node<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"writer\"<\/span><span class=\"p\">,<\/span><span class=\"n\">writer_node<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">graph<\/span><span class=\"o\">.<\/span><span class=\"n\">add_node<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"reviewer\"<\/span><span class=\"p\">,<\/span><span class=\"n\">reviewer_node<\/span><span class=\"p\">)<\/span>\n\n<span class=\"n\">graph<\/span><span class=\"o\">.<\/span><span class=\"n\">add_edge<\/span><span class=\"p\">(<\/span><span class=\"n\">START<\/span> <span class=\"p\">,<\/span> <span class=\"s2\">\"writer\"<\/span><span class=\"p\">)<\/span>\n\n<span class=\"n\">graph<\/span><span class=\"o\">.<\/span><span class=\"n\">add_edge<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"writer\"<\/span><span class=\"p\">,<\/span><span class=\"s2\">\"reviewer\"<\/span><span class=\"p\">)<\/span>\n\n<span class=\"n\">graph<\/span><span class=\"o\">.<\/span><span class=\"n\">add_conditional_edges<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"reviewer\"<\/span><span class=\"p\">,<\/span><span class=\"n\">quality_gate<\/span><span class=\"p\">)<\/span>\n\n\n<span class=\"n\">app<\/span> <span class=\"o\">=<\/span> <span class=\"n\">graph<\/span><span class=\"o\">.<\/span><span class=\"n\">compile<\/span><span class=\"p\">()<\/span>\n\n<span class=\"n\">initial_state<\/span> <span class=\"o\">=<\/span> <span class=\"p\">{<\/span>\n        <span class=\"s2\">\"topic\"<\/span><span class=\"p\">:<\/span> <span class=\"n\">topic<\/span><span class=\"p\">,<\/span>\n        <span class=\"s2\">\"draft\"<\/span><span class=\"p\">:<\/span> <span class=\"s2\">\"\"<\/span><span class=\"p\">,<\/span>\n        <span class=\"s2\">\"reviewer_feedback\"<\/span><span class=\"p\">:<\/span> <span class=\"s2\">\"\"<\/span><span class=\"p\">,<\/span>\n        <span class=\"s2\">\"is_approved\"<\/span><span class=\"p\">:<\/span> <span class=\"kc\">False<\/span><span class=\"p\">,<\/span>\n        <span class=\"s2\">\"attempt\"<\/span><span class=\"p\">:<\/span> <span class=\"mi\">0<\/span><span class=\"p\">,<\/span>\n<span class=\"p\">}<\/span>\n\n<span class=\"n\">res<\/span> <span class=\"o\">=<\/span> <span class=\"n\">app<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">(<\/span><span class=\"n\">initial_state<\/span><span class=\"p\">)<\/span><\/pre><\/div>\n<div class=\"px\">\n  <div class=\"px-r\"><span>Start<\/span><div><code>attempt<\/code> is 0 and <code>draft<\/code> is empty. The first writer round makes <code>attempt<\/code> 1.<\/div><\/div>\n  <div class=\"px-r\"><span>The result<\/span><div><code>invoke<\/code> returns the final state: the last <code>draft<\/code>, the last feedback, <code>is_approved<\/code> and the number of <code>attempt<\/code>s.<\/div><\/div>\n  <div class=\"px-r\"><span>What to watch<\/span><div>Print <code>res<\/code> and look at <code>attempt<\/code>. If it is 1, the first draft passed. If it is 3, the loop hit its limit.<\/div><\/div>\n  <div class=\"px-r hi\"><span>Rate limit<\/span><div>Your teaching plan notes that the free Mistral key allows only 2 requests per minute. This loop makes 2 calls per round, so it can stop with <code>429 Rate limit exceeded<\/code>. Use a paid key, or slow the calls down.<\/div><\/div>\n<\/div><div class=\"em-cap\">The code is from your <code>01_iterative.py<\/code>. We show no model output here, because we did not call the API.<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c1\" id=\"add-tools-the-writer-can-search\">Add Tools: The Writer Can Search<\/h2>\n<p>Some topics need fresh facts. We give the writer a search tool.<\/p>\n<figure class=\"visual\"><div class=\"px\">\n  <div class=\"px-r\"><span>The issue<\/span><div>A topic like &ldquo;this year's AI news&rdquo; needs fresh facts. The model's own memory is old.<\/div><\/div>\n  <div class=\"px-r\"><span>The first try<\/span><div>The writer writes from memory.<\/div><\/div>\n  <div class=\"px-r\"><span>Why it fails<\/span><div>The post may contain outdated or invented facts, and the reviewer cannot check them.<\/div><\/div>\n  <div class=\"px-r hi\"><span>The fix<\/span><div>Give the writer a <b>search tool<\/b>. It can search first, read the results, and then write.<\/div><\/div>\n<\/div><div class=\"hl\" data-x=\"1\"><pre><span class=\"n\">search_tool<\/span> <span class=\"o\">=<\/span> <span class=\"n\">TavilySearch<\/span><span class=\"p\">(<\/span><span class=\"n\">max_results<\/span> <span class=\"o\">=<\/span> <span class=\"mi\">3<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">tools<\/span> <span class=\"o\">=<\/span> <span class=\"p\">[<\/span><span class=\"n\">search_tool<\/span><span class=\"p\">]<\/span>\n<span class=\"n\">writter_llm_with_tools<\/span> <span class=\"o\">=<\/span> <span class=\"n\">writter_llm<\/span><span class=\"o\">.<\/span><span class=\"n\">bind_tools<\/span><span class=\"p\">(<\/span><span class=\"n\">tools<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">tool_node<\/span> <span class=\"o\">=<\/span> <span class=\"n\">ToolNode<\/span><span class=\"p\">(<\/span><span class=\"n\">tools<\/span><span class=\"p\">)<\/span>\n\n<span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">should_use_tool<\/span><span class=\"p\">(<\/span><span class=\"n\">state<\/span><span class=\"p\">:<\/span><span class=\"n\">State<\/span><span class=\"p\">):<\/span>\n    <span class=\"n\">last_message<\/span> <span class=\"o\">=<\/span> <span class=\"n\">state<\/span><span class=\"p\">[<\/span><span class=\"s1\">'messages'<\/span><span class=\"p\">][<\/span><span class=\"o\">-<\/span><span class=\"mi\">1<\/span><span class=\"p\">]<\/span>\n\n    <span class=\"k\">if<\/span> <span class=\"nb\">getattr<\/span><span class=\"p\">(<\/span><span class=\"n\">last_message<\/span><span class=\"p\">,<\/span><span class=\"s1\">'tool_calls'<\/span><span class=\"p\">,<\/span><span class=\"kc\">None<\/span><span class=\"p\">):<\/span>\n        <span class=\"k\">return<\/span> <span class=\"s2\">\"tools\"<\/span>\n    <span class=\"k\">return<\/span> <span class=\"s2\">\"extract_draft\"<\/span><\/pre><\/div>\n<div class=\"em-fig\"><svg class=\"em-svg\" viewBox=\"0 0 760 290\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"ga\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#9aa3a2\"/><\/marker><marker id=\"gb\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#c9583a\"/><\/marker><\/defs><circle cx=\"45.0\" cy=\"115.0\" r=\"22\" fill=\"#fff\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"45.0\" y=\"119.0\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#0e3b3a\">START<\/text><rect x=\"130.0\" y=\"96.0\" width=\"100\" height=\"38\" rx=\"9\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"180.0\" y=\"120.2\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">writer<\/text><rect x=\"130.0\" y=\"231.0\" width=\"100\" height=\"38\" rx=\"9\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"180.0\" y=\"255.2\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">tools<\/text><rect x=\"295.0\" y=\"96.0\" width=\"150\" height=\"38\" rx=\"9\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"370.0\" y=\"120.2\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">extract_draft<\/text><rect x=\"490.0\" y=\"96.0\" width=\"110\" height=\"38\" rx=\"9\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"545.0\" y=\"120.2\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">reviewer<\/text><circle cx=\"700.0\" cy=\"115.0\" r=\"20\" fill=\"#fff\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"700.0\" y=\"119.0\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#0e3b3a\">END<\/text><line x1=\"67.0\" y1=\"115.0\" x2=\"128.0\" y2=\"115.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><line x1=\"232.0\" y1=\"115.0\" x2=\"295.0\" y2=\"115.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><line x1=\"445.0\" y1=\"115.0\" x2=\"490.0\" y2=\"115.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><line x1=\"600.0\" y1=\"115.0\" x2=\"680.0\" y2=\"115.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><line x1=\"160.0\" y1=\"136.0\" x2=\"160.0\" y2=\"229.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><line x1=\"200.0\" y1=\"229.0\" x2=\"200.0\" y2=\"136.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><text x=\"246\" y=\"188\" font-size=\"13\" font-weight=\"700\" text-anchor=\"start\" fill=\"#1a5c5b\">tool call<\/text><text x=\"262\" y=\"146\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a5c5b\">no more tool calls<\/text><path d=\"M 545 96 Q 365 8 180 96\" fill=\"none\" stroke=\"#c9583a\" stroke-width=\"2.6\" marker-end=\"url(#gb)\"/><text x=\"365\" y=\"32\" font-size=\"14\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#c9583a\">rejected: back to the writer<\/text><text x=\"640\" y=\"146\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a5c5b\">approved, or<\/text><text x=\"640\" y=\"163\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a5c5b\">3 attempts<\/text><text x=\"40\" y=\"215\" font-size=\"13\" font-weight=\"800\" text-anchor=\"start\" fill=\"#8a6a12\">the tool loop<\/text><text x=\"40\" y=\"232\" font-size=\"12\" font-weight=\"700\" text-anchor=\"start\" fill=\"#8a6a12\">writer and tools<\/text><\/svg><\/div><div class=\"em-cap\">The code is from your <code>02_iterative_tools.py<\/code>. <code>extract_draft<\/code> pulls the final text out of the messages and puts it in <code>draft<\/code>, so the reviewer can read it.<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c2\" id=\"two-loops-in-one-graph\">Two Loops in One Graph<\/h2>\n<p>The new graph has a tool loop inside the review loop.<\/p>\n<figure class=\"visual\"><div class=\"hl\" data-x=\"1\"><pre><span class=\"n\">graph<\/span> <span class=\"o\">=<\/span> <span class=\"n\">StateGraph<\/span><span class=\"p\">(<\/span><span class=\"n\">State<\/span><span class=\"p\">)<\/span>\n\n<span class=\"n\">graph<\/span><span class=\"o\">.<\/span><span class=\"n\">add_node<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"writer\"<\/span><span class=\"p\">,<\/span><span class=\"n\">writer_node<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">graph<\/span><span class=\"o\">.<\/span><span class=\"n\">add_node<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"tools\"<\/span><span class=\"p\">,<\/span><span class=\"n\">tool_node<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">graph<\/span><span class=\"o\">.<\/span><span class=\"n\">add_node<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"extract_draft\"<\/span><span class=\"p\">,<\/span><span class=\"n\">extract_draft_node<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">graph<\/span><span class=\"o\">.<\/span><span class=\"n\">add_node<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"reviewer\"<\/span><span class=\"p\">,<\/span><span class=\"n\">reviewer_node<\/span><span class=\"p\">)<\/span>\n\n<span class=\"n\">graph<\/span><span class=\"o\">.<\/span><span class=\"n\">add_edge<\/span><span class=\"p\">(<\/span><span class=\"n\">START<\/span> <span class=\"p\">,<\/span><span class=\"s2\">\"writer\"<\/span><span class=\"p\">)<\/span>\n\n<span class=\"n\">graph<\/span><span class=\"o\">.<\/span><span class=\"n\">add_conditional_edges<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"writer\"<\/span><span class=\"p\">,<\/span><span class=\"n\">should_use_tool<\/span><span class=\"p\">)<\/span>\n\n<span class=\"c1\"># ReAct loop: tool results go back to the writer, which then writes the post (or searches again)<\/span>\n<span class=\"n\">graph<\/span><span class=\"o\">.<\/span><span class=\"n\">add_edge<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"tools\"<\/span><span class=\"p\">,<\/span><span class=\"s2\">\"writer\"<\/span><span class=\"p\">)<\/span>\n\n<span class=\"n\">graph<\/span><span class=\"o\">.<\/span><span class=\"n\">add_edge<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"extract_draft\"<\/span><span class=\"p\">,<\/span><span class=\"s2\">\"reviewer\"<\/span><span class=\"p\">)<\/span>\n\n<span class=\"n\">graph<\/span><span class=\"o\">.<\/span><span class=\"n\">add_conditional_edges<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"reviewer\"<\/span><span class=\"p\">,<\/span><span class=\"n\">should_stop_looping<\/span><span class=\"p\">)<\/span><\/pre><\/div>\n<div class=\"em-tbl\"><table>\n<tr><th>Loop<\/th><th>Goes between<\/th><th>It stops when&hellip;<\/th><\/tr>\n<tr><td><b>Tool loop<\/b> (inside)<\/td><td>writer and tools<\/td><td>the writer asks for no more tools: <code>should_use_tool<\/code> returns <code>\"extract_draft\"<\/code><\/td><\/tr>\n<tr><td><b>Review loop<\/b> (outside)<\/td><td>reviewer and writer<\/td><td>approved, or 3 attempts: <code>should_stop_looping<\/code> returns <code>END<\/code><\/td><\/tr>\n<\/table><\/div>\n<div class=\"em-point\"><b>This graph is an agent.<\/b> The model decides by itself whether to use a tool, and a loop keeps running until the job is done. It is the ReAct loop from the Tool Calling lesson, now inside a graph with a reviewer.<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c3\" id=\"quick-revision\">Quick Revision<\/h2>\n<p>The whole lesson on one page.<\/p>\n<figure class=\"visual\"><div class=\"bnt rt4 three\"><div class=\"bnt-t c3\"><div class=\"bnt-h\">Loop<\/div><div class=\"bnt-b\">An edge back<\/div><div class=\"bnt-p\">A conditional edge sends the work back to an earlier node. That is all a loop is.<\/div><\/div><div class=\"bnt-t c1\"><div class=\"bnt-h\">Stop rule<\/div><div class=\"bnt-b\">Always have one<\/div><div class=\"bnt-p\">Yours has two: approved, or 3 attempts. Without one, the loop can run for thousands of steps.<\/div><\/div><div class=\"bnt-t c4\"><div class=\"bnt-h\">Tools plus loop<\/div><div class=\"bnt-b\">An agent<\/div><div class=\"bnt-p\">The writer can search, and the reviewer can send the work back. Two loops, one graph.<\/div><\/div><\/div><\/figure>\n<div class=\"docs\"><span class=\"docs-l\">LangGraph docs<\/span><a href=\"https://docs.langchain.com/oss/python/langgraph/workflows-agents\" target=\"_blank\" rel=\"noopener\">Workflows and agents<\/a><a href=\"https://docs.langchain.com/oss/python/langgraph/graph-api\" target=\"_blank\" rel=\"noopener\">Graph API<\/a><\/div>\n\n<div class=\"sc-head code-head\">Code<\/div><details class=\"codecard\"><summary><span class=\"cc-t\">Write and review loop<\/span><span class=\"cc-f\">01_iterative.py · 133 lines<\/span><span class=\"cc-show\">Show code<\/span><\/summary><div class=\"hl\"><table class=\"hltable\"><tr><td class=\"linenos\"><div class=\"linenodiv\"><pre><span class=\"normal\">  1<\/span>\n<span class=\"normal\">  2<\/spa 2\">        - If feedback is provided, carefully rewrite the draft to address EVERY critique while keeping the core message intact. <\/span>\n<span class=\"s2\">    \"\"\"<\/span><span class=\"p\">)])<\/span>\n\n\n<span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">writer_node<\/span><span class=\"p\">(<\/span><span class=\"n\">state<\/span><span class=\"p\">:<\/span><span class=\"n\">State<\/span><span class=\"p\">)<\/span><span class=\"o\">-&gt;<\/span><span class=\"nb\">dict<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">    <\/span><span class=\"sd\">\"\"\"Write the post on give topic and also improve if any feedback is there?\"\"\"<\/span>\n    <span class=\"n\">attempt<\/span> <span class=\"o\">=<\/span> <span class=\"n\">state<\/span><span class=\"o\">.<\/span><span class=\"n\">get<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"attempt\"<\/span><span class=\"p\">,<\/span><span class=\"mi\">0<\/span><span class=\"p\">)<\/span> <span class=\"o\">+<\/span><span class=\"mi\">1<\/span>\n    <span class=\"n\">chain<\/span> <span class=\"o\">=<\/span> <span class=\"n\">writter_prompt<\/span> <span class=\"o\">|<\/span> <span class=\"n\">writter_llm<\/span> <span class=\"o\">|<\/span> <span class=\"n\">parser<\/span>\n    <span class=\"n\">response<\/span> <span class=\"o\">=<\/span>  <span class=\"n\">chain<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">({<\/span>\n                        <span class=\"s2\">\"topic\"<\/span><span class=\"p\">:<\/span><span class=\"n\">state<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"topic\"<\/span><span class=\"p\">],<\/span>\n                        <span class=\"s2\">\"draft\"<\/span><span class=\"p\">:<\/span><span class=\"n\">state<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"draft\"<\/span><span class=\"p\">]<\/span> <span class=\"p\">,<\/span>\n                        <span class=\"s2\">\"feedback\"<\/span><span class=\"p\">:<\/spa
