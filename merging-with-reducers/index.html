<script>window.PAGE = {"id": "n28_2", "root": "../", "lesson": {"id": "n28_2", "title": "Merging with Reducers", "short": "Merging with Reducers", "unit": "Unit 4", "unitName": "Agents with LangGraph", "pos": 11, "of": 16, "sub": "", "info": "Three nodes writing one key, the merge reducer, running it, and other reducers", "html": "<h2 class=\"c4\" id=\"the-problem-three-nodes-one-key\">The Problem: Three Nodes, One Key<\/h2>\n<p>All three checks write their score into the same state key, at the same time.<\/p>\n<figure class=\"visual\"><div class=\"px\">\n  <div class=\"px-r\"><span>The issue<\/span><div>The three nodes finish at the same moment. Each one returns an update for <code>safety_scores<\/code>.<\/div><\/div>\n  <div class=\"px-r\"><span>The first try<\/span><div>Declare the key as a plain dictionary: <code>safety_scores: dict[str, int]<\/code>.<\/div><\/div>\n  <div class=\"px-r\"><span>Why it fails<\/span><div>LangGraph does not know how to combine three updates for one key in one step. It stops with an error.<\/div><\/div>\n  <div class=\"px-r hi\"><span>The fix<\/span><div>Tell LangGraph how to <b>merge<\/b> them: a reducer.<\/div><\/div>\n<\/div><div class=\"em-lane\"><div class=\"stp-l\">The error, with a plain dictionary<\/div><\/div>\n<div class=\"em-point\"><code>InvalidUpdateError: Can receive only one value per step<\/code><\/div>\n<div class=\"em-cap\">The same error is in your teaching plan, where you break the code on purpose. We also got it when we tested on the installed LangGraph.<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c5\" id=\"the-reducer-merge_score_dicts\">The Reducer: merge_score_dicts<\/h2>\n<p>A reducer tells LangGraph how to combine the updates instead of overwriting.<\/p>\n<figure class=\"visual\"><div class=\"hl\" data-x=\"1\"><pre><span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">merge_score_dicts<\/span><span class=\"p\">(<\/span><span class=\"n\">existing<\/span> <span class=\"p\">:<\/span> <span class=\"nb\">dict<\/span> <span class=\"p\">,<\/span> <span class=\"n\">newUpdate<\/span><span class=\"p\">:<\/span><span class=\"nb\">dict<\/span><span class=\"p\">)<\/span> <span class=\"o\">-&gt;<\/span> <span class=\"nb\">dict<\/span><span class=\"p\">:<\/span>\n    <span class=\"k\">if<\/span> <span class=\"n\">existing<\/span> <span class=\"ow\">is<\/span> <span class=\"kc\">None<\/span><span class=\"p\">:<\/span>\n        <span class=\"k\">return<\/span> <span class=\"n\">newUpdate<\/span>\n    <span class=\"k\">return<\/span> <span class=\"p\">{<\/span><span class=\"o\">**<\/span><span class=\"n\">existing<\/span><span class=\"p\">,<\/span> <span class=\"o\">**<\/span><span class=\"n\">newUpdate<\/span><span class=\"p\">}<\/span>\n\n<span class=\"k\">class<\/span><span class=\"w\"> <\/span><span class=\"nc\">AnlayzerState<\/span><span class=\"p\">(<\/span><span class=\"n\">TypedDict<\/span><span class=\"p\">):<\/span>\n    <span class=\"n\">raw_text<\/span> <span class=\"p\">:<\/span> <span class=\"nb\">str<\/span>\n    <span class=\"n\">safety_scores<\/span> <span class=\"p\">:<\/span><span class=\"n\">Annotated<\/span><span class=\"p\">[<\/span><span class=\"nb\">dict<\/span><span class=\"p\">[<\/span><span class=\"nb\">str<\/span><span class=\"p\">,<\/span><span class=\"nb\">int<\/span><span class=\"p\">],<\/span><span class=\"n\">merge_score_dicts<\/span><span class=\"p\">]<\/span><\/pre><\/div>\n<div class=\"em-tbl\"><table><tr><th>Update arrives<\/th><th>safety_scores becomes<\/th><\/tr><tr><td><i>the start<\/i><\/td><td><code>{}<\/code><\/td><\/tr><tr><td><code>{'toxicity': 50}<\/code><\/td><td><code>{'toxicity': 50}<\/code><\/td><\/tr><tr><td><code>{'copyright_risk': 85}<\/code><\/td><td><code>{'toxicity': 50, 'copyright_risk': 85}<\/code><\/td><\/tr><tr><td><code>{'cultural_insensitivity': 78}<\/code><\/td><td><code>{'toxicity': 50, 'copyright_risk': 85, 'cultural_insensitivity': 78}<\/code><\/td><\/tr><\/table><\/div><div class=\"em-cap\">Example numbers, taken from your teaching plan. The three updates can arrive in any order, and the result has the same three keys.<\/div>\n<div class=\"px\">\n  <div class=\"px-r\"><span>existing<\/span><div>What <code>safety_scores<\/code> holds now.<\/div><\/div>\n  <div class=\"px-r\"><span>newUpdate<\/span><div>The small dictionary a node just returned.<\/div><\/div>\n  <div class=\"px-r hi\"><span>The merge<\/span><div><code>{**existing, **newUpdate}<\/code> copies the old keys and adds the new ones. Nothing is lost.<\/div><\/div>\n<\/div><\/figure>\n<hr />\n<h2 class=\"c1\" id=\"run-it-and-read-the-result\">Run It and Read the Result<\/h2>\n<p>We start with an empty dictionary and invoke the graph.<\/p>\n<figure class=\"visual\"><div class=\"hl\" data-x=\"1\"><pre><span class=\"n\">inital_state<\/span> <span class=\"o\">=<\/span> <span class=\"p\">{<\/span>\n    <span class=\"s2\">\"raw_text\"<\/span><span class=\"p\">:<\/span><span class=\"n\">sample_script<\/span><span class=\"p\">,<\/span>\n    <span class=\"s2\">\"safety_scores\"<\/span><span class=\"p\">:{}<\/span>\n<span class=\"p\">}<\/span>\n\n<span class=\"n\">res<\/span> <span class=\"o\">=<\/span> <span class=\"n\">app<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">(<\/span><span class=\"n\">inital_state<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">res<\/span><span class=\"p\">[<\/span><span class=\"s1\">'safety_scores'<\/span><span class=\"p\">])<\/span><\/pre><\/div>\n<div class=\"px\">\n  <div class=\"px-r\"><span>Start<\/span><div><code>safety_scores<\/code> begins as <code>{}<\/code>. The reducer adds each score to it.<\/div><\/div>\n  <div class=\"px-r\"><span>Result<\/span><div><code>{'copyright_risk': 85, 'cultural_insensitivity': 78, 'toxicity': 50}<\/code><\/div><\/div>\n  <div class=\"px-r hi\"><span>A clean text<\/span><div>Change <code>sample_script<\/code> to a clean text and the scores go down.<\/div><\/div>\n<\/div><div class=\"em-cap\">The result is from your teaching plan: your own run on the sample script. Your model may give other numbers. The sample script is deliberately bad, so the scores are high.<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c2\" id=\"other-reducers-and-when-to-use-parallel\">Other Reducers, and When to Use Parallel<\/h2>\n<p>You will meet two more reducers soon. Parallel flow is not always the right choice.<\/p>\n<figure class=\"visual\"><div class=\"em-tbl\"><table>\n<tr><th>Reducer<\/th><th>What it does<\/th><th>Used for<\/th><\/tr>\n<tr><td><code>merge_score_dicts<\/code><\/td><td>merges dictionaries (yours)<\/td><td>scores from parallel checks<\/td><\/tr>\n<tr><td><code>operator.add<\/code><\/td><td>a ready-made reducer from Python: it joins lists<\/td><td>collecting results from parallel nodes into one list<\/td><\/tr>\n<tr><td><code>add_messages<\/code><\/td><td>a ready-made reducer from LangGraph: it adds chat messages<\/td><td>chat history. <code>MessagesState<\/code> uses it.<\/td><\/tr>\n<\/table><\/div>\n<div class=\"em-tbl\"><table>\n<tr><th>Use parallel flow when&hellip;<\/th><th>Be careful when&hellip;<\/th><\/tr>\n<tr><td>the steps do not need each other's results<\/td><td>one step needs another's output: that is sequential<\/td><\/tr>\n<tr><td>you need all the results before moving on<\/td><td>the model API has a rate limit: three calls at once may be refused<\/td><\/tr>\n<tr><td>waiting time matters<\/td><td>the parallel nodes write the same key and you forgot the reducer<\/td><\/tr>\n<\/table><\/div>\n<div class=\"em-cap\">We tested <code>operator.add<\/code> and <code>add_messages<\/code> on the installed LangGraph, and both work as reducers.<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c3\" id=\"quick-revision\">Quick Revision<\/h2>\n<p>The whole lesson on one page.<\/p>\n<figure class=\"visual\"><div class=\"bnt rt4 three\"><div class=\"bnt-t c3\"><div class=\"bnt-h\">Shape<\/div><div class=\"bnt-b\">Fan-out and fan-in<\/div><div class=\"bnt-p\">Several edges leave one node, the branches run together, and the graph continues when all are done.<\/div><\/div><div class=\"bnt-t c1\"><div class=\"bnt-h\">The problem<\/div><div class=\"bnt-b\">One key, three writers<\/div><div class=\"bnt-p\">Without a reducer, LangGraph raises <code>InvalidUpdateError<\/code> when parallel nodes write the same key.<\/div><\/div><div class=\"bnt-t c4\"><div class=\"bnt-h\">The fix<\/div><div class=\"bnt-b\">A reducer<\/div><div class=\"bnt-p\"><code>Annotated[type, reducer]<\/code> tells LangGraph how to merge. Yours merges dictionaries. <code>operator.add<\/code> joins lists.<\/div><\/div><\/div><\/figure>\n<div class=\"docs\"><span class=\"docs-l\">LangGraph docs<\/span><a href=\"https://docs.langchain.com/oss/python/langgraph/workflows-agents\" target=\"_blank\" rel=\"noopener\">Workflows and agents<\/a><a href=\"https://docs.langchain.com/oss/python/langgraph/graph-api\" target=\"_blank\" rel=\"noopener\">Graph API: reducers<\/a><\/div>\n\n<div class=\"sc-head code-head\">Code<\/div><details class=\"codecard\"><summary><span class=\"cc-t\">Parallel checks with a merge reducer<\/span><span class=\"cc-f\">01_parallel_reducers.py · 114 lines<\/span><span class=\"cc-show\">Show code<\/span><\/summary><div class=\"hl\"><table class=\"hltable\"><tr><td class=\"linenos\"><div class=\"linenodiv\"><pre><span class=\"normal\">  1<\/span>\n<span class=\"normal\">  2<\/span>\n<span class=\"normal\">  3<\/span>\n<span class=\"normal\">  4<\/span>\n<span class=\"normal\">  5<\/span>\n<span class=\"normal\">  6<\/span>\n<span class=\"normal\">  7<\/span>\n<span class=\"normal\">  8<\/span>\n<span class=\"normal\">  9<\/span>\n<span class=\"normal\"> 10<\/span>\n<span class=\"normal\"> 11<\/span>\n<span class=\"normal\"> 12<\/span>\n<span class=\"normal\"> 13<\/span>\n<span class=\"normal\"> 14<\/span>\n<span class=\"normal\"> 15<\/span>\n<span class=\"normal\"> 16<\/span>\n<span class=\"normal\"> 17<\/span>\n<span class=\"normal\"> 18<\/span>\n<span class=\"normal\"> 19<\/span>\n<span class=\"normal\"> 20<\/span>\n<span class=\"normal\"> 21<\/span>\n<span class=\"normal\"> 22<\/span>\n<span class=\"normal\"> 23<\/span>\n<span class=\"normal\"> 24<\/span>\n<span class=\"normal\"> 25<\/span>\n<span class=\"normal\"> 26<\/span>\n<span class=\"normal\"> 27<\/span>\n<span class=\"normal\"> 28<\/span>\n<span class=\"normal\"> 29<\/span>\n<span class=\"normal\"> 30<\/span>\n<span class=\"normal\"> 31<\/span>\n<span class=\"normal\"> 32<\/span>\n<span class=\"normal\"> 33<\/span>\n<span class=\"normal\"> 34<\/span>\n<span class=\"normal\"> 35<\/span>\n<span class=\"normal\"> 36<\/span>\n<span class=\"normal\"> 37<\/span>\n<span class=\"normal\"> 38<\/span>\n<span class=\"normal\"> 39<\/span>\n<span class=\"normal\"> 40<\/span>\n<span class=\"normal\"> 41<\/span>\n<span class=\"normal\"> 42<\/span>\n<span class=\"normal\"> 43<\/span>\n<span class=\"normal\"> 44<\/span>\n<span class=\"normal\"> 45<\/span>\n<span class=\"normal\"> 46<\/span>\n<span class=\"normal\"> 47<\/span>\n<span class=\"normal\"> 48<\/span>\n<span class=\"normal\"> 49<\/span>\n<span class=\"normal\"> 50<\/span>\n<span class=\"normal\"> 51<\/span>\n<span class=\"normal\"> 52<\/span>\n<span class=\"normal\"> 53<\/span>\n<span class=\"normal\"> 54<\/span>\n<span class=\"normal\"> 55<\/span>\n<span class=\"normal\"> 56<\/span>\n<span class=\"normal\"> 57<\/span>\n<span class=\"normal\"> 58<\/span>\n<span class=\"normal\"> 59<\/span>\n<span class=\"normal\"> 60<\/span>\n<span class=\"normal\"> 61<\/span>\n<span class=\"normal\"> 62<\/span>\n<span class=\"normal\"> 63<\/span>\n<span class=\"normal\"> 64<\/span>\n<span class=\"normal\"> 65<\/span>\n<span class=\"normal\"> 66<\/span>\n<span class=\"normal\"> 67<\/span>\n<span class=\"normal\"> 68<\/span>\n<span class=\"normal\"> 69<\/span>\n<span class=\"normal\"> 70<\/span>\n<span class=\"normal\"> 71<\/span>\n<span class=\"normal\"> 72<\/span>\n<span class=\"normal\"> 73<\/span>\n<span class=\"normal\"> 74<\/span>\n<span class=\"normal\"> 75<\/span>\n<span class=\"normal\"> 76<\/span>\n<span class=\"normal\"> 77<\/span>\n<span class=\"normal\"> 78<\/span>\n<span class=\"normal\"> 79<\/span>\n<span class=\"normal\"> 80<\/span>\n<span class=\"normal\"> 81<\/span>\n<span class=\"normal\"> 82<\/span>\n<span class=\"normal\"> 83<\/span>\n<span class=\"normal\"> 84<\/span>\n<span class=\"normal\"> 85<\/span>\n<span class=\"normal\"> 86<\/span>\n<span class=\"normal\"> 87<\/span>\n<span class=\"normal\"> 88<\/span>\n<span class=\"normal\"> 89<\/span>\n<span class=\"normal\"> 90<\/span>\n<span class=\"normal\"> 91<\/span>\n<span class=\"normal\"> 92<\/span>\n<span class=\"normal\"> 93<\/span>\n<span class=\"normal\"> 94<\/span>\n<span class=\"normal\"> 95<\/span>\n<span class=\"normal\"> 96<\/span>\n<span class=\"normal\"> 97<\/span>\n<span class=\"normal\"> 98<\/span>\n<span class=\"normal\"> 99<\/span>\n<span class=\"normal\">100<\/span>\n<span class=\"normal\">101<\/span>\n<span class=\"normal\">102<\/span>\n<span class=\"normal\">103<\/span>\n<span class=\"normal\">104<\/span>\n<span class=\"normal\">105<\/span>\n<span class=\"normal\">106<\/span>\n<span class=\"normal\">107<\/span>\n<span class=\"normal\">108<\/span>\n<span class=\"normal\">109<\/span>\n<span class=\"normal\">110<\/span>\n<span class=\"normal\">111<\/span>\n<span class=\"normal\">112<\/span>\n<span class=\"normal\">113<\/span>\n<span class=\"normal\">114<\/span><\/pre><\/div><\/td><td class=\"code\"><div><pre><span><\/span><span class=\"kn\">import<\/span><span class=\"w\"> <\/span><span class=\"nn\">re<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">typing<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">TypedDict<\/span> <span class=\"p\">,<\/span> <span class=\"n\">Annotated<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">dotenv<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">load_dotenv<\/span>\n\n<span class=\"n\">load_dotenv<\/span><span class=\"p\">()<\/span>\n\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain.chat_models<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">init_chat_model<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langgraph.graph<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">StateGraph<\/span> <span class=\"p\">,<\/span> <span class=\"n\">END<\/span> <span class=\"p\">,<\/span> <span class=\"n\">START<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_core.prompts<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">ChatPromptTemplate<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_core.output_parsers<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">StrOutputParser<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">rich<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"nb\">print<\/span>\n<span class=\"n\">parser<\/span> <span class=\"o\">=<\/span> <span class=\"n\">StrOutputParser<\/span><span class=\"p\">()<\/span>\n\n<span class=\"n\">model<\/span> <span class=\"o\">=<\/span> <span class=\"n\">init_chat_model<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"mistralai:open-mistral-nemo\"<\/span><span class=\"p\">)<\/span>\n\n\n\n<span class=\"sd\">\"\"\"Reducer: tells LangGraph how to MERGE updates from parallel nodes, instead of overwriting\"\"\"<\/span>\n<span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">merge_score_dicts<\/span><span class=\"p\">(<\/span><span class=\"n\">existing<\/span> <span class=\"p\">:<\/span> <span class=\"nb\">dict<\/span> <span class=\"p\">,<\/span> <span class=\"n\">newUpdate<\/span><span class=\"p\">:<\/span><span class=\"nb\">dict<\/span><span class=\"p\">)<\/span> <span class=\"o\">-&gt;<\/span> <span class=\"nb\">dict<\/span><span class=\"p\">:<\/span>\n    <span class=\"k\">if<\/span> <span class=\"n\">existing<\/span> <span class=\"ow\">is<\/span> <span class=\"kc\">None<\/span><span class=\"p\">:<\/span>\n        <span class=\"k\">return<\/span> <span class=\"n\">newUpdate<\/span>\n    <span class=\"k\">return<\/span> <span class=\"p\">{<\/span><span class=\"o\">**<\/span><span class=\"n\">existing<\/span><span class=\"p\">,<\/span> <span class=\"o\">**<\/span><span class=\"n\">newUpdate<\/span><span class=\"p\">}<\/span>\n\n\n<span class=\"sd\">\"\"\"Annotated[type, reducer]: this key uses our reducer\"\"\"<\/span>\n<span class=\"k\">class<\/span><span class=\"w\"> <\/span><span class=\"nc\">AnlayzerState<\/span><span class=\"p\">(<\/span><span class=\"n\">TypedDict<\/span><span class=\"p\">):<\/span>\n    <span class=\"n\">raw_text<\/span> <span class=\"p\">:<\/span> <span class=\"nb\">str<\/span>\n    <span class=\"n\">safety_scores<\/span> <span class=\"p\">:<\/span><span class=\"n\">Annotated<\/span><span class=\"p\">[<\/span><span class=\"nb\">dict<\/span><span class=\"p\">[<\/span><span class=\"nb\">str<\/span><span class=\"p\">,<\/span><span class=\"nb\">int<\/span><span class=\"p\">],<\/span><span class=\"n\">merge_score_dicts<\/span><span class=\"p\">]<\/span>\n\n\n<span class=\"n\">toxicity_prompt<\/span> <span class=\"o\">=<\/span> <span class=\"n\">ChatPromptTemplate<\/span><span class=\"o\">.<\/span><span class=\"n\">from_messages<\/span><span class=\"p\">(<\/span>\n    <span class=\"p\">[<\/span>\n    <span class=\"p\">(<\/span><span class=\"s2\">\"system\"<\/span><span class=\"p\">,<\/span><span class=\"s2\">\"\"\"Analyze the following text for profanity, aggression, hate speech, or toxicity. <\/span>\n<span class=\"s2\">        Provide a score from 0 t
