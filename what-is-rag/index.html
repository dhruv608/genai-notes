<script>window.PAGE = {"id": "n34", "root": "../", "lesson": {"id": "n34", "title": "What is RAG?", "short": "What is RAG?", "unit": "Unit 3", "unitName": "Chat with Your Data (RAG)", "pos": 1, "of": 11, "sub": "", "info": "Why LLMs need your data, what RAG is, and the whole pipeline in one picture", "html": "<h2 class=\"c1\" id=\"1-a-practical-problem\">1. A Practical Problem<\/h2>\n<p>So far we built chatbots with history. Now let us build something practical. You work at a company that keeps data for many clients, in PDFs, Excel sheets and other files. Your manager says: <strong>\"Analyze these thousand pages and give me a report.\"<\/strong> Every page has payment amounts, dates and details, all as text.<\/p>\n<figure class=\"visual\"><div class=\"rg1\">\n  <div class=\"rg1-mgr\"><div class=\"rg1-who\"><span class=\"tag t\">Manager<\/span><\/div><div class=\"rg1-say\">\"Please analyze these <b>thousand pages<\/b> of PDFs and give me a report.\"<\/div><\/div>\n  <div class=\"rg1-doc\">\n    <div class=\"stp-l\">The data<\/div>\n    <div class=\"rg1-stack\"><i><\/i><i><\/i><i><\/i><b>1,000 pages<\/b><\/div>\n    <div class=\"rg1-list\"><u>Client details<\/u><u>Payment amounts<\/u><u>Dates<\/u><u>Everything in text<\/u><\/div>\n  <\/div>\n<\/div>\n<div class=\"rg-q\">How do you think we should proceed?<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c2\" id=\"2-how-would-you-do-it\">2. How Would You Do It?<\/h2>\n<p>Think first. The first idea is usually: paste everything into ChatGPT. The second idea: split it into parts and ask each part.<\/p>\n<figure class=\"visual\"><div class=\"rg2\">\n  <div class=\"rg2-c\"><div class=\"why-h\"><span class=\"tag t\">Idea 1<\/span><span class=\"stp-l\">Paste everything into ChatGPT<\/span><\/div>\n    <div class=\"win chatwin rg2-win\"><div class=\"win-top\"><i><\/i><i><\/i><i><\/i><span>chatgpt.com<\/span><\/div>\n      <div class=\"win-body\">\n        <div class=\"cuser\">[ all 1,000 pages pasted here ] Summarize every client's payments.<\/div>\n        <div class=\"crow\"><span class=\"cav\"><svg viewBox=\"0 0 24 24\" aria-label=\"ChatGPT\"><path d=\"M22.2819 9.8211a5.9847 5.9847 0 0 0-.5157-4.9108 6.0462 6.0462 0 0 0-6.5098-2.9A6.0651 6.0651 0 0 0 4.9807 4.1818a5.9847 5.9847 0 0 0-3.9977 2.9 6.0462 6.0462 0 0 0 .7427 7.0966 5.98 5.98 0 0 0 .511 4.9107 6.051 6.051 0 0 0 6.5146 2.9001A5.9847 5.9847 0 0 0 13.2599 24a6.0557 6.0557 0 0 0 5.7718-4.2058 5.9894 5.9894 0 0 0 3.9977-2.9001 6.0557 6.0557 0 0 0-.7475-7.0729zm-9.022 12.6081a4.4755 4.4755 0 0 1-2.8764-1.0408l.1419-.0804 4.7783-2.7582a.7948.7948 0 0 0 .3927-.6813v-6.7369l2.02 1.1686a.071.071 0 0 1 .038.052v5.5826a4.504 4.504 0 0 1-4.4945 4.4944zm-9.6607-4.1254a4.4708 4.4708 0 0 1-.5346-3.0137l.142.0852 4.783 2.7582a.7712.7712 0 0 0 .7806 0l5.8428-3.3685v2.3324a.0804.0804 0 0 1-.0332.0615L9.74 19.9502a4.4992 4.4992 0 0 1-6.1408-1.6464zM2.3408 7.8956a4.485 4.485 0 0 1 2.3655-1.9728V11.6a.7664.7664 0 0 0 .3879.6765l5.8144 3.3543-2.0201 1.1685a.0757.0757 0 0 1-.071 0l-4.8303-2.7865A4.504 4.504 0 0 1 2.3408 7.872zm16.5963 3.8558L13.1038 8.364 15.1192 7.2a.0757.0757 0 0 1 .071 0l4.8303 2.7913a4.4944 4.4944 0 0 1-.6765 8.1042v-5.6772a.79.79 0 0 0-.407-.667zm2.0107-3.0231l-.142-.0852-4.7735-2.7818a.7759.7759 0 0 0-.7854 0L9.409 9.2297V6.8974a.0662.0662 0 0 1 .0284-.0615l4.8303-2.7866a4.4992 4.4992 0 0 1 6.6802 4.66zM8.3065 12.863l-2.02-1.1638a.0804.0804 0 0 1-.038-.0567V6.0742a4.4992 4.4992 0 0 1 7.3757-3.4537l-.142.0805L8.704 5.459a.7948.7948 0 0 0-.3927.6813zm1.0976-2.3654l2.602-1.4998 2.6069 1.4998v2.9994l-2.5974 1.4997-2.6067-1.4997Z\"/><\/svg><\/span><div class=\"cans\"><p>Your message is too long. Please submit something shorter.<\/p><\/div><\/div>\n      <\/div><\/div>\n    <ul class=\"rg2-l\"><li><b>Too big.<\/b> 1,000 pages is roughly 650,000 tokens, far over a 128K context window.<\/li><li><b>Even if it fits<\/b> (a 1M-token model): slow and expensive on every question, and less accurate on very long text.<\/li><li><b>Does not scale<\/b> to 10,000 pages, or to data that keeps changing.<\/li><\/ul>\n    <div class=\"rg2-v\">Not good.<\/div>\n    <div class=\"tc-n\">Example answer. Token count is a rough estimate (about 500 words a page).<\/div><\/div>\n  <div class=\"rg2-c\"><div class=\"why-h\"><span class=\"tag t\">Idea 2<\/span><span class=\"stp-l\">Split it and ask in parts<\/span><\/div>\n    <div class=\"rg2-split\"><div class=\"rg2-p\"><small>Part 1<\/small><span>&hellip; Client A, payments 2019 &hellip;<\/span><em>cut here<\/em><\/div><div class=\"rg2-p\"><small>Part 2<\/small><span>&hellip; Client A, payments 2020 &hellip;<\/span><\/div><\/div>\n    <ul class=\"rg2-l\"><li><b>Still too long.<\/b> 100 pages, or even 50, is a lot.<\/li><li><b>Tedious.<\/b> Many separate questions to ask.<\/li><li><b>Not exact.<\/b> Each part gives its own answer.<\/li><li><b>Parts are connected.<\/b> Client A is in part 1 and part 2. Splitting blindly breaks that.<\/li><\/ul>\n    <div class=\"rg2-v\">Not good either.<\/div><\/div>\n<\/div>\n<div class=\"rg-q\">So which part has the answer?<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c3\" id=\"3-which-part-has-the-answer\">3. Which Part Has the Answer?<\/h2>\n<p>Even with parts, we must <strong>search<\/strong> the 1,000 pages for the right piece. But plain keyword search is not enough.<\/p>\n<figure class=\"visual\"><div class=\"two\">\n  <div class=\"two-c t\"><div class=\"why-h\"><span class=\"tag t\">The question<\/span><\/div>\n    <div class=\"two-q\">What was <b>Client A's revenue<\/b> in 2019?<\/div>\n    <div class=\"two-l\">The word is<\/div><code class=\"two-code\">revenue<\/code><\/div>\n  <div class=\"two-c d\"><div class=\"why-h\"><span class=\"tag d\">In the PDF<\/span><\/div>\n    <div class=\"two-q\">&hellip; <b>Client A's income<\/b> in 2019 was 4.2 lakh &hellip;<\/div>\n    <div class=\"two-l\">The word is<\/div><code class=\"two-code\">income<\/code><\/div>\n<\/div>\n<div class=\"rg3-x\"><b>Keyword search misses it.<\/b> The words are different, but the meaning is the same. We need search by <b>meaning<\/b>. That is what embeddings give us.<\/div>\n<div class=\"tc-n\">Example text.<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c4\" id=\"4-we-need-a-reliable-way-to-query-the-pdf\">4. We Need a Reliable Way to Query the PDF<\/h2>\n<p>We need a way to find the pieces that match the <strong>meaning<\/strong> of the question, and ask about only those. That is <strong>RAG<\/strong>.<\/p>\n<blockquote class=\"def\"><span class=\"deflab\">Definition<\/span>\n<p><strong>RAG<\/strong> stands for <mark class=\"hp\">Retrieval-Augmented Generation<\/mark>. <mark class=\"hk\">Retrieve<\/mark> only the pieces that matter, <mark class=\"hk\">augment<\/mark> the prompt with them, then <mark class=\"hk\">generate<\/mark> the answer.<\/p>\n<\/blockquote>\n<figure class=\"visual\"><div class=\"bnt rt4 three\">\n  <div class=\"bnt-t c3\"><div class=\"bnt-h\">Retrieve<\/div><div class=\"bnt-b\">Find the pieces<\/div><div class=\"bnt-p\">Search the PDF for the few pieces that match the question.<\/div><\/div>\n  <div class=\"bnt-t c1\"><div class=\"bnt-h\">Augment<\/div><div class=\"bnt-b\">Add them to the prompt<\/div><div class=\"bnt-p\">Put those pieces next to the question. This is the context.<\/div><\/div>\n  <div class=\"bnt-t c4\"><div class=\"bnt-h\">Generate<\/div><div class=\"bnt-b\">The LLM answers<\/div><div class=\"bnt-p\">The LLM writes the answer from the context you gave it.<\/div><\/div>\n<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c5\" id=\"5-what-is-inside-rag\">5. What Is Inside RAG?<\/h2>\n<p>Three steps make it work. Reading the data in is a separate part.<\/p>\n<figure class=\"visual\"><div class=\"bnt rt4 three\">\n  <div class=\"bnt-t c3\"><div class=\"bnt-h\">Step 1<\/div><div class=\"bnt-b\">Chunking<\/div><div class=\"bnt-p\">Cut the text into small pieces. We cover the chunking practices.<\/div><div class=\"bnt-p\"><b>Lesson:<\/b> Text Chunking<\/div><\/div>\n  <div class=\"bnt-t c1\"><div class=\"bnt-h\">Step 2<\/div><div class=\"bnt-b\">Embeddings<\/div><div class=\"bnt-p\">Turn each chunk into numbers, a vector. The theory, and how big an embedding is.<\/div><div class=\"bnt-p\"><b>Lesson:<\/b> Embeddings<\/div><\/div>\n  <div class=\"bnt-t c4\"><div class=\"bnt-h\">Step 3<\/div><div class=\"bnt-b\">Similarity search<\/div><div class=\"bnt-p\">Find the chunks closest to the question: cosine similarity, dot product, and how a vector database stores them.<\/div><div class=\"bnt-p\"><b>Lesson:<\/b> Vector Databases<\/div><\/div>\n  <div class=\"bnt-t wide-all neutral\"><div class=\"bnt-h\">A separate part<\/div><div class=\"bnt-b\">Document loaders<\/div><div class=\"bnt-p\">Getting the data in: PDFs, CSVs, websites, Wikipedia and more.<\/div><div class=\"bnt-p\"><b>Lessons:<\/b> Loading Documents, Web Data &amp; Search<\/div><\/div>\n<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c1\" id=\"6-from-question-to-answer\">6. From Question to Answer<\/h2>\n<p>For every question we search the vector database, take the <strong>top-k<\/strong> chunks, merge them, and pass them with the prompt to the LLM as context. That is the whole picture.<\/p>\n<figure class=\"diagram\"><pre class=\"mermaid\">flowchart TB\n  subgraph IDX[&quot;1 - Prepare your data (once)&quot;]\n    direction LR\n    P[&quot;100 pages&lt;br/&gt;your documents&quot;] -- &quot;Chunking&quot; --&gt; C[&quot;Chunks&lt;br/&gt;chunk 1, chunk 2&lt;br/&gt;chunk 3 ...&quot;]\n    C -- &quot;Embeddings&quot; --&gt; V[(&quot;Vector database&lt;br/&gt;one vector per chunk&quot;)]\n  end\n  subgraph FIND[&quot;2 - Find the context&quot;]\n    direction LR\n    Q([&quot;User prompt&quot;]) -- &quot;Embedding&quot; --&gt; QV[&quot;Question vector&quot;]\n    QV -- &quot;Similarity search&quot; --&gt; TK[&quot;Top K = 3&lt;br/&gt;closest chunks&quot;]\n    V2[(&quot;Vector database&lt;br/&gt;from part 1&quot;)] --&gt; TK\n    TK --&gt; CTX[&quot;Whole context&lt;br/&gt;the 3 chunks together&quot;]\n  end\n  subgraph WRITE[&quot;3 - Write the answer&quot;]\n    direction LR\n    Q2([&quot;User prompt&quot;]) --&gt; PC[&quot;Prompt + context&quot;]\n    CTX2[&quot;Whole context&lt;br/&gt;from part 2&quot;] --&gt; PC\n    PC --&gt; L[&quot;LLM&lt;br/&gt;OpenAI, Gemini ...&quot;]\n    L --&gt; R([&quot;Response&lt;br/&gt;from the context&quot;])\n  end\n  IDX ~~~ FIND\n  FIND ~~~ WRITE\nclassDef term fill:#0e3b3a,stroke:#0e3b3a,color:#ffffff,font-weight:bold\nclassDef gate fill:#fdf1ec,stroke:#c9583a,color:#7a2e1a\nclassDef store fill:#f5f5f4,stroke:#57534e,color:#292524\nclassDef c0 fill:#d4ecea,stroke:#2a7a79,color:#0e3b3a\nclassDef c1 fill:#fbe5dc,stroke:#c9583a,color:#7a2e1a\nclassDef c2 fill:#e3f5ee,stroke:#4aa58a,color:#14463a\nclassDef c3 fill:#f6f4f0,stroke:#a7a29a,color:#3f3b35\nclassDef c4 fill:#eef7f7,stroke:#1a5c5b,color:#0e3b3a\nclass IDX c0\nclass P c1\nclass C c2\nclass V store\nclass FIND c3\nclass Q term\nclass QV c4\nclass TK c0\nclass V2 store\nclass CTX c1\nclass WRITE c2\nclass Q2 term\nclass PC c3\nclass CTX2 c4\nclass L c0\nclass R term\nstyle IDX fill:#f4fafa,stroke:#9fcfce,stroke-width:1.5px\nstyle FIND fill:#fdf6f3,stroke:#ecc0ae,stroke-width:1.5px\nstyle WRITE fill:#f3faf7,stroke:#9fe0c7,stroke-width:1.5px<\/pre><div class=\"dg-ascii\" hidden><div class=\"hl\"><pre><span><\/span><code>RAG pipeline (diagram)\n<\/code><\/pre><\/div><\/div><\/figure>\n\n<hr />", "toc": [{"id": "1-a-practical-problem", "name": "1. A Practical Problem"}, {"id": "2-how-would-you-do-it", "name": "2. How Would You Do It?"}, {"id": "3-which-part-has-the-answer", "name": "3. Which Part Has the Answer?"}, {"id": "4-we-need-a-reliable-way-to-query-the-pdf", "name": "4. We Need a Reliable Way to Query the PDF"}, {"id": "5-what-is-inside-rag", "name": "5. What Is Inside RAG?"}, {"id": "6-from-question-to-answer", "name": "6. From Question to Answer"}], "search": "", "slides": null, "slideCount": 0, "code": []}};</script>
