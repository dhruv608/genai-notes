<script>window.PAGE = {"id": "n12_2", "root": "../", "lesson": {"id": "n12_2", "title": "Pipe & Runnables", "short": "Pipe & Runnables", "unit": "Unit 2", "unitName": "Build with LangChain", "pos": 11, "of": 14, "sub": "", "info": "The pipe operator and the Runnable standard", "html": "<h2 class=\"c4\" id=\"4-the-pipe-one-line-instead-of-three\">1. The Pipe: One Line Instead of Three<\/h2>\n<p>LangChain's fix: stop making a class for every job. Join any steps with one symbol.<\/p>\n<blockquote class=\"def\"><span class=\"deflab\">Definition<\/span>\n<p>The <strong>pipe<\/strong> <code>|<\/code> takes the output of the left side and gives it to the right side. This way of joining steps is called <mark class=\"hp\">LCEL<\/mark>, the <mark class=\"hk\">LangChain Expression Language<\/mark>.<\/p>\n<\/blockquote>\n<figure class=\"visual\"><div class=\"cmp2\">\n  <div class=\"cmp2-c\"><div class=\"cmp2-h\">By hand: 3 lines<\/div>\n    <code>prompt = template.invoke({...})<\/code><code>res = model.invoke(prompt)<\/code><code>text = parser.invoke(res)<\/code><\/div>\n  <div class=\"cmp2-c d\"><div class=\"cmp2-h\">With the pipe: 1 chain<\/div>\n    <code>chain = prompt | model | parser<\/code><code>chain.invoke({\"state\": \"punjab\"})<\/code><\/div>\n<\/div>\n<div class=\"px\">\n  <div class=\"px-r hi\"><span>The answer<\/span><div><div class=\"aib\">The capital of <b>Punjab<\/b> is <b>Chandigarh<\/b>. It is a <b>union territory<\/b> in India and serves as the shared capital for both <b>Punjab<\/b> and <b>Haryana<\/b>. Chandigarh is known for its modern urban planning, clean environment, and landmarks like the <b>Rock Garden<\/b> and <b>Le Corbusier-designed architecture<\/b>. It was established in 1952 after the partition of India and Pakistan.<\/div><\/div><\/div>\n<\/div><\/figure>\n<hr />\n<h2 class=\"c5\" id=\"5-what-is-a-runnable\">2. What Is a Runnable?<\/h2>\n<blockquote class=\"def\"><span class=\"deflab\">Definition<\/span>\n<p>A <strong>Runnable<\/strong> is anything in LangChain you can run with <code>.invoke()<\/code>.<\/p>\n<\/blockquote>\n<p>The name says it: <strong>Run + able<\/strong> = something you are able to run. Because every part follows this one standard, it comes with benefits.<\/p>\n<figure class=\"visual\"><div class=\"rnw\">\n  <div class=\"rnw-eq\"><span class=\"tag t\">Run<\/span><b>+<\/b><span class=\"tag d\">able<\/span><b>=<\/b><span class=\"rnw-r\">Runnable<\/span><i>something you are able to run<\/i><\/div>\n  <div class=\"rnw-all\"><span class=\"stp-l\">All of these are runnables<\/span><u>Prompt<\/u><u>Model<\/u><u>Parser<\/u><u>Chain<\/u><u>Your own function<\/u><\/div>\n  <div class=\"rnw-g\">\n    <div class=\"bnt-t c3\"><div class=\"bnt-h\">Benefit 1<\/div><div class=\"bnt-b\">Same methods everywhere<\/div><div class=\"bnt-p\"><code>invoke<\/code>, <code>stream<\/code> and <code>batch<\/code> work the same on a prompt, a model, a parser or a whole chain.<\/div><\/div>\n    <div class=\"bnt-t c1\"><div class=\"bnt-h\">Benefit 2<\/div><div class=\"bnt-b\">Join anything<\/div><div class=\"bnt-p\">The pipe <code>|<\/code> can connect any two runnables, so you build bigger things from small parts.<\/div><\/div>\n    <div class=\"bnt-t c4\"><div class=\"bnt-h\">Benefit 3<\/div><div class=\"bnt-b\">Easy to change<\/div><div class=\"bnt-p\">Swap the model or add a step of your own. The rest of the chain stays the same.<\/div><\/div>\n  <\/div>\n<\/div>\n<\/figure>\n<p>Every runnable has the same three methods. Pick a tab.<\/p>\n<figure class=\"visual\"><div class=\"dw\"><div class=\"dw-c t\">\n  <input type=\"radio\" name=\"dwr\" id=\"rn1\" checked><label for=\"rn1\">invoke<\/label>\n  <input type=\"radio\" name=\"dwr\" id=\"rn2\"><label for=\"rn2\">stream<\/label>\n  <input type=\"radio\" name=\"dwr\" id=\"rn3\"><label for=\"rn3\">batch<\/label>\n  <div class=\"hl\" data-x=\"1\"><pre><span class=\"vrn1\"><span class=\"n\">chain<\/span> <span class=\"o\">=<\/span> <span class=\"n\">prompt<\/span> <span class=\"o\">|<\/span> <span class=\"n\">model<\/span> <span class=\"o\">|<\/span> <span class=\"n\">parser<\/span>\n<span class=\"n\">res<\/span> <span class=\"o\">=<\/span> <span class=\"n\">chain<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">({<\/span><span class=\"s2\">\"state\"<\/span><span class=\"p\">:<\/span><span class=\"s2\">\"punjab\"<\/span><span class=\"p\">})<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">res<\/span><span class=\"p\">)<\/span><\/span><span class=\"vrn2\"><span class=\"n\">chain<\/span> <span class=\"o\">=<\/span> <span class=\"n\">prompt<\/span> <span class=\"o\">|<\/span> <span class=\"n\">model<\/span> <span class=\"o\">|<\/span> <span class=\"n\">parser<\/span>\n<span class=\"k\">for<\/span> <span class=\"n\">chunk<\/span> <span class=\"ow\">in<\/span> <span class=\"n\">chain<\/span><span class=\"o\">.<\/span><span class=\"n\">stream<\/span><span class=\"p\">({<\/span><span class=\"s2\">\"state\"<\/span><span class=\"p\">:<\/span><span class=\"s2\">\"Maharashtra\"<\/span><span class=\"p\">}):<\/span>\n    <span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">chunk<\/span><span class=\"p\">,<\/span><span class=\"n\">end<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"\"<\/span><span class=\"p\">,<\/span><span class=\"n\">flush<\/span><span class=\"o\">=<\/span><span class=\"kc\">True<\/span><span class=\"p\">)<\/span><\/span><span class=\"vrn3\"><span class=\"n\">batch_result<\/span> <span class=\"o\">=<\/span> <span class=\"n\">chain<\/span><span class=\"o\">.<\/span><span class=\"n\">batch<\/span><span class=\"p\">(<\/span><span class=\"n\">states_list<\/span><span class=\"p\">)<\/span><\/span><\/pre><\/div>\n  <div class=\"dw-blk get\"><span class=\"dw-al\">You get<\/span><div class=\"dw-out\"><span class=\"vrn1\"><div class=\"aib\">The capital of <b>Punjab<\/b> is <b>Chandigarh<\/b>. It is a <b>union territory<\/b> in India and serves as the shared capital for both <b>Punjab<\/b> and <b>Haryana<\/b>. Chandigarh is known for its modern urban planning, clean environment, and landmarks like the <b>Rock Garden<\/b> and <b>Le Corbusier-designed architecture<\/b>. It was established in 1952 after the partition of India and Pakistan.<\/div><\/span><span class=\"vrn2\"><div class=\"hl\" data-x=\"1\"><pre>'' | 'The' | ' capital' | ' of' | ' **' | 'Mah' | 'arashtra' | '**,' | ...<\/pre><\/div><\/span><span class=\"vrn3\"><div class=\"aib\">The capital of <b>Gujarat<\/b>, a state in western India, is <b>Gandhinagar<\/b>. Established in 1970, it serves as the administrative and political hub, replacing Ahmedabad as the capital. Gandhinagar is known for its modern infrastructure, planned city layout, and proximity to Ahmedabad, which remains the state's commercial and cultural center. The city is named after <b>Mahatma Gandhi<\/b>, the revered leader of India's independence movement.<\/div><div class=\"aib\">The capital of <b>Kerala<\/b>, a state in southern India, is <b>Thiruvananthapuram<\/b> (formerly known as Trivandrum). It is also the largest city in the state and serves as its political, economic, and cultural hub. The city is known for its beaches, historical landmarks like the <b>Padmanabhaswamy Temple<\/b>, and its role as a major port during colonial times.<\/div><div class=\"aib\">The capital of <b>Rajasthan<\/b>, the largest state in India by area, is <b>Jaipur<\/b>. Nicknamed the \"Pink City\" for its colonial-era pastel buildings, Jaipur serves as both the political and cultural heart of the state. Founded in 1727 by Maharaja Sawai Jai Singh II, it remains a vibrant hub for history, tourism, and governance.<\/div><\/span><\/div><\/div>\n  <div class=\"dw-cap\"><span class=\"vrn1\">One input, one full answer.<\/span><span class=\"vrn2\">The answer arrives piece by piece, so the user sees words as they are written.<\/span><span class=\"vrn3\">Many inputs in one go.<\/span><\/div>\n<\/div><\/div>\n<\/figure>\n<hr />\n<h2 class=\"c1\" id=\"6-a-chain-is-a-runnable-too\">3. A Chain Is a Runnable Too<\/h2>\n<p>Because a chain is a runnable, you can pipe a chain into another chain.<\/p>\n<figure class=\"visual\"><div class=\"hl\" data-x=\"1\"><pre><span class=\"n\">chain1<\/span>  <span class=\"o\">=<\/span> <span class=\"n\">prompt1<\/span> <span class=\"o\">|<\/span> <span class=\"n\">model<\/span> <span class=\"o\">|<\/span> <span class=\"n\">parser<\/span>\n<span class=\"n\">chain2<\/span> <span class=\"o\">=<\/span> <span class=\"n\">prompt2<\/span> <span class=\"o\">|<\/span> <span class=\"n\">model<\/span> <span class=\"o\">|<\/span> <span class=\"n\">parser<\/span>\n\n<span class=\"n\">chain<\/span> <span class=\"o\">=<\/span> <span class=\"p\">({<\/span><span class=\"s1\">'company_name'<\/span><span class=\"p\">:<\/span><span class=\"n\">chain1<\/span><span class=\"p\">}<\/span> <span class=\"o\">|<\/span> <span class=\"n\">chain2<\/span><span class=\"p\">)<\/span>\n\n<span class=\"n\">slogan<\/span> <span class=\"o\">=<\/span> <span class=\"n\">chain<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">({<\/span><span class=\"s2\">\"product\"<\/span><span class=\"p\">:<\/span><span class=\"s2\">\"cool lightweight laptop\"<\/span><span class=\"p\">})<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">slogan<\/span><span class=\"p\">)<\/span><\/pre><\/div>\n<div class=\"px\">\n  <div class=\"px-r\"><span>What happens<\/span><div><code>chain1<\/code> makes a company name. The dict <code>{'company_name': chain1}<\/code> saves it as <code>company_name<\/code>. <code>chain2<\/code> writes the slogan.<\/div><\/div>\n  <div class=\"px-r hi\"><span>The slogan<\/span><div><div class=\"aib\"><b>\"Lightning-fast brilliance—SwiftLume illuminates your world in a flash!\"<\/b> 🌟⚡<\/div><\/div><\/div>\n<\/div><\/figure>\n<div class=\"docs\"><span class=\"docs-l\">LangChain docs<\/span><a href=\"https://reference.langchain.com/python/langchain_core/runnables/base/Runnable\" target=\"_blank\" rel=\"noopener\">Runnable<\/a><\/div>\n\n<div class=\"sc-head code-head\">Code<\/div><details class=\"codecard\"><summary><span class=\"cc-t\">02_lcel_runnables_basic.py<\/span><span class=\"cc-f\">02_lcel_runnables_basic.py · 39 lines<\/span><span class=\"cc-show\">Show code<\/span><\/summary><div class=\"hl\"><table class=\"hltable\"><tr><td class=\"linenos\"><div class=\"linenodiv\"><pre><span class=\"normal\"> 1<\/span>\n<span class=\"normal\"> 2<\/span>\n<span class=\"normal\"> 3<\/span>\n<span class=\"normal\"> 4<\/span>\n<span class=\"normal\"> 5<\/span>\n<span class=\"normal\"> 6<\/span>\n<span class=\"normal\"> 7<\/span>\n<span class=\"normal\"> 8<\/span>\n<span class=\"normal\"> 9<\/span>\n<span class=\"normal\">10<\/span>\n<span class=\"normal\">11<\/span>\n<span class=\"normal\">12<\/span>\n<span class=\"normal\">13<\/span>\n<span class=\"normal\">14<\/span>\n<span class=\"normal\">15<\/span>\n<span class=\"normal\">16<\/span>\n<span class=\"normal\">17<\/span>\n<span class=\"normal\">18<\/span>\n<span class=\"normal\">19<\/span>\n<span class=\"normal\">20<\/span>\n<span class=\"normal\">21<\/span>\n<span class=\"normal\">22<\/span>\n<span class=\"normal\">23<\/span>\n<span class=\"normal\">24<\/span>\n<span class=\"normal\">25<\/span>\n<span class=\"normal\">26<\/span>\n<span class=\"normal\">27<\/span>\n<span class=\"normal\">28<\/span>\n<span class=\"normal\">29<\/span>\n<span class=\"normal\">30<\/span>\n<span class=\"normal\">31<\/span>\n<span class=\"normal\">32<\/span>\n<span class=\"normal\">33<\/span>\n<span class=\"normal\">34<\/span>\n<span class=\"normal\">35<\/span>\n<span class=\"normal\">36<\/span>\n<span class=\"normal\">37<\/span>\n<span class=\"normal\">38<\/span>\n<span class=\"normal\">39<\/span><\/pre><\/div><\/td><td class=\"code\"><div><pre><span><\/span><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">dotenv<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">load_dotenv<\/span>\n<span class=\"n\">load_dotenv<\/span><span class=\"p\">()<\/span>\n\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_core.prompts<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">ChatPromptTemplate<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain.chat_models<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">init_chat_model<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_core.output_parsers<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">StrOutputParser<\/span>\n<span class=\"n\">model<\/span> <span class=\"o\">=<\/span> <span class=\"n\">init_chat_model<\/span><span class=\"p\">(<\/span><span class=\"n\">model<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"mistralai:open-mistral-nemo\"<\/span><span class=\"p\">)<\/span>\n\n<span class=\"n\">prompt<\/span> <span class=\"o\">=<\/span> <span class=\"n\">ChatPromptTemplate<\/span><span class=\"o\">.<\/span><span class=\"n\">from_messages<\/span><span class=\"p\">(<\/span>\n    <span class=\"p\">[(<\/span><span class=\"s2\">\"system\"<\/span><span class=\"p\">,<\/span><span class=\"s2\">\"You are a concise geography expert. Answer in small paragraph\"<\/span><span class=\"p\">),<\/span>\n     <span class=\"p\">(<\/span><span class=\"s2\">\"human\"<\/span><span class=\"p\">,<\/span><span class=\"s2\">\"what is captial of <\/span><span class=\"si\">{state}<\/span><span class=\"s2\">\"<\/span><span class=\"p\">)]<\/span>\n<span class=\"p\">)<\/span>\n<span class=\"n\">parser<\/span> <span class=\"o\">=<\/span> <span class=\"n\">StrOutputParser<\/span><span class=\"p\">()<\/span>\n\n<span class=\"sd\">\"\"\"LCEL: | joins prompt, model and parser into one chain\"\"\"
