<script>window.PAGE = {"id": "n21", "root": "../", "lesson": {"id": "n21", "title": "Build a RAG App", "short": "Build a RAG App", "unit": "Unit 3", "unitName": "Chat with Your Data (RAG)", "pos": 10, "of": 11, "sub": "Build RAG", "info": "The two parts of a RAG app, load and split, embed and store, first and next run, retrieve, augment and generate, and other models and stores", "html": "<h2 class=\"c1\" id=\"the-rag-app-two-parts\">The RAG App: Two Parts<\/h2>\n<p>A RAG app has two parts. The first builds the knowledge base, once. The second answers a question, every time.<\/p>\n<figure class=\"visual\"><div class=\"stp-l\" style=\"margin-top: 14px\">Build the knowledge base, once<\/div><div class=\"bnt rt4 three\" style=\"grid-template-columns: repeat(4, 1fr)\"><div class=\"bnt-t c3\"><div class=\"bnt-h\">Load<\/div><div class=\"bnt-b\">The loader<\/div><div class=\"bnt-p\">The PDF becomes Documents<\/div><\/div><div class=\"bnt-t c3\"><div class=\"bnt-h\">Split<\/div><div class=\"bnt-b\">The text splitter<\/div><div class=\"bnt-p\">The Documents become chunks<\/div><\/div><div class=\"bnt-t c3\"><div class=\"bnt-h\">Embed<\/div><div class=\"bnt-b\">The embedding model<\/div><div class=\"bnt-p\">Each chunk becomes a vector<\/div><\/div><div class=\"bnt-t c3\"><div class=\"bnt-h\">Store<\/div><div class=\"bnt-b\">Chroma<\/div><div class=\"bnt-p\">The chunks and their vectors are saved<\/div><\/div><\/div><div class=\"stp-l\" style=\"margin-top: 14px\">Answer a question, every time<\/div><div class=\"bnt rt4 three\" style=\"grid-template-columns: repeat(4, 1fr)\"><div class=\"bnt-t c4\"><div class=\"bnt-h\">Embed<\/div><div class=\"bnt-b\">The question<\/div><div class=\"bnt-p\">The same embedding model makes its vector<\/div><\/div><div class=\"bnt-t c4\"><div class=\"bnt-h\">Retrieve<\/div><div class=\"bnt-b\">The closest chunks<\/div><div class=\"bnt-p\">The store returns the most similar chunks<\/div><\/div><div class=\"bnt-t c4\"><div class=\"bnt-h\">Augment<\/div><div class=\"bnt-b\">The prompt<\/div><div class=\"bnt-p\">The chunks and the question go into it<\/div><\/div><div class=\"bnt-t c4\"><div class=\"bnt-h\">Generate<\/div><div class=\"bnt-b\">The LLM<\/div><div class=\"bnt-p\">It answers from the chunks<\/div><\/div><\/div><\/figure>\n<hr />\n<h2 class=\"c2\" id=\"load-and-split\">Load and Split<\/h2>\n<p>The first two steps. You have seen both: the document loaders and the text splitters.<\/p>\n<figure class=\"visual\"><div class=\"hl\" data-x=\"1\"><pre><span class=\"n\">loader<\/span> <span class=\"o\">=<\/span> <span class=\"n\">PyPDFLoader<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"location of the PDF\"<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">docs<\/span> <span class=\"o\">=<\/span> <span class=\"n\">loader<\/span><span class=\"o\">.<\/span><span class=\"n\">load<\/span><span class=\"p\">()<\/span>\n<span class=\"n\">splitter<\/span> <span class=\"o\">=<\/span> <span class=\"n\">RecursiveCharacterTextSplitter<\/span><span class=\"p\">(<\/span><span class=\"n\">chunk_size<\/span><span class=\"o\">=<\/span><span class=\"mi\">500<\/span><span class=\"p\">,<\/span><span class=\"n\">chunk_overlap<\/span><span class=\"o\">=<\/span><span class=\"mi\">50<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">doc_chunks<\/span> <span class=\"o\">=<\/span> <span class=\"n\">splitter<\/span><span class=\"o\">.<\/span><span class=\"n\">split_documents<\/span><span class=\"p\">(<\/span><span class=\"n\">docs<\/span><span class=\"p\">)<\/span><\/pre><\/div>\n<div class=\"em-point\"><b>The loader<\/b> reads the PDF and gives one Document for each page.<\/div>\n<div class=\"em-point\"><b>The splitter<\/b> cuts the Documents into chunks of up to 500 characters, with an overlap of 50.<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c3\" id=\"embed-and-store\">Embed and Store<\/h2>\n<p>Each chunk becomes a vector, and the vectors are saved in a vector store. This app uses Chroma.<\/p>\n<figure class=\"visual\"><div class=\"hl\" data-x=\"1\"><pre><span class=\"n\">DB_DIR<\/span> <span class=\"o\">=<\/span> <span class=\"s2\">\"./chroma_db\"<\/span>\n<span class=\"n\">COLLECTION_NAME<\/span> <span class=\"o\">=<\/span> <span class=\"s2\">\"rag_knowledge\"<\/span>\n\n<span class=\"n\">embeddingModel<\/span> <span class=\"o\">=<\/span> <span class=\"n\">MistralAIEmbeddings<\/span><span class=\"p\">(<\/span><span class=\"n\">model<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"mistral-embed\"<\/span><span class=\"p\">)<\/span>\n\n<span class=\"n\">vector_store<\/span> <span class=\"o\">=<\/span> <span class=\"n\">Chroma<\/span><span class=\"o\">.<\/span><span class=\"n\">from_documents<\/span><span class=\"p\">(<\/span>\n    <span class=\"n\">documents<\/span><span class=\"o\">=<\/span><span class=\"n\">doc_chunks<\/span><span class=\"p\">,<\/span>\n    <span class=\"n\">embedding<\/span><span class=\"o\">=<\/span><span class=\"n\">embeddingModel<\/span><span class=\"p\">,<\/span>\n    <span class=\"n\">persist_directory<\/span><span class=\"o\">=<\/span><span class=\"n\">DB_DIR<\/span><span class=\"p\">,<\/span>\n    <span class=\"n\">collection_name<\/span><span class=\"o\">=<\/span><span class=\"n\">COLLECTION_NAME<\/span><span class=\"p\">,<\/span>\n<span class=\"p\">)<\/span><\/pre><\/div>\n<div class=\"em-point\"><b>embeddingModel<\/b> turns text into a vector. This is the model that embeds every chunk.<\/div>\n<div class=\"em-point\"><b>Chroma.from_documents<\/b> embeds all the chunks and saves them with their vectors.<\/div>\n<div class=\"em-point\"><b>persist_directory<\/b> is the folder where the database is saved. <b>collection_name<\/b> is the name of this collection inside Chroma.<\/div>\n<div class=\"em-point\"><b>The same embedding model is used later to embed the question.<\/b> Only then can the question and the chunks be compared.<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c4\" id=\"first-run-and-next-run\">First Run and Next Run<\/h2>\n<p>Building the knowledge base takes time and costs embedding calls. So the app does it only once.<\/p>\n<figure class=\"visual\"><div class=\"hl\" data-x=\"1\"><pre><span class=\"k\">if<\/span> <span class=\"ow\">not<\/span> <span class=\"n\">os<\/span><span class=\"o\">.<\/span><span class=\"n\">path<\/span><span class=\"o\">.<\/span><span class=\"n\">exists<\/span><span class=\"p\">(<\/span><span class=\"n\">DB_DIR<\/span><span class=\"p\">):<\/span>\n    <span class=\"c1\"># first run: load, split, embed and store<\/span>\n    <span class=\"o\">...<\/span>\n<span class=\"k\">else<\/span><span class=\"p\">:<\/span>\n    <span class=\"n\">vector_store<\/span> <span class=\"o\">=<\/span> <span class=\"n\">Chroma<\/span><span class=\"p\">(<\/span>\n        <span class=\"n\">persist_directory<\/span><span class=\"o\">=<\/span><span class=\"n\">DB_DIR<\/span><span class=\"p\">,<\/span>\n        <span class=\"n\">embedding_function<\/span><span class=\"o\">=<\/span><span class=\"n\">embeddingModel<\/span><span class=\"p\">,<\/span>\n        <span class=\"n\">collection_name<\/span><span class=\"o\">=<\/span><span class=\"n\">COLLECTION_NAME<\/span><span class=\"p\">,<\/span>\n    <span class=\"p\">)<\/span><\/pre><\/div>\n<div class=\"bnt rt4 three\" style=\"grid-template-columns: repeat(2, 1fr)\"><div class=\"bnt-t c3\"><div class=\"bnt-h\">First run<\/div><div class=\"bnt-b\">No saved database yet<\/div><div class=\"bnt-p\">The app loads, splits, embeds and stores. The database is saved in the folder.<\/div><\/div><div class=\"bnt-t c1\"><div class=\"bnt-h\">Next runs<\/div><div class=\"bnt-b\">The folder exists<\/div><div class=\"bnt-p\">The app only opens the saved database. No embedding calls, so it starts fast.<\/div><\/div><\/div><div class=\"em-point\"><b>To build the database again,<\/b> delete the folder.<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c5\" id=\"retrieve-the-closest-chunks\">Retrieve the Closest Chunks<\/h2>\n<p>The question is turned into a vector, and the store returns the chunks that are closest to it.<\/p>\n<figure class=\"visual\"><div class=\"hl\" data-x=\"1\"><pre><span class=\"n\">user_question<\/span> <span class=\"o\">=<\/span> <span class=\"s2\">\"what is main advantage of Retrieval-Augmented Generation?\"<\/span>\n<span class=\"n\">retrieved_docs<\/span><span class=\"o\">=<\/span> <span class=\"n\">vector_store<\/span><span class=\"o\">.<\/span><span class=\"n\">similarity_search<\/span><span class=\"p\">(<\/span><span class=\"n\">query<\/span><span class=\"o\">=<\/span><span class=\"n\">user_question<\/span><span class=\"p\">,<\/span><span class=\"n\">k<\/span><span class=\"o\">=<\/span><span class=\"mi\">3<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">context_text<\/span> <span class=\"o\">=<\/span> <span class=\"s2\">\"<\/span><span class=\"se\">\\n\\n<\/span><span class=\"s2\">\"<\/span><span class=\"o\">.<\/span><span class=\"n\">join<\/span><span class=\"p\">([<\/span><span class=\"n\">doc<\/span><span class=\"o\">.<\/span><span class=\"n\">page_content<\/span> <span class=\"k\">for<\/span> <span class=\"n\">doc<\/span> <span class=\"ow\">in<\/span> <span class=\"n\">retrieved_docs<\/span><span class=\"p\">])<\/span><\/pre><\/div>\n<div class=\"em-point\"><b>similarity_search<\/b> embeds the question and compares it with the stored vectors. It returns the <b>k<\/b> closest chunks. Here <code>k=3<\/code>, so three chunks come back.<\/div>\n<div class=\"em-point\"><b>context_text<\/b> joins the text of those chunks into one block.<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c1\" id=\"augment-and-generate\">Augment and Generate<\/h2>\n<p>The chunks and the question go into a prompt, and the LLM answers from them.<\/p>\n<figure class=\"visual\"><div class=\"bnt rt4 three\" style=\"grid-template-columns: repeat(2, 1fr)\"><div class=\"bnt-t c3\"><div class=\"bnt-h\">System message<\/div><div class=\"bnt-b\">The rule for the LLM<\/div><div class=\"bnt-p\">You are a helpful AI assistant. Answer the user's question ONLY based on the provided context. If the answer cannot be found in the context, say 'I cannot find the answer in the provided documents.'<\/div><\/div><div class=\"bnt-t c4\"><div class=\"bnt-h\">Human message<\/div><div class=\"bnt-b\">The chunks and the question<\/div><div class=\"bnt-p\"><code>Context:<\/code> the chunks<br><code>Question:<\/code> the user's question<\/div><\/div><\/div><div class=\"hl\" data-x=\"1\"><pre><span class=\"n\">model<\/span> <span class=\"o\">=<\/span> <span class=\"n\">init_chat_model<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"mistralai:open-mistral-nemo\"<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">rag_chain<\/span> <span class=\"o\">=<\/span> <span class=\"n\">rag_prompt<\/span> <span class=\"o\">|<\/span> <span class=\"n\">model<\/span> <span class=\"o\">|<\/span> <span class=\"n\">StrOutputParser<\/span><span class=\"p\">()<\/span>\n<span class=\"n\">response<\/span> <span class=\"o\">=<\/span> <span class=\"n\">rag_chain<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">({<\/span><span class=\"s2\">\"context\"<\/span><span class=\"p\">:<\/span><span class=\"n\">context_text<\/span> <span class=\"p\">,<\/span> <span class=\"s2\">\"question\"<\/span><span class=\"p\">:<\/span><span class=\"n\">user_question<\/span><span class=\"p\">})<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">response<\/span><span class=\"p\">)<\/span><\/pre><\/div>\n<div class=\"em-point\"><b>The system message is the key.<\/b> It tells the LLM to answer only from the context. If the answer is not there, the LLM says so, and does not guess.<\/div>\n<div class=\"em-point\"><b>The chain<\/b> is the prompt, then the model, then the parser. You built chains like this in the LCEL lessons.<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c2\" id=\"things-to-try\">Things to Try<\/h2>\n<p>Run the app and change one thing at a time.<\/p>\n<figure class=\"visual\"><div class=\"bnt rt4 three\" style=\"grid-template-columns: repeat(3, 1fr)\"><div class=\"bnt-t c3\"><div class=\"bnt-h\">Change k<\/div><div class=\"bnt-b\">How many chunks<\/div><div class=\"bnt-p\">Try a smaller and a bigger <code>k<\/code>. Too few chunks and the answer may be missing. Too many add noise and cost.<\/div><\/div><div class=\"bnt-t c1\"><div class=\"bnt-h\">Change the question<\/div><div class=\"bnt-b\">Ask something else<\/div><div class=\"bnt-p\">Ask about another part of the document and see which chunks come back.<\/div><\/div><div class=\"bnt-t c4\"><div class=\"bnt-h\">Ask what is not there<\/div><div class=\"bnt-b\">A question the document does not answer<\/div><div class=\"bnt-p\">The LLM replies: I cannot find the answer in the provided documents.<\/div><\/div><\/div><\/figure>\n<hr />\n<h2 class=\"c3\" id=\"other-embedding-models-and-vector-stores\">Other Embedding Models and Vector Stores<\/h2>\n<p>Chroma and Mistral are one choice. These are others.<\/p>\n<figure class=\"visual\"><div class=\"em-tbl ck-tbl\"><table>\n<tr><th>Embedding model<\/th><th>Package<\/th><th>Note<\/th><\/tr>\n<tr class=\"hi\"><td>mistral-embed<\/td><td><code>langchain-mistralai<\/code><\/td><td>free tier. Makes vectors of 1024 numbers.<\/td><\/tr>\n<tr><td>gemini-embedding-001<\/td><td><code>langchain-google-genai<\/code><\/td><td>free tier<\/td><\/tr>\n<tr><td>sentence-transformers/all-MiniLM-L6-v2<\/td><td><code>langchain-huggingface<\/code><\/td><td>free, runs on your own computer<\/td><\/tr>\n<\/table><\/div>\n<div class=\"em-tbl ck-tbl\"><table>\n<tr><th>Vector store<\/th><th>Package<\/th><th>Note<\/th><\/tr>\n<tr class=\"hi\"><td>Chroma<\/td><td><code>langchain-chroma<\/code><\/td><td>saves to a local folder<\/td><\/tr>\n<tr><td>FAISS<\/td><td><code>faiss-cpu<\/code><\/td><td>fast, in memory<\/td><\/tr>\n<tr><td>Pinecone, Qdrant, Weaviate<\/td><td>their own packages<\/td><td>in the cloud, for production<\/td><\/tr>\n<\/table><\/div>\n<\/figure>\n<hr /><div class=\"sc-head code-head\">Code<\/div><details class=\"codecard\"><summary><span class=\"cc-t\">Simple RAG with Chroma and Mistral<\/span><span class=\"cc-f\">01_simple_rag.py · 63 lines<\/span><span class=\"cc-show\">Show code<\/span><\/summary><div class=\"hl\"><table class=\"hltable\"><tr><td class=\"linenos\"><div class=\"linenodiv\"><pre><span class=\"normal\"> 1<\/span>\n<span class=\"normal\"> 2<\/span>\n<span class=\"normal\"> 3<\/span>\n<span class=\"normal\"> 4<\/span>\n<span class=\"normal\"> 5<\/span>\n<span class=\"normal\"> 6<\/span>\n<span class=\"normal\"> 7<\/span>\n<span class=\"normal\"> 8<\/span>\n<span class=\"normal\"> 9<\/span>\n<span class=\"normal\">10<\/span>\n<span class=\"normal\">11<\/span>\n<span class=\"normal\">12<\/span>\n<span class=\"normal\">13<\/span>\n<span class=\"normal\">14<\/span>\n<span class=\"normal\">15<\/span>\n<span class=\"normal\">16<\/span>\n<span class=\"normal\">17<\/span>\n<span class=\"normal\">18<\/span>\n<span class=\"normal\">19<\/span>\n<span class=\"normal\">20<\/span>\n<span class=\"normal\">21<\/span>\n<span class=\"normal\">22<\/span>\n<span class=\"normal\">23<\/span>\n<span class=\"normal\">24<\/span>\n<span class=\"normal\">25<\/span>\n<span class=\"normal\">26<\/span>\n<span class=\"normal\">27<\/span>\n<span class=\"normal\">28<\/span>\n<span class=\"normal\">29<\/span>\n<span class=\"normal\">30<\/span>\n<span class=\"normal\">31<\/span>\n<span class=\"normal\">32<\/span>\n<span class=\"normal\">33<\/span>\n<span class=\"normal\">34<\/span>\n<span class=\"normal\">35<\/span>\n<span class=\"normal\">36<\/span>\n<span class=\"normal\">37<\/span>\n<span class=\"normal\">38<\/span>\n<span class=\"normal\">39<\/span>\n<span class=\"normal\">40<\/span>\n<span class=\"normal\">41<\/span>\n<span class=\"normal\">42<\/span>\n<span class=\"normal\">43<\/span>\n<span class=\"normal\">44<\/span>\n<span class=\"normal\">45<\/span>\n<span class=\"normal\">46<\/span>\n<span class=\"normal\">47<\/span>\n<span class=\"normal\"
