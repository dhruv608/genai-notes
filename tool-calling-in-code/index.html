<script>window.PAGE = {"id": "n15_2", "root": "../", "lesson": {"id": "n15_2", "title": "Tool Calling in Code", "short": "Tool Calling in Code", "unit": "Unit 2", "unitName": "Build with LangChain", "pos": 15, "of": 15, "sub": "", "info": "Make a tool with @tool, the five-step tool-calling flow, and Tavily web search", "html": "<h2 class=\"c5\" id=\"5-make-a-tool\">1. Make a Tool<\/h2>\n<p>Put <code>@tool<\/code> above a normal function. The docstring tells the LLM when to use it, and the type hints tell it what to send.<\/p>\n<figure class=\"visual\"><div class=\"hl\" data-x=\"1\"><pre><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_core.tools<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">tool<\/span>\n\n<span class=\"nd\">@tool<\/span>\n<span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">add<\/span><span class=\"p\">(<\/span><span class=\"n\">a<\/span><span class=\"p\">:<\/span> <span class=\"nb\">int<\/span><span class=\"p\">,<\/span> <span class=\"n\">b<\/span><span class=\"p\">:<\/span> <span class=\"nb\">int<\/span><span class=\"p\">)<\/span> <span class=\"o\">-&gt;<\/span> <span class=\"nb\">int<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">    <\/span><span class=\"sd\">\"\"\"Add two numbers together.\"\"\"<\/span>\n    <span class=\"k\">return<\/span> <span class=\"n\">a<\/span> <span class=\"o\">+<\/span> <span class=\"n\">b<\/span>\n\n<span class=\"nd\">@tool<\/span>\n<span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">multiply<\/span><span class=\"p\">(<\/span><span class=\"n\">a<\/span><span class=\"p\">:<\/span> <span class=\"nb\">int<\/span><span class=\"p\">,<\/span> <span class=\"n\">b<\/span><span class=\"p\">:<\/span> <span class=\"nb\">int<\/span><span class=\"p\">)<\/span> <span class=\"o\">-&gt;<\/span> <span class=\"nb\">int<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">    <\/span><span class=\"sd\">\"\"\"Multiply two numbers together.\"\"\"<\/span>\n    <span class=\"k\">return<\/span> <span class=\"n\">a<\/span> <span class=\"o\">*<\/span> <span class=\"n\">b<\/span><\/pre><\/div>\n<div class=\"px\">\n  <div class=\"px-r\"><span>multiply.name<\/span><div><code>multiply<\/code><\/div><\/div>\n  <div class=\"px-r\"><span>multiply.description<\/span><div><code>Multiply two numbers together.<\/code><\/div><\/div>\n  <div class=\"px-r hi\"><span>multiply.args<\/span><div><code>{'a': {'title': 'A', 'type': 'integer'}, 'b': {'title': 'B', 'type': 'integer'}}<\/code><\/div><\/div>\n<\/div>\n<div class=\"tc-n\">This is what the LLM reads: the name, the description and the arguments.<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c1\" id=\"6-one-tool-call-it-directly\">2. One Tool: Call It Directly<\/h2>\n<p>The LLM answers with a tool call: the tool name and the arguments. If you have <strong>one<\/strong> tool, you do not need to look anything up. Call the tool yourself with those arguments.<\/p>\n<figure class=\"visual\"><div class=\"hl\" data-x=\"1\"><pre><span class=\"n\">tool_call<\/span> <span class=\"o\">=<\/span> <span class=\"n\">ai_message<\/span><span class=\"o\">.<\/span><span class=\"n\">tool_calls<\/span><span class=\"p\">[<\/span><span class=\"mi\">0<\/span><span class=\"p\">]<\/span>\n<span class=\"n\">tool_output<\/span> <span class=\"o\">=<\/span> <span class=\"n\">multiply<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">(<\/span><span class=\"n\">tool_call<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"args\"<\/span><span class=\"p\">])<\/span><\/pre><\/div>\n<div class=\"px\">\n  <div class=\"px-r\"><span>The LLM sends<\/span><div><code>[{'name': 'multiply', 'args': {'a': 45, 'b': 12}, 'id': '&hellip;'}]<\/code><\/div><\/div>\n  <div class=\"px-r\"><span>We call<\/span><div><code>multiply.invoke({'a': 45, 'b': 12})<\/code><\/div><\/div>\n  <div class=\"px-r hi\"><span>The tool returns<\/span><div><code>540<\/code><\/div><\/div>\n<\/div>\n<div class=\"tc-n\">Example values. This is a short version of the loop in your file, for one tool. Your file works for many tools, as you see next.<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c2\" id=\"7-many-tools-a-dictionary\">3. Many Tools: A Dictionary<\/h2>\n<p>With many tools, the LLM can ask for any of them, and it only sends the <strong>name<\/strong> as a string. So we keep our tools in a <strong>dictionary<\/strong>: the name is the key, the tool is the value.<\/p>\n<figure class=\"visual\"><div class=\"hl\" data-x=\"1\"><pre><span class=\"n\">tools_by_name<\/span> <span class=\"o\">=<\/span> <span class=\"p\">{}<\/span>\n<span class=\"k\">for<\/span> <span class=\"n\">t<\/span> <span class=\"ow\">in<\/span> <span class=\"n\">tools<\/span><span class=\"p\">:<\/span>\n    <span class=\"n\">tools_by_name<\/span><span class=\"p\">[<\/span><span class=\"n\">t<\/span><span class=\"o\">.<\/span><span class=\"n\">name<\/span><span class=\"p\">]<\/span> <span class=\"o\">=<\/span> <span class=\"n\">t<\/span><\/pre><\/div>\n<div class=\"px\">\n  <div class=\"px-r\"><span>What it does<\/span><div>For every tool <code>t<\/code> in the list, it saves the tool under its own name.<\/div><\/div>\n  <div class=\"px-r hi\"><span>The result<\/span><div><code>{'add': add, 'multiply': multiply}<\/code> the key is the tool name, the value is the tool itself.<\/div><\/div>\n<\/div>\n<div class=\"tc-n\">Why? So that when the LLM gives us the string <code>'multiply'<\/code>, we can get the multiply tool with <code>tools_by_name['multiply']<\/code>.<\/div>\n<div class=\"shortway\"><span class=\"shortway-l\">A shorter way<\/span><div class=\"hl\" data-x=\"1\"><pre><span class=\"n\">tools_by_name<\/span> <span class=\"o\">=<\/span> <span class=\"p\">{<\/span><span class=\"n\">t<\/span><span class=\"o\">.<\/span><span class=\"n\">name<\/span><span class=\"p\">:<\/span> <span class=\"n\">t<\/span> <span class=\"k\">for<\/span> <span class=\"n\">t<\/span> <span class=\"ow\">in<\/span> <span class=\"n\">tools<\/span><span class=\"p\">}<\/span><\/pre><\/div><span class=\"shortway-n\">Does the same thing in one line. This is the line in your file.<\/span><\/div>\n<\/figure>\n<hr />\n<h2 class=\"c3\" id=\"8-many-tools-find-the-tool-by-name\">4. Many Tools: Find the Tool by Name<\/h2>\n<p>We use the name the LLM sent to find the tool in the dictionary, then run it. The LLM can ask for more than one tool call in one answer, so we loop over them.<\/p>\n<figure class=\"visual\"><div class=\"hl\" data-x=\"1\"><pre><span class=\"n\">tools_by_name<\/span> <span class=\"o\">=<\/span> <span class=\"p\">{<\/span><span class=\"n\">t<\/span><span class=\"o\">.<\/span><span class=\"n\">name<\/span><span class=\"p\">:<\/span> <span class=\"n\">t<\/span> <span class=\"k\">for<\/span> <span class=\"n\">t<\/span> <span class=\"ow\">in<\/span> <span class=\"n\">tools<\/span><span class=\"p\">}<\/span>\n\n<span class=\"k\">for<\/span> <span class=\"n\">tool_call<\/span> <span class=\"ow\">in<\/span> <span class=\"n\">ai_message<\/span><span class=\"o\">.<\/span><span class=\"n\">tool_calls<\/span><span class=\"p\">:<\/span>\n    <span class=\"c1\"># Look up the actual function from the dictionary<\/span>\n    <span class=\"n\">selected_tool<\/span> <span class=\"o\">=<\/span> <span class=\"n\">tools_by_name<\/span><span class=\"p\">[<\/span><span class=\"n\">tool_call<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"name\"<\/span><span class=\"p\">]]<\/span>\n    \n    <span class=\"c1\"># Execute the tool<\/span>\n    <span class=\"n\">tool_output<\/span> <span class=\"o\">=<\/span> <span class=\"n\">selected_tool<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">(<\/span><span class=\"n\">tool_call<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"args\"<\/span><span class=\"p\">])<\/span>\n\n    <span class=\"c1\"># Wrap result in ToolMessage<\/span>\n    <span class=\"n\">messages<\/span><span class=\"o\">.<\/span><span class=\"n\">append<\/span><span class=\"p\">(<\/span><span class=\"n\">ToolMessage<\/span><span class=\"p\">(<\/span>\n        <span class=\"n\">content<\/span><span class=\"o\">=<\/span><span class=\"nb\">str<\/span><span class=\"p\">(<\/span><span class=\"n\">tool_output<\/span><span class=\"p\">),<\/span>\n        <span class=\"n\">tool_call_id<\/span><span class=\"o\">=<\/span><span class=\"n\">tool_call<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"id\"<\/span><span class=\"p\">]<\/span>\n    <span class=\"p\">))<\/span><\/pre><\/div>\n<div class=\"px\">\n  <div class=\"px-r\"><span>The LLM sends<\/span><div>The tool name, as a string: <code>tool_call[\"name\"]<\/code> is <code>'multiply'<\/code><\/div><\/div>\n  <div class=\"px-r hi\"><span>We find the tool<\/span><div><code>tools_by_name[\"multiply\"]<\/code> gives the <code>multiply<\/code> tool. The tool name and the function name are the same, so the lookup just works.<\/div><\/div>\n<\/div>\n<div class=\"tc-n\">Example values. After the lookup we run the tool with the arguments the LLM gave: <code>selected_tool.invoke(tool_call[\"args\"])<\/code>.<\/div>\n<\/figure>\n<hr />\n<h2 class=\"c4\" id=\"9-a-ready-made-tool-web-search\">5. A Ready-Made Tool: Web Search<\/h2>\n<p>You do not have to write every tool. <code>TavilySearch<\/code> is a ready-made web search tool. The tool call and its result go into the <code>MessagesPlaceholder<\/code> slot, like chat history.<\/p>\n<figure class=\"visual\"><div class=\"hl\" data-x=\"1\"><pre><span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain_tavily<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">TavilySearch<\/span>\n\n<span class=\"n\">web_search_tool<\/span> <span class=\"o\">=<\/span> <span class=\"n\">TavilySearch<\/span><span class=\"p\">(<\/span><span class=\"n\">max_results<\/span><span class=\"o\">=<\/span><span class=\"mi\">2<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">tools<\/span> <span class=\"o\">=<\/span> <span class=\"p\">[<\/span><span class=\"n\">web_search_tool<\/span><span class=\"p\">]<\/span>\n\n<span class=\"n\">llm<\/span> <span class=\"o\">=<\/span> <span class=\"n\">init_chat_model<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"mistralai:open-mistral-nemo\"<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">llm_with_tools<\/span> <span class=\"o\">=<\/span> <span class=\"n\">llm<\/span><span class=\"o\">.<\/span><span class=\"n\">bind_tools<\/span><span class=\"p\">(<\/span><span class=\"n\">tools<\/span><span class=\"p\">)<\/span><\/pre><\/div>\n<div class=\"px\">\n  <div class=\"px-r\"><span>The question<\/span><div>What are the latest key features announced in Python 3.13 or 3.14?<\/div><\/div>\n  <div class=\"px-r\"><span>The LLM asks<\/span><div><code>{'name': 'tavily_search', 'args': {'query': 'Python 3.13 new features'}}<\/code><\/div><\/div>\n  <div class=\"px-r\"><span>The tool returns<\/span><div><code>{'results': [{'title': \"What's New In Python 3.13\", 'url': 'https://docs.python.org/3/whatsnew/3.13.html', &hellip;}, &hellip;]}<\/code><\/div><\/div>\n  <div class=\"px-r hi\"><span>The final answer<\/span><div><div class=\"aib\">Python 3.13 adds a better interactive interpreter, an experimental free-threaded mode without the GIL, and an experimental JIT compiler.<\/div><\/div><\/div>\n<\/div>\n<div class=\"tc-n\">Example output. Your run will show different search results. You need your own free Tavily key.<\/div>\n<\/figure>\n<hr />\n<div class=\"docs\"><span class=\"docs-l\">LangChain docs<\/span><a href=\"https://reference.langchain.com/python/langchain_core/tools/convert/tool\" target=\"_blank\" rel=\"noopener\">@tool<\/a><a href=\"https://reference.langchain.com/python/langchain_core/messages/tool/ToolMessage\" target=\"_blank\" rel=\"noopener\">ToolMessage<\/a><a href=\"https://docs.langchain.com/oss/python/integrations/tools/tavily_search\" target=\"_blank\" rel sage<\/span>\n        <span class=\"n\">tool_messages_history<\/span><span class=\"o\">.<\/span><span class=\"n\">append<\/span><span class=\"p\">(<\/span>\n            <span class=\"n\">ToolMessage<\/span><span class=\"p\">(<\/span>\n                <span class=\"n\">content<\/span><span class=\"o\">=<\/span><span class=\"nb\">str<\/span><span class=\"p\">(<\/span><span class=\"n\">tool_output<\/span><span class=\"p\">),<\/span>\n                <span class=\"n\">tool_call_id<\/span><span class=\"o\">=<\/span><span class=\"n\">tool_call<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"id\"<\/span><span class=\"p\">]<\/span>\n            <span class=\"p\">)<\/span>\n        <span class=\"p\">)<\/span>\n    <span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"<\/span><span class=\"se\">\\n<\/span><span class=\"s2\">2. Tavily Tool Executed Successfully!\"<\/span><span class=\"p\">)<\/span>\n\n\n<span class=\"c1\"># ====================================================================<\/span>\n<span class=\"c1\"># 6. STEP 3: FINAL GROUNDED ANSWER VIA PROMPT TEMPLATE<\/span>\n<span class=\"c1\"># ====================================================================<\/span>\n<span class=\"c1\"># Re-invoke chain with populated tool messages!<\/span>\n<span class=\"n\">final_response<\/span> <span class=\"o\">=<\/span> <span class=\"n\">chain<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">({<\/span>\n    <span class=\"s2\">\"question\"<\/span><span class=\"p\">:<\/span> <span class=\"n\">user_question<\/span><span class=\"p\">,<\/span>\n    <span class=\"s2\">\"tool_messages\"<\/span><span class=\"p\">:<\/span> <span class=\"n\">tool_messages_history<\/span>\n<span class=\"p\">})<\/span>\n\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"<\/span><span class=\"se\">\\n<\/span><span class=\"s2\">3. Final Grounded Answer from LLM:\"<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">final_response<\/span><span class=\"o\">.<\/span><span class=\"n\">content<\/span><span class=\"p\">)<\/span>\n<\/pre><\/div><\/td><\/tr><\/table><\/div>\n<\/details>", "toc": [{"id": "5-make-a-tool", "name": "5. Make a Tool"}, {"id": "6-one-tool-call-it-directly", "name": "6. One Tool: Call It Directly"}, {"id": "7-many-tools-a-dictionary", "name": "7. Many Tools: A Dictionary"}, {"id": "8-many-tools-find-the-tool-by-name", "name": "8. Many Tools: Find the Tool by Name"}, {"id": "9-a-ready-made-tool-web-search", "name": "9. A Ready-Made Tool: Web Search"}], "search": "", "slides": null, "slideCount": 0, "code": []}};</script>
