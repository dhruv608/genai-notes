<script>window.PAGE = {"id": "n26_1", "root": "../", "lesson": {"id": "n26_1", "title": "Building a Graph", "short": "Building a Graph", "unit": "Unit 4", "unitName": "Agents with LangGraph", "pos": 6, "of": 16, "sub": "", "info": "Why we describe the flow, then add_node, add_edge with START and END, and compile and invoke", "html": "<h2 class=\"c1\" id=\"the-problem-someone-must-run-the-steps-in-order\">The Problem: Someone Must Run the Steps in Order<\/h2>\n<p>We have a state and some node functions. Now, who decides which one runs first, and what comes next?<\/p>\n<figure class=\"visual\"><div class=\"px\">\n  <div class=\"px-r\"><span>The issue<\/span><div>We have three node functions and one state. They must run in the right order.<\/div><\/div>\n  <div class=\"px-r\"><span>The first try<\/span><div>Call them one by one in plain Python: the editor, then the scriptwriter, then the translator.<\/div><\/div>\n  <div class=\"px-r\"><span>Why it fails<\/span><div>It works for a straight line. But &ldquo;stop if approved, otherwise go back&rdquo; needs if-statements and loops that you must write and track yourself. And you cannot pause, save the state or draw the flow.<\/div><\/div>\n  <div class=\"px-r hi\"><span>The fix<\/span><div><b>Describe<\/b> the flow instead: list the nodes, and draw the arrows. LangGraph runs it for us.<\/div><\/div>\n<\/div><\/figure>\n<hr />\n<h2 class=\"c2\" id=\"add_node-give-each-function-a-name\">add_node: Give Each Function a Name<\/h2>\n<p>A graph starts as an empty blueprint. We give it the state, and then we add each node with a name.<\/p>\n<figure class=\"visual\"><div class=\"hl\" data-x=\"1\"><pre><span class=\"n\">graph<\/span> <span class=\"o\">=<\/span> <span class=\"n\">StateGraph<\/span><span class=\"p\">(<\/span><span class=\"n\">pipelinestate<\/span><span class=\"p\">)<\/span>\n\n<span class=\"n\">graph<\/span><span class=\"o\">.<\/span><span class=\"n\">add_node<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"editor\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">editor_node<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">graph<\/span><span class=\"o\">.<\/span><span class=\"n\">add_node<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"scriptwriter\"<\/span><span class=\"p\">,<\/span><span class=\"n\">scriptwriter_node<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">graph<\/span><span class=\"o\">.<\/span><span class=\"n\">add_node<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"translator\"<\/span><span class=\"p\">,<\/span><span class=\"n\">tranlator_node<\/span><span class=\"p\">)<\/span><\/pre><\/div>\n<div class=\"px\">\n  <div class=\"px-r\"><span>StateGraph(&hellip;)<\/span><div>A new, empty graph. It needs the state class, so it knows the keys.<\/div><\/div>\n  <div class=\"px-r\"><span>add_node(name, function)<\/span><div>Adds one node: a <b>name<\/b> and the function that does the work.<\/div><\/div>\n  <div class=\"px-r hi\"><span>The name<\/span><div>The arrows use the name, not the function. You will see this in the next section.<\/div><\/div>\n<\/div><\/figure>\n<hr />\n<h2 class=\"c3\" id=\"add_edge-draw-the-arrows\">add_edge: Draw the Arrows<\/h2>\n<blockquote class=\"def\"><span class=\"deflab\">Definition<\/span>\n<p><strong>START<\/strong> and <strong>END<\/strong> are two special names. The graph begins at START and stops at END.<\/p>\n<\/blockquote>\n<p>An edge is one arrow from one node to the next.<\/p>\n<figure class=\"visual\"><div class=\"hl\" data-x=\"1\"><pre><span class=\"n\">graph<\/span><span class=\"o\">.<\/span><span class=\"n\">add_edge<\/span><span class=\"p\">(<\/span><span class=\"n\">START<\/span><span class=\"p\">,<\/span><span class=\"s2\">\"editor\"<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">graph<\/span><span class=\"o\">.<\/span><span class=\"n\">add_edge<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"editor\"<\/span><span class=\"p\">,<\/span><span class=\"s2\">\"scriptwriter\"<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">graph<\/span><span class=\"o\">.<\/span><span class=\"n\">add_edge<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"scriptwriter\"<\/span><span class=\"p\">,<\/span><span class=\"s2\">\"translator\"<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">graph<\/span><span class=\"o\">.<\/span><span class=\"n\">add_edge<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"translator\"<\/span><span class=\"p\">,<\/span><span class=\"n\">END<\/span><span class=\"p\">)<\/span><\/pre><\/div>\n<div class=\"em-fig\"><svg class=\"em-svg\" viewBox=\"0 0 760 120\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"ga\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#9aa3a2\"/><\/marker><marker id=\"gb\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#c9583a\"/><\/marker><\/defs><circle cx=\"45.0\" cy=\"60.0\" r=\"22\" fill=\"#fff\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"45.0\" y=\"64.0\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#0e3b3a\">START<\/text><rect x=\"120.0\" y=\"41.0\" width=\"100\" height=\"38\" rx=\"9\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"170.0\" y=\"65.2\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">editor<\/text><rect x=\"265.0\" y=\"41.0\" width=\"140\" height=\"38\" rx=\"9\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"335.0\" y=\"65.2\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">scriptwriter<\/text><rect x=\"440.0\" y=\"41.0\" width=\"120\" height=\"38\" rx=\"9\" fill=\"#eef7f7\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"500.0\" y=\"65.2\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0e3b3a\">translator<\/text><circle cx=\"660.0\" cy=\"60.0\" r=\"22\" fill=\"#fff\" stroke=\"#1a5c5b\" stroke-width=\"1.6\"/><text x=\"660.0\" y=\"64.0\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#0e3b3a\">END<\/text><line x1=\"67.0\" y1=\"60.0\" x2=\"118.0\" y2=\"60.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><line x1=\"222.0\" y1=\"60.0\" x2=\"263.0\" y2=\"60.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><line x1=\"407.0\" y1=\"60.0\" x2=\"438.0\" y2=\"60.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><line x1=\"562.0\" y1=\"60.0\" x2=\"636.0\" y2=\"60.0\" stroke=\"#9aa3a2\" stroke-width=\"2\" marker-end=\"url(#ga)\"/><\/svg><\/div><div class=\"px\">\n  <div class=\"px-r\"><span>add_edge(from, to)<\/span><div>One line, one arrow. When <code>editor<\/code> finishes, <code>scriptwriter<\/code> runs next.<\/div><\/div>\n  <div class=\"px-r\"><span>The first edge<\/span><div>It starts at <code>START<\/code>. It says which node runs first.<\/div><\/div>\n  <div class=\"px-r hi\"><span>The last edge<\/span><div>It goes to <code>END<\/code>. It says where the graph stops.<\/div><\/div>\n<\/div><\/figure>\n<hr />\n<h2 class=\"c4\" id=\"compile-and-invoke-run-the-graph\">compile and invoke: Run the Graph<\/h2>\n<p>The blueprint cannot run yet. We <strong>compile<\/strong> it, and then we <strong>invoke<\/strong> it.<\/p>\n<figure class=\"visual\"><div class=\"hl\" data-x=\"1\"><pre><span class=\"n\">app<\/span> <span class=\"o\">=<\/span> <span class=\"n\">graph<\/span><span class=\"o\">.<\/span><span class=\"n\">compile<\/span><span class=\"p\">()<\/span>\n<span class=\"n\">result<\/span> <span class=\"o\">=<\/span> <span class=\"n\">app<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">({<\/span>\n    <span class=\"s2\">\"raw_input\"<\/span> <span class=\"p\">:<\/span><span class=\"s2\">\"AI agents are the future of tech. They can think, plan, and act on their own. LangGraph helps you build these agents with proper control and memory.\"<\/span>\n<span class=\"p\">})<\/span><\/pre><\/div>\n<div class=\"px\">\n  <div class=\"px-r\"><span>compile()<\/span><div>Checks the blueprint and turns it into an app you can run.<\/div><\/div>\n  <div class=\"px-r\"><span>invoke(&hellip;)<\/span><div>Give it the starting state. It runs every node in order and returns the <b>final state<\/b>, with all the keys filled.<\/div><\/div>\n  <div class=\"px-r hi\"><span>A Runnable<\/span><div>The compiled app is a Runnable, like the chains you built. So <code>invoke<\/code>, <code>stream<\/code> and <code>batch<\/code> all work.<\/div><\/div>\n<\/div><div class=\"em-point\"><b>To see the graph:<\/b> print <code>app.get_graph().draw_mermaid()<\/code> and paste the text at mermaid.live. It draws the same picture as above.<\/div>\n<div class=\"em-cap\">The code is from your <code>02_sequential.py<\/code>. The Mermaid tip is from your teaching plan.<\/div>\n<\/figure>\n", "toc": [{"id": "the-problem-someone-must-run-the-steps-in-order", "name": "The Problem: Someone Must Run the Steps in Order"}, {"id": "add_node-give-each-function-a-name", "name": "add_node: Give Each Function a Name"}, {"id": "add_edge-draw-the-arrows", "name": "add_edge: Draw the Arrows"}, {"id": "compile-and-invoke-run-the-graph", "name": "compile and invoke: Run the Graph"}], "search": "", "slides": null, "slideCount": 0, "code": []}};</script>
