<script>window.PAGE = {"id": "n04_1", "root": "../", "lesson": {"id": "n04_1", "title": "Calling Your First LLM", "short": "Calling Your First LLM", "unit": "Unit 1", "unitName": "Start Here: GenAI Basics", "pos": 6, "of": 7, "sub": "Your first call", "info": "Package and API key for each company, then call Gemini, Groq and Mistral", "html": "<h2 class=\"c1\" id=\"1-before-you-call-an-llm\">1. Before You Call an LLM<\/h2>\n<p><strong>Every LLM comes from a different company.<\/strong> OpenAI makes GPT, Anthropic makes Claude, Google makes Gemini, Mistral AI makes Mistral, and Groq runs open models.<\/p>\n<p>To use any of them from your code, you need two things:<\/p>\n<ol>\n<li>Its <mark class=\"hp\">package<\/mark>: the Python library you download with <code>pip install<\/code>.<\/li>\n<li>Its <mark class=\"hk\">API key<\/mark>: your secret password to that company's model.<\/li>\n<\/ol>\n<p>So for every company you use, you download its package and get its API key. Here they are:<\/p>\n<figure class=\"visual\"><div class=\"exl prov\">\n  <div class=\"exl-h\"><span>Company<\/span><span>Install the package<\/span><span>Get the API key<\/span><span>Documentation<\/span><\/div>\n  <div class=\"exl-r\"><b>OpenAI <small>GPT<\/small><\/b><span class=\"in\">pip install openai<\/span><span class=\"d\">platform.openai.com<\/span><span class=\"d\"><a href=\"https://developers.openai.com/api/docs\" target=\"_blank\" rel=\"noopener\">developers.openai.com/api/docs ↗<\/a><\/span><\/div>\n  <div class=\"exl-r\"><b>Anthropic <small>Claude<\/small><\/b><span class=\"in\">pip install anthropic<\/span><span class=\"d\">console.anthropic.com<\/span><span class=\"d\"><a href=\"https://platform.claude.com/docs/en/home\" target=\"_blank\" rel=\"noopener\">platform.claude.com/docs ↗<\/a><\/span><\/div>\n  <div class=\"exl-r\"><b>Google <small>Gemini<\/small><\/b><span class=\"in\">pip install google-genai<\/span><span class=\"d\">aistudio.google.com<\/span><span class=\"d\"><a href=\"https://ai.google.dev/gemini-api/docs\" target=\"_blank\" rel=\"noopener\">ai.google.dev/gemini-api/docs ↗<\/a><\/span><\/div>\n  <div class=\"exl-r\"><b>Mistral AI <small>Mistral<\/small><\/b><span class=\"in\">pip install mistralai<\/span><span class=\"d\">console.mistral.ai<\/span><span class=\"d\"><a href=\"https://docs.mistral.ai\" target=\"_blank\" rel=\"noopener\">docs.mistral.ai ↗<\/a><\/span><\/div>\n  <div class=\"exl-r\"><b>Groq <small>open models<\/small><\/b><span class=\"in\">pip install groq<\/span><span class=\"d\">console.groq.com<\/span><span class=\"d\"><a href=\"https://console.groq.com/docs/overview\" target=\"_blank\" rel=\"noopener\">console.groq.com/docs ↗<\/a><\/span><\/div>\n<\/div>\n<\/figure>\n<div class=\"sc-head code-head\">Code<\/div><details class=\"codecard\"><summary><span class=\"cc-t\">Calling Gemini<\/span><span class=\"cc-f\">callinggemini.py · 17 lines<\/span><span class=\"cc-show\">Show code<\/span><\/summary><div class=\"cc-install\">First install the package: <code>pip install google-genai python-dotenv<\/code><\/div><div class=\"hl\"><table class=\"hltable\"><tr><td class=\"linenos\"><div class=\"linenodiv\"><pre><span class=\"normal\"> 1<\/span>\n<span class=\"normal\"> 2<\/span>\n<span class=\"normal\"> 3<\/span>\n<span class=\"normal\"> 4<\/span>\n<span class=\"normal\"> 5<\/span>\n<span class=\"normal\"> 6<\/span>\n<span class=\"normal\"> 7<\/span>\n<span class=\"normal\"> 8<\/span>\n<span class=\"normal\"> 9<\/span>\n<span class=\"normal\">10<\/span>\n<span class=\"normal\">11<\/span>\n<span class=\"normal\">12<\/span>\n<span class=\"normal\">13<\/span>\n<span class=\"normal\">14<\/span><\/pre><\/div><\/td><td class=\"code\"><div><pre><span><\/span><span class=\"kn\">import<\/span><span class=\"w\"> <\/span><span class=\"nn\">os<\/span>\n\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">dotenv<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">load_dotenv<\/s "role\"<\/span><span class=\"p\">:<\/span> <span class=\"s2\">\"user\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"content\"<\/span><span class=\"p\">:<\/span> <span class=\"s2\">\"What is the capital of India?\"<\/span><span class=\"p\">}],<\/span>\n<span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">response<\/span><span class=\"o\">.<\/span><span class=\"n\">choices<\/span><span class=\"p\">[<\/span><span class=\"mi\">0<\/span><span class=\"p\">]<\/span><span class=\"o\">.<\/span><span class=\"n\">message<\/span><span class=\"o\">.<\/span><span class=\"n\">content<\/span><span class=\"p\">)<\/span>\n\n\n<span class=\"c1\"># Models that work on the free plan:<\/span>\n<span class=\"c1\"># openai/gpt-oss-20b<\/span>\n<\/pre><\/div><\/td><\/tr><\/table><\/div>\n<\/details><details class=\"codecard\"><summary><span class=\"cc-t\">Calling Mistral<\/span><span class=\"cc-f\">callingmistral.py · 19 lines<\/span><span class=\"cc-show\">Show code<\/span><\/summary><div class=\"cc-install\">First install the package: <code>pip install mistralai python-dotenv<\/code><\/div><div class=\"hl\"><table class=\"hltable\"><tr><td class=\"linenos\"><div class=\"linenodiv\"><pre><span class=\"normal\"> 1<\/span>\n<span class=\"normal\"> 2<\/span>\n<span class=\"normal\"> 3<\/span>\n<span class=\"normal\"> 4<\/span>\n<span class=\"normal\"> 5<\/span>\n<span class=\"normal\"> 6<\/span>\n<span class=\"normal\"> 7<\/span>\n<span class=\"normal\"> 8<\/span>\n<span class=\"normal\"> 9<\/span>\n<span class=\"normal\">10<\/span>\n<span class=\"normal\">11<\/span>\n<span class=\"normal\">12<\/span>\n<span class=\"normal\">13<\/span>\n<span class=\"normal\">14<\/span>\n<span class=\"normal\">15<\/span>\n<span class=\"normal\">16<\/span>\n<span class=\"normal\">17<\/span>\n<span class=\"normal\">18<\/span><\/pre><\/div><\/td><td class=\"code\"><div><pre><span><\/span><span class=\"kn\">import<\/span><span class=\"w\"> <\/span><s
