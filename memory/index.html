<script>window.PAGE = {"id": "n30", "root": "../", "lesson": {"id": "n30", "title": "Memory", "short": "Memory", "unit": "Unit 4", "unitName": "Agents with LangGraph", "pos": 14, "of": 16, "sub": "Memory & humans", "info": "Persisting state across turns", "html": "<h2 class=\"c1\" id=\"1-architectural-purpose-mental-model\">1. Architectural Purpose &amp; Mental Model<\/h2>\n<p>In standard LLM chains, state is transient: as soon as the script finishes running, the conversation history vanishes from RAM.\nFor real-world chatbots, customer service copilots, and multi-turn assistants, systems require <strong>State Persistence<\/strong>:<\/p>\n<ol>\n<li>The conversation history must automatically accumulate without manual array appending in application code.<\/li>\n<li>The graph state must be saved to a persistent store (RAM, SQLite, PostgreSQL) after every execution turn.<\/li>\n<li>Multi-user conversations must be isolated cleanly using session identifiers (<strong><code>thread_id<\/code><\/strong>).<\/li>\n<\/ol>\n<hr />\n<h2 class=\"c2\" id=\"2-architecture-diagram\">2. Architecture Diagram<\/h2>\n<figure class=\"diagram\"><pre class=\"mermaid\">flowchart LR\n  START([&quot;START&quot;]) --&gt; C[&quot;Chatbot node&quot;] --&gt; END([&quot;END&quot;])\n  C -.-&gt; M[(&quot;MemorySaver checkpointer&lt;br/&gt;&lt;small&gt;saves state after every turn&lt;br/&gt;indexed by thread_id&lt;/small&gt;&quot;)]\nclassDef term fill:#0e3b3a,stroke:#0e3b3a,color:#ffffff,font-weight:bold\nclassDef gate fill:#fdf1ec,stroke:#c9583a,color:#7a2e1a\nclassDef store fill:#f5f5f4,stroke:#57534e,color:#292524\nclassDef c0 fill:#d4ecea,stroke:#2a7a79,color:#0e3b3a\nclassDef c1 fill:#fbe5dc,stroke:#c9583a,color:#7a2e1a\nclassDef c2 fill:#e3f5ee,stroke:#4aa58a,color:#14463a\nclassDef c3 fill:#f6f4f0,stroke:#a7a29a,color:#3f3b35\nclassDef c4 fill:#eef7f7,stroke:#1a5c5b,color:#0e3b3a\nclass START term\nclass C c0\nclass END term\nclass M store<\/pre><div class=\"dg-ascii\" hidden><div class=\"hl\"><pre><span><\/span><code>+-----------------------------------------------------------------------------------------+\n| PERSISTENT CONVERSATIONAL AGENT WITH CHECKPOINTER                                       |\n+-----------------------------------------------------------------------------------------+\n|                                                                                         |\n| [START] ───────────&gt; [Chatbot Node] ───────────&gt; [END]                                  |\n|                            │                                                            |\n|                            ▼                                                            |\n|                 ┌────────────────────────────────────────────────────────┐              |\n|                 │ MemorySaver Checkpointer                               │              |\n|                 │ - Snapshots State after every turn                     │              |\n|                 │ - Indexed by thread_id: {\"configurable\": {\"thread_id\"}}│              |\n|                 └────────────────────────────────────────────────────────┘              |\n+-----------------------------------------------------------------------------------------+\n<\/code><\/pre><\/div><\/div><\/figure>\n\n<hr />\n<h2 class=\"c3\" id=\"3-the-two-core-mechanics\">3. The Two Core Mechanics<\/h2>\n<h3 id=\"a-the-add_messages-reducer\">A. The <code>add_messages<\/code> Reducer<\/h3>\n<p>Instead of overwriting the <code>messages<\/code> key, the <code>add_messages<\/code> reducer automatically:<\/p>\n<ul>\n<li>Appends new incoming <code>HumanMessage<\/code> and <code>AIMessage<\/code> objects to the list.<\/li>\n<li>Replaces messages if an update contains an identical message <code>id<\/code> (enabling message editing).<\/li>\n<\/ul>\n<h3 id=\"b-the-checkpointer-thread_id\">B. The Checkpointer &amp; <code>thread_id<\/code><\/h3>\n<p>When compiling a graph with <code>compile(checkpointer=MemorySaver())<\/code>, every invocation requires a configuration dictionary:<\/p>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"n\">config<\/span> <span class=\"o\">=<\/span> <span class=\"p\">{<\/span><span class=\"s2\">\"configurable\"<\/span><span class=\"p\">:<\/span> <span class=\"p\">{<\/span><span class=\"s2\">\"thread_id\"<\/span><span class=\"p\">:<\/span> <span class=\"s2\">\"user_dhruv_session\"<\/span><span class=\"p\">}}<\/span>\n<\/code><\/pre><\/div>\n\n<ul>\n<li>Invocations sharing the same <code>thread_id<\/code> automatically retrieve the latest state snapshot from that thread.<\/li>\n<li>Different <code>thread_id<\/code> values run in 100% complete isolation, preventing cross-user data leakage.<\/li>\n<\/ul>\n<hr />\n<h2 class=\"c4\" id=\"4-production-python-implementation-chatbot_historypy\">4. Production Python Implementation (<code>Chatbot_history.py<\/code>)<\/h2>\n<details class=\"codecard\"><summary><span class=\"cc-t\">Code · 50 lines<\/span><span class=\"cc-f\">01_chatbot_memory.py<\/span><span class=\"cc-show\">Show here<\/span><\/summary><div class=\"hl\"><pre><span><\/span><code><span class=\"kn\">import<\/span><span class=\"w\"> <\/span><span class=\"nn\">os<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">dotenv<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">load_dotenv<\/span>\n<span class=\"n\">load_dotenv<\/span><span class=\"p\">()<\/span>\n\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">typing<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">TypedDict<\/span><span class=\"p\">,<\/span> <span class=\"n\">Annotated<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langchain.chat_models<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">init_chat_model<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langgraph.graph<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">START<\/span><span class=\"p\">,<\/span> <span class=\"n\">END<\/span><span class=\"p\">,<\/span> <span class=\"n\">StateGraph<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langgraph.graph.message<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">add_messages<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">langgraph.checkpoint.memory<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">MemorySaver<\/span>\n\n<span class=\"c1\"># 1. Initialize Model<\/span>\n<span class=\"n\">model<\/span> <span class=\"o\">=<\/span> <span class=\"n\">init_chat_model<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"mistralai:mistral-small-2603\"<\/span><span class=\"p\">)<\/span>\n\n<span class=\"c1\"># 2. State with add_messages Reducer<\/span>\n<span class=\"k\">class<\/span><span class=\"w\"> <\/span><span class=\"nc\">ChatState<\/span><span class=\"p\">(<\/span><span class=\"n\">TypedDict<\/span><span class=\"p\">):<\/span>\n    <span class=\"n\">messages<\/span><span class=\"p\">:<\/span> <span class=\"n\">Annotated<\/span><span class=\"p\">[<\/span><span class=\"nb\">list<\/span><span class=\"p\">,<\/span> <span class=\"n\">add_messages<\/span><span class=\"p\">]<\/span>\n\n<span class=\"c1\"># 3. Worker Node<\/span>\n<span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">chatbot_node<\/span><span class=\"p\">(<\/span><span class=\"n\">state<\/span><span class=\"p\">:<\/span> <span class=\"n\">ChatState<\/span><span class=\"p\">)<\/span> <span class=\"o\">-&gt;<\/span> <span class=\"nb\">dict<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">    <\/span><span class=\"sd\">\"\"\"Invokes LLM with current historical messages and returns new AI reply.\"\"\"<\/span>\n    <span class=\"n\">response<\/span> <span class=\"o\">=<\/span> <span class=\"n\">model<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">(<\/span><span class=\"n\">state<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"messages\"<\/span><span class=\"p\">])<\/span>\n    <span class=\"c1\"># Returning a list of messages triggers the add_messages reducer<\/span>\n    <span class=\"k\">return<\/span> <span class=\"p\">{<\/span><span class=\"s2\">\"messages\"<\/span><span class=\"p\">:<\/span> <span class=\"p\">[<\/span><span class=\"n\">response<\/span><span class=\"p\">]}<\/span>\n\n<span class=\"c1\"># 4. Construct Graph<\/span>\n<span class=\"n\">builder<\/span> <span class=\"o\">=<\/span> <span class=\"n\">StateGraph<\/span><span class=\"p\">(<\/span><span class=\"n\">ChatState<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">builder<\/span><span class=\"o\">.<\/span><span class=\"n\">add_node<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"bot\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">chatbot_node<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">builder<\/span><span class=\"o\">.<\/span><span class=\"n\">add_edge<\/span><span class=\"p\">(<\/span><span class=\"n\">START<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"bot\"<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">builder<\/span><span class=\"o\">.<\/span><span class=\"n\">add_edge<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"bot\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">END<\/span><span class=\"p\">)<\/span>\n\n<span class=\"c1\"># 5. Compile with In-Memory Checkpointer<\/span>\n<span class=\"n\">memory<\/span> <span class=\"o\">=<\/span> <span class=\"n\">MemorySaver<\/span><span class=\"p\">()<\/span>\n<span class=\"n\">app<\/span> <span class=\"o\">=<\/span> <span class=\"n\">builder<\/span><span class=\"o\">.<\/span><span class=\"n\">compile<\/span><span class=\"p\">(<\/span><span class=\"n\">checkpointer<\/span><span class=\"o\">=<\/span><span class=\"n\">memory<\/span><span class=\"p\">)<\/span>\n\n<span class=\"c1\"># 6. Multi-Turn Session Simulation (Thread Isolation)<\/span>\n<span class=\"n\">config_user_a<\/span> <span class=\"o\">=<\/span> <span class=\"p\">{<\/span><span class=\"s2\">\"configurable\"<\/span><span class=\"p\">:<\/span> <span class=\"p\">{<\/span><span class=\"s2\">\"thread_id\"<\/span><span class=\"p\">:<\/span> <span class=\"s2\">\"user_dhruv_01\"<\/span><span class=\"p\">}}<\/span>\n<span class=\"n\">config_user_b<\/span> <span class=\"o\">=<\/span> <span class=\"p\">{<\/span><span class=\"s2\">\"configurable\"<\/span><span class=\"p\">:<\/span> <span class=\"p\">{<\/span><span class=\"s2\">\"thread_id\"<\/span><span class=\"p\">:<\/span> <span class=\"s2\">\"user_sarah_02\"<\/span><span class=\"p\">}}<\/span>\n\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"=== USER A (DHRUV) TURN 1 ===\"<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">res1<\/span> <span class=\"o\">=<\/span> <span class=\"n\">app<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">({<\/span><span class=\"s2\">\"messages\"<\/span><span class=\"p\">:<\/span> <span class=\"p\">[(<\/span><span class=\"s2\">\"human\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"My name is Dhruv and I am building an AI agent.\"<\/span><span class=\"p\">)]},<\/span> <span class=\"n\">config<\/span><span class=\"o\">=<\/span><span class=\"n\">config_user_a<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"AI:\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">res1<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"messages\"<\/span><span class=\"p\">][<\/span><span class=\"o\">-<\/span><span class=\"mi\">1<\/span><span class=\"p\">]<\/span><span class=\"o\">.<\/span><span class=\"n\">content<\/span><span class=\"p\">)<\/span>\n\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"<\/span><span class=\"se\">\\n<\/span><span class=\"s2\">=== USER B (SARAH) TURN 1 ===\"<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">res_b<\/span> <span class=\"o\">=<\/span> <span class=\"n\">app<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">({<\/span><span class=\"s2\">\"messages\"<\/span><span class=\"p\">:<\/span> <span class=\"p\">[(<\/span><span class=\"s2\">\"human\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"My name is Sarah and I love robotics.\"<\/span><span class=\"p\">)]},<\/span> <span class=\"n\">config<\/span><span class=\"o\">=<\/span><span class=\"n\">config_user_b<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"AI:\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">res_b<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"messages\"<\/span><span class=\"p\">][<\/span><span class=\"o\">-<\/span><span class=\"mi\">1<\/span><span class=\"p\">]<\/span><span class=\"o\">.<\/span><span class=\"n\">content<\/span><span class=\"p\">)<\/span>\n\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"<\/span><span class=\"se\">\\n<\/span><span class=\"s2\">=== USER A (DHRUV) TURN 2 (Memory Recall) ===\"<\/span><span class=\"p\">)<\/span>\n<span class=\"c1\"># Note: We do NOT pass the name again. The model recalls it from thread state!<\/span>\n<span class=\"n\">res2<\/span> <span class=\"o\">=<\/span> <span class=\"n\">app<\/span><span class=\"o\">.<\/span><span class=\"n\">invoke<\/span><span class=\"p\">({<\/span><span class=\"s2\">\"messages\"<\/span><span class=\"p\">:<\/span> <span class=\"p\">[(<\/span><span class=\"s2\">\"human\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"What is my name and what am I building?\"<\/span><span class=\"p\">)]},<\/span> <span class=\"n\">config<\/span><span class=\"o\">=<\/span><span class=\"n\">config_user_a<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"AI:\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">res2<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"messages\"<\/span><span class=\"p\">][<\/span><span class=\"o\">-<\/span><span class=\"mi\">1<\/span><span class=\"p\">]<\/span><span class=\"o\">.<\/span><span class=\"n\">content<\/span><span class=\"p\">)<\/span>\n<\/code><\/pre><\/div><\/details>\n\n<hr />\n<h2 class=\"c5\" id=\"5-inspecting-state-time-travel\">5. Inspecting State &amp; Time Travel<\/h2>\n<p>LangGraph allows programmatic inspection of any thread's historical snapshots:<\/p>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"c1\"># Get current snapshot of thread<\/span>\n<span class=\"n\">current_state<\/span> <span class=\"o\">=<\/span> <span class=\"n\">app<\/span><span class=\"o\">.<\/span><span class=\"n\">get_state<\/span><span class=\"p\">(<\/span><span class=\"n\">config_user_a<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Current Message Count:\"<\/span><span class=\"p\">,<\/span> <span class=\"nb\">len<\/span><span class=\"p\">(<\/span><span class=\"n\">current_state<\/span><span class=\"o\">.<\/span><span class=\"n\">values<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"messages\"<\/span><span class=\"p\">]))<\/span>\n\n<span class=\"c1\"># Inspect full historical timeline<\/span>\n<span class=\"k\">for<\/span> <span class=\"n\">snapshot<\/span> <span class=\"ow\">in<\/span> <span class=\"n\">app<\/span><span class=\"o\">.<\/span><span class=\"n\">get_state_history<\/span><span class=\"p\">(<\/span><span class=\"n\">config_user_a<\/span><span class=\"p\">):<\/span>\n    <span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"sa\">f<\/span><span class=\"s2\">\"Checkpoint ID: <\/span><span class=\"si\">{<\/span><span class=\"n\">snapshot<\/span><span class=\"o\">.<\/span><span class=\"n\">config<\/span><span class=\"p\">[<\/span><span class=\"s1\">'configurable'<\/span><span class=\"p\">][<\/span><span class=\"s1\">'checkpoint_id'<\/span><span class=\"p\">]<\/span><span class=\"si\">}<\/span><span class=\"s2\"> | Next Node: <\/span><span class=\"si\">{<\/span><span class=\"n\">snapshot<\/span><span class=\"o\">.<\/span><span class=\"n\">next<\/span><span class=\"si\">}<\/span><span class=\"s2\">\"<\/span><span class=\"p\">)<\/span>\n<\/code><\/pre><\/div>\n\n<hr />\n<h2 class=\"c1\" id=\"6-key-takeaways\">6. Key Takeaways<\/h2>\n<ul>\n<li><strong>No Manual History Lists<\/strong>: Application code no longer needs to manually maintain <code>chat_history = []<\/code>; the checkpointer and reducer manage it automatically.<\/li>\n<li><strong>Multi-Tenancy<\/strong>: A single compiled graph instance safely serves thousands of concurrent users simply by switching <code>thread_id<\/code>.<\/li>\n<li><strong>Production Storage<\/strong>: For server restarts, swap <code>MemorySaver()<\/code> with <code>SqliteSaver.from_conn_string(\"state.db\")<\/code> or <code>PostgresSaver<\/code>.<\/li>\n<\/ul><div class=\"sc-head code-head\">Code<\/div><details class=\"codecard\"><summary><span class=\"cc-t\">01_chatbot_memory.py<\/span><span class=\"cc-f\">01_chatbot_memory.py · 48 lines<\/span><span class=\"cc-show\">Show code<\/span><\/summary><div class=\"hl\"><table class=\"hltable\"><tr><td class=\"linenos\"><div class=\"linenodiv\"><pre><span class=\"normal\"> 1<\/span>\n<span class=\"normal\"> 2<\/span>\n<span class=\"normal\"> 3<\/span>\n<span class=\"normal\"> 4<\/span>\n<span class=\"normal\"> 5<\/span>\n<span class=\"normal\"> 6<\/span>\n<span class=\"normal\"> 7<\/span>\n<span class=\"normal\"> 8<\/span>\n<span class=\"normal\"> 9<\/span>\n<span class=\"normal\">10<\/span>\n<span class=\"normal\">11<\/span>\n<span class=\"normal\">12<\/span>\n<span class=\"normal\">13<\/span>\n<span class=\"normal\">14<\/span>\n<span class=
